    <script>
        const pages = [{"id": 1, "en": ["THE DEATH OF A GOVERNMENT CLERK", "ONE fine evening, a no less fine government clerk called Ivan Dmitritch Tchervyakov was sitting in the second row of the stalls, gazing through an opera glass at the Cloches de Corneville. He gazed and felt at the acme of bliss. But suddenly. . . . In stories one so often meets with this “But suddenly.” The authors are right: life is so full of surprises! But suddenly his face puckered up, his eyes disappeared, his breathing was arrested . . . he took the opera glass from his eyes, bent over and . . . “Aptchee!!” he sneezed as you perceive. It is not reprehensible for anyone to sneeze anywhere. Peasants sneeze and so do police superintendents, and sometimes even privy councillors. All men sneeze. Tchervyakov was not in the least confused, he wiped his face with his handkerchief, and like a polite man, looked round to see whether he had disturbed any one by his sneezing. But then he was overcome with confusion. He saw that an old gentleman sitting in front of him in the first row of the stalls was carefully wiping his bald head and his neck with his glove and muttering something to himself. In the old gentleman, Tchervyakov recognised Brizzhalov, a civilian general serving in the Department of Transport."], "zh": ["政府文員的死", "一個晴朗的晚上，一位名叫伊凡·德米特里奇·切爾維亞科夫的政府文員，正坐在二樓的座位上，透過歌劇望遠鏡凝視著《科爾內維爾的鐘聲》。他凝視著，感受到無上的幸福。然而，突然……在故事中經常會遇到這種“然而突然”。作者們是對的：生活充滿了驚喜！但突然，他的臉龐皺了起來，眼睛消失了，呼吸也停住了……他把望遠鏡從眼前拿開，彎下身子，然後……“阿啾！！”他打了個噴嚏，如你所見。任何人在任何地方打噴嚏都不應受到譴責。農民會打噴嚏，警察局長也會，甚至有時候特許顧問也會。所有人都會打噴嚏。切爾維亞科夫並不感到困窘，他用手帕擦了擦臉，像個有禮貌的人一樣，四處張望，看看自己是否打擾到任何人。然而，隨即他感到一陣羞愧。他看到坐在他前面第一排的一位老紳士，正小心翼翼地用手套擦拭著光禿禿的頭和脖子，並自言自語。在這位老紳士身上，切爾維亞科夫認出了布里茲哈洛夫，一位在交通部任職的文官將軍。"]}, {"id": 2, "en": ["“I have spattered him,” thought Tchervyakov, “he is not the head of my department, but still it is awkward. I must apologise.”", "Tchervyakov gave a cough, bent his whole person forward, and whispered in the general’s ear.", "“Pardon, your Excellency, I spattered you accidentally. . . .”", "“Never mind, never mind.”", "“For goodness sake excuse me, I . . . I did not mean to.”", "“Oh, please, sit down! let me listen!”", "Tchervyakov was embarrassed, he smiled stupidly and fell to gazing at the stage. He gazed at it but was no longer feeling bliss. He began to be troubled by uneasiness. In the interval, he went up to Brizzhalov, walked beside him, and overcoming his shyness, muttered:"], "zh": ["「我潑到他了，」切爾維亞科夫心想，「他不是我部門的頭，但這仍然很尷尬。我必須道歉。」", "切爾維亞科夫清了清喉嚨，身子前傾，低聲在將軍的耳邊說道：", "「對不起，閣下，我不小心潑到您了……」", "「沒關係，沒關係。」", "「求您原諒，我……我不是故意的。」", "「哦，請坐下！讓我聽聽！」", "切爾維亞科夫感到尷尬，他傻傻地微笑，開始凝視舞台。他凝視著，但再也感受不到幸福。他開始感到不安。在中場休息時，他走到布里茲哈洛夫身邊，鼓起勇氣，低聲說："]}, {"id": 3, "en": ["“I spattered you, your Excellency, forgive me . . . you see . . . I didn’t do it to . . . .”", "“Oh, that’s enough . . . I’d forgotten it, and you keep on about it!” said the general, moving his lower lip impatiently.", "“He has forgotten, but there is a fiendish light in his eye,” thought Tchervyakov, looking suspiciously at the general. “And he doesn’t want to talk. I ought to explain to him . . . that I really didn’t intend . . . that it is the law of nature or else he will think I meant to spit on him. He doesn’t think so now, but he will think so later!”"], "zh": ["「我潑到您了，閣下，請原諒我……您看……我不是故意的……」", "「哦，夠了……我已經忘了，您還一直提著這事！」將軍不耐煩地撅起下唇說。", "「他已經忘了，但他眼中卻閃爍著惡魔般的光芒，」切爾維亞科夫心想，懷疑地看著將軍。「而且他不想說話。我應該向他解釋……我真的不是故意的……這是自然法則，否則他會認為我想朝他吐口水。他現在不這麼想，但他以後會這麼想！」"]}, {"id": 4, "en": ["On getting home, Tchervyakov told his wife of his breach of good manners. It struck him that his wife took too frivolous a view of the incident; she was a little frightened, but when she learned that Brizzhalov was in a different department, she was reassured.", "“Still, you had better go and apologise,” she said, “or he will think you don’t know how to behave in public.”", "“That’s just it! I did apologise, but he took it somehow queerly . . . he didn’t say a word of sense. There wasn’t time to talk properly.”", "Next day Tchervyakov put on a new uniform, had his hair cut and went to Brizzhalov’s to explain; going into the general’s reception room he saw there a number of petitioners and among them the general himself, who was beginning to interview them. After questioning several petitioners the general raised his eyes and looked at Tchervyakov."], "zh": ["回到家後，切爾維亞科夫告訴妻子他失禮的事。他覺得妻子對這件事的看法過於輕率；她有些害怕，但當她得知布里茲哈洛夫在不同的部門時，便放心了。", "「不過，您最好去道歉，」她說，「否則他會認為您不懂得在公共場合的行為。」", "「正是如此！我已經道歉了，但他似乎有些奇怪……他沒有說一句正經話。根本沒有時間好好談。」", "第二天，切爾維亞科夫穿上新制服，剪了頭髮，去找布里茲哈洛夫解釋；走進將軍的接待室，他看到裡面有很多請願者，其中還有將軍本人，正開始面試他們。在詢問了幾位請願者後，將軍抬起眼睛，看向切爾維亞科夫。"]}, {"id": 5, "en": ["“Yesterday at the Arcadia, if you recollect, your Excellency,” the latter began, “I sneezed and . . . accidentally spattered . . . Exc. . . .”", "“What nonsense. . . . It’s beyond anything! What can I do for you,” said the general addressing the next petitioner.", "“He won’t speak,” thought Tchervyakov, turning pale; “that means that he is angry. . . . No, it can’t be left like this. . . . I will explain to him.”", "When the general had finished his conversation with the last of the petitioners and was turning towards his inner apartments, Tchervyakov took a step towards him and muttered:", "“Your Excellency! If I venture to trouble your Excellency, it is simply from a feeling I may say of regret! . . . It was not intentional if you will graciously believe me.”"], "zh": ["「昨天在阿卡迪亞，如果您還記得，閣下，」切爾維亞科夫開始說，「我打了噴嚏，然後……不小心潑到……閣下……」", "「什麼胡說八道……這簡直是無稽之談！我能為您做什麼？」將軍對下一位請願者說道。", "「他不會說話，」切爾維亞科夫心想，臉色變得蒼白；「這意味著他生氣了……不，這不能就這樣算了……我必須向他解釋。」", "當將軍與最後一位請願者的談話結束，正準備轉向內室時，切爾維亞科夫向他邁出一步，低聲說：", "「閣下！如果我打擾您，這只是出於一種我可以說的遺憾！……如果您願意相信我，這不是故意的。」"]}, {"id": 6, "en": ["The general made a lachrymose face, and waved his hand.", "“Why, you are simply making fun of me, sir,” he said as he closed the door behind him.", "“Where’s the making fun in it?” thought Tchervyakov, “there is nothing of the sort! He is a general, but he can’t understand. If that is how it is I am not going to apologise to that fanfaron any more! The devil take him. I’ll write a letter to him, but I won’t go. By Jove, I won’t.”", "So thought Tchervyakov as he walked home; he did not write a letter to the general, he pondered and pondered and could not make up that letter. He had to go next day to explain in person."], "zh": ["將軍做出一副悲傷的表情，揮了揮手。", "「您簡直是在取笑我，先生，」他說，隨著關上門的聲音。", "「哪裡有取笑的意思？」切爾維亞科夫心想，「根本沒有這種事！他是將軍，但他卻無法理解。如果是這樣，我就不打算再向這個自吹自擂的人道歉了！該死的。我會給他寫封信，但我不會去。天啊，我不會。」", "切爾維亞科夫這樣想著，走在回家的路上；他沒有給將軍寫信，反而思考著，思考著，卻無法寫出那封信。第二天他必須親自去解釋。"]}, {"id": 7, "en": ["“I ventured to disturb your Excellency yesterday,” he muttered, when the general lifted enquiring eyes upon him, “not to make fun as you were pleased to say. I was apologising for having spattered you in sneezing. . . . And I did not dream of making fun of you. Should I dare to make fun of you, if we should take to making fun, then there would be no respect for persons, there would be. . . .”", "“Be off!” yelled the general, turning suddenly purple, and shaking all over.", "“What?” asked Tchervyakov, in a whisper turning numb with horror.", "“Be off!” repeated the general, stamping.", "Something seemed to give way in Tchervyakov’s stomach. Seeing nothing and hearing nothing he reeled to the door, went out into the street, and went staggering along. . . . Reaching home mechanically, without taking off his uniform, he lay down on the sofa and died."], "zh": ["「我昨天冒昧打擾了您，閣下，」當將軍用詢問的目光看向他時，他低聲說，「並不是如您所說的那樣取笑。我是為了道歉，因為我在打噴嚏時潑到了您……而我並沒有想要取笑您。如果我敢於取笑您，那麼我們就會開始取笑，那麼就不會有對人的尊重了，會有……」", "「滾！」將軍突然大吼，臉色變得紫紅，整個人顫抖著。", "「什麼？」切爾維亞科夫驚恐地低聲問，感到麻木。", "「滾！」將軍重複道，跺著腳。", "切爾維亞科夫的肚子裡似乎有什麼東西崩潰了。看不見任何東西，也聽不見任何聲音，他搖搖晃晃地走向門口，走出街道，踉踉蹌蹌地走著……機械般地回到家，沒有脫下制服，他躺在沙發上，死去了。"]}];

        let currentIndex = 0;
        let currentFontScale = parseFloat(localStorage.getItem('bilingual_font_scale')) || 1.0;
        const audioPlayer = document.getElementById('audioPlayer');

        document.documentElement.style.setProperty('--font-scale', currentFontScale);

        function changeFontSize(delta) {
            currentFontScale = Math.min(Math.max(0.7, currentFontScale + delta), 1.8);
            document.documentElement.style.setProperty('--font-scale', currentFontScale);
            localStorage.setItem('bilingual_font_scale', currentFontScale);
        }

        function updatePage() {
            if (!pages || pages.length === 0) return;
            const page = pages[currentIndex];
            const container = document.getElementById('paragraph-box');
            container.innerHTML = '';

            if (page.en && page.en.length > 0) {
                const enSec = document.createElement('div');
                enSec.className = 'en-section';
                page.en.forEach(pText => {
                    const p = document.createElement('div'); p.className = 'en-p'; p.innerText = pText; enSec.appendChild(p);
                });
                container.appendChild(enSec);
            }

            if (page.zh && page.zh.length > 0) {
                const zhSec = document.createElement('div');
                zhSec.className = 'zh-section';
                page.zh.forEach(pText => {
                    const p = document.createElement('div'); p.className = 'zh-p'; p.innerText = pText; zhSec.appendChild(p);
                });
                container.appendChild(zhSec);
            }

            document.getElementById('page-info').innerText = `${currentIndex + 1} / ${pages.length}`;
            document.getElementById('progress').style.width = `${((currentIndex + 1) / pages.length) * 100}%`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === pages.length - 1;
            document.getElementById('main-content').scrollTop = 0;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // 💡 智慧辨識電腦與手機觸控事件
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        document.addEventListener('mouseup', (e) => {
            // 電腦端：按住 Alt 鍵再選取才觸發（避開 Google 翻譯／一般選字）
            // 手機端：直接選取文字就觸發
            if (isMobile || e.altKey) {
                const selection = window.getSelection();
                const text = selection.toString().trim().toLowerCase();
                if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                    analyzeWord(text);
                }
            }
        });

        // 💡 電腦端：直接在英文段落雙擊單字即可查詢，不需要按 Alt，看小說時更方便
        document.addEventListener('dblclick', (e) => {
            if (isMobile) return; // 手機交給上面的 mouseup 處理，避免重複觸發
            if (!e.target.closest('.en-p')) return; // 只在英文段落內生效
            const selection = window.getSelection();
            const text = selection.toString().trim().toLowerCase();
            if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                analyzeWord(text);
            }
        });

        function analyzeWord(word) {
            const popup = document.getElementById('root-dict-popup');
            const title = document.getElementById('popup-word-title');
            const content = document.getElementById('popup-content');

            title.innerText = `🔍 【${word}】`;
            content.innerHTML = '';
            let hasResult = false;

            // 1. 字首：只取「最長匹配」，避免像 un / uni 這種短字首淹沒真正對的長字首
            let pMatches = [];
            dbPrefixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.startsWith(k)) pMatches.push({ key: k, meaning: item.meaning });
                });
            });
            const maxPLen = pMatches.reduce((m, x) => Math.max(m, x.key.length), 0);
            pMatches = pMatches.filter(x => x.key.length === maxPLen);

            // 2. 字尾：同樣只取「最長匹配」，並把同一個字尾在不同分類下的結果合併成一行
            let sRaw = [];
            dbSuffixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.endsWith(k) && k.length >= 2) sRaw.push({ key: k, meaning: item.meaning, category: item.category });
                });
            });
            const maxSLen = sRaw.reduce((m, x) => Math.max(m, x.key.length), 0);
            sRaw = sRaw.filter(x => x.key.length === maxSLen);
            const sGrouped = {};
            sRaw.forEach(x => {
                if (!sGrouped[x.key]) sGrouped[x.key] = { meanings: new Set(), categories: [] };
                if (x.meaning) sGrouped[x.key].meanings.add(x.meaning);
                sGrouped[x.key].categories.push(x.category);
            });
            const sMatches = Object.keys(sGrouped).map(k => ({
                key: k,
                meaning: Array.from(sGrouped[k].meanings).join('；'),
                categories: sGrouped[k].categories
            }));

            // 3. 字根：貪婪比對——優先用最長的字根，且已被字首/字尾/其他較長字根「占用」的字母範圍不再重複標記
            //    （例如 university 拆完 uni- 與 -ity 之後，中間巧合出現的 it 就不會再被誤判成字根）
            const prefixZoneEnd = maxPLen;
            const suffixZoneStart = word.length - maxSLen;

            const rootCandidates = {};
            dbRoots.forEach(item => {
                item.keys.forEach(k => {
                    if (k.length < 2) return;
                    if (!rootCandidates[k]) rootCandidates[k] = [];
                    rootCandidates[k].push(item.meaning);
                });
            });
            const sortedKeys = Object.keys(rootCandidates).sort((a, b) => b.length - a.length);

            let claimed = [];
            let rMatches = [];
            sortedKeys.forEach(k => {
                let searchFrom = 0;
                while (true) {
                    const idx = word.indexOf(k, searchFrom);
                    if (idx === -1) break;
                    const end = idx + k.length;
                    const insidePrefix = end <= prefixZoneEnd;
                    const insideSuffix = idx >= suffixZoneStart;
                    const overlapsClaimed = claimed.some(([cs, ce]) => idx < ce && end > cs);
                    if (!insidePrefix && !insideSuffix && !overlapsClaimed) {
                        claimed.push([idx, end]);
                        rMatches.push({ key: k, meaning: rootCandidates[k].join('；') });
                        break;
                    }
                    searchFrom = idx + 1;
                }
            });
            rMatches.sort((a, b) => b.key.length - a.key.length);

            if (pMatches.length > 0) {
                hasResult = true;
                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;
            }

            if (rMatches.length > 0) {
                hasResult = true;
                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🌱 字根 Root</div>${rows}</div>`;
            }

            if (sMatches.length > 0) {
                hasResult = true;
                const rows = sMatches.map(x => {
                    const mStr = x.meaning ? ` : ${x.meaning}` : '';
                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');
                    return `<div class="tag-item"><b>-${x.key}</b>${badges}${mStr}</div>`;
                }).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🔚 字尾 Suffix</div>${rows}</div>`;
            }

            if (!hasResult) {
                content.innerHTML += `<div class="no-result">本機字根資料庫沒有找到相符的片段，這個字可能是不規則變化，或不屬於常見的拉丁／希臘字源。</div>`;
            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function closePopup() { document.getElementById('root-dict-popup').style.display = 'none'; }
        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); closePopup(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }
        function seekProgress(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleMp3Play() {
            const label = document.getElementById('mp3BtnLabel');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => label.textContent = " 暫停").catch(() => alert('未找到 MP3 檔案'));
            } else { audioPlayer.pause(); label.textContent = " 全文"; }
        }
        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;
            function speakNext() {
                if (sentenceIndex >= sentences.length) return;
                const utterance = new SpeechSynthesisUtterance(sentences[sentenceIndex].trim());
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onend = () => { sentenceIndex++; speakNext(); };
                utterance.onerror = () => { sentenceIndex++; speakNext(); };
                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
        updatePage();
    </script>
