<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛倫．坡《黑貓》</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #2b2d42;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --accent-color: #3182ce;
            --border-color: #e2e8f0;
            --font-scale: 1;
        }

        body.dark-mode {
            --bg-color: #1a202c;
            --text-main: #edf2f7;
            --text-sub: #cbd5e0;
            --card-bg: #2d3748;
            --accent-color: #63b3ed;
            --border-color: #4a5568;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column;
            font-family: Georgia, "Times New Roman", "標楷體", serif;
        }

        header {
            height: 65px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 20;
            user-select: none;
        }

        .title {
            font-size: 1.2rem; font-weight: bold; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
        }

        .controls { display: flex; align-items: center; gap: 5px; }

        .controls button {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.88rem;
        }

        main { flex: 1; display: flex; position: relative; overflow-y: auto; padding: 15px 0; }

        .click-zone { position: absolute; top: 0; bottom: 0; width: 8%; z-index: 5; cursor: pointer; user-select: none; }
        .click-left { left: 0; } .click-right { right: 0; }

        .card-container { width: 95%; max-width: 1200px; margin: auto; padding: 0 10px; z-index: 10; }

        .paragraph-box {
            background-color: var(--card-bg); padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
        }

        .en-p {
            font-size: calc(1.18rem * var(--font-scale)); line-height: 1.65;
            font-family: Georgia, serif; color: var(--text-main); margin-bottom: 16px;
            user-select: text !important; cursor: text;
        }

        .zh-p {
            font-size: calc(1.25rem * var(--font-scale)); line-height: 1.85;
            font-family: "標楷體", serif; color: var(--text-sub);
            margin: 0 0 24px 0; padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            user-select: text !important;
        }

        /* 字根分析彈窗 */
        #root-dict-popup {
            display: none; position: fixed; bottom: 80px; left: 30px; width: 340px; max-height: 420px;
            background-color: var(--card-bg); border: 2px solid var(--accent-color);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999;
            padding: 16px; overflow-y: auto; font-family: -apple-system, sans-serif;
        }

        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .popup-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); }
        .close-btn { cursor: pointer; font-weight: bold; font-size: 1.2rem; color: var(--text-sub); }
        .tag-group { margin-bottom: 10px; }
        .tag-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
        .tag-item { background-color: var(--bg-color); border-left: 3px solid var(--accent-color); padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 0.9rem; }
        .suffix-badge { display: inline-block; background-color: var(--accent-color); color: white; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 4px; }
        .no-result { font-size: 0.85rem; color: var(--text-sub); line-height: 1.6; padding: 6px 2px 10px 2px; }
        .etymo-link { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); text-align: center; }
        .etymo-link a { color: var(--accent-color); text-decoration: none; font-size: 0.88rem; font-weight: bold; }
        .etymo-link a:hover { text-decoration: underline; }

        footer {
            height: 65px; padding: 8px 25px; background-color: var(--card-bg);
            border-top: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; gap: 6px; flex-shrink: 0; z-index: 20; user-select: none;
        }
        .progress-bar-container { width: 100%; background-color: var(--border-color); height: 6px; border-radius: 3px; overflow: hidden; cursor: pointer; }
        .progress-bar { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.2s; }
        .footer-controls { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-sub); }
        .nav-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 22px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        @media (max-width: 600px) {
            #root-dict-popup { left: 5%; right: 5%; width: 90%; bottom: 75px; }
            /* 手機螢幕窄，按鈕文字容易換行、把整個 header 撐成兩三行，
               所以只保留圖示、隱藏文字說明；電腦寬螢幕不受影響，文字照常顯示。 */
            .btn-label { display: none; }
            .controls button { padding: 6px 9px; }
        }
    </style>
</head>
<body>

    <audio id="audioPlayer" src="The Black Cat.mp3" preload="none"></audio>

    <header>
        <div class="title">📖 愛倫．坡《黑貓》</div>
        <div class="controls">
            <button onclick="changeFontSize(-0.1)" title="縮小字體">A-</button>
            <button onclick="changeFontSize(0.1)" title="放大字體">A+</button>
            <button onclick="speakCurrentPage()" title="朗讀">🔊<span class="btn-label"> 朗讀</span></button>
            <button id="mp3Btn" onclick="toggleMp3Play()" title="全文">🎧<span class="btn-label" id="mp3BtnLabel"> 全文</span></button>
            <button onclick="toggleDarkMode()" title="切換">🌙<span class="btn-label"> 切換</span></button>
            <button id="fullscreenBtn" onclick="toggleFullscreen()" title="全螢幕">⛶<span class="btn-label"> 全螢幕</span></button>
        </div>
    </header>

    <main id="main-content">
        <div class="click-zone click-left" onclick="prevPage()"></div>

            <span id="page-info">0 / 0</span>
            <button class="nav-btn" id="next-btn" onclick="nextPage()">下一頁</button>
        </div>
    </footer>

    <script>
        const pages = [{"id": 1, "blocks": [{"lang": "en", "text": "FOR the most wild, yet most homely narrative which I am about to pen, I neither expect nor solicit belief. Mad indeed would I be to expect it, in a case where my very senses reject their own evidence. Yet, mad am I not -- and very surely do I not dream. But to-morrow I die, and to-day I would unburthen my soul. My immediate purpose is to place before the world, plainly, succinctly, and without comment, a series of mere household events. In their consequences, these events have terrified -- have tortured -- have destroyed me. Yet I will not attempt to expound them. To me, they have presented little but Horror -- to many they will seem less terrible than barroques. Hereafter, perhaps, some intellect may be found which will reduce my phantasm to the common-place -- some intellect more calm, more logical, and far less excitable than my own, which will perceive, in the circumstances I detail with awe, nothing more than an ordinary succession of very natural causes and effects."}, {"lang": "zh", "text": "對於我即將書寫的這個既狂野又平凡的故事，我既不期待也不請求信任。若我期待信任，那我無疑是瘋狂的，因為我的感官甚至拒絕自己的證據。然而，我並不瘋狂，且我確實沒有在做夢。但明天我將死去，今天我想要卸下我的心靈重擔。我的直接目的，是將一系列僅僅是家庭事件的事實，清晰、簡潔且不加評論地呈現在世人面前。這些事件的後果讓我感到恐懼、折磨，甚至摧毀了我。然而，我不會試圖解釋它們。對我來說，它們幾乎只呈現出恐怖的面貌，而對許多人來說，它們似乎不會比巴洛克風格的藝術更可怕。或許將來會有某種智慧的存在，能將我的幻影還原為平常的事物——某種更冷靜、更理性、遠不如我自己那般激動的智慧，能在我以敬畏的心情詳細描述的情況中，看到的僅僅是非常自然的因果關係的普通延續。"}], "en": ["FOR the most wild, yet most homely narrative which I am about to pen, I neither expect nor solicit belief. Mad indeed would I be to expect it, in a case where my very senses reject their own evidence. Yet, mad am I not -- and very surely do I not dream. But to-morrow I die, and to-day I would unburthen my soul. My immediate purpose is to place before the world, plainly, succinctly, and without comment, a series of mere household events. In their consequences, these events have terrified -- have tortured -- have destroyed me. Yet I will not attempt to expound them. To me, they have presented little but Horror -- to many they will seem less terrible than barroques. Hereafter, perhaps, some intellect may be found which will reduce my phantasm to the common-place -- some intellect more calm, more logical, and far less excitable than my own, which will perceive, in the circumstances I detail with awe, nothing more than an ordinary succession of very natural causes and effects."], "zh": ["對於我即將書寫的這個既狂野又平凡的故事，我既不期待也不請求信任。若我期待信任，那我無疑是瘋狂的，因為我的感官甚至拒絕自己的證據。然而，我並不瘋狂，且我確實沒有在做夢。但明天我將死去，今天我想要卸下我的心靈重擔。我的直接目的，是將一系列僅僅是家庭事件的事實，清晰、簡潔且不加評論地呈現在世人面前。這些事件的後果讓我感到恐懼、折磨，甚至摧毀了我。然而，我不會試圖解釋它們。對我來說，它們幾乎只呈現出恐怖的面貌，而對許多人來說，它們似乎不會比巴洛克風格的藝術更可怕。或許將來會有某種智慧的存在，能將我的幻影還原為平常的事物——某種更冷靜、更理性、遠不如我自己那般激動的智慧，能在我以敬畏的心情詳細描述的情況中，看到的僅僅是非常自然的因果關係的普通延續。"]}, {"id": 2, "blocks": [{"lang": "en", "text": "From my infancy I was noted for the docility and humanity of my disposition. My tenderness of heart was even so conspicuous as to make me the jest of my companions. I was especially fond of animals, and was indulged by my parents with a great variety of pets. With these I spent most of my time, and never was so happy as when feeding and caressing them. This peculiarity of character grew with my growth, and, in my manhood, I derived from it one of my principal sources of pleasure. To those who have cherished an affection for a faithful and sagacious dog, I need hardly be at the trouble of explaining the nature or the intensity of the gratification thus derivable. There is something in the unselfish and self-sacrificing love of a brute, which goes directly to the heart of him who has had frequent occasion to test the paltry friendship and gossamer fidelity of mere Man."}, {"lang": "zh", "text": "自幼我便因性情溫和而富有人性而聞名。我的心地柔軟，甚至明顯到讓我成為同伴們的笑柄。我特別喜愛動物，父母也寵愛我，給了我各種各樣的寵物。我大部分時間都與它們相伴，沒有比餵養和撫摸它們更讓我快樂的事情了。這種性格的特點隨著我的成長而增強，到了成年後，我從中獲得了主要的快樂來源之一。對於那些珍愛一隻忠實而聰明的狗的人來說，我幾乎不需要費心解釋這種快樂的性質或強度。動物無私而自我犧牲的愛，直抵那些經常有機會測試人類微薄友誼和脆弱忠誠的人的心靈。"}], "en": ["From my infancy I was noted for the docility and humanity of my disposition. My tenderness of heart was even so conspicuous as to make me the jest of my companions. I was especially fond of animals, and was indulged by my parents with a great variety of pets. With these I spent most of my time, and never was so happy as when feeding and caressing them. This peculiarity of character grew with my growth, and, in my manhood, I derived from it one of my principal sources of pleasure. To those who have cherished an affection for a faithful and sagacious dog, I need hardly be at the trouble of explaining the nature or the intensity of the gratification thus derivable. There is something in the unselfish and self-sacrificing love of a brute, which goes directly to the heart of him who has had frequent occasion to test the paltry friendship and gossamer fidelity of mere Man."], "zh": ["自幼我便因性情溫和而富有人性而聞名。我的心地柔軟，甚至明顯到讓我成為同伴們的笑柄。我特別喜愛動物，父母也寵愛我，給了我各種各樣的寵物。我大部分時間都與它們相伴，沒有比餵養和撫摸它們更讓我快樂的事情了。這種性格的特點隨著我的成長而增強，到了成年後，我從中獲得了主要的快樂來源之一。對於那些珍愛一隻忠實而聰明的狗的人來說，我幾乎不需要費心解釋這種快樂的性質或強度。動物無私而自我犧牲的愛，直抵那些經常有機會測試人類微薄友誼和脆弱忠誠的人的心靈。"]}, {"id": 3, "blocks": [{"lang": "en", "text": "I married early, and was happy to find in my wife a disposition not uncongenial with my own. Observing my partiality for domestic pets, she lost no opportunity of procuring those of the most agreeable kind. We had birds, gold-fish, a fine dog, rabbits, a small monkey, and a cat."}, {"lang": "zh", "text": "我早婚，並高興地發現我的妻子性情與我相合。她注意到我對家庭寵物的偏愛，便不遺餘力地為我尋找最可愛的動物。我們有鳥、金魚、一隻漂亮的狗、兔子、一隻小猴子和一隻貓。"}, {"lang": "en", "text": "This latter was a remarkably large and beautiful animal, entirely black, and sagacious to an astonishing degree. In speaking of his intelligence, my wife, who at heart was not a little tinctured with superstition, made frequent allusion to the ancient popular notion, which regarded all black cats as witches in disguise. Not that she was ever serious upon this point -- and I mention the matter at all for no better reason than that it happens, just now, to be remembered."}, {"lang": "zh", "text": "這隻貓是一隻特別大且美麗的動物，完全是黑色的，聰明得令人驚訝。談到它的智慧時，我的妻子，心中不免帶有一些迷信，經常提到一種古老的流行觀念，認為所有黑貓都是變形的女巫。並不是說她在這方面是認真的——我提到這件事只是因為它恰好被我記起來。"}], "en": ["I married early, and was happy to find in my wife a disposition not uncongenial with my own. Observing my partiality for domestic pets, she lost no opportunity of procuring those of the most agreeable kind. We had birds, gold-fish, a fine dog, rabbits, a small monkey, and a cat.", "This latter was a remarkably large and beautiful animal, entirely black, and sagacious to an astonishing degree. In speaking of his intelligence, my wife, who at heart was not a little tinctured with superstition, made frequent allusion to the ancient popular notion, which regarded all black cats as witches in disguise. Not that she was ever serious upon this point -- and I mention the matter at all for no better reason than that it happens, just now, to be remembered."], "zh": ["我早婚，並高興地發現我的妻子性情與我相合。她注意到我對家庭寵物的偏愛，便不遺餘力地為我尋找最可愛的動物。我們有鳥、金魚、一隻漂亮的狗、兔子、一隻小猴子和一隻貓。", "這隻貓是一隻特別大且美麗的動物，完全是黑色的，聰明得令人驚訝。談到它的智慧時，我的妻子，心中不免帶有一些迷信，經常提到一種古老的流行觀念，認為所有黑貓都是變形的女巫。並不是說她在這方面是認真的——我提到這件事只是因為它恰好被我記起來。"]}, {"id": 4, "blocks": [{"lang": "en", "text": "Pluto -- this was the cat's name -- was my favorite pet and playmate. I alone fed him, and he attended me wherever I went about the house. It was even with difficulty that I could prevent him from following me through the streets."}, {"lang": "zh", "text": "普魯托——這是貓的名字——是我最喜愛的寵物和玩伴。我獨自餵養它，無論我在家裡走到哪裡，它都會跟隨我。甚至連在街上我也很難阻止它跟著我。"}, {"lang": "en", "text": "Our friendship lasted, in this manner, for several years, during which my general temperament and character -- through the instrumentality of the Fiend Intemperance -- had (I blush to confess it) experienced a radical alteration for the worse. I grew, day by day, more moody, more irritable, more regardless of the feelings of others. I suffered myself to use intemperate language to my wife. At length, I even offered her personal violence. My pets, of course, were made to feel the change in my disposition. I not only neglected, but ill-used them. For Pluto, however, I still retained sufficient regard to restrain me from maltreating him, as I made no scruple of maltreating the rabbits, the monkey, or even the dog, when by accident, or through affection, they came in my way. But my disease grew upon me -- for what disease is like Alcohol ! -- and at length even Pluto, who was now becoming old, and consequently somewhat peevish -- even Pluto began to experience the effects of my ill temper."}, {"lang": "zh", "text": "我們的友誼這樣持續了好幾年，在此期間，我的整體性情和性格——通過惡魔般的酗酒——（我羞愧地承認）經歷了根本性的惡化。我日益變得情緒化、易怒，對他人的感受漠不關心。我讓自己對妻子使用不當的言辭。最終，我甚至對她施加了人身暴力。我的寵物們，自然感受到了我性情的變化。我不僅忽視它們，還虐待它們。然而，對於普魯托，我仍然保留著足夠的關心，以至於不至於虐待它，儘管我毫不猶豫地虐待兔子、小猴子，甚至狗，當它們偶然或出於情感出現在我面前時。但我的病情不斷加重——因為有什麼病能比酗酒更可怕呢！——最終，即使是普魯托，這隻現在變得年老且有些脾氣的貓，也開始感受到我壞脾氣的影響。"}], "en": ["Pluto -- this was the cat's name -- was my favorite pet and playmate. I alone fed him, and he attended me wherever I went about the house. It was even with difficulty that I could prevent him from following me through the streets.", "Our friendship lasted, in this manner, for several years, during which my general temperament and character -- through the instrumentality of the Fiend Intemperance -- had (I blush to confess it) experienced a radical alteration for the worse. I grew, day by day, more moody, more irritable, more regardless of the feelings of others. I suffered myself to use intemperate language to my wife. At length, I even offered her personal violence. My pets, of course, were made to feel the change in my disposition. I not only neglected, but ill-used them. For Pluto, however, I still retained sufficient regard to restrain me from maltreating him, as I made no scruple of maltreating the rabbits, the monkey, or even the dog, when by accident, or through affection, they came in my way. But my disease grew upon me -- for what disease is like Alcohol ! -- and at length even Pluto, who was now becoming old, and consequently somewhat peevish -- even Pluto began to experience the effects of my ill temper."], "zh": ["普魯托——這是貓的名字——是我最喜愛的寵物和玩伴。我獨自餵養它，無論我在家裡走到哪裡，它都會跟隨我。甚至連在街上我也很難阻止它跟著我。", "我們的友誼這樣持續了好幾年，在此期間，我的整體性情和性格——通過惡魔般的酗酒——（我羞愧地承認）經歷了根本性的惡化。我日益變得情緒化、易怒，對他人的感受漠不關心。我讓自己對妻子使用不當的言辭。最終，我甚至對她施加了人身暴力。我的寵物們，自然感受到了我性情的變化。我不僅忽視它們，還虐待它們。然而，對於普魯托，我仍然保留著足夠的關心，以至於不至於虐待它，儘管我毫不猶豫地虐待兔子、小猴子，甚至狗，當它們偶然或出於情感出現在我面前時。但我的病情不斷加重——因為有什麼病能比酗酒更可怕呢！——最終，即使是普魯托，這隻現在變得年老且有些脾氣的貓，也開始感受到我壞脾氣的影響。"]}, {"id": 5, "blocks": [{"lang": "en", "text": "One night, returning home, much intoxicated, from one of my haunts about town, I fancied that the cat avoided my presence. I seized him; when, in his fright at my violence, he inflicted a slight wound upon my hand with his teeth. The fury of a demon instantly possessed me. I knew myself no longer. My  original soul seemed, at once, to take its flight from my body; and a more than fiendish malevolence, gin-nurtured, thrilled every fibre of my frame. I took from my waistcoat-pocket a pen-knife, opened it, grasped the poor beast by the throat, and deliberately cut one of its eyes from the socket ! I blush, I burn, I shudder, while I pen the damnable atrocity."}, {"lang": "zh", "text": "有一個夜晚，我從城裡的一個酒鬼聚集地醉醺醺地回家，發現貓似乎在躲避我。我抓住了它；當它因我的暴力而感到驚恐時，用牙齒輕輕咬了我一下。瞬間，魔鬼般的狂怒佔據了我。我再也無法認識自己。我的原始靈魂似乎瞬間脫離了我的身體；一種超越惡魔的惡意，像是酒精滋養的火焰，震撼著我身體的每一根神經。我從上衣口袋裡拿出一把小刀，打開它，抓住可憐的獸子，故意割掉了它的一隻眼睛！我羞愧、燒灼、顫抖，寫下這可惡的暴行。"}], "en": ["One night, returning home, much intoxicated, from one of my haunts about town, I fancied that the cat avoided my presence. I seized him; when, in his fright at my violence, he inflicted a slight wound upon my hand with his teeth. The fury of a demon instantly possessed me. I knew myself no longer. My  original soul seemed, at once, to take its flight from my body; and a more than fiendish malevolence, gin-nurtured, thrilled every fibre of my frame. I took from my waistcoat-pocket a pen-knife, opened it, grasped the poor beast by the throat, and deliberately cut one of its eyes from the socket ! I blush, I burn, I shudder, while I pen the damnable atrocity."], "zh": ["有一個夜晚，我從城裡的一個酒鬼聚集地醉醺醺地回家，發現貓似乎在躲避我。我抓住了它；當它因我的暴力而感到驚恐時，用牙齒輕輕咬了我一下。瞬間，魔鬼般的狂怒佔據了我。我再也無法認識自己。我的原始靈魂似乎瞬間脫離了我的身體；一種超越惡魔的惡意，像是酒精滋養的火焰，震撼著我身體的每一根神經。我從上衣口袋裡拿出一把小刀，打開它，抓住可憐的獸子，故意割掉了它的一隻眼睛！我羞愧、燒灼、顫抖，寫下這可惡的暴行。"]}, {"id": 6, "blocks": [{"lang": "en", "text": "When reason returned with the morning -- when I had slept off the fumes of the night's debauch -- I experienced a sentiment half of horror, half of remorse, for the crime of which I had been guilty; but it was, at best, a feeble and equivocal feeling, and the soul remained untouched. I again plunged into excess, and soon drowned in wine all memory of the deed."}, {"lang": "zh", "text": "當理智在早晨回來時——當我睡去，擺脫了昨夜的醉意——我感到一種半恐懼、半懺悔的情緒，對我所犯下的罪行感到不安；但這種感覺充其量只是微弱而模糊的，靈魂依然未受觸動。我再次沉迷於酗酒，並很快將對這一罪行的所有記憶淹沒在酒中。"}, {"lang": "en", "text": "In the meantime the cat slowly recovered. The socket of the lost eye presented, it is true, a frightful appearance, but he no longer appeared to suffer any pain. He went about the house as usual, but, as might be expected, fled in extreme terror at my approach. I had so much of my old heart left, as to be at first grieved by this evident dislike on the part of a creature which had once so loved me. But this feeling soon gave place to irritation. And then came, as if to my final and irrevocable overthrow, the spirit of PERVERSENESS. Of this spirit philosophy takes no account. Yet I am not more sure that my soul lives, than I am that perverseness is one of the primitive impulses of the human heart -- one of the indivisible primary faculties, or sentiments, which give direction to the character of Man. Who has not, a hundred times, found himself committing a vile or a silly action, for no other reason than because he knows he should not? Have we not a perpetual inclination, in the teeth of our best judgment, to violate that which is Law, merely because we understand it to be such? This spirit of perverseness, I say, came to my final overthrow. It was this unfathomable longing of the soul to vex itself -- to offer violence to its own nature -- to do wrong for the wrong's sake only -- that urged me to continue and finally to consummate the injury I had inflicted upon the unoffending brute. One morning, in cool blood, I slipped a noose about its neck and hung it to the limb of a tree; -- hung it with the tears streaming from my eyes, and with the bitterest remorse at my heart; -- hung it because I knew that it had loved me, and because I felt it had given me no reason of offence; -- hung it because I knew that in so doing I was committing a sin -- a deadly sin that would so jeopardize my immortal soul as to place it -- if such a thing were possible -- even beyond the reach of the infinite mercy of the Most Merciful and Most Terrible God."}, {"lang": "zh", "text": "與此同時，貓慢慢康復。失去的眼窩確實看起來可怕，但它似乎不再感到任何痛苦。它像往常一樣在家裡走動，但，正如可以預期的那樣，對我接近的時候極度恐懼。我心中仍然保留著一絲舊時的心情，起初對這隻曾經如此愛我的生物的明顯厭惡感到悲傷。但這種感覺很快被惱怒所取代。然後，似乎為了我最終和不可逆轉的覆滅，扭曲的精神降臨了。這種精神哲學上無法解釋。然而，我對我的靈魂是否存在的確信，並不比我對扭曲是人心原始衝動之一的確信更少——是指引人類性格的不可分割的基本能力或情感之一。誰沒有一百次發現自己因為知道不該這樣做而去做一些卑劣或愚蠢的事情呢？我們是否不會在明知這是法律的情況下，仍然有一種違反法律的持續傾向？我說，這種扭曲的精神，導致了我的最終覆滅。正是這種靈魂深處無法言喻的渴望，想要自我折磨——想要對自己的本性施加暴力——僅僅因為錯誤而去做錯事，驅使我繼續並最終完成對這隻無辜獸子的傷害。某個早晨，我冷靜地將一根繩索套在它的脖子上，將它吊在樹枝上；——在眼淚流淌的同時，心中充滿了最苦澀的懺悔；——吊它是因為我知道它曾經愛過我，因為我感到它沒有給我任何冒犯的理由；——吊它是因為我知道這樣做是在犯一個罪——一個致命的罪，將我的不朽靈魂置於危險之中，甚至使它——如果這樣的事情有可能發生——超越至高無上的仁慈和可怕的上帝的無限憐憫。"}], "en": ["When reason returned with the morning -- when I had slept off the fumes of the night's debauch -- I experienced a sentiment half of horror, half of remorse, for the crime of which I had been guilty; but it was, at best, a feeble and equivocal feeling, and the soul remained untouched. I again plunged into excess, and soon drowned in wine all memory of the deed.", "In the meantime the cat slowly recovered. The socket of the lost eye presented, it is true, a frightful appearance, but he no longer appeared to suffer any pain. He went about the house as usual, but, as might be expected, fled in extreme terror at my approach. I had so much of my old heart left, as to be at first grieved by this evident dislike on the part of a creature which had once so loved me. But this feeling soon gave place to irritation. And then came, as if to my final and irrevocable overthrow, the spirit of PERVERSENESS. Of this spirit philosophy takes no account. Yet I am not more sure that my soul lives, than I am that perverseness is one of the primitive impulses of the human heart -- one of the indivisible primary faculties, or sentiments, which give direction to the character of Man. Who has not, a hundred times, found himself committing a vile or a silly action, for no other reason than because he knows he should not? Have we not a perpetual inclination, in the teeth of our best judgment, to violate that which is Law, merely because we understand it to be such? This spirit of perverseness, I say, came to my final overthrow. It was this unfathomable longing of the soul to vex itself -- to offer violence to its own nature -- to do wrong for the wrong's sake only -- that urged me to continue and finally to consummate the injury I had inflicted upon the unoffending brute. One morning, in cool blood, I slipped a noose about its neck and hung it to the limb of a tree; -- hung it with the tears streaming from my eyes, and with the bitterest remorse at my heart; -- hung it because I knew that it had loved me, and because I felt it had given me no reason of offence; -- hung it because I knew that in so doing I was committing a sin -- a deadly sin that would so jeopardize my immortal soul as to place it -- if such a thing were possible -- even beyond the reach of the infinite mercy of the Most Merciful and Most Terrible God."], "zh": ["當理智在早晨回來時——當我睡去，擺脫了昨夜的醉意——我感到一種半恐懼、半懺悔的情緒，對我所犯下的罪行感到不安；但這種感覺充其量只是微弱而模糊的，靈魂依然未受觸動。我再次沉迷於酗酒，並很快將對這一罪行的所有記憶淹沒在酒中。", "與此同時，貓慢慢康復。失去的眼窩確實看起來可怕，但它似乎不再感到任何痛苦。它像往常一樣在家裡走動，但，正如可以預期的那樣，對我接近的時候極度恐懼。我心中仍然保留著一絲舊時的心情，起初對這隻曾經如此愛我的生物的明顯厭惡感到悲傷。但這種感覺很快被惱怒所取代。然後，似乎為了我最終和不可逆轉的覆滅，扭曲的精神降臨了。這種精神哲學上無法解釋。然而，我對我的靈魂是否存在的確信，並不比我對扭曲是人心原始衝動之一的確信更少——是指引人類性格的不可分割的基本能力或情感之一。誰沒有一百次發現自己因為知道不該這樣做而去做一些卑劣或愚蠢的事情呢？我們是否不會在明知這是法律的情況下，仍然有一種違反法律的持續傾向？我說，這種扭曲的精神，導致了我的最終覆滅。正是這種靈魂深處無法言喻的渴望，想要自我折磨——想要對自己的本性施加暴力——僅僅因為錯誤而去做錯事，驅使我繼續並最終完成對這隻無辜獸子的傷害。某個早晨，我冷靜地將一根繩索套在它的脖子上，將它吊在樹枝上；——在眼淚流淌的同時，心中充滿了最苦澀的懺悔；——吊它是因為我知道它曾經愛過我，因為我感到它沒有給我任何冒犯的理由；——吊它是因為我知道這樣做是在犯一個罪——一個致命的罪，將我的不朽靈魂置於危險之中，甚至使它——如果這樣的事情有可能發生——超越至高無上的仁慈和可怕的上帝的無限憐憫。"]}, {"id": 7, "blocks": [{"lang": "en", "text": "On the night of the day on which this cruel deed was done, I was aroused from sleep by the cry of fire. The curtains of my bed were in flames. The whole house was blazing. It was with great difficulty that my wife, a servant, and myself, made our escape from the conflagration. The destruction was complete. My entire worldly wealth was swallowed up, and I resigned myself thenceforward to despair."}, {"lang": "zh", "text": "在這殘酷行為的當晚，我被火災的呼喊驚醒。我的床簾著火了。整棟房子都在燃燒。我和我的妻子以及一名僕人艱難地逃出了火海。毀滅是徹底的。我的所有財產都被吞噬，我從此陷入絕望。"}, {"lang": "en", "text": "I am above the weakness of seeking to establish a sequence of cause and effect, between the disaster and the atrocity. But I am detailing a chain of facts -- and wish not to leave even a possible link imperfect. On the day succeeding the fire, I visited the ruins. The walls, with one exception, had fallen in. This exception was found in a compartment wall, not very thick, which stood about the middle of the house, and against which had rested the head of my bed. The plastering had here, in great measure, resisted the action of the fire -- a fact which I attributed to its having been recently spread. About this wall a dense crowd were collected, and many persons seemed to be examining a particular portion of it with very minute and eager attention. The words \"strange!\" \"singular!\" and other similar expressions, excited my curiosity. I approached and saw, as if graven in bas relief upon the white surface, the figure of a gigantic cat. The impression was given with an accuracy truly marvellous. There was a rope about the animal's neck."}, {"lang": "zh", "text": "我不會因為想要建立災難與暴行之間的因果關係而顯得脆弱。但我正在詳細描述一系列事實——並且不想留下任何可能的環節不完整。在火災的第二天，我參觀了廢墟。牆壁，除了有一面例外，已經倒塌。這面例外是一面不太厚的隔牆，位於房子的中間，曾經支撐著我的床頭。這裡的灰泥在很大程度上抵抗了火災的侵襲——我將這一事實歸因於它最近才塗抹過。圍著這面牆聚集著一群密集的人群，許多人似乎對其中一部分進行著非常細緻而熱切的檢查。人們的驚呼聲如“奇怪！”“獨特！”等，激起了我的好奇心。我走近一看，發現白色表面上似乎浮雕著一隻巨大的貓的形象。這個印記的準確性真是令人驚訝。動物的脖子上有一根繩子。"}], "en": ["On the night of the day on which this cruel deed was done, I was aroused from sleep by the cry of fire. The curtains of my bed were in flames. The whole house was blazing. It was with great difficulty that my wife, a servant, and myself, made our escape from the conflagration. The destruction was complete. My entire worldly wealth was swallowed up, and I resigned myself thenceforward to despair.", "I am above the weakness of seeking to establish a sequence of cause and effect, between the disaster and the atrocity. But I am detailing a chain of facts -- and wish not to leave even a possible link imperfect. On the day succeeding the fire, I visited the ruins. The walls, with one exception, had fallen in. This exception was found in a compartment wall, not very thick, which stood about the middle of the house, and against which had rested the head of my bed. The plastering had here, in great measure, resisted the action of the fire -- a fact which I attributed to its having been recently spread. About this wall a dense crowd were collected, and many persons seemed to be examining a particular portion of it with very minute and eager attention. The words \"strange!\" \"singular!\" and other similar expressions, excited my curiosity. I approached and saw, as if graven in bas relief upon the white surface, the figure of a gigantic cat. The impression was given with an accuracy truly marvellous. There was a rope about the animal's neck."], "zh": ["在這殘酷行為的當晚，我被火災的呼喊驚醒。我的床簾著火了。整棟房子都在燃燒。我和我的妻子以及一名僕人艱難地逃出了火海。毀滅是徹底的。我的所有財產都被吞噬，我從此陷入絕望。", "我不會因為想要建立災難與暴行之間的因果關係而顯得脆弱。但我正在詳細描述一系列事實——並且不想留下任何可能的環節不完整。在火災的第二天，我參觀了廢墟。牆壁，除了有一面例外，已經倒塌。這面例外是一面不太厚的隔牆，位於房子的中間，曾經支撐著我的床頭。這裡的灰泥在很大程度上抵抗了火災的侵襲——我將這一事實歸因於它最近才塗抹過。圍著這面牆聚集著一群密集的人群，許多人似乎對其中一部分進行著非常細緻而熱切的檢查。人們的驚呼聲如“奇怪！”“獨特！”等，激起了我的好奇心。我走近一看，發現白色表面上似乎浮雕著一隻巨大的貓的形象。這個印記的準確性真是令人驚訝。動物的脖子上有一根繩子。"]}, {"id": 8, "blocks": [{"lang": "en", "text": "When I first beheld this apparition -- for I could scarcely regard it as less -- my wonder and my terror were extreme. But at length reflection came to my aid. The cat, I remembered, had been hung in a garden adjacent to the house. Upon the alarm of fire, this garden had been immediately filled by the crowd -- by some one of whom the animal must have been cut from the tree and thrown, through an open window, into my chamber. This had probably been done with the view of arousing me from sleep. The falling of other walls had compressed the victim of my cruelty into the substance of the freshly-spread plaster; the lime of which, with the flames, and the ammonia from the carcass, had then accomplished the portraiture as I saw it."}, {"lang": "zh", "text": "當我第一次看到這個幻影時——因為我幾乎無法將其視為其他——我的驚奇和恐懼達到了極點。但最終，反思幫助了我。我記得那隻貓曾經被吊在房子旁邊的花園裡。在火災警報響起時，這個花園立刻被人群填滿——其中某個人必定將這隻動物從樹上割下，並通過一扇開著的窗戶扔進了我的房間。這樣做的目的可能是為了喚醒我。其他牆壁的倒塌將我殘忍行為的受害者壓縮進了新近塗抹的灰泥中；石灰與火焰以及屍體的氨氣，最終完成了我所看到的肖像。"}], "en": ["When I first beheld this apparition -- for I could scarcely regard it as less -- my wonder and my terror were extreme. But at length reflection came to my aid. The cat, I remembered, had been hung in a garden adjacent to the house. Upon the alarm of fire, this garden had been immediately filled by the crowd -- by some one of whom the animal must have been cut from the tree and thrown, through an open window, into my chamber. This had probably been done with the view of arousing me from sleep. The falling of other walls had compressed the victim of my cruelty into the substance of the freshly-spread plaster; the lime of which, with the flames, and the ammonia from the carcass, had then accomplished the portraiture as I saw it."], "zh": ["當我第一次看到這個幻影時——因為我幾乎無法將其視為其他——我的驚奇和恐懼達到了極點。但最終，反思幫助了我。我記得那隻貓曾經被吊在房子旁邊的花園裡。在火災警報響起時，這個花園立刻被人群填滿——其中某個人必定將這隻動物從樹上割下，並通過一扇開著的窗戶扔進了我的房間。這樣做的目的可能是為了喚醒我。其他牆壁的倒塌將我殘忍行為的受害者壓縮進了新近塗抹的灰泥中；石灰與火焰以及屍體的氨氣，最終完成了我所看到的肖像。"]}, {"id": 9, "blocks": [{"lang": "en", "text": "Although I thus readily accounted to my reason, if not altogether to my conscience, for the startling fact just detailed, it did not the less fail to make a deep impression upon my fancy. For months I could not rid myself of the phantasm of the cat; and, during this period, there came back into my spirit a half-sentiment that seemed, but was not, remorse. I went so far as to regret the loss of the animal, and to look about me, among the vile haunts which I now habitually frequented, for another pet of the same species, and of somewhat similar appearance, with which to supply its place."}, {"lang": "zh", "text": "雖然我這樣很容易就為我理智的解釋找到了理由，儘管並不完全符合我的良心，但這仍然未能對我的幻想產生深刻的影響。幾個月來，我無法擺脫貓的幻影；在這段期間，我的心靈中又回到了似乎是，但實際上並不是懺悔的半感情。我甚至後悔失去了這隻動物，並在我現在經常出入的那些卑劣場所中尋找另一隻同類，來替代它。"}], "en": ["Although I thus readily accounted to my reason, if not altogether to my conscience, for the startling fact just detailed, it did not the less fail to make a deep impression upon my fancy. For months I could not rid myself of the phantasm of the cat; and, during this period, there came back into my spirit a half-sentiment that seemed, but was not, remorse. I went so far as to regret the loss of the animal, and to look about me, among the vile haunts which I now habitually frequented, for another pet of the same species, and of somewhat similar appearance, with which to supply its place."], "zh": ["雖然我這樣很容易就為我理智的解釋找到了理由，儘管並不完全符合我的良心，但這仍然未能對我的幻想產生深刻的影響。幾個月來，我無法擺脫貓的幻影；在這段期間，我的心靈中又回到了似乎是，但實際上並不是懺悔的半感情。我甚至後悔失去了這隻動物，並在我現在經常出入的那些卑劣場所中尋找另一隻同類，來替代它。"]}, {"id": 10, "blocks": [{"lang": "en", "text": "One night as I sat, half stupified, in a den of more than infamy, my attention was suddenly drawn to some black object, reposing upon the head of one of the immense hogsheads of Gin, or of Rum, which constituted the chief furniture of the apartment. I had been looking steadily at the top of this hogshead for some minutes, and what now caused me surprise was the fact that I had not sooner perceived the object thereupon. I approached it, and touched it with my hand. It was a black cat -- a very large one -- fully as large as Pluto, and closely resembling him in every respect but one. Pluto had not a white hair upon any portion of his body; but this cat had a large, although indefinite splotch of white, covering nearly the whole region of the breast."}, {"lang": "zh", "text": "有一個夜晚，當我半昏迷地坐在一個名聲不佳的酒吧裡時，我的注意力突然被一個黑色物體吸引，這個物體正安靜地躺在一個巨大的酒桶的頂部，這些酒桶是這個房間的主要家具。我已經凝視著這個酒桶的頂部幾分鐘，而現在令我驚訝的是，我之前竟沒有注意到這個物體。我走近它，伸手觸摸。這是一隻黑貓——一隻非常大的貓——與普魯托一樣大，並在各方面都與他非常相似，除了有一點。普魯托的身上沒有一根白毛，而這隻貓的胸部幾乎覆蓋著一塊大而不明確的白色斑點。"}], "en": ["One night as I sat, half stupified, in a den of more than infamy, my attention was suddenly drawn to some black object, reposing upon the head of one of the immense hogsheads of Gin, or of Rum, which constituted the chief furniture of the apartment. I had been looking steadily at the top of this hogshead for some minutes, and what now caused me surprise was the fact that I had not sooner perceived the object thereupon. I approached it, and touched it with my hand. It was a black cat -- a very large one -- fully as large as Pluto, and closely resembling him in every respect but one. Pluto had not a white hair upon any portion of his body; but this cat had a large, although indefinite splotch of white, covering nearly the whole region of the breast."], "zh": ["有一個夜晚，當我半昏迷地坐在一個名聲不佳的酒吧裡時，我的注意力突然被一個黑色物體吸引，這個物體正安靜地躺在一個巨大的酒桶的頂部，這些酒桶是這個房間的主要家具。我已經凝視著這個酒桶的頂部幾分鐘，而現在令我驚訝的是，我之前竟沒有注意到這個物體。我走近它，伸手觸摸。這是一隻黑貓——一隻非常大的貓——與普魯托一樣大，並在各方面都與他非常相似，除了有一點。普魯托的身上沒有一根白毛，而這隻貓的胸部幾乎覆蓋著一塊大而不明確的白色斑點。"]}, {"id": 11, "blocks": [{"lang": "en", "text": "Upon my touching him, he immediately arose, purred loudly, rubbed against my hand, and appeared delighted with my notice. This, then, was the very creature of which I was in search. I at once offered to purchase it of the landlord; but this person made no claim to it -- knew nothing of it -- had never seen it before."}, {"lang": "zh", "text": "當我觸摸到它時，它立刻站起來，發出響亮的呼嚕聲，蹭著我的手，似乎對我的注意感到高興。這就是我一直在尋找的生物。我立刻向房東提出購買它的要求；但這個人對此毫無所知——從未見過它。"}, {"lang": "en", "text": "I continued my caresses, and, when I prepared to go home, the animal evinced a disposition to accompany me. I permitted it to do so; occasionally stooping and patting it as I proceeded. When it reached the house it domesticated itself at once, and became immediately a great favorite with my wife."}, {"lang": "zh", "text": "我繼續撫摸它，當我準備回家時，這隻動物表現出想要跟隨我的傾向。我允許它這樣做；在我走的時候，偶爾彎下腰來撫摸它。當它到達家裡時，立刻就適應了環境，並立即成為我妻子的寵兒。"}], "en": ["Upon my touching him, he immediately arose, purred loudly, rubbed against my hand, and appeared delighted with my notice. This, then, was the very creature of which I was in search. I at once offered to purchase it of the landlord; but this person made no claim to it -- knew nothing of it -- had never seen it before.", "I continued my caresses, and, when I prepared to go home, the animal evinced a disposition to accompany me. I permitted it to do so; occasionally stooping and patting it as I proceeded. When it reached the house it domesticated itself at once, and became immediately a great favorite with my wife."], "zh": ["當我觸摸到它時，它立刻站起來，發出響亮的呼嚕聲，蹭著我的手，似乎對我的注意感到高興。這就是我一直在尋找的生物。我立刻向房東提出購買它的要求；但這個人對此毫無所知——從未見過它。", "我繼續撫摸它，當我準備回家時，這隻動物表現出想要跟隨我的傾向。我允許它這樣做；在我走的時候，偶爾彎下腰來撫摸它。當它到達家裡時，立刻就適應了環境，並立即成為我妻子的寵兒。"]}, {"id": 12, "blocks": [{"lang": "en", "text": "For my own part, I soon found a dislike to it arising within me. This was just the reverse of what I had anticipated; but -- I know not how or why it was -- its evident fondness for myself rather disgusted and annoyed. By slow degrees, these feelings of disgust and annoyance rose into the bitterness of hatred. I avoided the creature; a certain sense of shame, and the remembrance of my former deed of cruelty, preventing me from physically abusing it. I did not, for some weeks, strike, or otherwise violently ill use it; but gradually -- very gradually -- I came to look upon it with unutterable loathing, and to flee silently from its odious presence, as from the breath of a pestilence."}, {"lang": "zh", "text": "就我而言，我很快發現自己對它產生了厭惡。這與我預期的正好相反；但——我不知道為什麼——它對我的明顯喜愛反而讓我感到厭惡和煩躁。隨著時間的推移，這種厭惡和煩躁的感覺逐漸升級為仇恨。我避免接觸這隻生物；一種羞愧感和對我之前殘忍行為的回憶，阻止我對它施加身體上的虐待。幾個星期以來，我沒有打它或以其他方式對它施加暴力；但漸漸地——非常漸漸地——我開始對它產生無法言喻的厭惡，並像逃避瘟疫的氣息一樣，靜靜地逃避它的可憎存在。"}], "en": ["For my own part, I soon found a dislike to it arising within me. This was just the reverse of what I had anticipated; but -- I know not how or why it was -- its evident fondness for myself rather disgusted and annoyed. By slow degrees, these feelings of disgust and annoyance rose into the bitterness of hatred. I avoided the creature; a certain sense of shame, and the remembrance of my former deed of cruelty, preventing me from physically abusing it. I did not, for some weeks, strike, or otherwise violently ill use it; but gradually -- very gradually -- I came to look upon it with unutterable loathing, and to flee silently from its odious presence, as from the breath of a pestilence."], "zh": ["就我而言，我很快發現自己對它產生了厭惡。這與我預期的正好相反；但——我不知道為什麼——它對我的明顯喜愛反而讓我感到厭惡和煩躁。隨著時間的推移，這種厭惡和煩躁的感覺逐漸升級為仇恨。我避免接觸這隻生物；一種羞愧感和對我之前殘忍行為的回憶，阻止我對它施加身體上的虐待。幾個星期以來，我沒有打它或以其他方式對它施加暴力；但漸漸地——非常漸漸地——我開始對它產生無法言喻的厭惡，並像逃避瘟疫的氣息一樣，靜靜地逃避它的可憎存在。"]}, {"id": 13, "blocks": [{"lang": "en", "text": "What added, no doubt, to my hatred of the beast, was the discovery, on the morning after I brought it home, that, like Pluto, it also had been deprived of one of its eyes. This circumstance, however, only endeared it to my wife, who, as I have already said, possessed, in a high degree, that humanity of feeling which had once been my distinguishing trait, and the source of many of my simplest and purest pleasures."}, {"lang": "zh", "text": "無疑，讓我對這隻獸子更加厭惡的是，當我把它帶回家後的第二天早晨，我發現它也像普魯托一樣失去了一隻眼睛。然而，這一情況卻讓我妻子更加喜愛它，正如我之前所說，她擁有著我曾經的特徵——那種高尚的人性情感，曾是我最顯著的特徵，也是我最簡單、最純粹快樂的源泉。"}, {"lang": "en", "text": "With my aversion to this cat, however, its partiality for myself seemed to increase. It followed my footsteps with a pertinacity which it would be difficult to make the reader comprehend. Whenever I sat, it would crouch beneath my chair, or spring upon my knees, covering me with its loathsome caresses. If I arose to walk it would get between my feet and thus nearly throw me down, or, fastening its long and sharp claws in my dress, clamber, in this manner, to my breast. At such times, although I longed to destroy it with a blow, I was yet withheld from so doing, partly by a memory of my former crime, but chiefly -- let me confess it at once -- by absolute dread of the beast."}, {"lang": "zh", "text": "然而，對於這隻貓的厭惡，似乎它對我的偏愛卻在增加。它以一種難以讓讀者理解的堅持跟隨著我的腳步。每當我坐下時，它就會蜷縮在我的椅子下，或跳到我的膝蓋上，對我進行可憎的愛撫。如果我起身走動，它就會在我腳下穿梭，幾乎將我絆倒，或者用它長而尖的爪子抓住我的衣服，這樣爬到我的胸前。在這樣的時候，雖然我渴望用一擊將它摧毀，但我卻被一種對我過去罪行的記憶所阻止，主要的原因——讓我坦白——是對這隻獸子的絕對恐懼。"}], "en": ["What added, no doubt, to my hatred of the beast, was the discovery, on the morning after I brought it home, that, like Pluto, it also had been deprived of one of its eyes. This circumstance, however, only endeared it to my wife, who, as I have already said, possessed, in a high degree, that humanity of feeling which had once been my distinguishing trait, and the source of many of my simplest and purest pleasures.", "With my aversion to this cat, however, its partiality for myself seemed to increase. It followed my footsteps with a pertinacity which it would be difficult to make the reader comprehend. Whenever I sat, it would crouch beneath my chair, or spring upon my knees, covering me with its loathsome caresses. If I arose to walk it would get between my feet and thus nearly throw me down, or, fastening its long and sharp claws in my dress, clamber, in this manner, to my breast. At such times, although I longed to destroy it with a blow, I was yet withheld from so doing, partly by a memory of my former crime, but chiefly -- let me confess it at once -- by absolute dread of the beast."], "zh": ["無疑，讓我對這隻獸子更加厭惡的是，當我把它帶回家後的第二天早晨，我發現它也像普魯托一樣失去了一隻眼睛。然而，這一情況卻讓我妻子更加喜愛它，正如我之前所說，她擁有著我曾經的特徵——那種高尚的人性情感，曾是我最顯著的特徵，也是我最簡單、最純粹快樂的源泉。", "然而，對於這隻貓的厭惡，似乎它對我的偏愛卻在增加。它以一種難以讓讀者理解的堅持跟隨著我的腳步。每當我坐下時，它就會蜷縮在我的椅子下，或跳到我的膝蓋上，對我進行可憎的愛撫。如果我起身走動，它就會在我腳下穿梭，幾乎將我絆倒，或者用它長而尖的爪子抓住我的衣服，這樣爬到我的胸前。在這樣的時候，雖然我渴望用一擊將它摧毀，但我卻被一種對我過去罪行的記憶所阻止，主要的原因——讓我坦白——是對這隻獸子的絕對恐懼。"]}, {"id": 14, "blocks": [{"lang": "en", "text": "This dread was not exactly a dread of physical evil -- and yet I should be at a loss how otherwise to define it. I am almost ashamed to own -- yes, even in this felon's cell, I am almost ashamed to own -- that the terror and horror with which the animal inspired me, had been heightened by one of the merest chimæras it would be possible to conceive. My wife had called my attention, more than once, to the character of the mark of white hair, of which I have spoken, and which constituted the sole visible difference between the strange beast and the one I had destroyed. The reader will remember that this mark, although large, had been originally very indefinite; but, by slow degrees -- degrees nearly imperceptible, and which for a long time my Reason struggled to reject as fanciful -- it had, at length, assumed a rigorous distinctness of outline. It was now the representation of an object that I shudder to name -- and for this, above all, I loathed, and dreaded, and would have rid myself of the monster had I dared -- it was now, I say, the image of a hideous -- of a ghastly thing -- of the GALLOWS ! -- oh, mournful and terrible engine of Horror and of Crime -- of Agony and of Death !"}, {"lang": "zh", "text": "這種恐懼並不完全是對身體傷害的恐懼——然而我無法用其他方式來定義它。我幾乎感到羞愧——是的，即使在這個罪犯的牢房裡，我也幾乎感到羞愧——承認這隻動物所激起的恐懼和恐怖，因為一種最微不足道的幻影而加劇。我的妻子曾多次提到我所說的白毛標記的特徵，這是這隻奇怪的獸子和我所摧毀的那隻之間唯一的可見區別。讀者會記得，這個標記雖然很大，但最初卻非常不明確；但隨著時間的推移——幾乎無法察覺的漸變，並且我的理智長期以來努力拒絕這種幻想——它最終變得輪廓分明。現在它的形狀是我不敢提及的物體的象徵——而正因為這一點，我對它的厭惡、恐懼，並且如果我敢的話，我會想要擺脫這隻怪物——現在，我說，它的形象是可怕的——可怕的東西——絞刑架！——哦，悲哀而可怕的恐怖與罪惡的工具——痛苦與死亡的象徵！"}], "en": ["This dread was not exactly a dread of physical evil -- and yet I should be at a loss how otherwise to define it. I am almost ashamed to own -- yes, even in this felon's cell, I am almost ashamed to own -- that the terror and horror with which the animal inspired me, had been heightened by one of the merest chimæras it would be possible to conceive. My wife had called my attention, more than once, to the character of the mark of white hair, of which I have spoken, and which constituted the sole visible difference between the strange beast and the one I had destroyed. The reader will remember that this mark, although large, had been originally very indefinite; but, by slow degrees -- degrees nearly imperceptible, and which for a long time my Reason struggled to reject as fanciful -- it had, at length, assumed a rigorous distinctness of outline. It was now the representation of an object that I shudder to name -- and for this, above all, I loathed, and dreaded, and would have rid myself of the monster had I dared -- it was now, I say, the image of a hideous -- of a ghastly thing -- of the GALLOWS ! -- oh, mournful and terrible engine of Horror and of Crime -- of Agony and of Death !"], "zh": ["這種恐懼並不完全是對身體傷害的恐懼——然而我無法用其他方式來定義它。我幾乎感到羞愧——是的，即使在這個罪犯的牢房裡，我也幾乎感到羞愧——承認這隻動物所激起的恐懼和恐怖，因為一種最微不足道的幻影而加劇。我的妻子曾多次提到我所說的白毛標記的特徵，這是這隻奇怪的獸子和我所摧毀的那隻之間唯一的可見區別。讀者會記得，這個標記雖然很大，但最初卻非常不明確；但隨著時間的推移——幾乎無法察覺的漸變，並且我的理智長期以來努力拒絕這種幻想——它最終變得輪廓分明。現在它的形狀是我不敢提及的物體的象徵——而正因為這一點，我對它的厭惡、恐懼，並且如果我敢的話，我會想要擺脫這隻怪物——現在，我說，它的形象是可怕的——可怕的東西——絞刑架！——哦，悲哀而可怕的恐怖與罪惡的工具——痛苦與死亡的象徵！"]}, {"id": 15, "blocks": [{"lang": "en", "text": "And now was I indeed wretched beyond the wretchedness of mere Humanity. And a brute beast -- whose fellow I had contemptuously destroyed -- a brute beast to work out for me -- for me a man, fashioned in the image of the High God -- so much of insufferable wo! Alas! neither by day nor by night knew I the blessing of Rest any more! During the former the creature left me no moment alone; and, in the latter, I started, hourly, from dreams of unutterable fear, to find the hot breath of the thing upon my face, and its vast weight -- an incarnate Night-Mare that I had no power to shake off -- incumbent eternally upon my heart !"}, {"lang": "zh", "text": "而現在，我的痛苦確實超越了單純人性的痛苦。而一隻我曾經輕蔑地摧毀的野獸——一隻野獸為我——為我這個按照至高神的形象所造的人——帶來如此難以忍受的痛苦！可憐啊！我再也無法在白天或黑夜享受到安寧的祝福！在白天，這隻生物不給我片刻的獨處；而在夜裡，我每小時都因無法言喻的恐懼而驚醒，發現那東西的熱氣在我臉上，和它的巨大重量——一種我無法擺脫的化身噩夢，永遠壓在我的心上！"}], "en": ["And now was I indeed wretched beyond the wretchedness of mere Humanity. And a brute beast -- whose fellow I had contemptuously destroyed -- a brute beast to work out for me -- for me a man, fashioned in the image of the High God -- so much of insufferable wo! Alas! neither by day nor by night knew I the blessing of Rest any more! During the former the creature left me no moment alone; and, in the latter, I started, hourly, from dreams of unutterable fear, to find the hot breath of the thing upon my face, and its vast weight -- an incarnate Night-Mare that I had no power to shake off -- incumbent eternally upon my heart !"], "zh": ["而現在，我的痛苦確實超越了單純人性的痛苦。而一隻我曾經輕蔑地摧毀的野獸——一隻野獸為我——為我這個按照至高神的形象所造的人——帶來如此難以忍受的痛苦！可憐啊！我再也無法在白天或黑夜享受到安寧的祝福！在白天，這隻生物不給我片刻的獨處；而在夜裡，我每小時都因無法言喻的恐懼而驚醒，發現那東西的熱氣在我臉上，和它的巨大重量——一種我無法擺脫的化身噩夢，永遠壓在我的心上！"]}, {"id": 16, "blocks": [{"lang": "en", "text": "Beneath the pressure of torments such as these, the feeble remnant of the good within me succumbed. Evil thoughts became my sole intimates -- the darkest and most evil of thoughts. The moodiness of my usual temper increased to hatred of all things and of all mankind; while, from the sudden, frequent, and ungovernable outbursts of a fury to which I now blindly abandoned myself, my uncomplaining wife, alas! was the most usual and the most patient of sufferers."}, {"lang": "zh", "text": "在這樣的折磨壓力下，我內心微弱的善良殘餘屈服了。邪惡的思想成為我唯一的伴侶——最黑暗、最邪惡的思想。我的情緒變得愈發陰鬱，對所有事物和全人類充滿仇恨；而我現在盲目地放任自己突然、頻繁且無法控制的怒火，我那默默忍受的妻子，唉！成為了最常受苦和最耐心的受害者。"}, {"lang": "en", "text": "One day she accompanied me, upon some household errand, into the cellar of the old building which our poverty compelled us to inhabit. The cat followed me down the steep stairs, and, nearly throwing me headlong, exasperated me to madness. Uplifting an axe, and forgetting, in my wrath, the childish dread which had hitherto stayed my hand, I aimed a blow at the animal which, of course, would have proved instantly fatal had it descended as I wished. But this blow was arrested by the hand of my wife. Goaded, by the interference, into a rage more than demoniacal, I withdrew my arm from her grasp and buried the axe in her brain. She fell dead upon the spot, without a groan."}, {"lang": "zh", "text": "有一天，她陪我去老房子的地下室辦一些家務，因為貧窮迫使我們住在那裡。貓跟著我下了陡峭的樓梯，幾乎把我絆倒，讓我憤怒到瘋狂。我舉起一把斧頭，忘記了以往的恐懼，對著這隻動物揮下去，這一擊如果如我所願，當然會立刻致命。但這一擊被我妻子的手攔住了。因為她的干預，我被激怒得幾乎失去理智，將手從她的抓握中抽回，將斧頭埋進了她的腦袋裡。她當場死去，沒有發出一聲呻吟。"}], "en": ["Beneath the pressure of torments such as these, the feeble remnant of the good within me succumbed. Evil thoughts became my sole intimates -- the darkest and most evil of thoughts. The moodiness of my usual temper increased to hatred of all things and of all mankind; while, from the sudden, frequent, and ungovernable outbursts of a fury to which I now blindly abandoned myself, my uncomplaining wife, alas! was the most usual and the most patient of sufferers.", "One day she accompanied me, upon some household errand, into the cellar of the old building which our poverty compelled us to inhabit. The cat followed me down the steep stairs, and, nearly throwing me headlong, exasperated me to madness. Uplifting an axe, and forgetting, in my wrath, the childish dread which had hitherto stayed my hand, I aimed a blow at the animal which, of course, would have proved instantly fatal had it descended as I wished. But this blow was arrested by the hand of my wife. Goaded, by the interference, into a rage more than demoniacal, I withdrew my arm from her grasp and buried the axe in her brain. She fell dead upon the spot, without a groan."], "zh": ["在這樣的折磨壓力下，我內心微弱的善良殘餘屈服了。邪惡的思想成為我唯一的伴侶——最黑暗、最邪惡的思想。我的情緒變得愈發陰鬱，對所有事物和全人類充滿仇恨；而我現在盲目地放任自己突然、頻繁且無法控制的怒火，我那默默忍受的妻子，唉！成為了最常受苦和最耐心的受害者。", "有一天，她陪我去老房子的地下室辦一些家務，因為貧窮迫使我們住在那裡。貓跟著我下了陡峭的樓梯，幾乎把我絆倒，讓我憤怒到瘋狂。我舉起一把斧頭，忘記了以往的恐懼，對著這隻動物揮下去，這一擊如果如我所願，當然會立刻致命。但這一擊被我妻子的手攔住了。因為她的干預，我被激怒得幾乎失去理智，將手從她的抓握中抽回，將斧頭埋進了她的腦袋裡。她當場死去，沒有發出一聲呻吟。"]}, {"id": 17, "blocks": [{"lang": "en", "text": "This hideous murder accomplished, I set myself forthwith, and with entire deliberation, to the task of concealing the body. I knew that I could not remove it from the house, either by day or by night, without the risk of being observed by the neighbors. Many projects entered my mind. At one period I thought of cutting the corpse into minute fragments, and destroying them by fire. At another, I resolved to dig a grave for it in the floor of the cellar. Again, I deliberated about casting it in the well in the yard -- about packing it in a box, as if merchandize, with the usual arrangements, and so getting a porter to take it from the house. Finally I hit upon what I considered a far better expedient than either of these. I determined to wall it up in the cellar -- as the monks of the middle ages are recorded to have walled up their victims."}, {"lang": "zh", "text": "這樸素的謀殺完成後，我立刻開始全心全意地隱藏屍體。我知道我無法在白天或黑夜將它從房子裡搬走，而不冒著被鄰居發現的風險。許多計劃進入我的腦海。在某個時期，我考慮將屍體切成小塊，然後用火焚燒它。又一個時期，我決定在地下室的地板上挖一個墳墓。再者，我考慮將它扔進院子裡的井裡——將它打包在一個箱子裡，像貨物一樣，並進行通常的安排，讓搬運工將它從房子裡搬走。最後，我想到了我認為比這些方法更好的辦法。我決定將它牆壁封住——就像中世紀的修道士們記載的那樣，將他們的受害者封在牆裡。"}], "en": ["This hideous murder accomplished, I set myself forthwith, and with entire deliberation, to the task of concealing the body. I knew that I could not remove it from the house, either by day or by night, without the risk of being observed by the neighbors. Many projects entered my mind. At one period I thought of cutting the corpse into minute fragments, and destroying them by fire. At another, I resolved to dig a grave for it in the floor of the cellar. Again, I deliberated about casting it in the well in the yard -- about packing it in a box, as if merchandize, with the usual arrangements, and so getting a porter to take it from the house. Finally I hit upon what I considered a far better expedient than either of these. I determined to wall it up in the cellar -- as the monks of the middle ages are recorded to have walled up their victims."], "zh": ["這樸素的謀殺完成後，我立刻開始全心全意地隱藏屍體。我知道我無法在白天或黑夜將它從房子裡搬走，而不冒著被鄰居發現的風險。許多計劃進入我的腦海。在某個時期，我考慮將屍體切成小塊，然後用火焚燒它。又一個時期，我決定在地下室的地板上挖一個墳墓。再者，我考慮將它扔進院子裡的井裡——將它打包在一個箱子裡，像貨物一樣，並進行通常的安排，讓搬運工將它從房子裡搬走。最後，我想到了我認為比這些方法更好的辦法。我決定將它牆壁封住——就像中世紀的修道士們記載的那樣，將他們的受害者封在牆裡。"]}, {"id": 18, "blocks": [{"lang": "en", "text": "For a purpose such as this the cellar was well adapted. Its walls were loosely constructed, and had lately been plastered throughout with a rough plaster, which the dampness of the atmosphere had prevented from hardening. Moreover, in one of the walls was a projection, caused by a false chimney, or fireplace, that had been filled up, and made to resemble the rest of the cellar. I made no doubt that I could readily displace the bricks at this point, insert the corpse, and wall the whole up as before, so that no eye could detect any thing suspicious."}, {"lang": "zh", "text": "為了這樣的目的，地下室非常適合。它的牆壁建造得很鬆散，最近用粗糙的灰泥重新塗抹，因為潮濕的氣候使其無法硬化。此外，牆壁上有一個突出部分，是由一個假煙囪或壁爐造成的，這個部分已經被填滿，並使其看起來與地下室的其他部分相似。我毫不懷疑我可以輕易地在這個地方移動磚塊，將屍體放入，然後像以前一樣將整個牆壁封住，讓任何人都無法察覺到任何可疑的東西。"}, {"lang": "en", "text": "And in this calculation I was not deceived. By means of a crow-bar I easily dislodged the bricks, and, having carefully deposited the body against the inner wall, I propped it in that position, while, with little trouble, I re-laid the whole structure as it originally stood. Having procured mortar, sand, and hair, with every possible precaution, I prepared a plaster which could not be distinguished from the old, and with this I very carefully went over the new brick-work. When I had finished, I felt satisfied that all was right. The wall did not present the slightest appearance of having been disturbed. The rubbish on the floor was picked up with the minutest care. I looked around triumphantly, and said to myself -- \"Here at least, then, my labor has not been in vain.\""}, {"lang": "zh", "text": "在這一計算中，我並沒有被欺騙。通過一根撬棍，我輕鬆地將磚塊移開，並小心翼翼地將屍體放在內牆上，支撐著它，同時毫不費力地將整個結構恢復到原來的樣子。獲得了灰泥、沙子和毛髮，並且小心翼翼地準備了一種無法與舊灰泥區分的灰泥，然後我非常小心地將新磚的表面覆蓋上。當我完成時，我感到一切都很好。牆壁沒有顯示出任何被擾動的跡象。地板上的垃圾被仔細清理。我得意地四處張望，對自己說——“至少在這裡，我的勞動沒有白費。”"}], "en": ["For a purpose such as this the cellar was well adapted. Its walls were loosely constructed, and had lately been plastered throughout with a rough plaster, which the dampness of the atmosphere had prevented from hardening. Moreover, in one of the walls was a projection, caused by a false chimney, or fireplace, that had been filled up, and made to resemble the rest of the cellar. I made no doubt that I could readily displace the bricks at this point, insert the corpse, and wall the whole up as before, so that no eye could detect any thing suspicious.", "And in this calculation I was not deceived. By means of a crow-bar I easily dislodged the bricks, and, having carefully deposited the body against the inner wall, I propped it in that position, while, with little trouble, I re-laid the whole structure as it originally stood. Having procured mortar, sand, and hair, with every possible precaution, I prepared a plaster which could not be distinguished from the old, and with this I very carefully went over the new brick-work. When I had finished, I felt satisfied that all was right. The wall did not present the slightest appearance of having been disturbed. The rubbish on the floor was picked up with the minutest care. I looked around triumphantly, and said to myself -- \"Here at least, then, my labor has not been in vain.\""], "zh": ["為了這樣的目的，地下室非常適合。它的牆壁建造得很鬆散，最近用粗糙的灰泥重新塗抹，因為潮濕的氣候使其無法硬化。此外，牆壁上有一個突出部分，是由一個假煙囪或壁爐造成的，這個部分已經被填滿，並使其看起來與地下室的其他部分相似。我毫不懷疑我可以輕易地在這個地方移動磚塊，將屍體放入，然後像以前一樣將整個牆壁封住，讓任何人都無法察覺到任何可疑的東西。", "在這一計算中，我並沒有被欺騙。通過一根撬棍，我輕鬆地將磚塊移開，並小心翼翼地將屍體放在內牆上，支撐著它，同時毫不費力地將整個結構恢復到原來的樣子。獲得了灰泥、沙子和毛髮，並且小心翼翼地準備了一種無法與舊灰泥區分的灰泥，然後我非常小心地將新磚的表面覆蓋上。當我完成時，我感到一切都很好。牆壁沒有顯示出任何被擾動的跡象。地板上的垃圾被仔細清理。我得意地四處張望，對自己說——“至少在這裡，我的勞動沒有白費。”"]}, {"id": 19, "blocks": [{"lang": "en", "text": "My next step was to look for the beast which had been the cause of so much wretchedness; for I had, at length, firmly resolved to put it to death. Had I been able to meet with it, at the moment, there could have been no doubt of its fate; but it appeared that the crafty animal had been alarmed at the violence of my previous anger, and forebore to present itself in my present mood. It is impossible to describe, or to imagine, the deep, the blissful sense of relief which the absence of the detested creature occasioned in my bosom. It did not make its appearance during the night -- and thus for one night at least, since its introduction into the house, I soundly and tranquilly slept; aye, slept even with the burden of murder upon my soul!"}, {"lang": "zh", "text": "我的下一步是尋找那隻造成如此多痛苦的獸子；因為我最終下定決心要將它殺死。如果當時我能遇到它，毫無疑問它的命運將會註定；但這隻狡猾的動物似乎因為我之前的憤怒而感到驚恐，並且不敢在我此刻的情緒中出現。無法形容或想像，這隻可憎生物的缺席在我心中引起的深刻、幸福的解脫感。它在夜裡沒有出現——因此至少在它進入我家以來的第一個夜晚，我安然無恙地睡著；是的，甚至在我靈魂上背負著謀殺的重擔！"}], "en": ["My next step was to look for the beast which had been the cause of so much wretchedness; for I had, at length, firmly resolved to put it to death. Had I been able to meet with it, at the moment, there could have been no doubt of its fate; but it appeared that the crafty animal had been alarmed at the violence of my previous anger, and forebore to present itself in my present mood. It is impossible to describe, or to imagine, the deep, the blissful sense of relief which the absence of the detested creature occasioned in my bosom. It did not make its appearance during the night -- and thus for one night at least, since its introduction into the house, I soundly and tranquilly slept; aye, slept even with the burden of murder upon my soul!"], "zh": ["我的下一步是尋找那隻造成如此多痛苦的獸子；因為我最終下定決心要將它殺死。如果當時我能遇到它，毫無疑問它的命運將會註定；但這隻狡猾的動物似乎因為我之前的憤怒而感到驚恐，並且不敢在我此刻的情緒中出現。無法形容或想像，這隻可憎生物的缺席在我心中引起的深刻、幸福的解脫感。它在夜裡沒有出現——因此至少在它進入我家以來的第一個夜晚，我安然無恙地睡著；是的，甚至在我靈魂上背負著謀殺的重擔！"]}, {"id": 20, "blocks": [{"lang": "en", "text": "The second and the third day passed, and still my tormentor came not. Once again I breathed as a freeman. The monster, in terror, had fled the premises forever! I should behold it no more! My happiness was supreme! The guilt of my dark deed disturbed me but little. Some few inquiries had been made, but these had been readily answered. Even a search had been instituted -- but of course nothing was to be discovered. I looked upon my future felicity as secured."}, {"lang": "zh", "text": "第二天和第三天過去了，然而我的折磨者仍然沒有出現。再次，我如同自由人般呼吸。這隻怪物因恐懼而永遠逃離了這個地方！我再也不會見到它了！我的幸福達到了巔峰！我黑暗罪行的罪惡感幾乎沒有打擾我。雖然有一些詢問，但這些都很容易回答。甚至還進行了一次搜查——但當然什麼也沒有被發現。我認為我的未來幸福已經得到了保障。"}, {"lang": "en", "text": "Upon the fourth day of the assassination, a party of the police came, very unexpectedly, into the house, and proceeded again to make rigorous investigation of the premises. Secure, however, in the inscrutability of my place of concealment, I felt no embarrassment whatever. The officers bade me accompany them in their search. They left no nook or corner unexplored. At length, for the third or fourth time, they descended into the cellar. I quivered not in a muscle. My heart beat calmly as that of one who slumbers in innocence. I walked the cellar from end to end. I folded my arms upon my bosom, and roamed easily to and fro. The police were thoroughly satisfied and prepared to depart. The glee at my heart was too strong to be restrained. I burned to say if but one word, by way of triumph, and to render doubly sure their assurance of my guiltlessness."}, {"lang": "zh", "text": "在謀殺的第四天，一隊警察意外地來到我家，並再次對房屋進行嚴格的調查。然而，我對我藏身之處的隱秘感到安全，毫無尷尬。警官們要求我陪同他們進行搜索。他們沒有留下任何角落或死角未檢查。最終，他們第三次或第四次下到了地下室。我一絲不苟，心臟平靜得如同一個無辜的沉睡者。我在地下室裡走來走去，雙臂交叉在胸前，輕鬆地來回走動。警察們對此感到非常滿意，準備離開。我的心中充滿了無法抑制的喜悅。我渴望說出一句話，來表達我的勝利，並讓他們更加確信我的無辜。"}], "en": ["The second and the third day passed, and still my tormentor came not. Once again I breathed as a freeman. The monster, in terror, had fled the premises forever! I should behold it no more! My happiness was supreme! The guilt of my dark deed disturbed me but little. Some few inquiries had been made, but these had been readily answered. Even a search had been instituted -- but of course nothing was to be discovered. I looked upon my future felicity as secured.", "Upon the fourth day of the assassination, a party of the police came, very unexpectedly, into the house, and proceeded again to make rigorous investigation of the premises. Secure, however, in the inscrutability of my place of concealment, I felt no embarrassment whatever. The officers bade me accompany them in their search. They left no nook or corner unexplored. At length, for the third or fourth time, they descended into the cellar. I quivered not in a muscle. My heart beat calmly as that of one who slumbers in innocence. I walked the cellar from end to end. I folded my arms upon my bosom, and roamed easily to and fro. The police were thoroughly satisfied and prepared to depart. The glee at my heart was too strong to be restrained. I burned to say if but one word, by way of triumph, and to render doubly sure their assurance of my guiltlessness."], "zh": ["第二天和第三天過去了，然而我的折磨者仍然沒有出現。再次，我如同自由人般呼吸。這隻怪物因恐懼而永遠逃離了這個地方！我再也不會見到它了！我的幸福達到了巔峰！我黑暗罪行的罪惡感幾乎沒有打擾我。雖然有一些詢問，但這些都很容易回答。甚至還進行了一次搜查——但當然什麼也沒有被發現。我認為我的未來幸福已經得到了保障。", "在謀殺的第四天，一隊警察意外地來到我家，並再次對房屋進行嚴格的調查。然而，我對我藏身之處的隱秘感到安全，毫無尷尬。警官們要求我陪同他們進行搜索。他們沒有留下任何角落或死角未檢查。最終，他們第三次或第四次下到了地下室。我一絲不苟，心臟平靜得如同一個無辜的沉睡者。我在地下室裡走來走去，雙臂交叉在胸前，輕鬆地來回走動。警察們對此感到非常滿意，準備離開。我的心中充滿了無法抑制的喜悅。我渴望說出一句話，來表達我的勝利，並讓他們更加確信我的無辜。"]}, {"id": 21, "blocks": [{"lang": "en", "text": "\"Gentlemen,\" I said at last, as the party ascended the steps, \"I delight to have allayed your suspicions. I wish you all health, and a little more courtesy. By the bye, gentlemen, this -- this is a very well constructed house.\" (In the rabid desire to say something easily, I scarcely knew what I uttered at all.) -- \"I may say an excellently well constructed house. These walls -- are you going, gentlemen? -- these walls are solidly put together;\" and here, through the mere phrenzy of bravado, I rapped heavily, with a cane which I held in my hand, upon that very portion of the brick-work behind which stood the corpse of the wife of my bosom."}, {"lang": "zh", "text": "“各位，”我終於說道，當這隊人馬正要上樓時，“我很高興能消除你們的懷疑。我祝你們健康，並希望你們能多一點禮貌。對了，各位，這——這是一棟非常結實的房子。”（在這種狂熱的渴望中，我幾乎不知道自己說了什麼。）——“我可以說這是一棟極好的房子。這些牆壁——你們要走了嗎，各位？——這些牆壁建得非常堅固；”在這裡，因為單純的自負，我用手中的手杖重重敲打了那一部分磚牆，正是我妻子的屍體就藏在那裡。"}], "en": ["\"Gentlemen,\" I said at last, as the party ascended the steps, \"I delight to have allayed your suspicions. I wish you all health, and a little more courtesy. By the bye, gentlemen, this -- this is a very well constructed house.\" (In the rabid desire to say something easily, I scarcely knew what I uttered at all.) -- \"I may say an excellently well constructed house. These walls -- are you going, gentlemen? -- these walls are solidly put together;\" and here, through the mere phrenzy of bravado, I rapped heavily, with a cane which I held in my hand, upon that very portion of the brick-work behind which stood the corpse of the wife of my bosom."], "zh": ["“各位，”我終於說道，當這隊人馬正要上樓時，“我很高興能消除你們的懷疑。我祝你們健康，並希望你們能多一點禮貌。對了，各位，這——這是一棟非常結實的房子。”（在這種狂熱的渴望中，我幾乎不知道自己說了什麼。）——“我可以說這是一棟極好的房子。這些牆壁——你們要走了嗎，各位？——這些牆壁建得非常堅固；”在這裡，因為單純的自負，我用手中的手杖重重敲打了那一部分磚牆，正是我妻子的屍體就藏在那裡。"]}, {"id": 22, "blocks": [{"lang": "en", "text": "But may God shield and deliver me from the fangs of the Arch-Fiend ! No sooner had the reverberation of my blows sunk into silence, than I was answered by a voice from within the tomb! -- by a cry, at first muffled and broken, like the sobbing of a child, and then quickly swelling into one long, loud, and continuous scream, utterly anomalous and inhuman -- a howl -- a wailing shriek, half of horror and half of triumph, such as might have arisen only out of hell, conjointly from the throats of the dammed in their agony and of the demons that exult in the damnation."}, {"lang": "zh", "text": "但願上帝保佑我，讓我逃脫魔鬼的爪牙！我剛敲打的回聲還未沉寂，便聽到來自墳墓內的聲音！——起初是低沉而斷斷續續的哭聲，像是孩子的啜泣，然後迅速變成一聲長而響亮、連綿不絕的尖叫，完全異常且不人道——一聲嚎叫——一聲哀嚎，半是恐懼半是勝利，似乎只有地獄的被詛咒者在他們的痛苦中和那些在詛咒中得意的惡魔的喉嚨中才能發出。"}], "en": ["But may God shield and deliver me from the fangs of the Arch-Fiend ! No sooner had the reverberation of my blows sunk into silence, than I was answered by a voice from within the tomb! -- by a cry, at first muffled and broken, like the sobbing of a child, and then quickly swelling into one long, loud, and continuous scream, utterly anomalous and inhuman -- a howl -- a wailing shriek, half of horror and half of triumph, such as might have arisen only out of hell, conjointly from the throats of the dammed in their agony and of the demons that exult in the damnation."], "zh": ["但願上帝保佑我，讓我逃脫魔鬼的爪牙！我剛敲打的回聲還未沉寂，便聽到來自墳墓內的聲音！——起初是低沉而斷斷續續的哭聲，像是孩子的啜泣，然後迅速變成一聲長而響亮、連綿不絕的尖叫，完全異常且不人道——一聲嚎叫——一聲哀嚎，半是恐懼半是勝利，似乎只有地獄的被詛咒者在他們的痛苦中和那些在詛咒中得意的惡魔的喉嚨中才能發出。"]}, {"id": 23, "blocks": [{"lang": "en", "text": "Of my own thoughts it is folly to speak. Swooning, I staggered to the opposite wall. For one instant the party upon the stairs remained motionless, through extremity of terror and of awe. In the next, a dozen stout arms were toiling at the wall. It fell bodily. The corpse, already greatly decayed and clotted with gore, stood erect before the eyes of the spectators. Upon its head, with red extended mouth and solitary eye of fire, sat the hideous beast whose craft had seduced me into murder, and whose informing voice had consigned me to the hangman. I had walled the monster up within the tomb!"}, {"lang": "zh", "text": "談到我自己的想法，這是愚蠢的。我暈眩著，踉蹌著走向對面的牆壁。就在那一瞬間，樓梯上的人因恐懼和敬畏而愣住了。接著，十幾隻強壯的手臂在牆上奮力掙扎。牆壁整個倒塌了。屍體，已經腐爛且沾滿血跡，直立在觀眾面前。它的頭上，張嘴發出紅色的火焰，獨眼的可怕獸子坐在上面，正是那隻引誘我走向謀殺的怪物，正是那隻將我送上絞刑架的         let currentIndex = 0;

        function updatePage() {
            if (!pages || pages.length === 0) return;
            const page = pages[currentIndex];
            const container = document.getElementById('paragraph-box');
            container.innerHTML = '';

            // 依原文順序交替渲染英文／中文段落（一頁可能有好幾組英中對照），
            // 不再把整頁的英文集中在最上面、中文集中在最下面。
            const blocks = page.blocks || [];
            blocks.forEach(b => {
                const p = document.createElement('div');
                p.className = (b.lang === 'en') ? 'en-p' : 'zh-p';
                p.innerText = b.text;
                container.appendChild(p);
            });

            document.getElementById('page-info').innerText = `${currentIndex + 1} / ${pages.length}`;
            document.getElementById('progress').style.width = `${((currentIndex + 1) / pages.length) * 100}%`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === pages.length - 1;
            document.getElementById('main-content').scrollTop = 0;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // 💡 智慧辨識電腦與手機觸控事件
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        document.addEventListener('mouseup', (e) => {
            // 電腦端：按住 Alt 鍵再選取才觸發（避開 Google 翻譯／一般選字）
            // 手機端：直接選取文字就觸發
            if (isMobile || e.altKey) {
                const selection = window.getSelection();
                const text = selection.toString().trim().toLowerCase();
                if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                    analyzeWord(text);
                }
            }
        });

        // 💡 電腦端：直接在英文段落雙擊單字即可查詢，不需要按 Alt，看小說時更方便
        document.addEventListener('dblclick', (e) => {
            if (isMobile) return; // 手機交給上面的 mouseup 處理，避免重複觸發
            if (!e.target.closest('.en-p')) return; // 只在英文段落內生效
            const selection = window.getSelection();
            const text = selection.toString().trim().toLowerCase();
            if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                analyzeWord(text);
            }
        });

        function analyzeWord(word) {
            const popup = document.getElementById('root-dict-popup');
            const title = document.getElementById('popup-word-title');
            const content = document.getElementById('popup-content');

            title.innerText = `🔍 【${word}】`;
            content.innerHTML = '';
            let hasResult = false;

            // 1. 字首：只取「最長匹配」，避免像 un / uni 這種短字首淹沒真正對的長字首
            let pMatches = [];
            dbPrefixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.startsWith(k)) pMatches.push({ key: k, meaning: item.meaning });
                });
            });
            const maxPLen = pMatches.reduce((m, x) => Math.max(m, x.key.length), 0);
            pMatches = pMatches.filter(x => x.key.length === maxPLen);

            // 2. 字尾：同樣只取「最長匹配」，並把同一個字尾在不同分類下的結果合併成一行
            let sRaw = [];
            dbSuffixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.endsWith(k) && k.length >= 2) sRaw.push({ key: k, meaning: item.meaning, category: item.category });
                });
            });
            const maxSLen = sRaw.reduce((m, x) => Math.max(m, x.key.length), 0);
            sRaw = sRaw.filter(x => x.key.length === maxSLen);
            const sGrouped = {};
            sRaw.forEach(x => {
                if (!sGrouped[x.key]) sGrouped[x.key] = { meanings: new Set(), categories: [] };
                if (x.meaning) sGrouped[x.key].meanings.add(x.meaning);
                sGrouped[x.key].categories.push(x.category);
            });
            const sMatches = Object.keys(sGrouped).map(k => ({
                key: k,
                meaning: Array.from(sGrouped[k].meanings).join('；'),
                categories: sGrouped[k].categories
            }));

            // 3. 字根：貪婪比對——優先用最長的字根，且已被字首/字尾/其他較長字根「占用」的字母範圍不再重複標記
            //    （例如 university 拆完 uni- 與 -ity 之後，中間巧合出現的 it 就不會再被誤判成字根）
            const prefixZoneEnd = maxPLen;
            const suffixZoneStart = word.length - maxSLen;

            const rootCandidates = {};
            dbRoots.forEach(item => {
                item.keys.forEach(k => {
                    if (k.length < 2) return;
                    if (!rootCandidates[k]) rootCandidates[k] = [];
                    rootCandidates[k].push(item.meaning);
                });
            });
            const sortedKeys = Object.keys(rootCandidates).sort((a, b) => b.length - a.length);

            let claimed = [];
            let rMatches = [];
            sortedKeys.forEach(k => {
                let searchFrom = 0;
                while (true) {
                    const idx = word.indexOf(k, searchFrom);
                    if (idx === -1) break;
                    const end = idx + k.length;
                    const insidePrefix = end <= prefixZoneEnd;
                    const insideSuffix = idx >= suffixZoneStart;
                    const overlapsClaimed = claimed.some(([cs, ce]) => idx < ce && end > cs);
                    if (!insidePrefix && !insideSuffix && !overlapsClaimed) {
                        claimed.push([idx, end]);
                        rMatches.push({ key: k, meaning: rootCandidates[k].join('；') });
                        break;
                    }
                    searchFrom = idx + 1;
                }
            });
            rMatches.sort((a, b) => b.key.length - a.key.length);

            if (pMatches.length > 0) {
                hasResult = true;
                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;
            }

            if (rMatches.length > 0) {
                hasResult = true;
                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🌱 字根 Root</div>${rows}</div>`;
            }

            if (sMatches.length > 0) {
                hasResult = true;
                const rows = sMatches.map(x => {
                    const mStr = x.meaning ? ` : ${x.meaning}` : '';
                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');
                    return `<div class="tag-item"><b>-${x.key}</b>${badges}${mStr}</div>`;
                }).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🔚 字尾 Suffix</div>${rows}</div>`;
            }

            if (!hasResult) {
                content.innerHTML += `<div class="no-result">本機字根資料庫沒有找到相符的片段，這個字可能是不規則變化，或不屬於常見的拉丁／希臘字源。</div>`;
            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }

            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }

        function toggleMp3Play() {
            const label = document.getElementById('mp3BtnLabel');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => label.textContent = " 暫停").catch(() => alert('未找到 MP3 檔案'));
            } else { audioPlayer.pause(); label.textContent = " 全文"; }
        }
        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;
            function speakNext() {
                if (sentenceIndex >= sentences.length) return;
                const utterance = new SpeechSynthesisUtterance(sentences[sentenceIndex].trim());
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onend = () => { sentenceIndex++; speakNext(); };
                utterance.onerror = () => { sentenceIndex++; speakNext(); };
                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
