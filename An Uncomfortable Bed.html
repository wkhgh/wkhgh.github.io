<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莫泊桑 《不舒服的牀》</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #2b2d42;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --accent-color: #3182ce;
            --border-color: #e2e8f0;
            --font-scale: 1;
        }

        body.dark-mode {
            --bg-color: #1a202c;
            --text-main: #edf2f7;
            --text-sub: #cbd5e0;
            --card-bg: #2d3748;
            --accent-color: #63b3ed;
            --border-color: #4a5568;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column;
            font-family: Georgia, "Times New Roman", "標楷體", serif;
        }

        header {
            height: 65px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 20;
            user-select: none;
        }

        .title {
            font-size: 1.2rem; font-weight: bold; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
        }

        .controls { display: flex; align-items: center; gap: 5px; }

        .controls button {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.88rem;
        }

        main { flex: 1; display: flex; position: relative; overflow-y: auto; padding: 15px 0; }

        .click-zone { position: absolute; top: 0; bottom: 0; width: 8%; z-index: 5; cursor: pointer; user-select: none; }
        .click-left { left: 0; } .click-right { right: 0; }

        .card-container { width: 95%; max-width: 1200px; margin: auto; padding: 0 10px; z-index: 10; }

        .paragraph-box {
            background-color: var(--card-bg); padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
        }

        .en-p {
            font-size: calc(1.18rem * var(--font-scale)); line-height: 1.65;
            font-family: Georgia, serif; color: var(--text-main); margin-bottom: 16px;
            user-select: text !important; cursor: text;
        }

        .zh-section { border-top: 1px dashed var(--border-color); padding-top: 20px; }

        .zh-p {
            font-size: calc(1.25rem * var(--font-scale)); line-height: 1.85;
            font-family: "標楷體", serif; color: var(--text-sub); margin-bottom: 16px;
            user-select: text !important;
        }

        /* 字根分析彈窗 */
        #root-dict-popup {
            display: none; position: fixed; bottom: 80px; left: 30px; width: 340px; max-height: 420px;
            background-color: var(--card-bg); border: 2px solid var(--accent-color);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999;
            padding: 16px; overflow-y: auto; font-family: -apple-system, sans-serif;
        }

        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .popup-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); }
        .close-btn { cursor: pointer; font-weight: bold; font-size: 1.2rem; color: var(--text-sub); }
        .tag-group { margin-bottom: 10px; }
        .tag-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
        .tag-item { background-color: var(--bg-color); border-left: 3px solid var(--accent-color); padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 0.9rem; }
        .suffix-badge { display: inline-block; background-color: var(--accent-color); color: white; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 4px; }
        .no-result { font-size: 0.85rem; color: var(--text-sub); line-height: 1.6; padding: 6px 2px 10px 2px; }
        .etymo-link { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); text-align: center; }
        .etymo-link a { color: var(--accent-color); text-decoration: none; font-size: 0.88rem; font-weight: bold; }
        .etymo-link a:hover { text-decoration: underline; }

        footer {
            height: 65px; padding: 8px 25px; background-color: var(--card-bg);
            border-top: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; gap: 6px; flex-shrink: 0; z-index: 20; user-select: none;
        }
        .progress-bar-container { width: 100%; background-color: var(--border-color); height: 6px; border-radius: 3px; overflow: hidden; cursor: pointer; }
        .progress-bar { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.2s; }
        .footer-controls { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-sub); }
        .nav-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 22px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        @media (max-width: 600px) {
            #root-dict-popup { left: 5%; right: 5%; width: 90%; bottom: 75px; }
        }
    </style>
</head>

    <script>
        const pages = [{"id": 1, "en": ["An Uncomfortable Bed", "One autumn I went to stay for the hunting season with some friends in a chateau in Picardy.", "My friends were fond of practical joking, as all my friends are. I do not care to know any other sort of people.", "When I arrived, they gave me a princely reception, which at once aroused distrust in my breast. We had some capital shooting. They embraced me, they cajoled me, as if they expected to have great fun at my expense.", "I said to myself:", "\"Look out, old ferret! They have something in preparation for you.\"", "During the dinner, the mirth was excessive, far too great, in fact. I thought: \"Here are people who take a double share of amusement, and apparently without reason. They must be looking out in their own minds for some good bit of fun. Assuredly I am to be the victim of the joke. Attention!\""], "zh": ["一個秋天，我去皮卡第的一座城堡與一些朋友共度狩獵季節。", "我的朋友們喜歡開玩笑，就像我所有的朋友一樣。我不想認識其他類型的人。", "當我抵達時，他們給了我一個王子般的接待，這立刻在我心中引起了不安。我們有一些精彩的射擊。他們擁抱我，討好我，彷彿期待著在我身上獲得巨大的樂趣。", "我對自己說：", "「小心點，老獾！他們正在為你準備什麼。」", "在晚餐期間，氣氛過於歡樂，實在是過於誇張。我心想：「這裡的人似乎在享受雙倍的樂趣，顯然沒有理由。他們一定在心中期待著某個好玩的事情。毫無疑問，我將成為這個玩笑的受害者。注意！"]}, {"id": 2, "en": ["During the entire evening, everyone laughed in an exaggerated fashion. I smelled a practical joke in the air, as a dog smells game. But what was it? I was watchful, restless. I did not let a word or a meaning or a gesture escape me. Everyone seemed to me an object of suspicion, and I even looked distrustfully at the faces of the servants.", "The hour rang for going to bed, and the whole household came to escort me to my room. Why? They called to me: \"Good night.\" I entered the apartment, shut the door, and remained standing, without moving a single step, holding the wax candle in my hand."], "zh": ["整個晚上，每個人都在誇張地大笑。我像狗嗅到獵物一樣嗅到了空氣中的惡作劇氣息。但那是什麼呢？我保持警覺，心神不寧。我不放過任何一個字、任何一個意義或任何一個手勢。每個人對我來說似乎都是可疑的對象，我甚至對僕人的臉也投以懷疑的目光。", "上床的時間到了，整個家庭來陪我到我的房間。為什麼？他們對我喊道：「晚安。」我進入房間，關上門，站著不動，手中拿著蠟燭。"]}, {"id": 3, "en": ["I heard laughter and whispering in the corridor. Without doubt they were spying on me. I cast a glance around the walls, the furniture, the ceiling, the hangings, the floor. I saw nothing to justify suspicion. I heard persons moving about outside my door. I had no doubt they were looking through the keyhole.", "An idea came into my head: \"My candle may suddenly go out, and leave me in darkness.\"", "Then I went across to the mantelpiece, and lighted all the wax candles that were on it. After that, I cast another glance around me without discovering anything. I advanced with short steps, carefully examining the apartment. Nothing. I inspected every article one after the other. Still nothing. I went over to the window. The shutters, large wooden shutters, were open. I shut them with great care, and then drew the curtains, enormous velvet curtains, and I placed a chair in front of them, so as to have nothing to fear from without."], "zh": ["我聽到走廊裡傳來笑聲和低語。毫無疑問，他們在監視我。我環顧四周，查看牆壁、家具、天花板、掛毯和地板。我沒有看到任何可以證明我懷疑的東西。我聽到門外有人走動。我毫無疑問地認為他們在透過鑰匙孔窺視。", "一個念頭閃過我的腦海：「我的蠟燭可能會突然熄滅，讓我陷入黑暗。」", "於是我走到壁爐架前，點燃了上面的所有蠟燭。之後，我再次環顧四周，卻什麼也沒有發現。我小心翼翼地走動，仔細檢查這間公寓。沒有。逐一檢查每一件物品。依然沒有。我走到窗邊。大木窗戶是開著的。我小心翼翼地把它們關上，然後拉上厚重的天鵝絨窗簾，並在它們前面放了一把椅子，以免外面有任何威脅。"]}, {"id": 4, "en": ["Then I cautiously sat down. The armchair was solid. I did not venture to get into the bed. However, time was flying; and I ended by coming to the conclusion that I was ridiculous. If they were spying on me, as I supposed, they must, while waiting for the success of the joke they had been preparing for me, have been laughing enormously at my terror. So I made up my mind to go to bed. But the bed was particularly suspicious-looking. I pulled at the curtains. They seemed to be secure. All the same, there was danger. I was going perhaps to receive a cold shower-bath from overhead, or perhaps, the moment I stretched myself out, to find myself sinking under the floor with my mattress. I searched in my memory for all the practical jokes of which I ever had experience. And I did not want to be caught. Ah! certainly not! certainly not! Then I suddenly bethought myself of a precaution which I consider one of extreme efficacy: I caught hold of the side of the mattress gingerly, and very slowly drew it toward me. It came away, followed by the sheet and the rest of the bedclothes. I dragged all these objects into the very middle of the room, facing the entrance door. I made my bed over again as best I could at some distance from the suspected bedstead and the corner which had filled me with such anxiety. Then, I extinguished all the candles, and, groping my way, I slipped under the bedclothes."], "zh": ["然後我小心翼翼地坐下。扶手椅很結實。我不敢躺進床裡。然而，時間在飛逝；我最終得出結論，我是多麼可笑。如果他們真的在監視我，正如我所想的那樣，他們一定在等待我恐懼的時候，笑得不亦樂乎。因此我決定上床。但那張床看起來特別可疑。我拉了拉窗簾。它們似乎是安全的。儘管如此，仍然有危險。我可能會從上面遭遇一場冷水淋浴，或者，當我躺下的時候，發現自己與床墊一起沉入地板。我在記憶中搜尋所有我曾經經歷過的惡作劇。我不想被抓住。啊！絕對不行！然後我突然想到了我認為極其有效的一個預防措施：我小心翼翼地抓住床墊的一側，慢慢地把它拉向我。它跟著床單和其他床上用品一起移開。我把這些物品拖到房間的正中央，面對著入口門。我盡量把床鋪好，遠離那張可疑的床架和讓我如此焦慮的角落。然後，我熄滅了所有的蠟燭，摸索著滑進了床上。"]}, {"id": 5, "en": ["For at least another hour, I remained awake, starting at the slightest sound. Everything seemed quiet in the chateau. I fell asleep.", "I must have been in a deep sleep for a long time, but all of a sudden, I was awakened with a start by the fall of a heavy body tumbling right on top of my own body, and, at the same time, I received on my face, on my neck, and on my chest a burning liquid which made me utter a howl of pain. And a dreadful noise, as if a sideboard laden with plates and dishes had fallen down, penetrated my ears."], "zh": ["至少又過了一個小時，我保持清醒，對最微小的聲音驚醒。一切在城堡裡似乎都很安靜。我睡著了。", "我一定是沉沉入睡了很長時間，但突然間，我被一個重物掉落在我身上驚醒，與此同時，我的臉、脖子和胸口被一種燒灼的液體潑灑，讓我發出一聲痛苦的嚎叫。還有一聲可怕的噪音，彷彿一個裝滿盤子和碗的邊櫃倒下，傳入我的耳中。"]}, {"id": 6, "en": ["I felt myself suffocating under the weight that was crushing me and preventing me from moving. I stretched out my hand to find out what was the nature of this object. I felt a face, a nose, and whiskers. Then with all my strength I launched out a blow over this face. But I immediately received a hail of cuffings which made me jump straight out of the soaked sheets, and rush in my nightshirt into the corridor, the door of which I found open.", "O stupor! it was broad daylight. The noise brought my friends hurrying into the apartment, and we found, sprawling over my improvised bed, the dismayed valet, who, while bringing me my morning cup of tea, had tripped over this obstacle in the middle of the floor, and fallen on his stomach, spilling, in spite of himself, my breakfast over my face.", "The precautions I had taken in closing the shutters and going to sleep in the middle of the room had only brought about the interlude I had been striving to avoid.", "Ah! how they all laughed that day!"], "zh": ["我感到自己被壓在重物下，無法動彈。我伸出手想知道這個物體的性質。我感覺到一張臉、一個鼻子和鬍鬚。然後我用全力朝這張臉打去。但我立刻遭到了一陣拳打腳踢，讓我一下子從濕透的床單中跳了起來，穿著睡衣衝進走廊，發現門是開著的。", "哦，驚愕！天已經大亮了。噪音吸引了我的朋友們急忙進入房間，我們發現驚慌失措的男僕正趴在我臨時搭建的床上，他在給我送早茶時，絆倒在地板上的這個障礙物上，摔倒在肚子上，無意中把我的早餐潑灑在我的臉上。", "我關閉窗戶和在房間中央睡覺所採取的預防措施，僅僅帶來了我努力避免的插曲。", "啊！那天他們都笑得不可開交！"]}];
        const dbPrefixes = [{"keys": ["a"], "meaning": "of"}, {"keys": ["a"], "meaning": "on"}, {"keys": ["a"], "meaning": "intensive"}, {"keys": ["a"], "meaning": "ad=to, at, for"}, {"keys": ["a"], "meaning": "ab=from, away"}, {"keys": ["a"], "meaning": "ex=out,extremely"}, {"keys": ["a"], "meaning": "negative(not, without)"}, {"keys": ["ab"], "meaning": "from,away from,off"}, {"keys": ["abs"], "meaning": "apart,away from,off"}, {"keys": ["ad"], "meaning": "near,to,towards,at,for"}, {"keys": ["al"], "meaning": "near, to, towards, all"}, {"keys": ["amb"], "meaning": "about,around,both"}, {"keys": ["ambi"], "meaning": "on both sides, about, arount"}, {"keys": ["amphi"], "meaning": "on both sides, around"}, {"keys": ["an"], "meaning": "negative(not, without)"}, {"keys": ["ana"], "meaning": "upon,on,up"}, {"keys": ["ante"], "meaning": "before"}, {"keys": ["anti"], "meaning": "against,opposite to"}, {"keys": ["apo"], "meaning": "away"}, {"keys": ["arch"], "meaning": "chief"}, {"keys": ["suto"], "meaning": "self"}, {"keys": ["be"], "meaning": "to make"}, {"keys": ["be"], "meaning": "to cover with"}, {"keys": ["be"], "meaning": "upon"}, {"keys": ["be"], "meaning": "by"}, {"keys": ["be"], "meaning": "intensive"}, {"keys": ["bene"], "meaning": "well,good"}, {"keys": ["bi"], "meaning": "double,two"}, {"keys": ["by"], "meaning": "side"}, {"keys": ["cata"], "meaning": "down, downwards, fully"}, {"keys": ["circum"], "meaning": "around, round about"}, {"keys": ["com"], "meaning": "together,with, wholly"}, {"keys": ["counter"], "meaning": "against"}, {"keys": ["contra"], "meaning": "against"}, {"keys": ["de"], "meaning": "down, downard"}, {"keys": ["de"], "meaning": "apart, from"}, {"keys": ["deca"], "meaning": "ten"}, {"keys": ["demi"], "meaning": "half"}, {"keys": ["di"], "meaning": "double,twice"}, {"keys": ["dia"], "meaning": "through,between, across"}, {"keys": ["dis"], "meaning": "apart,away"}, {"keys": ["duo"], "meaning": "two,double"}, {"keys": ["donna"], "meaning": "lady         }

        // 💡 智慧辨識電腦與手機觸控事件
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        document.addEventListener('mouseup', (e) => {
            // 電腦端：按住 Alt 鍵再選取才觸發（避開 Google 翻譯／一般選字）
            // 手機端：直接選取文字就觸發
            if (isMobile || e.altKey) {
                const selection = window.getSelection();
                const text = selection.toString().trim().toLowerCase();
                if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                    analyzeWord(text);
                }
            }
        });

        // 💡 電腦端：直接在英文段落雙擊單字即可查詢，不需要按 Alt，看小說時更方便
        document.addEventListener('dblclick', (e) => {
            if (isMobile) return; // 手機交給上面的 mouseup 處理，避免重複觸發
            if (!e.target.closest('.en-p')) return; // 只在英文段落內生效
            const selection = window.getSelection();
            const text = selection.toString().trim().toLowerCase();
            if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                analyzeWord(text);
            }
        });

        function analyzeWord(word) {
            const popup = document.getElementById('root-dict-popup');
            const title = document.getElementById('popup-word-title');
            const content = document.getElementById('popup-content');

            title.innerText = `🔍 【${word}】`;
            content.innerHTML = '';
            let hasResult = false;

            // 1. 字首：只取「最長匹配」，避免像 un / uni 這種短字首淹沒真正對的長字首
            let pMatches = [];
            dbPrefixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.startsWith(k)) pMatches.push({ key: k, meaning: item.meaning });
                });
            });
            const maxPLen = pMatches.reduce((m, x) => Math.max(m, x.key.length), 0);
            pMatches = pMatches.filter(x => x.key.length === maxPLen);

            // 2. 字尾：同樣只取「最長匹配」，並把同一個字尾在不同分類下的結果合併成一行
            let sRaw = [];
            dbSuffixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.endsWith(k) && k.length >= 2) sRaw.push({ key: k, meaning: item.meaning, category: item.category });
                });
            });
            const maxSLen = sRaw.reduce((m, x) => Math.max(m, x.key.length), 0);
            sRaw = sRaw.filter(x => x.key.length === maxSLen);
            const sGrouped = {};
            sRaw.forEach(x => {
                if (!sGrouped[x.key]) sGrouped[x.key] = { meanings: new Set(), categories: [] };
                if (x.meaning) sGrouped[x.key].meanings.add(x.meaning);
                sGrouped[x.key].categories.push(x.category);
            });
            const sMatches = Object.keys(sGrouped).map(k => ({
                key: k,
                meaning: Array.from(sGrouped[k].meanings).join('；'),
                categories: sGrouped[k].categories
            }));

            // 3. 字根：貪婪比對——優先用最長的字根，且已被字首/字尾/其他較長字根「占用」的字母範圍不再重複標記
            //    （例如 university 拆完 uni- 與 -ity 之後，中間巧合出現的 it 就不會再被誤判成字根）
            const prefixZoneEnd = maxPLen;
            const suffixZoneStart = word.length - maxSLen;

            const rootCandidates = {};
            dbRoots.forEach(item => {
                item.keys.forEach(k => {
                    if (k.length < 2) return;
                    if (!rootCandidates[k]) rootCandidates[k] = [];
                    rootCandidates[k].push(item.meaning);
                });
            });
            const sortedKeys = Object.keys(rootCandidates).sort((a, b) => b.length - a.length);

            let claimed = [];
            let rMatches = [];
            sortedKeys.forEach(k => {
                let searchFrom = 0;
                while (true) {
                    const idx = word.indexOf(k, searchFrom);
                    if (idx === -1) break;
                    const end = idx + k.length;
                    const insidePrefix = end <= prefixZoneEnd;
                    const insideSuffix = idx >= suffixZoneStart;
                    const overlapsClaimed = claimed.some(([cs, ce]) => idx < ce && end > cs);
                    if (!insidePrefix && !insideSuffix && !overlapsClaimed) {
                        claimed.push([idx, end]);
                        rMatches.push({ key: k, meaning: rootCandidates[k].join('；') });
                        break;
                    }
                    searchFrom = idx + 1;
                }
            });
            rMatches.sort((a, b) => b.key.length - a.key.length);

            if (pMatches.length > 0) {
                hasResult = true;
                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;
            }

            if (rMatches.length > 0) {
                hasResult = true;
                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🌱 字根 Root</div>${rows}</div>`;
            }

            if (sMatches.length > 0) {
                hasResult = true;
                const rows = sMatches.map(x => {
                    const mStr = x.meaning ? ` : ${x.meaning}` : '';
                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');
                    return `<div class="tag-item"><b>-${x.key}</b>${badges}${mStr}</div>`;
                }).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🔚 字尾 Suffix</div>${rows}</div>`;
            }

            if (!hasResult) {
                content.innerHTML += `<div class="no-result">本機字根資料庫沒有找到相符的片段，這個字可能是不規則變化，或不屬於常見的拉丁／希臘字源。</div>`;
            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function closePopup() { document.getElementById('root-dict-popup').style.display = 'none'; }
        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); closePopup(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }
        function seekProgress(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleMp3Play() {
            const label = document.getElementById('mp3BtnLabel');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => label.textContent = " 暫停").catch(() => alert('未找到 MP3 檔案'));
            } else { audioPlayer.pause(); label.textContent = " 全文"; }
        }
        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;
            function speakNext() {
                if (sentenceIndex >= sentences.length) return;
                const utterance = new SpeechSynthesisUtterance(sentences[sentenceIndex].trim());
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onend = () => { sentenceIndex++; speakNext(); };
                utterance.onerror = () => { sentenceIndex++; speakNext(); };
                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
        updatePage();
    </script>
</body>
</html>
