    <style>

        /* 字根分析彈窗 */

    <script>
        const pages = [{"id": 1, "blocks": [{"lang": "en", "text": "I visited St. Louis lately, and on my way West, after changing cars at Terre Haute, Indiana, a mild, benevolent-looking gentleman of about forty-five, or maybe fifty, came in at one of the way-stations and sat down beside me. We talked together pleasantly on various subjects for an hour, perhaps, and I found him exceedingly intelligent and entertaining. When he learned that I was from Washington, he immediately began to ask questions about various public men, and about Congressional affairs; and I saw very shortly that I was conversing with a man who was perfectly familiar with the ins and outs of political life at the Capital, even to the ways and manners, and customs of procedure of Senators and Representatives in the Chambers of the national Legislature. Presently two men halted near us for a single moment, and one said to the other:"}, {"lang": "zh", "text": "我最近造訪了聖路易斯，並在前往西部的途中，在印第安納州的特雷豪特換車時，一位看起來和藹可親的中年紳士走進來，坐在我旁邊。他大約四十五歲，或許五十歲，我們愉快地聊了約一小時，發現他非常聰明且有趣。當他得知我來自華盛頓時，他立刻開始詢問各種公眾人物和國會事務；我很快就意識到，我正在與一位對國會政治生活的內幕了如指掌的人交談，甚至包括參議員和眾議員在國家立法機構中的行為舉止和程序習慣。此時，兩名男子在我們附近停下來，片刻之後，其中一人對另一人說："}], "en": ["I visited St. Louis lately, and on my way West, after changing cars at Terre Haute, Indiana, a mild, benevolent-looking gentleman of about forty-five, or maybe fifty, came in at one of the way-stations and sat down beside me. We talked together pleasantly on various subjects for an hour, perhaps, and I found him exceedingly intelligent and entertaining. When he learned that I was from Washington, he immediately began to ask questions about various public men, and about Congressional affairs; and I saw very shortly that I was conversing with a man who was perfectly familiar with the ins and outs of political life at the Capital, even to the ways and manners, and customs of procedure of Senators and Representatives in the Chambers of the national Legislature. Presently two men halted near us for a single moment, and one said to the other:"], "zh": ["我最近造訪了聖路易斯，並在前往西部的途中，在印第安納州的特雷豪特換車時，一位看起來和藹可親的中年紳士走進來，坐在我旁邊。他大約四十五歲，或許五十歲，我們愉快地聊了約一小時，發現他非常聰明且有趣。當他得知我來自華盛頓時，他立刻開始詢問各種公眾人物和國會事務；我很快就意識到，我正在與一位對國會政治生活的內幕了如指掌的人交談，甚至包括參議員和眾議員在國家立法機構中的行為舉止和程序習慣。此時，兩名男子在我們附近停下來，片刻之後，其中一人對另一人說："]}, {"id": 2, "blocks": [{"lang": "en", "text": "“Harris, if you’ll do that for me, I’ll never forget you, my boy.”"}, {"lang": "zh", "text": "「哈里斯，如果你能為我做這件事，我永遠不會忘記你，我的孩子。」"}, {"lang": "en", "text": "My new comrade’s eye lighted pleasantly. The words had touched upon a happy memory, I thought. Then his face settled into thoughtfulness—almost into gloom. He turned to me and said,"}, {"lang": "zh", "text": "我新認識的夥伴眼中閃過一絲愉悅的光芒。我想，這句話觸動了他美好的回憶。然後他的臉色變得沉思，幾乎是陰鬱。他轉向我說："}, {"lang": "en", "text": "“Let me tell you a story; let me give you a secret chapter of my life—a chapter that has never been referred to by me since its events transpired. Listen patiently, and promise that you will not interrupt me.”"}, {"lang": "zh", "text": "「讓我告訴你一個故事；讓我分享我生命中的一個秘密篇章——一個自從事件發生以來我從未提及的篇章。請耐心聆聽，並保證不會打斷我。」"}, {"lang": "en", "text": "I said I would not, and he related the following strange adventure, speaking sometimes with animation, sometimes with melancholy, but always with feeling and earnestness."}, {"lang": "zh", "text": "我答應不會打斷他，他便講述了以下這段奇異的冒險，有時語氣激昂，有時則帶著憂鬱，但始終充滿感情和誠摯。"}], "en": ["“Harris, if you’ll do that for me, I’ll never forget you, my boy.”", "My new comrade’s eye lighted pleasantly. The words had touched upon a happy memory, I thought. Then his face settled into thoughtfulness—almost into gloom. He turned to me and said,", "“Let me tell you a story; let me give you a secret chapter of my life—a chapter that has never been referred to by me since its events transpired. Listen patiently, and promise that you will not interrupt me.”", "I said I would not, and he related the following strange adventure, speaking sometimes with animation, sometimes with melancholy, but always with feeling and earnestness."], "zh": ["「哈里斯，如果你能為我做這件事，我永遠不會忘記你，我的孩子。」", "我新認識的夥伴眼中閃過一絲愉悅的光芒。我想，這句話觸動了他美好的回憶。然後他的臉色變得沉思，幾乎是陰鬱。他轉向我說：", "「讓我告訴你一個故事；讓我分享我生命中的一個秘密篇章——一個自從事件發生以來我從未提及的篇章。請耐心聆聽，並保證不會打斷我。」", "我答應不會打斷他，他便講述了以下這段奇異的冒險，有時語氣激昂，有時則帶著憂鬱，但始終充滿感情和誠摯。"]}, {"id": 3, "blocks": [{"lang": "en", "text": "THE STRANGER’S NARRATIVE\n“On the 19th of December, 1853, I started from St. Louis on the evening train bound for Chicago. There were only twenty-four passengers, all told. There were no ladies and no children. We were in excellent spirits, and pleasant acquaintanceships were soon formed. The journey bade fair to be a happy one; and no individual in the party, I think, had even the vaguest presentiment of the horrors we were soon to undergo."}, {"lang": "zh", "text": "陌生人的敘述\n「1853年12月19日，我從聖路易斯出發，搭乘前往芝加哥的夜班火車。總共只有二十四名乘客，沒有女士和小孩。我們的情緒非常高昂，很快便建立了愉快的友誼。這段旅程似乎注定會是愉快的；我想，沒有一個人對我們即將經歷的恐怖有絲毫的預感。"}, {"lang": "en", "text": "“At 11 P.M. it began to snow hard. Shortly after leaving the small village of Welden, we entered upon that tremendous prairie solitude that stretches its leagues on leagues of houseless dreariness far away toward the Jubilee Settlements. The winds, unobstructed by trees or hills, or even vagrant rocks, whistled fiercely across the level desert, driving the falling snow before it like spray from the crested waves of a stormy sea. The snow was deepening fast; and we knew, by the diminished speed of the train, that the engine was plowing through it with steadily increasing difficulty. Indeed, it almost came to a dead halt sometimes, in the midst of great drifts that piled themselves like colossal graves across the track. Conversation began to flag. Cheerfulness gave place to grave concern. The possibility of being imprisoned in the snow, on the bleak prairie, fifty miles from any house, presented itself to every mind, and extended its depressing influence over every spirit."}, {"lang": "zh", "text": "「晚上11點，雪開始下得很大。在離小村莊韋爾登不久後，我們進入了那片廣袤的草原孤寂，無邊無際的荒涼延伸至朱比利定居點。風無樹木或山丘的阻擋，甚至連流浪的岩石也無法阻擋，猛烈地在平坦的沙漠上呼嘯，將飄落的雪像暴風海浪上的水霧一樣驅散。雪越下越厚；我們知道，隨著火車速度的減慢，機車在雪中掘進的難度也在不斷增加。事實上，有時它幾乎停下來，陷入了像巨大的墳墓一樣堆積在軌道上的大雪中。交談開始減少，愉快的氣氛讓位於嚴肅的擔憂。每個人心中都浮現出在這片荒涼的草原上被困在雪中的可能性，距離任何房屋五十英里，這種想法在每個人的心中蔓延，並對每個人的精神施加了壓力。"}], "en": ["THE STRANGER’S NARRATIVE\n“On the 19th of December, 1853, I started from St. Louis on the evening train bound for Chicago. There were only twenty-four passengers, all told. There were no ladies and no children. We were in excellent spirits, and pleasant acquaintanceships were soon formed. The journey bade fair to be a happy one; and no individual in the party, I think, had even the vaguest presentiment of the horrors we were soon to undergo.", "“At 11 P.M. it began to snow hard. Shortly after leaving the small village of Welden, we entered upon that tremendous prairie solitude that stretches its leagues on leagues of houseless dreariness far away toward the Jubilee Settlements. The winds, unobstructed by trees or hills, or even vagrant rocks, whistled fiercely across the level desert, driving the falling snow before it like spray from the crested waves of a stormy sea. The snow was deepening fast; and we knew, by the diminished speed of the train, that the engine was plowing through it with steadily increasing difficulty. Indeed, it almost came to a dead halt sometimes, in the midst of great drifts that piled themselves like colossal graves across the track. Conversation began to flag. Cheerfulness gave place to grave concern. The possibility of being imprisoned in the snow, on the bleak prairie, fifty miles from any house, presented itself to every mind, and extended its depressing influence over every spirit."], "zh": ["陌生人的敘述\n「1853年12月19日，我從聖路易斯出發，搭乘前往芝加哥的夜班火車。總共只有二十四名乘客，沒有女士和小孩。我們的情緒非常高昂，很快便建立了愉快的友誼。這段旅程似乎注定會是愉快的；我想，沒有一個人對我們即將經歷的恐怖有絲毫的預感。", "「晚上11點，雪開始下得很大。在離小村莊韋爾登不久後，我們進入了那片廣袤的草原孤寂，無邊無際的荒涼延伸至朱比利定居點。風無樹木或山丘的阻擋，甚至連流浪的岩石也無法阻擋，猛烈地在平坦的沙漠上呼嘯，將飄落的雪像暴風海浪上的水霧一樣驅散。雪越下越厚；我們知道，隨著火車速度的減慢，機車在雪中掘進的難度也在不斷增加。事實上，有時它幾乎停下來，陷入了像巨大的墳墓一樣堆積在軌道上的大雪中。交談開始減少，愉快的氣氛讓位於嚴肅的擔憂。每個人心中都浮現出在這片荒涼的草原上被困在雪中的可能性，距離任何房屋五十英里，這種想法在每個人的心中蔓延，並對每個人的精神施加了壓力。"]}, {"id": 4, "blocks": [{"lang": "en", "text": "“At two o’clock in the morning I was aroused out of an uneasy slumber by the ceasing of all motion about me. The appalling truth flashed upon me instantly—we were captives in a snow-drift! ‘All hands to the rescue!’ Every man sprang to obey. Out into the wild night, the pitchy darkness, the billowy snow, the driving storm, every soul leaped, with the consciousness that a moment lost now might bring destruction to us all. Shovels, hands, boards—anything, everything that could displace snow, was brought into instant requisition. It was a weird picture, that small company of frantic men fighting the banking snows, half in the blackest shadow and half in the angry light of the locomotive’s reflector."}, {"lang": "zh", "text": "「凌晨兩點，我被周圍一切運動的停止驚醒。可怕的真相瞬間閃過我的腦海——我們被困在雪堆裡！『所有人都來救援！』每個人都立刻跳起來，衝向狂野的夜晚，漆黑的黑暗，波濤洶湧的雪，驟然的暴風，每個人都意識到，現在失去一刻可能會給我們帶來毀滅。鏟子、手、木板——任何可以移動雪的東西，立刻被拿來使用。那小小的瘋狂男子群體在黑暗的陰影和機車反射器的怒光中，拼命與堆積的雪作鬥爭，形成了一幅奇異的畫面。"}], "en": ["“At two o’clock in the morning I was aroused out of an uneasy slumber by the ceasing of all motion about me. The appalling truth flashed upon me instantly—we were captives in a snow-drift! ‘All hands to the rescue!’ Every man sprang to obey. Out into the wild night, the pitchy darkness, the billowy snow, the driving storm, every soul leaped, with the consciousness that a moment lost now might bring destruction to us all. Shovels, hands, boards—anything, everything that could displace snow, was brought into instant requisition. It was a weird picture, that small company of frantic men fighting the banking snows, half in the blackest shadow and half in the angry light of the locomotive’s reflector."], "zh": ["「凌晨兩點，我被周圍一切運動的停止驚醒。可怕的真相瞬間閃過我的腦海——我們被困在雪堆裡！『所有人都來救援！』每個人都立刻跳起來，衝向狂野的夜晚，漆黑的黑暗，波濤洶湧的雪，驟然的暴風，每個人都意識到，現在失去一刻可能會給我們帶來毀滅。鏟子、手、木板——任何可以移動雪的東西，立刻被拿來使用。那小小的瘋狂男子群體在黑暗的陰影和機車反射器的怒光中，拼命與堆積的雪作鬥爭，形成了一幅奇異的畫面。"]}, {"id": 5, "blocks": [{"lang": "en", "text": "“One short hour sufficed to prove the utter uselessness of our efforts. The storm barricaded the track with a dozen drifts while we dug one away. And worse than this, it was discovered that the last grand charge the engine had made upon the enemy had broken the fore-and-aft shaft of the driving-wheel! With a free track before us we should still have been helpless. We entered the car wearied with labor, and very sorrowful. We gathered about the stoves, and gravely canvassed our situation. We had no provisions whatever—in this lay our chief distress. We could not freeze, for there was a good supply of wood in the tender. This was our only comfort. The discussion ended at last in accepting the disheartening decision of the conductor, viz., that it would be death for any man to attempt to travel fifty miles on foot through snow like that. We could not send for help, and even if we could it would not come. We must submit, and await, as patiently as we might, succor or starvation! I think the stoutest heart there felt a momentary chill when those words were uttered."}, {"lang": "zh", "text": "「一小時後，我們的努力完全無效。暴風雪在我們挖掘的地方又堆起了十幾個雪堆。而更糟糕的是，發現機車對敵人的最後一次衝鋒已經損壞了驅動輪的前後軸！即使前方有一條暢通的路，我們仍然無能為力。我們疲憊不堪且非常悲傷地回到車廂，圍坐在爐子旁，嚴肅地討論我們的處境。我們完全沒有任何食物——這是我們最大的困擾。我們不會凍死，因為車廂裡有足夠的木材。這是我們唯一的安慰。討論最終以接受列車長的令人沮喪的決定而告終，即任何人試圖在這樣的雪中步行五十英里都是死路一條。我們無法發送求救信，甚至如果能發送也不會有人來。我們必須忍耐，耐心等待救援或飢餓！我想，當這句話被說出時，場上最堅強的心也感到一陣寒意。"}], "en": ["“One short hour sufficed to prove the utter uselessness of our efforts. The storm barricaded the track with a dozen drifts while we dug one away. And worse than this, it was discovered that the last grand charge the engine had made upon the enemy had broken the fore-and-aft shaft of the driving-wheel! With a free track before us we should still have been helpless. We entered the car wearied with labor, and very sorrowful. We gathered about the stoves, and gravely canvassed our situation. We had no provisions whatever—in this lay our chief distress. We could not freeze, for there was a good supply of wood in the tender. This was our only comfort. The discussion ended at last in accepting the disheartening decision of the conductor, viz., that it would be death for any man to attempt to travel fifty miles on foot through snow like that. We could not send for help, and even if we could it would not come. We must submit, and await, as patiently as we might, succor or starvation! I think the stoutest heart there felt a momentary chill when those words were uttered."], "zh": ["「一小時後，我們的努力完全無效。暴風雪在我們挖掘的地方又堆起了十幾個雪堆。而更糟糕的是，發現機車對敵人的最後一次衝鋒已經損壞了驅動輪的前後軸！即使前方有一條暢通的路，我們仍然無能為力。我們疲憊不堪且非常悲傷地回到車廂，圍坐在爐子旁，嚴肅地討論我們的處境。我們完全沒有任何食物——這是我們最大的困擾。我們不會凍死，因為車廂裡有足夠的木材。這是我們唯一的安慰。討論最終以接受列車長的令人沮喪的決定而告終，即任何人試圖在這樣的雪中步行五十英里都是死路一條。我們無法發送求救信，甚至如果能發送也不會有人來。我們必須忍耐，耐心等待救援或飢餓！我想，當這句話被說出時，場上最堅強的心也感到一陣寒意。"]}, {"id": 6, "blocks": [{"lang": "en", "text": "“Within the hour conversation subsided to a low murmur here and there about the car, caught fitfully between the rising and falling of the blast; the lamps grew dim; and the majority of the castaways settled themselves among the flickering shadows to think—to forget the present, if they could—to sleep, if they might."}, {"lang": "zh", "text": "「在一小時內，車廂裡的交談變成了低聲的耳語，時而在風暴的起伏中被打斷；燈光變得昏暗；大多數被困者在閃爍的陰影中安頓下來，思考——如果能的話，忘記當前的情況——如果可以的話，入睡。"}, {"lang": "en", "text": "“The eternal night—it surely seemed eternal to us—wore its lagging hours away at last, and the cold gray dawn broke in the east. As the light grew stronger the passengers began to stir and give signs of life, one after another, and each in turn pushed his slouched hat up from his forehead, stretched his stiffened limbs, and glanced out of the windows upon the cheerless prospect. It was cheer less, indeed!—not a living thing visible anywhere, not a human habitation; nothing but a vast white desert; uplifted sheets of snow drifting hither and thither before the wind—a world of eddying flakes shutting out the firmament above."}, {"lang": "zh", "text": "「那漫長的夜晚——對我們來說似乎是永恆的——終於過去了，冷灰色的黎明在東方破曉。隨著光線變得明亮，乘客們開始活動，逐一顯示出生命的跡象，每個人都推起帽子，伸展僵硬的四肢，朝窗外望去，看到那無情的景象。的確是無情的！——哪裡都看不見一個活物，沒有任何人類的居所；只有一片廣袤的白色沙漠；被風吹得四處飄蕩的雪片，形成了一個封閉的世界，將天空遮蔽。"}], "en": ["“Within the hour conversation subsided to a low murmur here and there about the car, caught fitfully between the rising and falling of the blast; the lamps grew dim; and the majority of the castaways settled themselves among the flickering shadows to think—to forget the present, if they could—to sleep, if they might.", "“The eternal night—it surely seemed eternal to us—wore its lagging hours away at last, and the cold gray dawn broke in the east. As the light grew stronger the passengers began to stir and give signs of life, one after another, and each in turn pushed his slouched hat up from his forehead, stretched his stiffened limbs, and glanced out of the windows upon the cheerless prospect. It was cheer less, indeed!—not a living thing visible anywhere, not a human habitation; nothing but a vast white desert; uplifted sheets of snow drifting hither and thither before the wind—a world of eddying flakes shutting out the firmament above."], "zh": ["「在一小時內，車廂裡的交談變成了低聲的耳語，時而在風暴的起伏中被打斷；燈光變得昏暗；大多數被困者在閃爍的陰影中安頓下來，思考——如果能的話，忘記當前的情況——如果可以的話，入睡。", "「那漫長的夜晚——對我們來說似乎是永恆的——終於過去了，冷灰色的黎明在東方破曉。隨著光線變得明亮，乘客們開始活動，逐一顯示出生命的跡象，每個人都推起帽子，伸展僵硬的四肢，朝窗外望去，看到那無情的景象。的確是無情的！——哪裡都看不見一個活物，沒有任何人類的居所；只有一片廣袤的白色沙漠；被風吹得四處飄蕩的雪片，形成了一個封閉的世界，將天空遮蔽。"]}, {"id": 7, "blocks": [{"lang": "en", "text": "“All day we moped about the cars, saying little, thinking much. Another lingering dreary night—and hunger."}, {"lang": "zh", "text": "「整天我們在車廂裡無精打采，幾乎不說話，卻思考著很多。又是一個漫長而沉悶的夜晚——還有饑餓。"}, {"lang": "en", "text": "“Another dawning—another day of silence, sadness, wasting hunger, hopeless watching for succor that could not come. A night of restless slumber, filled with dreams of feasting—wakings distressed with the gnawings of hunger."}, {"lang": "zh", "text": "「又一個黎明——又一天的沉默、悲傷、日漸消瘦的饑餓，無望地等待著無法到來的救援。又是一個不安的睡眠，充滿了豐盛的夢境——醒來時卻因饑餓的折磨而感到痛苦。"}, {"lang": "en", "text": "“The fourth day came and went—and the fifth! Five days of dreadful imprisonment! A savage hunger looked out at every eye. There was in it a sign of awful import—the foreshadowing of a something that was vaguely shaping itself in every heart—a something which no tongue dared yet to frame into words."}, {"lang": "zh", "text": "「第四天來了又去，然後是第五天！五天的可怕囚禁！每個人的眼中都流露出野蠻的饑餓。這其中隱含著可怕的預兆——在每個心中模糊地形成著一種東西——一種尚未有人敢於用言語表達的東西。"}], "en": ["“All day we moped about the cars, saying little, thinking much. Another lingering dreary night—and hunger.", "“Another dawning—another day of silence, sadness, wasting hunger, hopeless watching for succor that could not come. A night of restless slumber, filled with dreams of feasting—wakings distressed with the gnawings of hunger.", "“The fourth day came and went—and the fifth! Five days of dreadful imprisonment! A savage hunger looked out at every eye. There was in it a sign of awful import—the foreshadowing of a something that was vaguely shaping itself in every heart—a something which no tongue dared yet to frame into words."], "zh": ["「整天我們在車廂裡無精打采，幾乎不說話，卻思考著很多。又是一個漫長而沉悶的夜晚——還有饑餓。", "「又一個黎明——又一天的沉默、悲傷、日漸消瘦的饑餓，無望地等待著無法到來的救援。又是一個不安的睡眠，充滿了豐盛的夢境——醒來時卻因饑餓的折磨而感到痛苦。", "「第四天來了又去，然後是第五天！五天的可怕囚禁！每個人的眼中都流露出野蠻的饑餓。這其中隱含著可怕的預兆——在每個心中模糊地形成著一種東西——一種尚未有人敢於用言語表達的東西。"]}, {"id": 8, "blocks": [{"lang": "en", "text": "“The sixth day passed—the seventh dawned upon as gaunt and haggard and hopeless a company of men as ever stood in the shadow of death. It must out now! That thing which had been growing up in every heart was ready to leap from every lip at last! Nature had been taxed to the utmost—she must yield. RICHARD H. GASTON of Minnesota, tall, cadaverous, and pale, rose up. All knew what was coming. All prepared—every emotion, every semblance of excitement—was smothered—only a calm, thoughtful seriousness appeared in the eyes that were lately so wild."}, {"lang": "zh", "text": "「第六天過去了，第七天來臨，這是一群瘦弱、憔悴、絕望的男人，仿佛永遠站在死亡的陰影之中。這一切必須結束！那種在每個心中滋長的東西終於準備從每個嘴唇上跳出來！大自然已經被逼到了極限——她必須屈服。來自明尼蘇達的理查德·H·加斯頓，身材高瘦，面色蒼白，站了起來。所有人都知道接下來會發生什麼。所有人都做好了準備——每一種情感，每一絲興奮的表現都被壓抑——只有一種冷靜、深思的嚴肅在那些曾經狂野的眼中出現。"}, {"lang": "en", "text": "“‘Gentlemen: It cannot be delayed longer! The time is at hand! We must determine which of us shall die to furnish food for the rest!’"}, {"lang": "zh", "text": "「『各位：這一刻不能再拖延！時刻已到！我們必須決定誰將死去，以供其他人食用！』"}], "en": ["“The sixth day passed—the seventh dawned upon as gaunt and haggard and hopeless a company of men as ever stood in the shadow of death. It must out now! That thing which had been growing up in every heart was ready to leap from every lip at last! Nature had been taxed to the utmost—she must yield. RICHARD H. GASTON of Minnesota, tall, cadaverous, and pale, rose up. All knew what was coming. All prepared—every emotion, every semblance of excitement—was smothered—only a calm, thoughtful seriousness appeared in the eyes that were lately so wild.", "“‘Gentlemen: It cannot be delayed longer! The time is at hand! We must determine which of us shall die to furnish food for the rest!’"], "zh": ["「第六天過去了，第七天來臨，這是一群瘦弱、憔悴、絕望的男人，仿佛永遠站在死亡的陰影之中。這一切必須結束！那種在每個心中滋長的東西終於準備從每個嘴唇上跳出來！大自然已經被逼到了極限——她必須屈服。來自明尼蘇達的理查德·H·加斯頓，身材高瘦，面色蒼白，站了起來。所有人都知道接下來會發生什麼。所有人都做好了準備——每一種情感，每一絲興奮的表現都被壓抑——只有一種冷靜、深思的嚴肅在那些曾經狂野的眼中出現。", "「『各位：這一刻不能再拖延！時刻已到！我們必須決定誰將死去，以供其他人食用！』"]}, {"id": 9, "blocks": [{"lang": "en", "text": "“MR. JOHN J. WILLIAMS of Illinois rose and said: ‘Gentlemen—I nominate the Rev. James Sawyer of Tennessee.’"}, {"lang": "zh", "text": "「來自伊利諾伊州的約翰·J·威廉姆斯站起來說：『各位——我提名來自田納西州的詹姆斯·索耶牧師。』"}, {"lang": "en", "text": "“MR. Wm. R. ADAMS of Indiana said: ‘I nominate Mr. Daniel Slote of New York.’"}, {"lang": "zh", "text": "「來自印第安納州的威廉·R·亞當斯說：『我提名來自紐約的丹尼爾·斯洛特。』"}, {"lang": "en", "text": "“MR. CHARLES J. LANGDON: ‘I nominate Mr. Samuel A. Bowen of St. Louis.’"}, {"lang": "zh", "text": "「查爾斯·J·朗登說：『我提名來自聖路易斯的塞繆爾·A·鮑文。』"}, {"lang": "en", "text": "“MR. SLOTE: ‘Gentlemen—I desire to decline in favor of Mr. John A. Van Nostrand, Jun., of New Jersey.’"}, {"lang": "zh", "text": "「斯洛特說：『各位——我希望能夠讓位給來自新澤西州的約翰·A·范·諾斯特蘭德。』"}, {"lang": "en", "text": "“MR. GASTON: ‘If there be no objection, the gentleman’s desire will be acceded to.’"}, {"lang": "zh", "text": "「加斯頓說：『如果沒有異議，將尊重這位紳士的要求。』"}, {"lang": "en", "text": "“MR. VAN NOSTRAND objecting, the resignation of Mr. Slote was rejected. The resignations of Messrs. Sawyer and Bowen were also offered, and refused upon the same grounds."}, {"lang": "zh", "text": "「范·諾斯特蘭德提出異議，斯洛特的辭職被拒絕。索耶和鮑文的辭職也被提出，並因同樣的理由被拒絕。"}], "en": ["“MR. JOHN J. WILLIAMS of Illinois rose and said: ‘Gentlemen—I nominate the Rev. James Sawyer of Tennessee.’", "“MR. Wm. R. ADAMS of Indiana said: ‘I nominate Mr. Daniel Slote of New York.’", "“MR. CHARLES J. LANGDON: ‘I nominate Mr. Samuel A. Bowen of St. Louis.’", "“MR. SLOTE: ‘Gentlemen—I desire to decline in favor of Mr. John A. Van Nostrand, Jun., of New Jersey.’", "“MR. GASTON: ‘If there be no objection, the gentleman’s desire will be acceded to.’", "“MR. VAN NOSTRAND objecting, the resignation of Mr. Slote was rejected. The resignations of Messrs. Sawyer and Bowen were also offered, and refused upon the same grounds."], "zh": ["「來自伊利諾伊州的約翰·J·威廉姆斯站起來說：『各位——我提名來自田納西州的詹姆斯·索耶牧師。』", "「來自印第安納州的威廉·R·亞當斯說：『我提名來自紐約的丹尼爾·斯洛特。』", "「查爾斯·J·朗登說：『我提名來自聖路易斯的塞繆爾·A·鮑文。』", "「斯洛特說：『各位——我希望能夠讓位給來自新澤西州的約翰·A·范·諾斯特蘭德。』", "「加斯頓說：『如果沒有異議，將尊重這位紳士的要求。』", "「范·諾斯特蘭德提出異議，斯洛特的辭職被拒絕。索耶和鮑文的辭職也被提出，並因同樣的理由被拒絕。"]}, {"id": 10, "blocks": [{"lang": "en", "text": "“MR. A. L. BASCOM of Ohio: ‘I move that the nominations now close, and that the House proceed to an election by ballot.’"}, {"lang": "zh", "text": "「來自俄亥俄州的A·L·巴斯科姆說：『我提議現在結束提名，並進行投票選舉。』"}, {"lang": "en", "text": "“MR. SAWYER: ‘Gentlemen—I protest earnestly against these proceedings. They are, in every way, irregular and unbecoming. I must beg to move that they be dropped at once, and that we elect a chairman of the meeting and proper officers to assist him, and then we can go on with the business before us understandingly.’"}, {"lang": "zh", "text": "「索耶說：『各位——我強烈反對這些程序。這一切在各方面都是不規範和不合適的。我必須請求立即停止這些程序，並選舉一位會議主席和適當的官員來協助他，然後我們可以理解地繼續進行我們的事務。』"}, {"lang": "en", "text": "“MR. BELL of Iowa: ‘Gentlemen—I object. This is no time to stand upon forms and ceremonious observances. For more than seven days we have been without food. Every moment we lose in idle discussion increases our distress. I am satisfied with the nominations that have been made—every gentleman present is, I believe—and I, for one, do not see why we should not proceed at once to elect one or more of them. I wish to offer a resolution—’"}, {"lang": "zh", "text": "「來自愛荷華州的貝爾說：『各位——我反對。現在不是堅持形式和儀式的時候。我們已經七天沒有食物了。我們在無謂的討論中浪費的每一刻都增加了我們的痛苦。我對已經提出的提名感到滿意——我相信在場的每位紳士也是如此——而我，作為其中之一，並不明白為什麼我們不應該立即選舉其中一位或多位。我要提出一項決議——』"}], "en": ["“MR. A. L. BASCOM of Ohio: ‘I move that the nominations now close, and that the House proceed to an election by ballot.’", "“MR. SAWYER: ‘Gentlemen—I protest earnestly against these proceedings. They are, in every way, irregular and unbecoming. I must beg to move that they be dropped at once, and that we elect a chairman of the meeting and proper officers to assist him, and then we can go on with the business before us understandingly.’", "“MR. BELL of Iowa: ‘Gentlemen—I object. This is no time to stand upon forms and ceremonious observances. For more than seven days we have been without food. Every moment we lose in idle discussion increases our distress. I am satisfied with the nominations that have been made—every gentleman present is, I believe—and I, for one, do not see why we should not proceed at once to elect one or more of them. I wish to offer a resolution—’"], "zh": ["「來自俄亥俄州的A·L·巴斯科姆說：『我提議現在結束提名，並進行投票選舉。』", "「索耶說：『各位——我強烈反對這些程序。這一切在各方面都是不規範和不合適的。我必須請求立即停止這些程序，並選舉一位會議主席和適當的官員來協助他，然後我們可以理解地繼續進行我們的事務。』", "「來自愛荷華州的貝爾說：『各位——我反對。現在不是堅持形式和儀式的時候。我們已經七天沒有食物了。我們在無謂的討論中浪費的每一刻都增加了我們的痛苦。我對已經提出的提名感到滿意——我相信在場的每位紳士也是如此——而我，作為其中之一，並不明白為什麼我們不應該立即選舉其中一位或多位。我要提出一項決議——』"]}, {"id": 11, "blocks": [{"lang": "en", "text": "“MR. GASTON: ‘It would be objected to, and have to lie over one day under the rules, thus bringing about the very delay you wish to avoid. The gentleman from New Jersey—’"}, {"lang": "zh", "text": "「加斯頓說：『這會被反對，根據規則必須延遲一天，這樣就會帶來你希望避免的延遲。來自新澤西州的紳士——』"}, {"lang": "en", "text": "“MR. VAN NOSTRAND: ‘Gentlemen—I am a stranger among you; I have not sought the distinction that has been conferred upon me, and I feel a delicacy—’"}, {"lang": "zh", "text": "「范·諾斯特蘭德說：『各位——我在你們中間是個陌生人；我並未尋求這一榮譽，我感到有些不安——』"}, {"lang": "en", "text": "“MR. MORGAN Of Alabama (interrupting): ‘I move the previous question.’"}, {"lang": "zh", "text": "「來自阿拉巴馬州的摩根（打斷道）：『我提議進行前置問題。』"}, {"lang": "en", "text": "“The motion was carried, and further debate shut off, of course. The motion to elect officers was passed, and under it Mr. Gaston was chosen chairman, Mr. Blake, secretary, Messrs. Holcomb, Dyer, and Baldwin a committee on nominations, and Mr. R. M. Howland, purveyor, to assist the committee in making selections."}, {"lang": "zh", "text": "「這項提議獲得通過，進一步的辯論當然被終止。選舉官員的提議獲得通過，於是加斯頓被選為主席，布雷克為秘書，霍爾科姆、戴爾和鮑德溫為提名委員會，R·M·霍蘭德為採購員，協助委員會進行選擇。"}], "en": ["“MR. GASTON: ‘It would be objected to, and have to lie over one day under the rules, thus bringing about the very delay you wish to avoid. The gentleman from New Jersey—’", "“MR. VAN NOSTRAND: ‘Gentlemen—I am a stranger among you; I have not sought the distinction that has been conferred upon me, and I feel a delicacy—’", "“MR. MORGAN Of Alabama (interrupting): ‘I move the previous question.’", "“The motion was carried, and further debate shut off, of course. The motion to elect officers was passed, and under it Mr. Gaston was chosen chairman, Mr. Blake, secretary, Messrs. Holcomb, Dyer, and Baldwin a committee on nominations, and Mr. R. M. Howland, purveyor, to assist the committee in making selections."], "zh": ["「加斯頓說：『這會被反對，根據規則必須延遲一天，這樣就會帶來你希望避免的延遲。來自新澤西州的紳士——』", "「范·諾斯特蘭德說：『各位——我在你們中間是個陌生人；我並未尋求這一榮譽，我感到有些不安——』", "「來自阿拉巴馬州的摩根（打斷道）：『我提議進行前置問題。』", "「這項提議獲得通過，進一步的辯論當然被終止。選舉官員的提議獲得通過，於是加斯頓被選為主席，布雷克為秘書，霍爾科姆、戴爾和鮑德溫為提名委員會，R·M·霍蘭德為採購員，協助委員會進行選擇。"]}, {"id": 12, "blocks": [{"lang": "en", "text": "“A recess of half an hour was then taken, and some little caucusing followed. At the sound of the gavel the meeting reassembled, and the committee reported in favor of Messrs. George Ferguson of Kentucky, Lucien Herrman of Louisiana, and W. Messick of Colorado as candidates. The report was accepted."}, {"lang": "zh", "text": "「然後休會半小時，隨後進行了一些小型的會議。在槌聲響起後，會議重新召開，委員會報告支持肯塔基州的喬治·弗格森、路易斯安那州的盧西安·赫爾曼和科羅拉多州的W·梅西克作為候選人。報告獲得接受。"}, {"lang": "en", "text": "“MR. ROGERS of Missouri: ‘Mr. President—The report being properly before the House now, I move to amend it by substituting for the name of Mr. Herrman that of Mr. Lucius Harris of St. Louis, who is well and honorably known to us all. I do not wish to be understood as casting the least reflection upon the high character and standing of the gentleman from Louisiana—far from it. I respect and esteem him as much as any gentleman here present possibly can; but none of us can be blind to the fact that he has lost more flesh during the week that we have lain here than any among us—none of us can be blind to the fact that the committee has been derelict in its duty, either through negligence or a graver fault, in thus offering for our suffrages a gentleman who, however pure his own motives may be, has really less nutriment in him—’"}, {"lang": "zh", "text": "「來自密蘇里州的羅傑斯說：『主席先生——報告現在正正式提交給會議，我提議將赫爾曼的名字替換為來自聖路易斯的盧修斯·哈里斯，他在我們所有人中是眾所周知且受人尊敬的。我不希望被理解為對來自路易斯安那州的紳士的任何貶低——絕對不是。我尊重並敬重他，與在場的任何紳士一樣；但我們無法對他在這一周裡失去的體重視而不見——我們無法對委員會的失職視而不見，無論是因為疏忽還是更嚴重的過失，竟然向我們提出一位，無論他自己的動機多麼純粹，實際上卻少了更多的營養——」"}], "en": ["“A recess of half an hour was then taken, and some little caucusing followed. At the sound of the gavel the meeting reassembled, and the committee reported in favor of Messrs. George Ferguson of Kentucky, Lucien Herrman of Louisiana, and W. Messick of Colorado as candidates. The report was accepted.", "“MR. ROGERS of Missouri: ‘Mr. President—The report being properly before the House now, I move to amend it by substituting for the name of Mr. Herrman that of Mr. Lucius Harris of St. Louis, who is well and honorably known to us all. I do not wish to be understood as casting the least reflection upon the high character and standing of the gentleman from Louisiana—far from it. I respect and esteem him as much as any gentleman here present possibly can; but none of us can be blind to the fact that he has lost more flesh during the week that we have lain here than any among us—none of us can be blind to the fact that the committee has been derelict in its duty, either through negligence or a graver fault, in thus offering for our suffrages a gentleman who, however pure his own motives may be, has really less nutriment in him—’"], "zh": ["「然後休會半小時，隨後進行了一些小型的會議。在槌聲響起後，會議重新召開，委員會報告支持肯塔基州的喬治·弗格森、路易斯安那州的盧西安·赫爾曼和科羅拉多州的W·梅西克作為候選人。報告獲得接受。", "「來自密蘇里州的羅傑斯說：『主席先生——報告現在正正式提交給會議，我提議將赫爾曼的名字替換為來自聖路易斯的盧修斯·哈里斯，他在我們所有人中是眾所周知且受人尊敬的。我不希望被理解為對來自路易斯安那州的紳士的任何貶低——絕對不是。我尊重並敬重他，與在場的任何紳士一樣；但我們無法對他在這一周裡失去的體重視而不見——我們無法對委員會的失職視而不見，無論是因為疏忽還是更嚴重的過失，竟然向我們提出一位，無論他自己的動機多麼純粹，實際上卻少了更多的營養——」"]}, {"id": 13, "blocks": [{"lang": "en", "text": "“THE CHAIR: ‘The gentleman from Missouri will take his seat. The Chair cannot allow the integrity of the committee to be questioned save by the regular course, under the rules. What action will the House take upon the gentleman’s motion?’"}, {"lang": "zh", "text": "「主席：『來自密蘇里州的紳士請就座。主席無法允許質疑委員會的完整性，除非按照規則的正常程序。會議對這位紳士的提議將採取什麼行動？』"}, {"lang": "en", "text": "“MR. HALLIDAY of Virginia: ‘I move to further amend the report by substituting Mr. Harvey Davis of Oregon for Mr. Messick. It may be urged by gentlemen that the hardships and privations of a frontier life have rendered Mr. Davis tough; but, gentlemen, is this a time to cavil at toughness? Is this a time to be fastidious concerning trifles? Is this a time to dispute about matters of paltry significance? No, gentlemen, bulk is what we desire—substance, weight, bulk—these are the supreme requisites now—not talent, not genius, not education. I insist upon my motion.’"}, {"lang": "zh", "text": "「來自維吉尼亞州的哈利戴說：『我提議進一步修訂報告，將來自俄勒岡州的哈維·戴維斯替換梅西克。有人可能會說，邊疆生活的艱辛和困苦使戴維斯變得強壯；但，各位，這是時候對強壯挑剔嗎？這是時候對瑣事斤斤計較嗎？這是時候對微不足道的事情爭論嗎？不，各位，我們現在所需要的是體量——實質、重量、體量——這些是現在最重要的要求——不是才能，不是天才，不是教育。我堅持我的提議。」"}], "en": ["“THE CHAIR: ‘The gentleman from Missouri will take his seat. The Chair cannot allow the integrity of the committee to be questioned save by the regular course, under the rules. What action will the House take upon the gentleman’s motion?’", "“MR. HALLIDAY of Virginia: ‘I move to further amend the report by substituting Mr. Harvey Davis of Oregon for Mr. Messick. It may be urged by gentlemen that the hardships and privations of a frontier life have rendered Mr. Davis tough; but, gentlemen, is this a time to cavil at toughness? Is this a time to be fastidious concerning trifles? Is this a time to dispute about matters of paltry significance? No, gentlemen, bulk is what we desire—substance, weight, bulk—these are the supreme requisites now—not talent, not genius, not education. I insist upon my motion.’"], "zh": ["「主席：『來自密蘇里州的紳士請就座。主席無法允許質疑委員會的完整性，除非按照規則的正常程序。會議對這位紳士的提議將採取什麼行動？』", "「來自維吉尼亞州的哈利戴說：『我提議進一步修訂報告，將來自俄勒岡州的哈維·戴維斯替換梅西克。有人可能會說，邊疆生活的艱辛和困苦使戴維斯變得強壯；但，各位，這是時候對強壯挑剔嗎？這是時候對瑣事斤斤計較嗎？這是時候對微不足道的事情爭論嗎？不，各位，我們現在所需要的是體量——實質、重量、體量——這些是現在最重要的要求——不是才能，不是天才，不是教育。我堅持我的提議。」"]}, {"id": 14, "blocks": [{"lang": "en", "text": "“MR. MORGAN (excitedly): ‘Mr. Chairman—I do most strenuously object to this amendment. The gentleman from Oregon is old, and furthermore is bulky only in bone—not in flesh. I ask the gentleman from Virginia if it is soup we want instead of solid sustenance? if he would delude us with shadows? if he would mock our suffering with an Oregonian specter? I ask him if he can look upon the anxious faces around him, if he can gaze into our sad eyes, if he can listen to the beating of our expectant hearts, and still thrust this famine-stricken fraud upon us? I ask him if he can think of our desolate state, of our past sorrows, of our dark future, and still unpityingly foist upon us this wreck, this ruin, this tottering swindle, this gnarled and blighted and sapless vagabond from Oregon’s inhospitable shores? Never!’ [Applause.]"}, {"lang": "zh", "text": "「摩根（激動地）：『主席先生——我強烈反對這項修正案。來自俄勒岡州的紳士年紀大，而且他只是骨頭粗壯——而非肉體。我問來自維吉尼亞州的紳士，我們是否想要湯而不是固體食物？如果他想用幻影來欺騙我們？如果他想用俄勒岡的幻影來嘲弄我們的痛苦？我問他，是否能看著周圍焦急的面孔，是否能凝視我們悲傷的眼睛，是否能聆聽我們期待的心跳，卻仍然將這個饑荒中的騙子強加於我們？我問他，是否能想到我們的淒慘狀態、過去的悲傷、黑暗的未來，卻仍然無情地將這個來自俄勒岡的殘骸、廢墟、搖搖欲墜的騙子、這個枯瘦而無生氣的流浪者強加於我們？絕不！」【掌聲】"}], "en": ["“MR. MORGAN (excitedly): ‘Mr. Chairman—I do most strenuously object to this amendment. The gentleman from Oregon is old, and furthermore is bulky only in bone—not in flesh. I ask the gentleman from Virginia if it is soup we want instead of solid sustenance? if he would delude us with shadows? if he would mock our suffering with an Oregonian specter? I ask him if he can look upon the anxious faces around him, if he can gaze into our sad eyes, if he can listen to the beating of our expectant hearts, and still thrust this famine-stricken fraud upon us? I ask him if he can think of our desolate state, of our past sorrows, of our dark future, and still unpityingly foist upon us this wreck, this ruin, this tottering swindle, this gnarled and blighted and sapless vagabond from Oregon’s inhospitable shores? Never!’ [Applause.]"], "zh": ["「摩根（激動地）：『主席先生——我強烈反對這項修正案。來自俄勒岡州的紳士年紀大，而且他只是骨頭粗壯——而非肉體。我問來自維吉尼亞州的紳士，我們是否想要湯而不是固體食物？如果他想用幻影來欺騙我們？如果他想用俄勒岡的幻影來嘲弄我們的痛苦？我問他，是否能看著周圍焦急的面孔，是否能凝視我們悲傷的眼睛，是否能聆聽我們期待的心跳，卻仍然將這個饑荒中的騙子強加於我們？我問他，是否能想到我們的淒慘狀態、過去的悲傷、黑暗的未來，卻仍然無情地將這個來自俄勒岡的殘骸、廢墟、搖搖欲墜的騙子、這個枯瘦而無生氣的流浪者強加於我們？絕不！」【掌聲】"]}, {"id": 15, "blocks": [{"lang": "en", "text": "“The amendment was put to vote, after a fiery debate, and lost. Mr. Harris was substituted on the first amendment. The balloting then began. Five ballots were held without a choice. On the sixth, Mr. Harris was elected, all voting for him but himself. It was then moved that his election should be ratified by acclamation, which was lost, in consequence of his again voting against himself."}, {"lang": "zh", "text": "「經過激烈的辯論，修正案被投票表決，失敗。哈里斯在第一項修正案中被替換。隨後開始投票。進行了五輪投票，卻未能選出人選。在第六輪中，哈里斯當選，除了他自己，所有人都投了他的票。然後提議以全體表決確認他的當選，但因為他再次投票反對自己而失敗。"}, {"lang": "en", "text": "“MR. RADWAY moved that the House now take up the remaining candidates, and go into an election for breakfast. This was carried."}, {"lang": "zh", "text": "「拉德威提議會議現在考慮剩餘的候選人，並進行早餐的選舉。這項提議獲得通過。"}, {"lang": "en", "text": "“On the first ballot there was a tie, half the members favoring one candidate on account of his youth, and half favoring the other on account of his superior size. The President gave the casting vote for the latter, Mr. Messick. This decision created considerable dissatisfaction among the friends of Mr. Ferguson, the defeated candidate, and there was some talk of demanding a new ballot; but in the midst of it a motion to adjourn was carried, and the meeting broke up at once."}, {"lang": "zh", "text": "「在第一次投票中出現平局，半數成員因為候選人的年輕而支持一位，另一半則因為另一位的體型而支持他。主席為後者投下了決定性的一票，選擇了梅西克。這一決定引起了弗格森的支持者的不滿，並有人提議要求重新投票；但在此期間，提議休會獲得通過，會議立即解散。"}], "en": ["“The amendment was put to vote, after a fiery debate, and lost. Mr. Harris was substituted on the first amendment. The balloting then began. Five ballots were held without a choice. On the sixth, Mr. Harris was elected, all voting for him but himself. It was then moved that his election should be ratified by acclamation, which was lost, in consequence of his again voting against himself.", "“MR. RADWAY moved that the House now take up the remaining candidates, and go into an election for breakfast. This was carried.", "“On the first ballot there was a tie, half the members favoring one candidate on account of his youth, and half favoring the other on account of his superior size. The President gave the casting vote for the latter, Mr. Messick. This decision created considerable dissatisfaction among the friends of Mr. Ferguson, the defeated candidate, and there was some talk of demanding a new ballot; but in the midst of it a motion to adjourn was carried, and the meeting broke up at once."], "zh": ["「經過激烈的辯論，修正案被投票表決，失敗。哈里斯在第一項修正案中被替換。隨後開始投票。進行了五輪投票，卻未能選出人選。在第六輪中，哈里斯當選，除了他自己，所有人都投了他的票。然後提議以全體表決確認他的當選，但因為他再次投票反對自己而失敗。", "「拉德威提議會議現在考慮剩餘的候選人，並進行早餐的選舉。這項提議獲得通過。", "「在第一次投票中出現平局，半數成員因為候選人的年輕而支持一位，另一半則因為另一位的體型而支持他。主席為後者投下了決定性的一票，選擇了梅西克。這一決定引起了弗格森的支持者的不滿，並有人提議要求重新投票；但在此期間，提議休會獲得通過，會議立即解散。"]}, {"id": 16, "blocks": [{"lang": "en", "text": "“The preparations for supper diverted the attention of the Ferguson faction from the discussion of their grievance for a long time, and then, when they would have taken it up again, the happy announcement that Mr. Harris was ready drove all thought of it to the winds."}, {"lang": "zh", "text": "「晚餐的準備使弗格森派系的注意力暫時轉移，當他們想再次討論時，哈里斯已準備好的喜訊驅散了所有的想法。"}, {"lang": "en", "text": "“We improvised tables by propping up the backs of car-seats, and sat down with hearts full of gratitude to the finest supper that had blessed our vision for seven torturing days. How changed we were from what we had been a few short hours before! Hopeless, sad-eyed misery, hunger, feverish anxiety, desperation, then; thankfulness, serenity, joy too deep for utterance now. That I know was the cheeriest hour of my eventful life. The winds howled, and blew the snow wildly about our prison house, but they were powerless to distress us any more. I liked Harris. He might have been better done, perhaps, but I am free to say that no man ever agreed with me better than Harris, or afforded me so large a degree of satisfaction. Messick was very well, though rather high-flavored, but for genuine nutritiousness and delicacy of fiber, give me Harris. Messick had his good points—I will not attempt to deny it, nor do I wish to do it—but he was no more fitted for breakfast than a mummy would be, sir—not a bit. Lean?—why, bless me!—and tough? Ah, he was very tough! You could not imagine it—you could never imagine anything like it.”"}, {"lang": "zh", "text": "「我們用車廂座椅的背部支撐即興搭建了桌子，坐下來，心中充滿感激，享用著七天折磨後最美好的晚餐。我們與幾個小時前的自己相比，變化真大！曾經的絕望、悲傷的眼神、饑餓、焦慮、絕望，現在卻是感激、平靜、無法言喻的喜悅。我知道那是我多彩人生中最愉快的時光。風呼嘯著，將雪狂野地吹拂著我們的囚室，但它們再也無法讓我們感到不安。我喜歡哈里斯。或許他可以做得更好，但我可以坦白地說，沒有任何人比哈里斯更能讓我感到滿意。梅西克也不錯，雖然味道稍重，但就真正的營養和纖維的細膩度而言，還是哈里斯更好。梅西克有他的優點——我不會否認，也不想否認——但他根本不適合當早餐，像木乃伊一樣，先生——一點也不。瘦？——天哪！——而且很硬！啊，他真是硬！你無法想像——你永遠無法想像。"}], "en": ["“The preparations for supper diverted the attention of the Ferguson faction from the discussion of their grievance for a long time, and then, when they would have taken it up again, the happy announcement that Mr. Harris was ready drove all thought of it to the winds.", "“We improvised tables by propping up the backs of car-seats, and sat down with hearts full of gratitude to the finest supper that had blessed our vision for seven torturing days. How changed we were from what we had been a few short hours before! Hopeless, sad-eyed misery, hunger, feverish anxiety, desperation, then; thankfulness, serenity, joy too deep for utterance now. That I know was the cheeriest hour of my eventful life. The winds howled, and blew the snow wildly about our prison house, but they were powerless to distress us any more. I liked Harris. He might have been better done, perhaps, but I am free to say that no man ever agreed with me better than Harris, or afforded me so large a degree of satisfaction. Messick was very well, though rather high-flavored, but for genuine nutritiousness and delicacy of fiber, give me Harris. Messick had his good points—I will not attempt to deny it, nor do I wish to do it—but he was no more fitted for breakfast than a mummy would be, sir—not a bit. Lean?—why, bless me!—and tough? Ah, he was very tough! You could not imagine it—you could never imagine anything like it.”"], "zh": ["「晚餐的準備使弗格森派系的注意力暫時轉移，當他們想再次討論時，哈里斯已準備好的喜訊驅散了所有的想法。", "「我們用車廂座椅的背部支撐即興搭建了桌子，坐下來，心中充滿感激，享用著七天折磨後最美好的晚餐。我們與幾個小時前的自己相比，變化真大！曾經的絕望、悲傷的眼神、饑餓、焦慮、絕望，現在卻是感激、平靜、無法言喻的喜悅。我知道那是我多彩人生中最愉快的時光。風呼嘯著，將雪狂野地吹拂著我們的囚室，但它們再也無法讓我們感到不安。我喜歡哈里斯。或許他可以做得更好，但我可以坦白地說，沒有任何人比哈里斯更能讓我感到滿意。梅西克也不錯，雖然味道稍重，但就真正的營養和纖維的細膩度而言，還是哈里斯更好。梅西克有他的優點——我不會否認，也不想否認——但他根本不適合當早餐，像木乃伊一樣，先生——一點也不。瘦？——天哪！——而且很硬！啊，他真是硬！你無法想像——你永遠無法想像。"]}, {"id": 17, "blocks": [{"lang": "en", "text": "“Do you mean to tell me that—”"}, {"lang": "zh", "text": "「你是說——」"}, {"lang": "en", "text": "“Do not interrupt me, please. After breakfast we elected a man by the name of Walker, from Detroit, for supper. He was very good. I wrote his wife so afterward. He was worthy of all praise. I shall always remember Walker. He was a little rare, but very good. And then the next morning we had Morgan of Alabama for breakfast. He was one of the finest men I ever sat down to—handsome, educated, refined, spoke several languages fluently—a perfect gentleman—he was a perfect gentleman, and singularly juicy. For supper we had that Oregon patriarch, and he was a fraud, there is no question about it—old, scraggy, tough, nobody can picture the reality. I finally said, gentlemen, you can do as you like, but I will wait for another election. And Grimes of Illinois said, ‘Gentlemen, I will wait also. When you elect a man that has something to recommend him, I shall be glad to join you again.’ It soon became evident that there was general dissatisfaction with Davis of Oregon, and so, to preserve the good will that had prevailed so pleasantly since we had had Harris, an election was called, and the result of it was that Baker of Georgia was chosen. He was splendid! Well, well—after that we had Doolittle, and Hawkins, and McElroy (there was some complaint about McElroy, because he was uncommonly short and thin), and Penrod, and two Smiths, and Bailey (Bailey had a wooden leg, which was clear loss, but he was otherwise good), and an Indian boy, and an organ-grinder, and a gentleman by the name of Buckminster—a poor stick of a vagabond that wasn’t any good for company and no account for breakfast. We were glad we got him elected before relief came.”"}, {"lang": "zh", "text": "「請不要打斷我。早餐後，我們選了一位名叫沃克的男子，來自底特律，作為晚餐。他非常好。我之後寫信給他的妻子。他值得所有的讚美。我將永遠記住沃克。他有點稀有，但非常好。然後第二天早上，我們吃了來自阿拉巴馬州的摩根作為早餐。他是我曾經坐下來的最優秀的人之一——英俊、受過教育、優雅，流利地說幾種語言——一位完美的紳士——他真的是一位完美的紳士，且特別多汁。晚餐我們則選擇了那位來自俄勒岡的族長，他毫無疑問是一個騙子——年紀大、瘦弱、堅硬，沒有人能描繪出真實的情況。我最後說，紳士們，你們可以隨意，但我會等到下一次選舉。伊利諾伊州的格萊姆斯說，『紳士們，我也會等。當你們選出一位有值得推薦的候選人時，我將很高興再次加入你們。』很快就變得明顯，大家對來自俄勒岡的戴維斯感到普遍不滿，因此為了保持自從哈里斯以來一直愉快的良好氣氛，召開了選舉，結果選出了來自喬治亞州的貝克。他非常出色！好吧，之後我們又選了杜利特、霍金斯、麥克艾爾羅伊（對於麥克艾爾羅伊有些抱怨，因為他異常矮小和瘦弱）、潘羅德、兩位史密斯、貝利（貝利有一條木腿，這明顯是損失，但他其他方面還不錯）、一位印第安男孩、一位磨琴者，以及一位名叫巴金斯特的紳士——一個可憐的流浪者，對於陪伴毫無用處，早餐也不行。我們很高興在救援來臨之前選上了他。"}], "en": ["“Do you mean to tell me that—”", "“Do not interrupt me, please. After breakfast we elected a man by the name of Walker, from Detroit, for supper. He was very good. I wrote his wife so afterward. He was worthy of all praise. I shall always remember Walker. He was a little rare, but very good. And then the next morning we had Morgan of Alabama for breakfast. He was one of the finest men I ever sat down to—handsome, educated, refined, spoke several languages fluently—a perfect gentleman—he was a perfect gentleman, and singularly juicy. For supper we had that Oregon patriarch, and he was a fraud, there is no question about it—old, scraggy, tough, nobody can picture the reality. I finally said, gentlemen, you can do as you like, but I will wait for another election. And Grimes of Illinois said, ‘Gentlemen, I will wait also. When you elect a man that has something to recommend him, I shall be glad to join you again.’ It soon became evident that there was general dissatisfaction with Davis of Oregon, and so, to preserve the good will that had prevailed so pleasantly since we had had Harris, an election was called, and the result of it was that Baker of Georgia was chosen. He was splendid! Well, well—after that we had Doolittle, and Hawkins, and McElroy (there was some complaint about McElroy, because he was uncommonly short and thin), and Penrod, and two Smiths, and Bailey (Bailey had a wooden leg, which was clear loss, but he was otherwise good), and an Indian boy, and an organ-grinder, and a gentleman by the name of Buckminster—a poor stick of a vagabond that wasn’t any good for company and no account for breakfast. We were glad we got him elected before relief came.”"], "zh": ["「你是說——」", "「請不要打斷我。早餐後，我們選了一位名叫沃克的男子，來自底特律，作為晚餐。他非常好。我之後寫信給他的妻子。他值得所有的讚美。我將永遠記住沃克。他有點稀有，但非常好。然後第二天早上，我們吃了來自阿拉巴馬州的摩根作為早餐。他是我曾經坐下來的最優秀的人之一——英俊、受過教育、優雅，流利地說幾種語言——一位完美的紳士——他真的是一位完美的紳士，且特別多汁。晚餐我們則選擇了那位來自俄勒岡的族長，他毫無疑問是一個騙子——年紀大、瘦弱、堅硬，沒有人能描繪出真實的情況。我最後說，紳士們，你們可以隨意，但我會等到下一次選舉。伊利諾伊州的格萊姆斯說，『紳士們，我也會等。當你們選出一位有值得推薦的候選人時，我將很高興再次加入你們。』很快就變得明顯，大家對來自俄勒岡的戴維斯感到普遍不滿，因此為了保持自從哈里斯以來一直愉快的良好氣氛，召開了選舉，結果選出了來自喬治亞州的貝克。他非常出色！好吧，之後我們又選了杜利特、霍金斯、麥克艾爾羅伊（對於麥克艾爾羅伊有些抱怨，因為他異常矮小和瘦弱）、潘羅德、兩位史密斯、貝利（貝利有一條木腿，這明顯是損失，但他其他方面還不錯）、一位印第安男孩、一位磨琴者，以及一位名叫巴金斯特的紳士——一個可憐的流浪者，對於陪伴毫無用處，早餐也不行。我們很高興在救援來臨之前選上了他。"]}, {"id": 18, "blocks": [{"lang": "en", "text": "“And so the blessed relief did come at last?”"}, {"lang": "zh", "text": "「那麼，祝福的救援終於來了？」"}, {"lang": "en", "text": "“Yes, it came one bright, sunny morning, just after election. John Murphy was the choice, and there never was a better, I am willing to testify; but John Murphy came home with us, in the train that came to succor us, and lived to marry the widow Harris—”"}, {"lang": "zh", "text": "「是的，它在一個明亮、陽光明媚的早晨來了，正好在選舉之後。約翰·墨菲是我們的選擇，沒有比他更好的人，我願意證明；但約翰·墨菲和我們一起回家，搭乘來救援我們的火車，並活著娶了哈里斯的遺孀——」"}, {"lang": "en", "text": "“Relict of—”"}, {"lang": "zh", "text": "「她是——」"}, {"lang": "en", "text": "“Relict of our first choice. He married her, and is happy and respected and prosperous yet. Ah, it was like a novel, sir—it was like a romance. This is my stopping-place, sir; I must bid you goodby. Any time that you can make it convenient to tarry a day or two with me, I shall be glad to have you. I like you, sir; I have conceived an affection for you. I could like you as well as I liked Harris himself, sir. Good day, sir, and a pleasant journey.”"}, {"lang": "zh", "text": "「我們的第一選擇的遺孀。他娶了她，現在幸福、受人尊敬且繁榮。啊，這就像小說，先生——就像浪漫故事。這是我的下車站，先生；我必須和您告別。隨時您能方便地在我這裡逗留一兩天，我將非常高興。先生，我喜歡您；我對您產生了好感。我可以像喜歡哈里斯一樣喜歡您，先生。祝您有美好的一天，旅途愉快。」"}], "en": ["“And so the blessed relief did come at last?”", "“Yes, it came one bright, sunny morning, just after election. John Murphy was the choice, and there never was a better, I am willing to testify; but John Murphy came home with us, in the train that came to succor us, and lived to marry the widow Harris—”", "“Relict of—”", "“Relict of our first choice. He married her, and is happy and respected and prosperous yet. Ah, it was like a novel, sir—it was like a romance. This is my stopping-place, sir; I must bid you goodby. Any time that you can make it convenient to tarry a day or two with me, I shall be glad to have you. I like you, sir; I have conceived an affection for you. I could like you as well as I liked Harris himself, sir. Good day, sir, and a pleasant journey.”"], "zh": ["「那麼，祝福的救援終於來了？」", "「是的，它在一個明亮、陽光明媚的早晨來了，正好在選舉之後。約翰·墨菲是我們的選擇，沒有比他更好的人，我願意證明；但約翰·墨菲和我們一起回家，搭乘來救援我們的火車，並活著娶了哈里斯的遺孀——」", "「她是——」", "「我們的第一選擇的遺孀。他娶了她，現在幸福、受人尊敬且繁榮。啊，這就像小說，先生——就像浪漫故事。這是我的下車站，先生；我必須和您告別。隨時您能方便地在我這裡逗留一兩天，我將非常高興。先生，我喜歡您；我對您產生了好感。我可以像喜歡哈里斯一樣喜歡您，先生。祝您有美好的一天，旅途愉快。」"]}, {"id": 19, "blocks": [{"lang": "en", "text": "He was gone. I never felt so stunned, so distressed, so bewildered in my life. But in my soul I was glad he was gone. With all his gentleness of manner and his soft voice, I shuddered whenever he turned his hungry eye upon me; and when I heard that I had achieved his perilous affection, and that I stood almost with the late Harris in his esteem, my heart fairly stood still!"}, {"lang": "zh", "text": "他走了。我從未感到如此震驚、如此不安、如此困惑。但在我心中，我很高興他走了。儘管他舉止溫和，聲音柔和，但每當他用渴望的目光盯著我時，我都不禁打顫；當我聽到我已經贏得了他危險的喜愛，並且在他心中幾乎與已故的哈里斯平起平坐時，我的心幾乎停止了跳動！"}, {"lang": "en", "text": "I was bewildered beyond description. I did not doubt his word; I could not question a single item in a statement so stamped with the earnestness of truth as his; but its dreadful details overpowered me, and threw my thoughts into hopeless confusion. I saw the conductor looking at me. I said, “Who is that man?”"}, {"lang": "zh", "text": "我感到無法形容的困惑。我不懷疑他的話；我無法質疑他陳述中的任何一項細節，因為那是如此真摯的表達，但其可怕的細節壓倒了我，讓我的思緒陷入無望的混亂。我看到列車長在看著我。我說：「那個人是誰？」"}], "en": ["He was gone. I never felt so stunned, so distressed, so bewildered in my life. But in my soul I was glad he was gone. With all his gentleness of manner and his soft voice, I shuddered whenever he turned his hungry eye upon me; and when I heard that I had achieved his perilous affection, and that I stood almost with the late Harris in his esteem, my heart fairly stood still!", "I was bewildered beyond description. I did not doubt his word; I could not question a single item in a statement so stamped with the earnestness of truth as his; but its dreadful details overpowered me, and threw my thoughts into hopeless confusion. I saw the conductor looking at me. I said, “Who is that man?”"], "zh": ["他走了。我從未感到如此震驚、如此不安、如此困惑。但在我心中，我很高興他走了。儘管他舉止溫和，聲音柔和，但每當他用渴望的目光盯著我時，我都不禁打顫；當我聽到我已經贏得了他危險的喜愛，並且在他心中幾乎與已故的哈里斯平起平坐時，我的心幾乎停止了跳動！", "我感到無法形容的困惑。我不懷疑他的話；我無法質疑他陳述中的任何一項細節，因為那是如此真摯的表達，但其可怕的細節壓倒了我，讓我的思緒陷入無望的混亂。我看到列車長在看著我。我說：「那個人是誰？」"]}, {"id": 20, "blocks": [{"lang": "en", "text": "“He was a member of Congress once, and a good one. But he got caught in a snow-drift in the cars, and like to have been starved to death. He got so frost-bitten and frozen up generally, and used up for want of something to eat, that he was sick and out of his head two or three months afterward. He is all right now, only he is a monomaniac, and when he gets on that old subject he never stops till he has eat up that whole car-load of people he talks about. He would have finished the crowd by this time, only he had to get out here. He has got their names as pat as A B C. When he gets them all eat up but himself, he always says: ‘Then the hour for the usual election for breakfast having arrived, and there being no opposition, I was duly elected, after which, there being no objections offered, I resigned. Thus I am here.’”"}, {"lang": "zh", "text": "「他曾經是一位國會議員，還是一位好議員。但他在車上被困在雪堆裡，差點餓死。他的手腳凍傷，整個人因為缺乏食物而病倒，幾個月後才恢復過來。現在他沒事了，只是成了偏執狂，當他談到那個老話題時，總是停不下來，直到他把他所談論的整車人都吃掉為止。他本來會把那群人吃光，只是他必須在這裡下車。他對他們的名字記得一清二楚。當他把除了自己以外的所有人都吃掉時，他總是說：『然後，早餐的選舉時間到了，沒有反對意見，我被正式選上，之後，沒有提出異議，我辭職了。於是我在這裡。』」"}, {"lang": "en", "text": "I felt inexpressibly relieved to know that I had only been listening to the harmless vagaries of a madman instead of the genuine experiences of a bloodthirsty cannibal."}, {"lang": "zh", "text": "我感到無法形容的輕鬆，知道我只是聽到了一位瘋子的無害幻想，而不是一位嗜血的食人族的真實經歷。"}], "en": ["“He was a member of Congress once, and a good one. But he got caught in a snow-drift in the cars, and like to have been starved to death. He got so frost-bitten and frozen up generally, and used up for want of something to eat, that he was sick and out of his head two or three months afterward. He is all right now, only he is a monomaniac, and when he gets on that old subject he never stops till he has eat up that whole car-load of people he talks about. He would have finished the crowd by this time, only he had to get out here. He has got their names as pat as A B C. When he gets them all eat up but himself, he always says: ‘Then the hour for the usual election for breakfast having arrived, and there being no opposition, I was duly elected, after which, there being no objections offered, I resigned. Thus I am here.’”", "I felt inexpressibly relieved to know that I had only been listening to the harmless vagaries of a madman instead of the genuine experiences of a bloodthirsty cannibal."], "zh": ["「他曾經是一位國會議員，還是一位好議員。但他在車上被困在雪堆裡，差點餓死。他的手腳凍傷，整個人因為缺乏食物而病倒，幾個月後才恢復過來。現在他沒事了，只是成了偏執狂，當他談到那個老話題時，總是停不下來，直到他把他所談論的整車人都吃掉為止。他本來會把那群人吃光，只是他必須在這裡下車。他對他們的名字記得一清二楚。當他把除了自己以外的所有人都吃掉時，他總是說：『然後，早餐的選舉時間到了，沒有反對意見，我被正式選上，之後，沒有提出異議，我辭職了。於是我在這裡。』」", "我感到無法形容的輕鬆，知道我只是聽到了一位瘋子的無害幻想，而不是一位嗜血的食人族的真實經歷。"]}];

 {"category": "場所名詞字尾", "keys": ["age"], "meaning": ""}, {"category": "場所名詞字尾", "keys": ["ary"], "meaning": ""}, {"category": "場所名詞字尾", "keys": ["ery"], "meaning": ""}, {"category": "場所名詞字尾", "keys": ["ory"], "meaning": ""}, {"category": "場所名詞字尾", "keys": ["dom"], "meaning": ""}, {"category": "場所名詞字尾", "keys": ["um"], "meaning": ""}, {"category": "場所名詞字尾", "keys": ["y"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["emia"], "meaning": "blood condition"}, {"category": "形容詞字尾", "keys": ["able", "ible"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["al", "ial"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["an", "ian"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ant", "ent"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ar"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ary"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ate", "ete", "ute"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ed"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["en"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ern"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ese"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["fold"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ful"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ic"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ical"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["id"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ile"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ine"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ing"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ior"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ique", "esque"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ish"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ite"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ive"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["less"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["like"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ly"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["most"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ory"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ous"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["some"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ward"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["y"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ence"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ling", "long"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ly"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ward(s)"], "meaning": ""}, {"category": "副詞字尾", "keys": ["way(s)", "wise"], "meaning": ""}, {"category": "動詞字尾", "keys": ["ate"], "meaning": ""}, {"category": "動詞字尾", "keys": ["en"], "meaning": ""}, {"category": "動詞字尾", "keys": ["er"], "meaning": ""}, {"category": "動詞字尾", "keys": ["fy"], "meaning": ""}, {"category": "動詞字尾", "keys": ["ize", "ise"], "meaning": ""}, {"category": "動詞字尾", "keys": ["ish"], "meaning": ""}, {"category": "動詞字尾", "keys": ["le"], "meaning": ""}];

        let currentIndex = 0;
        let currentFontScale = parseFloat(localStorage.getItem('bilingual_font_scale')) || 1.0;
        const audioPlayer = document.getElementById('audioPlayer');

        document.documentElement.style.setProperty('--font-scale', currentFontScale);

        function changeFontSize(delta) {
            currentFontScale = Math.min(Math.max(0.7, currentFontScale + delta), 1.8);
            document.documentElement.style.setProperty('--font-scale', currentFontScale);
            localStorage.setItem('bilingual_font_scale', currentFontScale);
        }

        function updatePage() {
            if (!pages || pages.length === 0) return;
            const page = pages[currentIndex];
            const container = document.getElementById('paragraph-box');
            container.innerHTML = '';

            // 依原文順序交替渲染英文／中文段落（一頁可能有好幾組英中對照），
            // 不再把整頁的英文集中在最上面、中文集中在最下面。
            const blocks = page.blocks || [];
            blocks.forEach(b => {
                const p = document.createElement('div');
                p.className = (b.lang === 'en') ? 'en-p' : 'zh-p';
                p.innerText = b.text;
                container.appendChild(p);
            });

            document.getElementById('page-info').innerText = `${currentIndex + 1} / ${pages.length}`;
            document.getElementById('progress').style.width = `${((currentIndex + 1) / pages.length) * 100}%`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === pages.length - 1;
            document.getElementById('main-content').scrollTop = 0;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // 💡 智慧辨識電腦與手機觸控事件
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        document.addEventListener('mouseup', (e) => {
            // 電腦端：按住 Alt 鍵再選取才觸發（避開 Google 翻譯／一般選字）
            // 手機端：直接選取文字就觸發
            if (isMobile || e.altKey) {
                const selection = window.getSelection();
                const text = selection.toString().trim().toLowerCase();
                if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                    analyzeWord(text);
                }
            }
        });

        // 💡 電腦端：直接在英文段落雙擊單字即可查詢，不需要按 Alt，看小說時更方便
        document.addEventListener('dblclick', (e) => {
            if (isMobile) return; // 手機交給上面的 mouseup 處理，避免重複觸發
            if (!e.target.closest('.en-p')) return; // 只在英文段落內生效
            const selection = window.getSelection();
            const text = selection.toString().trim().toLowerCase();
            if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                analyzeWord(text);
            }
        });

        function analyzeWord(word) {
            const popup = document.getElementById('root-dict-popup');
            const title = document.getElementById('popup-word-title');
            const content = document.getElementById('popup-content');

            title.innerText = `🔍 【${word}】`;
            content.innerHTML = '';
            let hasResult = false;

            // 1. 字首：只取「最長匹配」，避免像 un / uni 這種短字首淹沒真正對的長字首
            let pMatches = [];
            dbPrefixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.startsWith(k)) pMatches.push({ key: k, meaning: item.meaning });
                });
            });
            const maxPLen = pMatches.reduce((m, x) => Math.max(m, x.key.length), 0);
            pMatches = pMatches.filter(x => x.key.length === maxPLen);

            // 2. 字尾：同樣只取「最長匹配」，並把同一個字尾在不同分類下的結果合併成一行
            let sRaw = [];
            dbSuffixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.endsWith(k) && k.length >= 2) sRaw.push({ key: k, meaning: item.meaning, category: item.category });
                });
            });
            const maxSLen = sRaw.reduce((m, x) => Math.max(m, x.key.length), 0);
            sRaw = sRaw.filter(x => x.key.length === maxSLen);
            const sGrouped = {};
            sRaw.forEach(x => {
                if (!sGrouped[x.key]) sGrouped[x.key] = { meanings: new Set(), categories: [] };
                if (x.meaning) sGrouped[x.key].meanings.add(x.meaning);
                sGrouped[x.key].categories.push(x.category);
            });
            const sMatches = Object.keys(sGrouped).map(k => ({
                key: k,
                meaning: Array.from(sGrouped[k].meanings).join('；'),
                categories: sGrouped[k].categories
            }));

            // 3. 字根：貪婪比對——優先用最長的字根，且已被字首/字尾/其他較長字根「占用」的字母範圍不再重複標記
            //    （例如 university 拆完 uni- 與 -ity 之後，中間巧合出現的 it 就不會再被誤判成字根）
            const prefixZoneEnd = maxPLen;
            const suffixZoneStart = word.length - maxSLen;

            const rootCandidates = {};
            dbRoots.forEach(item => {
                item.keys.forEach(k => {
                    if (k.length < 2) return;
                    if (!rootCandidates[k]) rootCandidates[k] = [];
                    rootCandidates[k].push(item.meaning);
                });
            });
            const sortedKeys = Object.keys(rootCandidates).sort((a, b) => b.length - a.length);

            let claimed = [];
            let rMatches = [];
            sortedKeys.forEach(k => {
                let searchFrom = 0;
                while (true) {
                    const idx = word.indexOf(k, searchFrom);
                    if (idx === -1) break;
                    const end = idx + k.length;
                    const insidePrefix = end <= prefixZoneEnd;
                    const insideSuffix = idx >= suffixZoneStart;
                    const overlapsClaimed = claimed.some(([cs, ce]) => idx < ce && end > cs);
                    if (!insidePrefix && !insideSuffix && !overlapsClaimed) {
                        claimed.push([idx, end]);
                        rMatches.push({ key: k, meaning: rootCandidates[k].join('；') });
                        break;
                    }
                    searchFrom = idx + 1;
                }
            });
            rMatches.sort((a, b) => b.key.length - a.key.length);

            if (pMatches.length > 0) {
                hasResult = true;
                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;
            }

            if (rMatches.length > 0) {
                hasResult = true;
                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🌱 字根 Root</div>${rows}</div>`;
            }

            if (sMatches.length > 0) {
                hasResult = true;
                const rows = sMatches.map(x => {
                    const mStr = x.meaning ? ` : ${x.meaning}` : '';
                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');
                    return `<div class="tag-item"><b>-${x.key}</b>${badges}${mStr}</div>`;
                }).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🔚 字尾 Suffix</div>${rows}</div>`;
            }

            if (!hasResult) {
                content.innerHTML += `<div class="no-result">本機字根資料庫沒有找到相符的片段，這個字可能是不規則變化，或不屬於常見的拉丁／希臘字源。</div>`;
            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function closePopup() { document.getElementById('root-dict-popup').style.display = 'none'; }
        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); closePopup(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }
        function seekProgress(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleMp3Play() {
            const label = document.getElementById('mp3BtnLabel');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => label.textContent = " 暫停").catch(() => alert('未找到 MP3 檔案'));
            } else { audioPlayer.pause(); label.textContent = " 全文"; }
        }
        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;
            function speakNext() {
                if (sentenceIndex >= sentences.length) return;
                const utterance = new SpeechSynthesisUtterance(sentences[sentenceIndex].trim());
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onend = () => { sentenceIndex++; speakNext(); };
                utterance.onerror = () => { sentenceIndex++; speakNext(); };
                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
        updatePage();
