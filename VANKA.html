<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>契訶夫《凡卡》</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #2b2d42;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --accent-color: #3182ce;
            --border-color: #e2e8f0;
            --font-scale: 1;
        }

        body.dark-mode {
            --bg-color: #1a202c;
            --text-main: #edf2f7;
            --text-sub: #cbd5e0;
            --card-bg: #2d3748;
            --accent-color: #63b3ed;
            --border-color: #4a5568;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column;
            font-family: Georgia, "Times New Roman", "標楷體", serif;
        }

        header {
            height: 65px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 20;
            user-select: none;
        }

        .title {
            font-size: 1.2rem; font-weight: bold; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
        }

        .controls { display: flex; align-items: center; gap: 5px; }

        .controls button {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.88rem;
        }

        main { flex: 1; display: flex; position: relative; overflow-y: auto; padding: 15px 0; }

        .click-zone { position: absolute; top: 0; bottom: 0; width: 8%; z-index: 5; cursor: pointer; user-select: none; }
        .click-left { left: 0; } .click-right { right: 0; }

        .card-container { width: 95%; max-width: 1200px; margin: auto; padding: 0 10px; z-index: 10; }

        .paragraph-box {
            background-color: var(--card-bg); padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
        }

        .en-p {
            font-size: calc(1.18rem * var(--font-scale)); line-height: 1.65;
            font-family: Georgia, serif; color: var(--text-main); margin-bottom: 16px;
            user-select: text !important; cursor: text;
        }

        .zh-section { border-top: 1px dashed var(--border-color); padding-top: 20px; }

        .zh-p {
            font-size: calc(1.25rem * var(--font-scale)); line-height: 1.85;
            font-family: "標楷體", serif; color: var(--text-sub); margin-bottom: 16px;
            user-select: text !important;
        }

        /* 字根分析彈窗 */
        #root-dict-popup {
            display: none; position: fixed; bottom: 80px; left: 30px; width: 340px; max-height: 420px;
            background-color: var(--card-bg); border: 2px solid var(--accent-color);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999;
            padding: 16px; overflow-y: auto; font-family: -apple-system, sans-serif;
        }

        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .popup-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); }
        .close-btn { cursor: pointer; font-weight: bold; font-size: 1.2rem; color: var(--text-sub); }
        .tag-group { margin-bottom: 10px; }
        .tag-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
        .tag-item { background-color: var(--bg-color); border-left: 3px solid var(--accent-color); padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 0.9rem; }
        .suffix-badge { display: inline-block; background-color: var(--accent-color); color: white; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 4px; }
        .no-result { font-size: 0.85rem; color: var(--text-sub); line-height: 1.6; padding: 6px 2px 10px 2px; }
        .etymo-link { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); text-align: center; }
        .etymo-link a { color: var(--accent-color); text-decoration: none; font-size: 0.88rem; font-weight: bold; }
        .etymo-link a:hover { text-decoration: underline; }

        footer {
            height: 65px; padding: 8px 25px; background-color: var(--card-bg);
            border-top: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; gap: 6px; flex-shrink: 0; z-index: 20; user-select: none;
        }
        .progress-bar-container { width: 100%; background-color: var(--border-color); height: 6px; border-radius: 3px; overflow: hidden; cursor: pointer; }
        .progress-bar { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.2s; }
        .footer-controls { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-sub); }
        .nav-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 22px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        @media (max-width: 600px) {
            #root-dict-popup { left: 5%; right: 5%; width: 90%; bottom: 75px; }
        }
    </style>
</head>
<body>

    <audio id="audioPlayer" src="VANKA.mp3" preload="none"></audio>

    <header>
        <div class="title">📖 契訶夫《凡卡》</div>
        <div class="controls">
            <button onclick="changeFontSize(-0.1)">A-</button>
            <button onclick="changeFontSize(0.1)">A+</button>

            <button id="mp3Btn" onclick="toggleMp3Play()">🎧<span class="btn-label" id="mp3BtnLabel"> 全文</span></button>
            <button onclick="toggleDarkMode()">🌙<span class="btn-label"> 切換</span></button>

            <div class="progress-bar" id="progress"></div>

            <button class="nav-btn" id="prev-btn" onclick="prevPage()">上一頁</button>
            <span id="page-info">0 / 0</span>
            <button class="nav-btn" id="next-btn" onclick="nextPage()">下一頁</button>
        </div>
    </footer>

    <script>
        const pages = [{"id": 1, "en": ["VANKA ZHUKOV, a boy of nine, who had been for three months apprenticed to Alyahin the shoemaker, was sitting up on Christmas Eve. Waiting till his master and mistress and their workmen had gone to the midnight service, he took out of his master’s cupboard a bottle of ink and a pen with a rusty nib, and, spreading out a crumpled sheet of paper in front of him, began writing. Before forming the first letter he several times looked round fearfully at the door and the windows, stole a glance at the dark ikon, on both sides of which stretched shelves full of lasts, and heaved a broken sigh. The paper lay on the bench while he knelt before it."], "zh": ["瓦卡·朱科夫，九歲的男孩，已經跟隨鞋匠阿利亞欣學徒三個月，聖誕前夜他坐在那裡。等到他的主人和女主人及工人們都去參加午夜禮拜後，他從主人的櫥櫃裡拿出一瓶墨水和一支生鏽的筆，將一張皺巴巴的紙展開在面前，開始寫信。在寫下第一個字母之前，他幾次驚恐地朝門和窗戶看，偷偷瞥了一眼黑暗中的聖像，兩側擺滿了鞋楦，然後重重地嘆了口氣。紙張躺在長凳上，而他則跪在它面前。"]}, {"id": 2, "en": ["“Dear grandfather, Konstantin Makaritch,” he wrote, “I am writing you a letter. I wish you a happy Christmas, and all blessings from God Almighty. I have neither father nor mother, you are the only one left me.”", "Vanka raised his eyes to the dark ikon on which the light of his candle was reflected, and vividly recalled his grandfather, Konstantin Makaritch, who was night watchman to a family called Zhivarev. He was a thin but extraordinarily nimble and lively little old man of sixty-five, with an everlastingly laughing face and drunken eyes. By day he slept in the servants’ kitchen, or made jokes with the cooks; at night, wrapped in an ample sheepskin, he walked round the grounds and tapped with his little mallet. Old Kashtanka and Eel, so-called on account of his dark colour and his long body like a weasel’s, followed him with hanging heads. This Eel was exceptionally polite and affectionate, and looked with equal kindness on strangers and his own masters, but had not a very good reputation. Under his politeness and meekness was hidden the most Jesuitical cunning. No one knew better how to creep up on occasion and snap at one’s legs, to slip into the store-room, or steal a hen from a peasant. His hind legs had been nearly pulled off more than once, twice he had been hanged, every week he was thrashed till he was half dead, but he always revived."], "zh": ["「親愛的祖父，康斯坦丁·馬卡里奇，」他寫道，「我正在給您寫信。祝您聖誕快樂，願全能的上帝賜予您一切祝福。我沒有父親也沒有母親，您是我唯一剩下的人。」", "瓦卡抬起頭，望向黑暗中的聖像，蠟燭的光映照在上面，他清晰地回想起他的祖父康斯坦丁·馬卡里奇，他是名叫日瓦列夫的家庭的夜間守衛。祖父是一位瘦小卻異常靈活和活潑的六十五歲老人，臉上永遠帶著笑容，眼神醉意朦朧。白天他在僕人的廚房裡睡覺，或是和廚師們開玩笑；晚上，他裹著一件寬大的羊皮大衣，圍著院子走，拿著小木槌敲打著。老卡什坦卡和名叫鰻魚的狗，因為牠的毛色暗淡和長得像黃鼠狼，低著頭跟在他身後。這隻鰻魚特別有禮貌且親切，對陌生人和自己的主人都一樣友好，但名聲卻不太好。在他的禮貌和溫順之下，隱藏著最狡猾的心機。沒有人比他更懂得在合適的時候悄悄接近並咬住人的腿，溜進儲藏室，或是從農民那裡偷一隻母雞。他的後腿曾經多次被拉扯得快要斷掉，兩次被吊起，每週都被打得半死，但他總是能活過來。"]}, {"id": 3, "en": ["At this moment grandfather was, no doubt, standing at the gate, screwing up his eyes at the red windows of the church, stamping with his high felt boots, and joking with the servants. His little mallet was hanging on his belt. He was clasping his hands, shrugging with the cold, and, with an aged chuckle, pinching first the housemaid, then the cook.", "“How about a pinch of snuff?” he was saying, offering the women his snuff-box.", "The women would take a sniff and sneeze. Grandfather would be indescribably delighted, go off into a merry chuckle, and cry:", "“Tear it off, it has frozen on!”"], "zh": ["此刻，祖父無疑正站在大門口，眯著眼睛看著教堂紅色的窗戶，穿著高高的毛氈靴子在那裡跺腳，和僕人們開著玩笑。他的小木槌掛在腰帶上。他雙手交叉，因為寒冷而縮肩，帶著年老的笑聲，先捏了捏女僕，然後又捏了捏廚師。", "「來一點鼻煙怎麼樣？」他一邊說，一邊把鼻煙盒遞給女人們。", "女人們會吸一口，然後打噴嚏。祖父會高興得無法形容，笑得開懷，喊道：", "「快點，快點，它凍住了！」"]}, {"id": 4, "en": ["They give the dogs a sniff of snuff too. Kashtanka sneezes, wriggles her head, and walks away offended. Eel does not sneeze, from politeness, but wags his tail. And the weather is glorious. The air is still, fresh, and transparent. The night is dark, but one can see the whole village with its white roofs and coils of smoke coming from the chimneys, the trees silvered with hoar frost, the snowdrifts. The whole sky spangled with gay twinkling stars, and the Milky Way is as distinct as though it had been washed and rubbed with snow for a holiday. . . .", "Vanka sighed, dipped his pen, and went on writing:"], "zh": ["他們也讓狗聞一聞鼻煙。卡什坦卡打了個噴嚏，扭動著頭，生氣地走開了。鰻魚則因為禮貌沒有打噴嚏，而是搖著尾巴。天氣真好。空氣靜謐、清新而透明。夜色雖然黑暗，但整個村莊的白色屋頂和從煙囪裡冒出的煙霧清晰可見，樹木被霜覆蓋，雪堆如山。整個天空閃爍著五彩斑斕的星星，銀河清晰可見，彷彿為了節日而被雪洗刷和擦拭過……", "瓦卡嘆了口氣，沾了沾筆，繼續寫道："]}, {"id": 5, "en": ["“And yesterday I had a wigging. The master pulled me out into the yard by my hair, and whacked me with a boot-stretcher because I accidentally fell asleep while I was rocking their brat in the cradle. And a week ago the mistress told me to clean a herring, and I began from the tail end, and she took the herring and thrust its head in my face. The workmen laugh at me and send me to the tavern for vodka, and tell me to steal the master’s cucumbers for them, and the master beats me with anything that comes to hand. And there is nothing to eat. In the morning they give me bread, for dinner, porridge, and in the evening, bread again; but as for tea, or soup, the master and mistress gobble it all up themselves. And I am put to sleep in the passage, and when their wretched brat cries I get no sleep at all, but have to rock the cradle. Dear grandfather, show the divine mercy, take me away from here, home to the village. It’s more than I can bear. I bow down to your feet, and will pray to God for you for ever, take me away from here or I shall die.”"], "zh": ["「昨天我被罵了一頓。主人把我拉到院子裡，抓著我的頭髮，用鞋撐打了我，因為我在搖他們的嬰兒時不小心睡著了。還有一週前，女主人讓我清理一條鯡魚，我從尾巴開始清理，她卻把魚的頭塞到我臉上。工人們笑我，讓我去酒館買伏特加，還叫我偷主人的黃瓜，主人則用手邊的任何東西打我。而且我沒有東西吃。早上給我麵包，午餐是粥，晚上又是麵包；至於茶或湯，主人和女主人全自己吃了。我被放在走廊裡睡覺，當他們可憐的嬰兒哭的時候，我根本無法睡覺，只能搖著搖籃。親愛的祖父，施予我神聖的憐憫，帶我回家，回到村莊。這一切我再也無法忍受。我向您跪下，永遠為您祈禱，帶我離開這裡，否則我會死。」"]}, {"id": 6, "en": ["Vanka’s mouth worked, he rubbed his eyes with his black fist, and gave a sob.", "“I will powder your snuff for you,” he went on. “I will pray for you, and if I do anything you can thrash me like Sidor’s goat. And if you think I’ve no job, then I will beg the steward for Christ’s sake to let me clean his boots, or I’ll go for a shepherd-boy instead of Fedka. Dear grandfather, it is more than I can bear, it’s simply no life at all. I wanted to run away to the village, but I have no boots, and I am afraid of the frost. When I grow up big I will take care of you for this, and not let anyone annoy you, and when you die I will pray for the rest of your soul, just as for my mammy’s.”"], "zh": ["瓦卡的嘴巴動著，他用黑色的小拳頭揉著眼睛，抽泣著。", "「我會為您磨鼻煙，」他繼續說。「我會為您祈禱，如果我做錯了什麼，您可以像打西多爾的山羊那樣打我。如果您覺得我沒有工作，那我會為基督的緣故向管家請求讓我清理他的靴子，或者我會去當牧羊男孩，代替費德卡。親愛的祖父，這一切我再也無法忍受，根本不是生活。我想逃回村莊，但我沒有靴子，還怕凍傷。等我長大了，我會照顧您，不讓任何人打擾您，當您去世時，我會為您的靈魂祈禱，就像為我媽媽的靈魂一樣。」"]}, {"id": 7, "en": ["“Moscow is a big town. It’s all gentlemen’s houses, and there are lots of horses, but there are no sheep, and the dogs are not spiteful. The lads here don’t go out with the star, and they don’t let anyone go into the choir, and once I saw in a shop window fishing-hooks for sale, fitted ready with the line and for all sorts of fish, awfully good ones, there was even one hook that would hold a forty-pound sheat-fish. And I have seen shops where there are guns of all sorts, after the pattern of the master’s guns at home, so that I shouldn’t wonder if they are a hundred roubles each. . . . And in the butchers’ shops there are grouse and woodcocks and fish and hares, but the shopmen don’t say where they shoot them.”"], "zh": ["「莫斯科是一個大城市。這裡全是紳士的房子，馬很多，但沒有羊，狗也不惡毒。這裡的孩子們不會帶著星星出門，也不讓任何人進入合唱團，而我曾在商店的櫥窗裡看到賣魚鉤的，已經配好了線，還有各種魚的，特別好，甚至還有一個鉤子能夠掛住四十磅的鱸魚。我還見過商店裡有各種槍，樣式和主人家裡的槍一樣，所以我不會驚訝如果它們每把都要一百盧布……而在肉店裡有松雞、林鴿、魚和野兔，但店員們卻不說它們是在哪裡打到的。」"]}, {"id": 8, "en": ["“Dear grandfather, when they have the Christmas tree at the big house, get me a gilt walnut, and put it away in the green trunk. Ask the young lady Olga Ignatyevna, say it’s for Vanka.”", "Vanka gave a tremulous sigh, and again stared at the window. He remembered how his grandfather always went into the forest to get the Christmas tree for his master’s family, and took his grandson with him. It was a merry time! Grandfather made a noise in his throat, the forest crackled with the frost, and looking at them Vanka chortled too. Before chopping down the Christmas tree, grandfather would smoke a pipe, slowly take a pinch of snuff, and laugh at frozen Vanka. . . . The young fir trees, covered with hoar frost, stood motionless, waiting to see which of them was to die. Wherever one looked, a hare flew like an arrow over the snowdrifts . . . . Grandfather could not refrain from shouting: “Hold him, hold him . . . hold him! Ah, the bob-tailed devil!”"], "zh": ["「親愛的祖父，當他們在大房子裡擺聖誕樹時，給我一個金色的核桃，放在綠色的箱子裡。請問年輕的小姐奧爾加·伊格納季耶夫娜，說是給瓦卡的。」", "瓦卡發出一聲顫抖的嘆息，再次盯著窗戶。他想起祖父總是進森林為主人家找聖誕樹，還帶著他的孫子一起去。那是快樂的時光！祖父在喉嚨裡發出聲音，森林因為霜而發出噼啪聲，瓦卡看著他也咯咯笑。在砍下聖誕樹之前，祖父會抽煙斗，慢慢地吸一口鼻煙，然後笑著看著凍得發抖的瓦卡……那些被霜覆蓋的小松樹靜靜地矗立著，等待著哪一棵會被砍倒。無論往哪裡看，一隻野兔像箭一樣飛過雪堆……祖父忍不住大喊：「抓住他，抓住他……抓住他！啊，這隻短尾巴的惡魔！」"]}, {"id": 9, "en": ["When he had cut down the Christmas tree, grandfather used to drag it to the big house, and there set to work to decorate it. . . . The young lady, who was Vanka’s favourite, Olga Ignatyevna, was the busiest of all. When Vanka’s mother Pelageya was alive, and a servant in the big house, Olga Ignatyevna used to give him goodies, and having nothing better to do, taught him to read and write, to count up to a hundred, and even to dance a quadrille. When Pelageya died, Vanka had been transferred to the servants’ kitchen to be with his grandfather, and from the kitchen to the shoemaker’s in Moscow."], "zh": ["當他砍下聖誕樹後，祖父會把它拖到大房子，然後開始裝飾它……最忙碌的就是瓦卡最喜歡的年輕小姐奧爾加·伊格納季耶夫娜。當瓦卡的母親佩拉蓋亞還活著，並且在大房子裡做僕人的時候，奧爾加·伊格納季耶夫娜常常給他零食，因為沒有更好的事情可做，教他讀書寫字，數到一百，甚至還教他跳四手舞。當佩拉蓋亞去世後，瓦卡被調到僕人的廚房，和祖父在一起，然後從廚房轉到莫斯科的鞋匠那裡。"]}, {"id": 10, "en": ["“Do come, dear grandfather,” Vanka went on with his letter. “For Christ’s sake, I beg you, take me away. Have pity on an unhappy orphan like me; here everyone knocks me about, and I am fearfully hungry; I can’t tell you what misery it is, I am always crying. And the other day the master hit me on the head with a last, so that I fell down. My life is wretched, worse than any dog’s. . . . I send greetings to Alyona, one-eyed Yegorka, and the coachman, and don’t give my concertina to anyone. I remain, your grandson, Ivan Zhukov. Dear grandfather, do come.”"], "zh": ["「親愛的祖父，求您來吧，」瓦卡繼續寫他的信。「為了基督的緣故，我懇求您，帶我走。可憐一個像我這樣不幸的孤兒；在這裡每個人都打我，我非常餓；我無法告訴您有多痛苦，我總是在哭。前幾天，主人用鞋撐打了我的頭，讓我摔倒了。我的生活悲慘，甚至比狗的生活還要糟糕……我向阿廖娜、一隻獨眼的葉戈爾卡和馬車夫問好，並且不要把我的手風琴給任何人。我仍然是您的孫子，伊凡·朱科夫。親愛的祖父，求您來吧。」"]}, {"id": 11, "en": ["Vanka folded the sheet of writing-paper twice, and put it into an envelope he had bought the day before for a kopeck. . . . After thinking a little, he dipped the pen and wrote the address:", "To grandfather in the village.", "Then he scratched his head, thought a little, and added: Konstantin Makaritch. Glad that he had not been prevented from writing, he put on his cap and, without putting on his little greatcoat, ran out into the street as he was in his shirt. . . .", "The shopmen at the butcher’s, whom he had questioned the day before, told him that letters were put in post-boxes, and from the boxes were carried about all over the earth in mailcarts with drunken drivers and ringing bells. Vanka ran to the nearest post-box, and thrust the precious letter in the slit. . . .", "An hour later, lulled by sweet hopes, he was sound asleep. . . . He dreamed of the stove. On the stove was sitting his grandfather, swinging his bare legs, and reading the letter to the cooks. . . .", "By the stove was Eel, wagging his tail."], "zh": ["瓦卡將寫好的信紙對折兩次，放進他前一天花一個科比克買的信封裡……想了一會兒，他沾了沾筆，寫下地址：", "寄給村裡的祖父。", "然後他抓了抓頭，想了一會兒，補上了：康斯坦丁·馬卡里奇。高興的是他沒有被阻止寫信，他戴上帽子，沒有穿上小外套，就這樣跑到街上，穿著襯衫……", "他前一天在肉店詢問的店員告訴他，信件要放進郵筒，然後從郵筒裡用郵車運送到全世界，駕駛的都是喝醉的司機，還有響亮的鈴聲。瓦卡跑到最近的郵筒，將那封珍貴的信塞進了縫隙裡……", "一小時後，伴隨著甜美的希望，他沉沉入睡……他夢見爐子。爐子上坐著他的祖父，搖著光溜溜的腿，正在給廚師們讀信……", "在爐子旁邊，鰻魚搖著尾巴。"]}];

            });

                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;

                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');

                hasResult = true;
                const rows = sMatches.map(x => {

                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');

            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function closePopup() { document.getElementById('root-dict-popup').style.display = 'none'; }
        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); closePopup(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }
        function seekProgress(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleMp3Play() {
            const label = document.getElementById('mp3BtnLabel');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => label.textContent = " 暫停").catch(() => alert('未找到 MP3 檔案'));
            } else { audioPlayer.pause(); label.textContent = " 全文"; }
        }
        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;
            function speakNext() {
                if (sentenceIndex >= sentences.length) return;
                const utterance = new SpeechSynthesisUtterance(sentences[sentenceIndex].trim());
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onend = () => { sentenceIndex++; speakNext(); };
                utterance.onerror = () => { sentenceIndex++; speakNext(); };
                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
        updatePage();
    </script>
</body>
</html>
