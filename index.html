    <script>
        const pages = [{"id": 1, "top": "FOR the most wild, yet most homely narrative which I am about to pen, I neither expect nor solicit belief. Mad indeed would I be to expect it, in a case where my very senses reject their own evidence. Yet, mad am I not -- and very surely do I not dream. But to-morrow I die, and to-day I would unburthen my soul. My immediate purpose is to place before the world, plainly, succinctly, and without comment, a series of mere household events. In their consequences, these events have terrified -- have tortured -- have destroyed me. Yet I will not attempt to expound them. To me, they have presented little but Horror -- to many they will seem less terrible than barroques. Hereafter, perhaps, some intellect may be found which will reduce my phantasm to the common-place -- some intellect more calm, more logical, and far less excitable than my own, which will perceive, in the circumstances I detail with awe, nothing more than an ordinary succession of very natural causes and effects.", "top_lang": "en", "bottom": "對於我即將筆下寫出的這篇極其瘋狂卻又極其家常的故事，我既不期望、也不懇求別人相信。如果我居然期望別人相信，那我真是瘋了，因為連我的感官都在抗拒它們自己的證據。然而，我並沒有瘋——而且我非常確信我不是在做夢。但明天我就要死了，今天我想要卸下靈魂的重擔。我當前的目的，是向世人平實、簡明且不加評論地陳述一系列純粹的家庭事件。這些事件的後果，曾讓我恐懼、曾讓我受盡折磨、曾讓我毀滅。然而，我不打算試圖解釋它們。對我而言，它們除了帶來恐怖之外別無他物——對許多人來說，它們或許會顯得荒誕而不那麼可怕。將來，也許會出現某個頭腦，能夠將我的幻象化為平庸之談——某個比我更加冷靜、更具邏輯性且遠沒那麼容易激動的頭腦，它在我所詳述的那些令我敬畏的環境中，除了看到一連串非常自然的原因與結果的尋常演變之外，再也看不到別的東西。", "bottom_lang": "zh"}, {"id": 2, "top": "From my infancy I was noted for the docility and humanity of my disposition. My tenderness of heart was even so conspicuous as to make me the jest of my companions. I was especially fond of animals, and was indulged by my parents with a great variety of pets. With these I spent most of my time, and never was so happy as when feeding and caressing them. This peculiarity of character grew with my growth, and, in my manhood, I derived from it one of my principal sources of pleasure. To those who have cherished an affection for a faithful and sagacious dog, I need hardly be at the trouble of explaining the nature or the intensity of the gratification thus derivable. There is something in the unselfish and self-sacrificing love of a brute, which goes directly to the heart of him who has had frequent occasion to test the paltry friendship and gossamer fidelity of mere Man.", "top_lang": "en", "bottom": "從我幼年起，我就以溫順和仁慈的性情而聞名。我的心地柔軟，甚至顯眼到成為同伴們笑柄的地步。我特別喜愛動物，父母也縱容我養了各種各樣的寵物。我把大部分時間都花在它們身上，餵養它們、撫摸它們時是我最快樂的時刻。這種性格上的特點隨著我的成長而增長，到了成年，它成了我主要的快樂來源之一。對於那些曾對一隻忠誠而聰慧的狗懷有深厚感情的人，我幾乎不需要費力去解釋這種快樂的性質或強烈程度。動物那種無私且自我犧牲的愛中，有著某種直擊心靈深處的東西，而這種心靈曾無數次見證過區區人類那微不足道的友誼和蛛絲般的忠誠。", "bottom_lang": "zh"}, {"id": 3, "top": "I married early, and was happy to find in my wife a disposition not uncongenial with my own. Observing my partiality for domestic pets, she lost no opportunity of procuring those of the most agreeable kind. We had birds, gold-fish, a fine dog, rabbits, a small monkey, and a cat.", "top_lang": "en", "bottom": "我很早就結婚了，並且高興地發現妻子和我有着相契合的性情。她見我偏愛家養寵物，便抓住一切機會物色最討人喜歡的種類。我們養了鳥、金魚、一隻優秀的狗、兔子、一隻小猴子和一隻貓。", "bottom_lang": "zh"}, {"id": 4, "top": "This latter was a remarkably large and beautiful animal, entirely black, and sagacious to an astonishing degree. In speaking of his intelligence, my wife, who at heart was not a little tinctured with superstition, made frequent allusion to the ancient popular notion, which regarded all black cats as witches in disguise. Not that she was ever serious upon this point -- and I mention the matter at all for no better reason than that it happens, just now, to be remembered.", "top_lang": "en", "bottom": "這後者是一隻異常巨大而美麗的動物，全身漆黑，且聰明得令人驚訝。在談到他的聰明才智時，我的妻子內心其實或多或少帶有一點迷信色彩，她經常提到那個古老的民間觀念，即認為所有黑貓都是偽裝成動物的巫婆。倒不是說她對此曾有過認真看待——我提起這件事，也純粹是因為此時恰好想到了它。", "bottom_lang": "zh"}, {"id": 5, "top": "Pluto -- this was the cat's name -- was my favorite pet and playmate. I alone fed him, and he attended me wherever I went about the house. It was even with difficulty that I could prevent him from following me through the streets.", "top_lang": "en", "bottom": "布魯圖——這隻貓的名字——是我最寵愛的寵物和玩伴。只有我餵養他，而且他在屋子裡無論走到哪裡都跟著我。甚至連要阻止他在街上跟著我，我都得費一番勁。", "bottom_lang": "zh"}, {"id": 6, "top": "Our friendship lasted, in this manner, for several years, during which my general temperament and character -- through the instrumentality of the Fiend Intemperance -- had (I blush to confess it) experienced a radical alteration for the worse. I grew, day by day, more moody, more irritable, more regardless of the feelings of others. I suffered myself to use intemperate language to my wife. At length, I even offered her personal violence. My pets, of course, were made to feel the change in my disposition. I not only neglected, but ill-used them. For Pluto, however, I still retained sufficient regard to restrain me from maltreating him, as I made no scruple of maltreating the rabbits, the monkey, or even the dog, when by accident, or through affection, they came in my way. But my disease grew upon me -- for what disease is like Alcohol ! -- and at length even Pluto, who was now becoming old, and consequently somewhat peevish -- even Pluto began to experience the effects of my ill temper.", "top_lang": "en", "bottom": "我們的友誼就這樣持續了好幾年，在此期間，由於惡魔「酗酒」作祟，我的整體性格和品格——我羞於承認——經歷了徹底變壞的激變。我日漸變得喜怒無常、易怒，更加漠視他人的感受。我放任自己對妻子使用過激的言語。最後，我甚至對她動了粗。我的寵物們，自然也感受到了我性情的轉變。我不僅疏忽照顧它們，還虐待它們。然而，對於布魯圖，我仍然保留著足夠的敬意，使我不至於虐待他，而對於兔子、猴子甚至那隻狗，當它們偶爾或出於喜愛而擋了我的道時，我虐待起來卻毫無顧忌。但我的疾病在我身上加劇——世上還有什麼疾病能比得上酒精！——終於連漸漸老去、因而變得有些乖戾的布魯圖，也開始感受到我暴躁脾氣的影響。", "bottom_lang": "zh"}, {"id": 7, "top": "One night, returning home, much intoxicated, from one of my haunts about town, I fancied that the cat avoided my presence. I seized him; when, in his fright at my violence, he inflicted a slight wound upon my hand with his teeth. The fury of a demon instantly possessed me. I knew myself no longer. My  original soul seemed, at once, to take its flight from my body; and a more than fiendish malevolence, gin-nurtured, thrilled every fibre of my frame. I took from my waistcoat-pocket a pen-knife, opened it, grasped the poor beast by the throat, and deliberately cut one of its eyes from the socket ! I blush, I burn, I shudder, while I pen the damnable atrocity.", "top_lang": "en", "bottom": "一天夜裡，我從鎮上的某個常去之處醉醺醺地回到家，覺得那隻貓在躲避我的身影。我一把抓住他；而他因對我的暴力感到恐懼，用牙齒在我的手上咬出了一個輕微的傷口。惡魔的狂怒瞬間攫住了我。我不再認得自己。我原本的靈魂彷彿一下子飛離了軀體；一種比魔鬼還要惡毒、由琴酒滋養的戾氣，震顫著我身體的每一根纖維。我從馬甲口袋裡掏出一把小刀，將其打開，一把掐住這可憐畜生的喉嚨，殘忍地活生生挖出了它眼眶裡的一隻眼睛！當我寫下這滔天惡行時，我感到臉紅、灼熱、顫抖。", "bottom_lang": "zh"}, {"id": 8, "top": "When reason returned with the morning -- when I had slept off the fumes of the night's debauch -- I experienced a sentiment half of horror, half of remorse, for the crime of which I had been guilty; but it was, at best, a feeble and equivocal feeling, and the soul remained untouched. I again plunged into excess, and soon drowned in wine all memory of the deed.", "top_lang": "en", "bottom": "當理智在清晨隨之回歸——當我宿醉的酒氣消散後——對於自己犯下的罪行，我產生了一種半是恐懼、半是懊悔的情緒；但這充其量只是一種軟弱而含糊的情感，靈魂深處並未受到觸動。我再次沉溺於放縱，很快便在美酒中淹沒了對這項行為的所有記憶。", "bottom_lang": "zh"}, {"id": 9, "top": "In the meantime the cat slowly recovered. The socket of the lost eye presented, it is true, a frightful appearance, but he no longer appeared to suffer any pain. He went about the house as usual, but, as might be expected, fled in extreme terror at my approach. I had so much of my old heart left, as to be at first grieved by this evident dislike on the part of a creature which had once so loved me. But this feeling soon gave place to irritation. And then came, as if to my final and irrevocable overthrow, the spirit of PERVERSENESS. Of this spirit philosophy takes no account. Yet I am not more sure that my soul lives, than I am that perverseness is one of the primitive impulses of the human heart -- one of the indivisible primary faculties, or sentiments, which give direction to the character of Man. Who has not, a hundred times, found himself committing a vile or a silly action, for no other reason than because he knows he should not? Have we not a perpetual inclination, in the teeth of our best judgment, to violate that which is Law, merely because we understand it to be such? This spirit of perverseness, I say, came to my final overthrow. It was this unfathomable longing of the soul to vex itself -- to offer violence to its own nature -- to do wrong for the wrong's sake only -- that urged me to continue and finally to consummate the injury I had inflicted upon the unoffending brute. One morning, in cool blood, I slipped a noose about its neck and hung it to the limb of a tree; -- hung it with the tears streaming from my eyes, and with the bitterest remorse at my heart; -- hung it because I knew that it had loved me, and because I felt it had given me no reason of offence; -- hung it because I knew that in so doing I was committing a sin -- a deadly sin that would so jeopardize my immortal soul as to place it -- if such a thing were possible -- even beyond the reach of the infinite mercy of the Most Merciful and Most Terrible God.", "top_lang": "en", "bottom": "與此同時，貓漸漸康復了。失去眼睛的眼眶看起來確實十分可怕，但他似乎不再感到任何痛苦。他像往常一樣在家裡走動，但正如意料之中那樣，一接近我便會驚恐萬分地逃開。我的內心還殘存著些許舊日的善良，起初為一隻曾如此愛我的生物表現出這種明顯的厭惡而感到悲傷。但這種感覺很快就被惱怒所取代。接著，彷彿是為了將我推向最後且不可挽回的毀滅，反叛的靈魂——「反常之靈」降臨了。哲學從不把這種精神放在眼裡。然而，我深信不疑的是，反常是人類心靈的原始衝動之一——是賦予人類性格方向的不可分割的原生官能或情感之一。誰不曾無數次發現自己正在做一件卑鄙或愚蠢的事，而理由僅僅是因為他知道自己不該這樣做？我們難道不總是頂着最佳判斷的壓力，去違背那些我們明知是法律的東西，僅僅因為我們知道它是法律嗎？我說，正是這種反常的精神，促成了我最終的毀滅。正是這種靈魂深處不可探測的渴望——渴望折磨自己、渴望侵犯自身的本性、為了作惡而作惡——促使了我去繼續並最終完成我對那隻無辜畜生施加的傷害。一天早晨，趁着心平氣和之際，我將一個套索套在它的脖子上，把它掛在了一棵樹的枝幹上；——一邊掛着，一邊淚如雨下，內心充滿了最痛苦的悔恨；——把它掛起來，是因為我知道它曾愛過我，是因為我覺得它沒有給我任何值得冒犯的理由；——把它掛起來，是因為我知道這樣做是在犯罪——一種致命的罪過，它將危險地威脅我的不朽靈魂，甚至將其置於——如果真有這種可能的話——至仁至慈、至可畏之神的無限憐憫所不及的境地。", "bottom_lang": "zh"}, {"id": 10, "top": "On the night of the day on which this cruel deed was done, I was aroused from sleep by the cry of fire. The curtains of my bed were in flames. The whole house was blazing. It was with great difficulty that my wife, a servant, and myself, made our escape from the conflagration. The destruction was complete. My entire worldly wealth was swallowed up, and I resigned myself thenceforward to despair.", "top_lang": "en", "bottom": "就在這殘忍行徑發生的當天夜裡，我在睡夢中被火警驚醒。我床上的帷幕正在燃燒。整棟房子陷入一片火海。我和妻子、一名僕人費了好大勁才從大火中逃生。毀滅是徹底的。我全部的世俗財產都被吞噬了，此後我便向絕望俯首稱臣。", "bottom_lang": "zh"}, {"id": 11, "top": "I am above the weakness of seeking to establish a sequence of cause and effect, between the disaster and the atrocity. But I am detailing a chain of facts -- and wish not to leave even a possible link imperfect. On the day succeeding the fire, I visited the ruins. The walls, with one exception, had fallen in. This exception was found in a compartment wall, not very thick, which stood about the middle of the house, and against which had rested the head of my bed. The plastering had here, in great measure, resisted the action of the fire -- a fact which I attributed to its having been recently spread. About this wall a dense crowd were collected, and many persons seemed to be examining a particular portion of it with very minute and eager attention. The words \"strange!\" \"singular!\" and other similar expressions, excited my curiosity. I approached and saw, as if graven in bas relief upon the white surface, the figure of a gigantic cat. The impression was given with an accuracy truly marvellous. There was a rope about the animal's neck.", "top_lang": "en", "bottom": "我還沒有軟弱到要去尋求這場災難與那樁暴行之間的因果聯繫。但我正在詳述一連串的事實——並且不想留下哪怕一個可能的環節出現殘缺。火災過後的第二天，我造訪了廢墟。除了面牆壁外，其餘的牆壁都倒塌了。這例外是一堵位於房子正中、不太厚的隔間牆，我床頭曾緊靠着它。這裡的石膏在很大程度上抵禦了火勢的作用——這一事實我歸因於它是最近才粉刷上去的。這堵牆周圍聚集了密密麻麻的人群，許多人似乎正以極其細緻且急切的注意力審視着其中的某個特定部分。「奇怪！」「奇特！」等諸如此類的字眼激起了我的好奇心。我走近一看，只見一隻巨大的貓的形貌如浮雕般銘刻在白色的表面上。那印記逼真得簡直不可思議。動物的脖子上還套着一條繩子。", "bottom_lang": "zh"}, {"id": 12, "top": "When I first beheld this apparition -- for I could scarcely regard it as less -- my wonder and my terror were extreme. But at length reflection came to my aid. The cat, I remembered, had been hung in a garden adjacent to the house. Upon the alarm of fire, this garden had been immediately filled by the crowd -- by some one of whom the animal must have been cut from the tree and thrown, through an open window, into my chamber. This had probably been done with the view of arousing me from sleep. The falling of other walls had compressed the victim of my cruelty into the substance of the freshly-spread plaster; the lime of which, with the flames, and the ammonia from the carcass, had then accomplished the portraiture as I saw it.", "top_lang": "en", "bottom": "當我初次看到這個幻影——因為我幾乎無法將它視為別的東西——我的驚奇與恐懼達到了極點。但最終理智前來幫忙。我記起，那隻貓是在緊挨着房子的花園裡被吊死的。火警一響，這個花園立刻擠滿了人群——這隻動物一定是被其中某個人從樹上割下來，並從開着的窗戶扔進了我的臥室。這大概是為了把我從睡夢中驚醒。其他牆壁的倒塌，將我殘酷的受害者壓進了新塗抹的石膏之中；石灰、火焰以及屍體產生的氨氣，隨後便促成了我所看到的這幅肖像。", "bottom_lang": "zh"}, {"id": 13, "top": "Although I thus readily accounted to my reason, if not altogether to my conscience, for the startling fact just detailed, it did not the less fail to make a deep impression upon my fancy. For months I could not rid myself of the phantasm of the cat; and, during this period, there came back into my spirit a half-sentiment that seemed, but was not, remorse. I went so far as to regret the loss of the animal, and to look about me, among the vile haunts which I now habitually frequented, for another pet of the same species, and of somewhat similar appearance, with which to supply its place.", "top_lang": "en", "bottom": "儘管我這樣輕易地向我的理智——如果不是完全向良心——解釋了剛剛詳述的驚人事實，但它並未因此減少對我幻想的深刻影響。好幾個月我都無法擺脫貓的幻影；在此期間，我心中重新湧現出一種半真半假、看似悔恨卻並非真正悔恨的情感。我甚至開始後悔失去了那隻動物，並在我現在經常出沒的那些卑劣場所周圍尋找另一隻品種相同、外貌稍有些相似的寵物來替代它。", "bottom_lang": "zh"}, {"id": 14, "top": "One night as I sat, half stupified, in a den of more than infamy, my attention was suddenly drawn to some black object, reposing upon the head of one of the immense hogsheads of Gin, or of Rum, which constituted the chief furniture of the apartment. I had been looking steadily at the top of this hogshead for some minutes, and what now caused me surprise was the fact that I had not sooner perceived the object thereupon. I approached it, and touched it with my hand. It was a black cat -- a very large one -- fully as large as Pluto, and closely resembling him in every respect but one. Pluto had not a white hair upon any portion of his body; but this cat had a large, although indefinite splotch of white, covering nearly the whole region of the breast.", "top_lang": "en", "bottom": "一天夜裡，我半醉半醒地坐在一個無比藏垢納污的酒窟里，我的注意力突然被某個黑色的東西吸引了，它正歇息在一個巨大的琴酒或蘭姆酒桶的頂部，而這些酒桶構成了這個房間的主要擺設。我已經盯着這個酒桶頂部好幾分鐘了，現在讓我感到驚訝的是，我竟然沒有更早發現那個東西。我走近它，用手觸摸了它。那是一隻黑貓——一隻非常大的貓——完全和布魯圖一樣大，並且在各個方面都與他極其相似，除了有一點不同。布魯圖身上沒有一根白毛，但這隻貓身上有一塊很大、雖然輪廓不甚分明的白斑，幾乎覆蓋了它的整個胸部。", "bottom_lang": "zh"}, {"id": 15, "top": "Upon my touching him, he immediately arose, purred loudly, rubbed against my hand, and appeared delighted with my notice. This, then, was the very creature of which I was in search. I at once offered to purchase it of the landlord; but this person made no claim to it -- knew nothing of it -- had never seen it before.", "top_lang": "en", "bottom": "在我觸摸它時，它立刻站了起來，大聲呼嚕着，在我的手上磨蹭，似乎對我的關注感到非常高興。這，正是我要找的生物。我當即提出要從店主那裡買下它；但這人對它毫無所知——從未見過它。", "bottom_lang": "zh"}, {"id": 16, "top": "I continued my caresses, and, when I prepared to go home, the animal evinced a disposition to accompany me. I permitted it to do so; occasionally stooping and patting it as I proceeded. When it reached the house it domesticated itself at once, and became immediately a great favorite with my wife.", "top_lang": "en", "bottom": "我繼續撫摸着它，當我準備回家時，這動物表現出了同行的意願。我允許它這樣做；一路上偶爾停下來彎腰拍拍它。到了家裡，它立刻適應了環境，並很快成了我妻子的最愛。", "bottom_lang": "zh"}, {"id": 17, "top": "For my own part, I soon found a dislike to it arising within me. This was just the reverse of what I had anticipated; but -- I know not how or why it was -- its evident fondness for myself rather disgusted and annoyed. By slow degrees, these feelings of disgust and annoyance rose into the bitterness of hatred. I avoided the creature; a certain sense of shame, and the remembrance of my former deed of cruelty, preventing me from physically abusing it. I did not, for some weeks, strike, or otherwise violently ill use it; but gradually -- very gradually -- I came to look upon it with unutterable loathing, and to flee silently from its odious presence, as from the breath of a pestilence.", "top_lang": "en", "bottom": "至於我本人，我很快發現自己對它產生了一種厭惡感。這正與我的預期相反——但我不知道是如何或為什麼——它對我明顯的喜愛反而讓我感到噁心和煩惱。漸漸地，這種噁心與煩惱的感覺上升成了仇恨的苦澀。我迴避着這個生物；由於某種羞恥感以及對我先前殘忍行徑的回憶，使我沒有對它實施肉體上的虐待。有好幾個星期，我沒有打它，也沒有對它進行其他猛烈的虐待；但漸漸地——非常漸漸地——我開始用一種無法言喻的厭惡來看待它，並像躲避瘟疫的氣息一樣，默默地逃避它那可憎的身影。", "bottom_lang": "zh"}, {"id": 18, "top": "What added, no doubt, to my hatred of the beast, was the discovery, on the morning after I brought it home, that, like Pluto, it also had been deprived of one of its eyes. This circumstance, however, only endeared it to my wife, who, as I have already said, possessed, in a high degree, that humanity of feeling which had once been my distinguishing trait, and the source of many of my simplest and purest pleasures.", "top_lang": "en", "bottom": "毫無疑問，加深我對這隻野獸仇恨的，是我將它帶回家後的第二天早晨發現的：和布魯圖一樣，它也失去了一隻眼睛。然而，這一情況只讓它更加贏得了我妻子的喜愛，正如我已經說過的，她高度具備那種曾是我的顯著特點、且曾是我許多簡單純潔快樂之源的仁慈情感。", "bottom_lang": "zh"}, {"id": 19, "top": "With my aversion to this cat, however, its partiality for myself seemed to increase. It followed my footsteps with a pertinacity which it would be difficult to make the reader comprehend. Whenever I sat, it would crouch beneath my chair, or spring upon my knees, covering me with its loathsome caresses. If I arose to walk it would get between my feet and thus nearly throw me down, or, fastening its long and sharp claws in my dress, clamber, in this manner, to my breast. At such times, although I longed to destroy it with a blow, I was yet withheld from so doing, partly by a memory of my former crime, but chiefly -- let me confess it at once -- by absolute dread of the beast.", "top_lang": "en", "bottom": "然而，隨着我對這隻貓的厭惡增加，它對我的偏愛似乎也在增加。它以一種極其頑強的態度跟隨我的腳步，這讓讀者很難理解。每當我坐下時，它就會蜷伏在我的椅子底下，或者跳上我的膝蓋，用它那令人作嘔的撫摸包裹着我。如果我起身走路，它就會卡在我的腳縫裡，從而差點把我絆倒；或者將它長而尖銳的爪子死死抓進我的衣服里，以此攀爬到我的胸口。在那些時候，儘管我渴望用一擊來消滅它，但我還是忍住了沒這麼做，一部分是由於對我先前罪行的記憶，但主要地——讓我直言不諱吧——是由於對這隻野獸的絕對恐懼。", "bottom_lang": "zh"}, {"id": 20, "top": "This dread was not exactly a dread of physical evil -- and yet I should be at a loss how otherwise to define it. I am almost ashamed to own -- yes, even in this felon's cell, I am almost ashamed to own -- that the terror and horror with which the animal inspired me, had been heightened by one of the merest chimæras it would be possible to conceive. My wife had called my attention, more than once, to the character of the mark of white hair, of which I have spoken, and which constituted the sole visible difference between the strange beast and the one I had destroyed. The reader will remember that this mark, although large, had been originally very indefinite; but, by slow degrees -- degrees nearly imperceptible, and which for a long time my Reason struggled to reject as fanciful -- it had, at length, assumed a rigorous distinctness of outline. It was now the representation of an object that I shudder to name -- and for this, above all, I loathed, and dreaded, and would have rid myself of the monster had I dared -- it was now, I say, the image of a hideous -- of a ghastly thing -- of the GALLOWS ! -- oh, mournful and terrible engine of Horror and of Crime -- of Agony and of Death !", "top_lang": "en", "bottom": "這種恐懼並非完全是對肉體傷害的恐懼——然而我若要以其他方式來定義它，倒真有些不知所措。我幾乎羞於承認——是的，即使在這個死囚牢裡，我幾乎也羞於承認——這種動物激發給我的恐懼與驚駭，已經被你能想像得到的、最純粹的虛妄幻想之一加劇了。我的妻子曾不止一次地提醒我注意我所說的那撮白毛的特徵，這正是那隻奇怪的野獸與我曾摧毀的那隻唯一的肉眼可見區別。讀者會記得，這個標記雖然很大，但最初非常模糊；然而，經過緩慢的、幾乎難以察覺的漸變——一段時間以來，我的理智一直在掙扎着將其斥為幻覺——它最終呈現出了嚴整清晰的輪廓。它現在描繪的是一個我羞於啟齒的對象——也正因於此，我最為痛恨它、恐懼它，如果我敢的話，我本該早已擺脫這個怪物——它現在，我說，是一個猙獰可怖的東西的形象——絞架！——噢，悲傷而可怕的恐懼與罪惡、痛苦與死亡的機器！", "bottom_lang": "zh"}, {"id": 21, "top": "And now was I indeed wretched beyond the wretchedness of mere Humanity. And a brute beast -- whose fellow I had contemptuously destroyed -- a brute beast to work out for me -- for me a man, fashioned in the image of the High God -- so much of insufferable wo! Alas! neither by day nor by night knew I the blessing of Rest any more! During the former the creature left me no moment alone; and, in the latter, I started, hourly, from dreams of unutterable fear, to find the hot breath of the thing upon my face, and its vast weight -- an incarnate Night-Mare that I had no power to shake off -- incumbent eternally upon my heart !", "top_lang": "en", "bottom": "而此時的我，確實陷入了超越凡塵俗世悲慘境地的絕望。而一隻野獸——我曾輕蔑地毀滅了它的同類——一隻野獸竟然為我——為我這個按高高神明形象塑造的人——帶來了如此無法承受的痛苦！唉！無論是白天還是黑夜，我都再也不知道安息的恩賜了！白天，這生物不讓我有一刻獨處；夜晚，我每小時都會從無法言喻的恐懼夢境中驚醒，發現這東西溫熱的氣息噴在我的臉上，它那巨大的重量——一個我無力甩脫的、有血有肉的夢魘——永恆地壓在我的心頭！", "bottom_lang": "zh"}, {"id": 22, "top": "Beneath the pressure of torments such as these, the feeble remnant of the good within me succumbed. Evil thoughts became my sole intimates -- the darkest and most evil of thoughts. The moodiness of my usual temper increased to hatred of all things and of all mankind; while, from the sudden, frequent, and ungovernable outbursts of a fury to which I now blindly abandoned myself, my uncomplaining wife, alas! was the most usual and the most patient of sufferers.", "top_lang": "en", "bottom": "在諸如此類折磨的壓力下，我內心善良的微弱殘餘屈服了。邪惡的思想成了我唯一的伴侶——最黑暗、最邪惡的思想。我平素暴躁的性情升級成了對萬物和全人類的仇恨；而對於那種我現在盲目放縱自己、既突然又頻繁且無法控制的狂怒，我那從不抱怨的妻子，唉，成了最常遭受且最為耐心的受害者。", "bottom_lang": "zh"}, {"id": 23, "top": "One day she accompanied me, upon some household errand, into the cellar of the old building which our poverty compelled us to inhabit. The cat followed me down the steep stairs, and, nearly throwing me headlong, exasperated me to madness. Uplifting an axe, and forgetting, in my wrath, the childish dread which had hitherto stayed my hand, I aimed a blow at the animal which, of course, would have proved instantly fatal had it descended as I wished. But this blow was arrested by the hand of my wife. Goaded, by the interference, into a rage more than demoniacal, I withdrew my arm from her grasp and buried the axe in her brain. She fell dead upon the spot, without a groan.", "top_lang": "en", "bottom": "一天，她陪着我因貧困而不得不居住的那棟舊建築的地下室去辦理某項家務雜事。那貓順着陡峭的樓梯跟了下來，差點把我絆了個狗吃屎，這激怒得我近乎發瘋。我舉起一把斧頭，在憤怒中忘記了至今一直在阻止我動手的孩子氣恐懼，朝着那隻動物猛劈下去，如果它如我所願地落下，那當然會是致命的一擊。但這一擊被我妻子的手給攔住了。這干預激起了我近乎魔鬼般的狂怒，我從她的握力中抽回手臂，將斧頭深深砍進了她的腦袋。她哼也沒哼一聲，當場倒地身亡。", "bottom_lang": "zh"}, {"id": 24, "top": "This hideous murder accomplished, I set myself forthwith, and with entire deliberation, to the task of concealing the body. I knew that I could not remove it from the house, either by day or by night, without the risk of being observed by the neighbors. Many projects entered my mind. At one period I thought of cutting the corpse into minute fragments, and destroying them by fire. At another, I resolved to dig a grave for it in the floor of the cellar. Again, I deliberated about casting it in the well in the yard -- about packing it in a box, as if merchandize, with the usual arrangements, and so getting a porter to take it from the house. Finally I hit upon what I considered a far better expedient than either of these. I determined to wall it up in the cellar -- as the monks of the middle ages are recorded to have walled up their victims.", "top_lang": "en", "bottom": "這場可怕的謀殺完成後，我立刻且全神貫注地投入到掩蓋屍體的任務中。我知道無論白天還是黑夜，我都不可能在不冒着被鄰居發現的風險下將它移出房屋。許多計劃湧入我的腦海。有一段時間，我考慮將屍體切成細小的碎片，然後用火焚毀。另一時刻，我決定在地下室的地板上為它挖一個墳墓。接着，我琢磨着把它扔進院子裡的井裡——或者把它像普通商品一樣裝進箱子裡，然後找個搬運工把它從家裡運走。最後，我想出了一個自認為比上述任何辦法都好得多的權宜之計。我決定把它砌在地下室的牆裡——就像歷史記載中中世紀的僧侶們將他們的受害者築在牆裡一樣。", "bottom_lang": "zh"}, {"id": 25, "top": "For a purpose such as this the cellar was well adapted. Its walls were loosely constructed, and had lately been plastered throughout with a rough plaster, which the dampness of the atmosphere had prevented from hardening. Moreover, in one of the walls was a projection, caused by a false chimney, or fireplace, that had been filled up, and made to resemble the rest of the cellar. I made no doubt that I could readily displace the bricks at this point, insert the corpse, and wall the whole up as before, so that no eye could detect any thing suspicious.", "top_lang": "en", "bottom": "為了這樣一個目的，地下室非常合適。它的牆壁結構鬆散，最近剛剛用粗糙的石灰粉刷過，大氣的潮濕使它尚未完全硬化。此外，其中一面牆上有一個凸起，是由一個被填死並修得跟地下室其他部分一樣的假煙囪或壁爐造成的。我毫不懷疑我能輕易地撬開這個地方的磚塊，放入屍體，然後像原來那樣把整面牆重新砌好，這樣任何人的眼睛都無法察覺任何可疑之處。", "bottom_lang": "zh"}, {"id": 26, "top": "And in this calculation I was not deceived. By means of a crow-bar I easily dislodged the bricks, and, having carefully deposited the body against the inner wall, I propped it in that position, while, with little trouble, I re-laid the whole structure as it originally stood. Having procured mortar, sand, and hair, with every possible precaution, I prepared a plaster which could not be distinguished from the old, and with this I very carefully went over the new brick-work. When I had finished, I felt satisfied that all was right. The wall did not present the slightest appearance of having been disturbed. The rubbish on the floor was picked up with the minutest care. I looked around triumphantly, and said to myself -- \"Here at least, then, my labor has not been in vain.\"", "top_lang": "en", "bottom": "我的計算沒有出錯。藉助一根撬棍，我輕易地移開了磚塊，將屍體小心翼翼地緊貼着內牆放置好，並將它支撐在那個位置，然後我不費吹灰之力就將整個結構按原樣重新砌了回去。我弄來了灰泥、沙子和動物毛髮，做好了所有可能的防範準備，調配出了一種與舊牆毫無二致的粉刷灰泥，並用它非常小心地修補了新砌的磚牆。當我完工時，我感到十分滿意，一切都天衣無縫。牆壁沒有絲毫被動過痕跡。地板上的碎屑被極其小心地清理乾淨。我得意洋洋地環顧四周，對自己說：「至少在這裡，我的勞動沒有白費。」", "bottom_lang": "zh"}, {"id": 27, "top": "My next step was to look for the beast which had been the cause of so much wretchedness; for I had, at length, firmly resolved to put it to death. Had I been able to meet with it, at the moment, there could have been no doubt of its fate; but it appeared that the crafty animal had been alarmed at the violence of my previous anger, and forebore to present itself in my present mood. It is impossible to describe, or to imagine, the deep, the blissful sense of relief which the absence of the detested creature occasioned in my bosom. It did not make its appearance during the night -- and thus for one night at least, since its introduction into the house, I soundly and tranquilly slept; aye, slept even with the burden of murder upon my soul!", "top_lang": "en", "bottom": "我的下一步是尋找那隻曾製造了如此多苦難的野獸；因為我終於下定決心要置它於死地。如果當時能遇到它，它的命運絕對難逃一死；但這隻狡猾的動物似乎被我先前發怒時的暴力嚇壞了，在我目前這種情緒下，它刻意忍耐着沒有露面。那種由討厭的生物不在而帶來的深切、幸福的解脫感，是無法用言語形容或想像的。它整個晚上都沒有出現——就這樣，自它進入這棟房子以來，至少在這一夜裡，我睡得深沉而安寧；是的，甚至帶着背負謀殺的靈魂入睡！", "bottom_lang": "zh"}, {"id": 28, "top": "The second and the third day passed, and still my tormentor came not. Once again I breathed as a freeman. The monster, in terror, had fled the premises forever! I should behold it no more! My happiness was supreme! The guilt of my dark deed disturbed me but little. Some few inquiries had been made, but these had been readily answered. Even a search had been instituted -- but of course nothing was to be discovered. I looked upon my future felicity as secured.", "top_lang": "en", "bottom": "第二、第三天過去了，我的折磨者依然沒有出現。我再次像個自由人一樣呼吸。那個怪物在恐懼中永遠逃離了這處宅邸！我再也見不到它了！我的幸福達到了頂點！我黑暗行徑的罪惡感幾乎沒有打擾到我。雖有一些查詢，但都輕而易舉地應付過去了。甚至還展開了一次搜查——但當然什麼也沒發現。我認為我未來的幸福已然有了保障。", "bottom_lang": "zh"}, {"id": 29, "top": "Upon the fourth day of the assassination, a party of the police came, very unexpectedly, into the house, and proceeded again to make rigorous investigation of the premises. Secure, however, in the inscrutability of my place of concealment, I felt no embarrassment whatever. The officers bade me accompany them in their search. They left no nook or corner unexplored. At length, for the third or fourth time, they descended into the cellar. I quivered not in a muscle. My heart beat calmly as that of one who slumbers in innocence. I walked the cellar from end to end. I folded my arms upon my bosom, and roamed easily to and fro. The police were thoroughly satisfied and prepared to depart. The glee at my heart was too strong to be restrained. I burned to say if but one word, by way of triumph, and to render doubly sure their assurance of my guiltlessness.", "top_lang": "en", "bottom": "謀殺案發生的第四天，一隊警察非常突然地闖進屋裡，再次對這處宅邸進行了嚴格的搜查。然而，憑藉着藏匿地點的不可探測性，我感到毫無慌亂。警官們讓我和他們一起搜查。他們沒有放過任何一個角落或縫隙。終於，在第三次或第四次的時候，他們下到了地下室。我的肌肉沒有一處顫抖。我的心跳平靜得就像一個在純真中沉睡的人。我從這頭走到那頭地巡視着地下室。我將雙臂抱在胸前，從容不迫地踱來踱去。警察們感到十分滿意，準備離開。我心中的狂喜簡直無法抑制。我渴望說上一句話，哪怕只是一句，權作勝利的宣告，並雙倍確保他們對我清白無辜的確信。", "bottom_lang": "zh"}, {"id": 30, "top": "\"Gentlemen,\" I said at last, as the party ascended the steps, \"I delight to have allayed your suspicions. I wish you all health, and a little more courtesy. By the bye, gentlemen, this -- this is a very well constructed house.\" (In the rabid desire to say something easily, I scarcely knew what I uttered at all.) -- \"I may say an excellently well constructed house. These walls -- are you going, gentlemen? -- these walls are solidly put together;\" and here, through the mere phrenzy of bravado, I rapped heavily, with a cane which I held in my hand, upon that very portion of the brick-work behind which stood the corpse of the wife of my bosom.", "top_lang": "en", "bottom": "「紳士們，」當眾人登上台階時，我終於開口道，「我很高興能消除你們的疑心。祝大家身體健康，還有，多一點禮節。順便說一句，紳士們，這——這是一棟建造得非常好的房子。」（由於一種急於輕鬆說點什麼的瘋狂心理，我幾乎不知道自己在胡言亂語些什麼。）——「我甚至可以說是一棟建造得極其優秀的房子。這些牆壁——你們要走了嗎，紳士們？——這些牆壁結構十分堅固；」緊接着，出於一種純粹的虛張聲勢的狂亂，我用手裡拿着的手杖，狠狠地敲擊着那段藏着我心愛妻子屍體的磚牆。", "bottom_lang": "zh"}, {"id": 31, "top": "But may God shield and deliver me from the fangs of the Arch-Fiend ! No sooner had the reverberation of my blows sunk into silence, than I was answered by a voice from within the tomb! -- by a cry, at first muffled and broken, like the sobbing of a child, and then quickly swelling into one long, loud, and continuous scream, utterly anomalous and inhuman -- a howl -- a wailing shriek, half of horror and half of triumph, such as might have arisen only out of hell, conjointly from the throats of the dammed in their agony and of the demons that exult in the damnation.", "top_lang": "en", "bottom": "然而，願上帝庇護並將我從大惡魔的爪牙中拯救出來！我的敲擊聲回響剛落入沉寂，墓穴內部就傳來了一個聲音回應我！——那是一聲起初沉悶而破碎、像小孩哭泣般的呼喊，隨後迅速膨脹為一聲漫長、響亮而連續的尖叫，完全是反常且非人的——一聲哀號——一聲尖銳的哭喊，半是恐懼半是狂喜，這種聲音仿佛只能從地獄深處傳來，由受難者在痛苦中的喉嚨與那些因詛咒而歡欣鼓舞的惡魔們一同嘶吼出來。", "bottom_lang": "zh"}, {"id": 32, "top": "Of my own thoughts it is folly to speak. Swooning, I staggered to the opposite wall. For one instant the party upon the stairs remained motionless, through extremity of terror and of awe. In the next, a dozen stout arms were toiling at the wall. It fell bodily. The corpse, already greatly decayed and clotted with gore, stood erect before the eyes of the spectators. Upon its head, with red extended mouth and solitary eye of fire, sat the hideous beast whose craft had seduced me into murder, and whose informing voice had consigned me to the hangman. I had walled the monster up within the tomb!", "top_lang": "en", "bottom": "談論我自己的想法是愚蠢的。我暈厥着踉蹌退到對面的牆邊。樓梯上的人群因極度的恐懼和敬畏，呆立了一瞬間。緊接着，一打強壯有力的胳膊開始對牆壁進行砸拆。牆壁轟然倒塌。那具已經嚴重腐爛並凝結着血塊的屍體，直挺挺地站在旁觀者的眼前。在它的頭頂上，張着血紅的嘴巴和僅剩的一隻噴火眼睛，蹲坐着那隻用狡猾誘騙我走向謀殺、又用通告的聲音將我送上絞刑架的可憎野獸！我竟然把這怪物活生生地砌在了墓穴之中！", "bottom_lang": "zh"}];
        let currentIndex = 0;
        let currentFontScale = parseFloat(localStorage.getItem('bilingual_font_scale')) || 1.0;

        document.documentElement.style.setProperty('--font-scale', currentFontScale);

        function changeFontSize(delta) {
            currentFontScale = Math.min(Math.max(0.7, currentFontScale + delta), 1.8);
            document.documentElement.style.setProperty('--font-scale', currentFontScale);
            localStorage.setItem('bilingual_font_scale', currentFontScale);
        }

        function updatePage() {
            if (!pages || pages.length === 0) return;

            const page = pages[currentIndex];

            const topEl = document.getElementById('top-text');
            const bottomEl = document.getElementById('bottom-text');

            topEl.innerText = page.top;
            bottomEl.innerText = page.bottom;

            topEl.className = 'top-text ' + (page.top_lang === 'zh' ? 'lang-zh' : 'lang-en');
            bottomEl.className = 'bottom-text ' + (page.bottom_lang === 'zh' ? 'lang-zh' : 'lang-en');

            document.getElementById('page-info').innerText = `${currentIndex + 1} / ${pages.length}`;

            const progressPercent = ((currentIndex + 1) / pages.length) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === pages.length - 1;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function nextPage() {
            if (currentIndex < pages.length - 1) {
                currentIndex++;
                updatePage();
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                updatePage();
            }
        }

        function seekProgress(e) {
            const container = e.currentTarget;
            const rect = container.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const percentage = clickX / width;
            currentIndex = Math.floor(percentage * pages.length);
            updatePage();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // 朗讀：包含逗點/分號拆分，徹底解決長句被瀏覽器超時中斷問題
        function speakCurrent() {
            if (!('speechSynthesis' in window)) {
                alert('您的瀏覽器不支援語音朗讀');
                return;
            }

            window.speechSynthesis.cancel();

            const page = pages[currentIndex];
            let textToSpeak = null;
            if (page.top_lang === 'en') {
                textToSpeak = page.top;
            } else if (page.bottom_lang === 'en') {
                textToSpeak = page.bottom;
            }

            if (!textToSpeak) {
                alert('這一段沒有偵測到英文內容可供朗讀');
                return;
            }

            // 💡 關鍵修復：加入逗號 `,`、分號 `;`、破折號 `--` 一併切分，朗讀更加順暢且絕不超時！
            const sentences = textToSpeak.match(/[^.!?,;—-]+[.!?,;—-]*/g) || [textToSpeak];
            let sentenceIndex = 0;

            function speakNextSentence() {
                if (sentenceIndex >= sentences.length) return;

                const sentenceText = sentences[sentenceIndex].trim();
                if (!sentenceText) {
                    sentenceIndex++;
                    speakNextSentence();
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(sentenceText);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;

                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(v =>
                    v.lang.includes('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha'))
                ) || voices.find(v => v.lang.startsWith('en'));

                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                utterance.onend = () => {
                    sentenceIndex++;
                    speakNextSentence();
                };

                utterance.onerror = () => {
                    sentenceIndex++;
                    speakNextSentence();
                };

                window.speechSynthesis.speak(utterance);
            }

            speakNextSentence();
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                prevPage();
            }
        });

        updatePage();
