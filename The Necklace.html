<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>莫泊桑 《項鍊》</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #2b2d42;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --accent-color: #3182ce;
            --border-color: #e2e8f0;
            --font-scale: 1;
        }

        body.dark-mode {
            --bg-color: #1a202c;
            --text-main: #edf2f7;
            --text-sub: #cbd5e0;
            --card-bg: #2d3748;
            --accent-color: #63b3ed;
            --border-color: #4a5568;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column;
            font-family: Georgia, "Times New Roman", "標楷體", serif;
        }

        header {
            height: 65px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color); flex-shrink: 0; z-index: 20;
            user-select: none;
        }

        .title {
            font-size: 1.2rem; font-weight: bold; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
        }

        .controls { display: flex; align-items: center; gap: 5px; }

        .controls button {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.88rem;
        }

        main { flex: 1; display: flex; position: relative; overflow-y: auto; padding: 15px 0; }

        .click-zone { position: absolute; top: 0; bottom: 0; width: 8%; z-index: 5; cursor: pointer; user-select: none; }
        .click-left { left: 0; } .click-right { right: 0; }

        .card-container { width: 95%; max-width: 1200px; margin: auto; padding: 0 10px; z-index: 10; }

        .paragraph-box {
            background-color: var(--card-bg); padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
        }

        .en-p {
            font-size: calc(1.18rem * var(--font-scale)); line-height: 1.65;
            font-family: Georgia, serif; color: var(--text-main); margin-bottom: 16px;
            user-select: text !important; cursor: text;
        }

        .zh-p {
            font-size: calc(1.25rem * var(--font-scale)); line-height: 1.85;
            font-family: "標楷體", serif; color: var(--text-sub);
            margin: 0 0 24px 0; padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            user-select: text !important;
        }

        /* 字根分析彈窗 */
        #root-dict-popup {
            display: none; position: fixed; bottom: 80px; left: 30px; width: 340px; max-height: 420px;
            background-color: var(--card-bg); border: 2px solid var(--accent-color);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999;
            padding: 16px; overflow-y: auto; font-family: -apple-system, sans-serif;
        }

        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .popup-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); }
        .close-btn { cursor: pointer; font-weight: bold; font-size: 1.2rem; color: var(--text-sub); }
        .tag-group { margin-bottom: 10px; }
        .tag-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
        .tag-item { background-color: var(--bg-color); border-left: 3px solid var(--accent-color); padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 0.9rem; }
        .suffix-badge { display: inline-block; background-color: var(--accent-color); color: white; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 4px; }
        .no-result { font-size: 0.85rem; color: var(--text-sub); line-height: 1.6; padding: 6px 2px 10px 2px; }
        .etymo-link { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); text-align: center; }
        .etymo-link a { color: var(--accent-color); text-decoration: none; font-size: 0.88rem; font-weight: bold; }
        .etymo-link a:hover { text-decoration: underline; }

        footer {
            height: 65px; padding: 8px 25px; background-color: var(--card-bg);
            border-top: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; gap: 6px; flex-shrink: 0; z-index: 20; user-select: none;
        }
        .progress-bar-container { width: 100%; background-color: var(--border-color); height: 6px; border-radius: 3px; overflow: hidden; cursor: pointer; }
        .progress-bar { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.2s; }
        .footer-controls { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-sub); }
        .nav-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 22px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        @media (max-width: 600px) {
            #root-dict-popup { left: 5%; right: 5%; width: 90%; bottom: 75px; }
            /* 手機螢幕窄，按鈕文字容易換行、把整個 header 撐成兩三行，
               所以只保留圖示、隱藏文字說明；電腦寬螢幕不受影響，文字照常顯示。 */
            .btn-label { display: none; }
            .controls button { padding: 6px 9px; }
        }
    </style>
</head>
<body>

    <script>
        const pages = [{"id": 1, "blocks": [{"lang": "en", "text": "The Necklace"}, {"lang": "zh", "text": "項鍊"}, {"lang": "en", "text": "She was one of those pretty and charming girls who are sometimes, as if by a mistake of destiny, born in a family of clerks. She had no dowry, no expectations, no means of being known, understood, loved, wedded, by any rich and distinguished man; and she let herself be married to a little clerk at the Ministry of Public Instruction."}, {"lang": "zh", "text": "她是那種美麗而迷人的女孩，偶爾因命運的錯誤而出生在一個文員家庭。她沒有嫁妝，沒有期望，沒有任何機會被富有和顯赫的男人認識、理解、愛慕和娶回家；於是她隨便嫁給了一位在公共教育部工作的文員。"}, {"lang": "en", "text": "She dressed plainly because she could not dress well, but she was as unhappy as though she had really fallen from her proper station; since with women there is neither caste nor rank; and beauty, grace, and charm act instead of family and birth. Natural fineness, instinct for what is elegant, suppleness of wit, are the sole hierarchy, and make from women of the people the equals of the very greatest ladies."}, {"lang": "zh", "text": "她的穿著樸素，因為她無法穿得好，但她的心情卻像真的從她應有的地位墮落了一樣不快；因為對於女性來說，並不存在種姓或地位；而美貌、優雅和魅力則代替了家庭和出身。天生的優雅、對於優雅事物的直覺、機智的靈活性，才是唯一的階級，讓平民女性成為最偉大貴婦的平等者。"}], "en": ["The Necklace", "She was one of those pretty and charming girls who are sometimes, as if by a mistake of destiny, born in a family of clerks. She had no dowry, no expectations, no means of being known, understood, loved, wedded, by any rich and distinguished man; and she let herself be married to a little clerk at the Ministry of Public Instruction.", "She dressed plainly because she could not dress well, but she was as unhappy as though she had really fallen from her proper station; since with women there is neither caste nor rank; and beauty, grace, and charm act instead of family and birth. Natural fineness, instinct for what is elegant, suppleness of wit, are the sole hierarchy, and make from women of the people the equals of the very greatest ladies."], "zh": ["項鍊", "她是那種美麗而迷人的女孩，偶爾因命運的錯誤而出生在一個文員家庭。她沒有嫁妝，沒有期望，沒有任何機會被富有和顯赫的男人認識、理解、愛慕和娶回家；於是她隨便嫁給了一位在公共教育部工作的文員。", "她的穿著樸素，因為她無法穿得好，但她的心情卻像真的從她應有的地位墮落了一樣不快；因為對於女性來說，並不存在種姓或地位；而美貌、優雅和魅力則代替了家庭和出身。天生的優雅、對於優雅事物的直覺、機智的靈活性，才是唯一的階級，讓平民女性成為最偉大貴婦的平等者。"]}, {"id": 2, "blocks": [{"lang": "en", "text": "She suffered ceaselessly, feeling herself born for all the delicacies and all the luxuries. She suffered from the poverty of her dwelling, from the wretched look of the walls, from the worn-out chairs, from the ugliness of the curtains. All those things, of which another woman of her rank would never even have been conscious, tortured her and made her angry. The sight of the little Breton peasant who did her humble housework aroused in her regrets which were despairing, and distracted dreams. She thought of the silent antechambers hung with Oriental tapestry, lit by tall bronze candelabra, and of the two great footmen in knee breeches who sleep in the big armchairs, made drowsy by the heavy warmth of the hot-air stove. She thought of the long salons fatted up with ancient silk, of the delicate furniture carrying priceless curiosities, and of the coquettish perfumed boudoirs made for talks at five o'clock with intimate friends, with men famous and sought after, whom all women envy and whose attention they all desire."}, {"lang": "zh", "text": "她不斷地受著折磨，感覺自己生來就是為了所有的精緻和奢華。她因為住所的貧困而痛苦，因為牆壁的悲慘樣子而痛苦，因為磨損的椅子而痛苦，因為窗簾的醜陋而痛苦。所有這些，其他同級的女性甚至不會意識到的事物，卻折磨著她，讓她憤怒。看到那位為她做家務的小布列塔尼農婦，喚起了她絕望的懷念和分心的夢想。她想到了懸掛著東方掛毯的寂靜前廳，燭台高聳，散發著柔和的光芒，還有兩位穿著膝褲的高大男侍者，懶洋洋地在大扶手椅上打盹，被熱氣騰騰的暖氣所催眠。她想到了用古老絲綢裝飾的長沙龍，精緻的家具上擺放著無價的珍品，還有為五點鐘與親密朋友、著名且受人追捧的男性交談而設計的妩媚香氣的更衣室，所有女性都嫉妒他們，渴望得到他們的注意。"}], "en": ["She suffered ceaselessly, feeling herself born for all the delicacies and all the luxuries. She suffered from the poverty of her dwelling, from the wretched look of the walls, from the worn-out chairs, from the ugliness of the curtains. All those things, of which another woman of her rank would never even have been conscious, tortured her and made her angry. The sight of the little Breton peasant who did her humble housework aroused in her regrets which were despairing, and distracted dreams. She thought of the silent antechambers hung with Oriental tapestry, lit by tall bronze candelabra, and of the two great footmen in knee breeches who sleep in the big armchairs, made drowsy by the heavy warmth of the hot-air stove. She thought of the long salons fatted up with ancient silk, of the delicate furniture carrying priceless curiosities, and of the coquettish perfumed boudoirs made for talks at five o'clock with intimate friends, with men famous and sought after, whom all women envy and whose attention they all desire."], "zh": ["她不斷地受著折磨，感覺自己生來就是為了所有的精緻和奢華。她因為住所的貧困而痛苦，因為牆壁的悲慘樣子而痛苦，因為磨損的椅子而痛苦，因為窗簾的醜陋而痛苦。所有這些，其他同級的女性甚至不會意識到的事物，卻折磨著她，讓她憤怒。看到那位為她做家務的小布列塔尼農婦，喚起了她絕望的懷念和分心的夢想。她想到了懸掛著東方掛毯的寂靜前廳，燭台高聳，散發著柔和的光芒，還有兩位穿著膝褲的高大男侍者，懶洋洋地在大扶手椅上打盹，被熱氣騰騰的暖氣所催眠。她想到了用古老絲綢裝飾的長沙龍，精緻的家具上擺放著無價的珍品，還有為五點鐘與親密朋友、著名且受人追捧的男性交談而設計的妩媚香氣的更衣室，所有女性都嫉妒他們，渴望得到他們的注意。"]}, {"id": 3, "blocks": [{"lang": "en", "text": "When she sat down to dinner, before the round table covered with a tablecloth three days old, opposite her husband, who uncovered the soup tureen and declared with an enchanted air, \"Ah, the good pot-au-feu! I don't know anything better than that,\" she thought of dainty dinners, of shining silverware, of tapestry which peopled the walls with ancient personages and with strange birds flying in the midst of a fairy forest; and she thought of delicious dishes served on marvelous plates, and of the whispered gallantries which you listen to with a sphinx-like smile, while you are eating the pink flesh of a trout or the wings of a quail."}, {"lang": "zh", "text": "當她坐下來吃晚餐時，面對著一張覆著三天前桌布的圓桌，對面是她的丈夫，他揭開湯鍋，滿臉陶醉地說：“啊，這好吃的牛肉湯！我不知道還有什麼比這更好的了。”她卻想到了精緻的晚餐、閃亮的銀器、牆上懸掛著古代人物和奇異飛鳥的掛毯；她想到了在奇妙的盤子上端上來的美味佳餚，還有那些低語的調情，讓你在品嚐鮮美的鱒魚肉或鵪鶉翅時，面帶著斯芬克斯般的微笑。"}], "en": ["When she sat down to dinner, before the round table covered with a tablecloth three days old, opposite her husband, who uncovered the soup tureen and declared with an enchanted air, \"Ah, the good pot-au-feu! I don't know anything better than that,\" she thought of dainty dinners, of shining silverware, of tapestry which peopled the walls with ancient personages and with strange birds flying in the midst of a fairy forest; and she thought of delicious dishes served on marvelous plates, and of the whispered gallantries which you listen to with a sphinx-like smile, while you are eating the pink flesh of a trout or the wings of a quail."], "zh": ["當她坐下來吃晚餐時，面對著一張覆著三天前桌布的圓桌，對面是她的丈夫，他揭開湯鍋，滿臉陶醉地說：“啊，這好吃的牛肉湯！我不知道還有什麼比這更好的了。”她卻想到了精緻的晚餐、閃亮的銀器、牆上懸掛著古代人物和奇異飛鳥的掛毯；她想到了在奇妙的盤子上端上來的美味佳餚，還有那些低語的調情，讓你在品嚐鮮美的鱒魚肉或鵪鶉翅時，面帶著斯芬克斯般的微笑。"]}, {"id": 4, "blocks": [{"lang": "en", "text": "She had no dresses, no jewels, nothing. And she loved nothing but that; she felt made for that. She would so have liked to please, to be envied, to be charming, to be sought after."}, {"lang": "zh", "text": "她沒有衣服，沒有珠寶，什麼都沒有。她只愛那個；她感覺自己就是為了那個而生。她多麼希望能讓人喜愛，讓人羨慕，讓人迷戀，讓人追求。"}, {"lang": "en", "text": "She had a friend, a former schoolmate at the convent, who was rich, and whom she did not like to go and see any more, because she suffered so much when she came back."}, {"lang": "zh", "text": "她有一位朋友，曾經的修道院同學，富有，但她不喜歡再去見她，因為每次回來都會感到非常痛苦。"}, {"lang": "en", "text": "But, one evening, her husband returned home with a triumphant air, and holding a large envelope in his hand."}, {"lang": "zh", "text": "但有一天晚上，她的丈夫帶著勝利的神情回到家，手裡拿著一個大信封。"}, {"lang": "en", "text": "\"There,\" said he, \"here is something for you.\""}, {"lang": "zh", "text": "“看，”他說，“這是給你的。”"}, {"lang": "en", "text": "She tore the paper sharply, and drew out a printed card which bore these words:"}, {"lang": "zh", "text": "她猛地撕開包裝，抽出一張印刷的卡片，上面寫著："}], "en": ["She had no dresses, no jewels, nothing. And she loved nothing but that; she felt made for that. She would so have liked to please, to be envied, to be charming, to be sought after.", "She had a friend, a former schoolmate at the convent, who was rich, and whom she did not like to go and see any more, because she suffered so much when she came back.", "But, one evening, her husband returned home with a triumphant air, and holding a large envelope in his hand.", "\"There,\" said he, \"here is something for you.\"", "She tore the paper sharply, and drew out a printed card which bore these words:"], "zh": ["她沒有衣服，沒有珠寶，什麼都沒有。她只愛那個；她感覺自己就是為了那個而生。她多麼希望能讓人喜愛，讓人羨慕，讓人迷戀，讓人追求。", "她有一位朋友，曾經的修道院同學，富有，但她不喜歡再去見她，因為每次回來都會感到非常痛苦。", "但有一天晚上，她的丈夫帶著勝利的神情回到家，手裡拿著一個大信封。", "“看，”他說，“這是給你的。”", "她猛地撕開包裝，抽出一張印刷的卡片，上面寫著："]}, {"id": 5, "blocks": [{"lang": "en", "text": "\"The Minister of Public Instruction and Mme. Georges Ramponneau request the honor of M. and Mme. Loisel's company at the palace of the Ministry on Monday evening, January 18th.\""}, {"lang": "zh", "text": "“公共教育部長和喬治·蘭蓬諾夫人請求洛伊塞爾夫婦於一月十八日星期一晚上光臨部長府。”"}, {"lang": "en", "text": "Instead of being delighted, as her husband hoped, she threw the invitation on the table with disdain, murmuring:"}, {"lang": "zh", "text": "她並沒有像丈夫所希望的那樣高興，反而不屑地把邀請函扔在桌上，喃喃道："}, {"lang": "en", "text": "\"What do you want me to do with that?\""}, {"lang": "zh", "text": "“你想我怎麼辦？”"}, {"lang": "en", "text": "\"But, my dear, I thought you would be glad. You never go out, and this is such a fine opportunity. I had awful trouble to get it. Everyone wants to go; it is very select, and they are not giving many invitations to clerks. The whole official world will be there.\""}, {"lang": "zh", "text": "“但是，親愛的，我以為你會高興的。你從不出門，這是個多麼好的機會。我費了很大的力氣才得到這個。每個人都想去；這是非常高級的，而且不會給文員發很多邀請函。整個官場都會在那裡。”"}], "en": ["\"The Minister of Public Instruction and Mme. Georges Ramponneau request the honor of M. and Mme. Loisel's company at the palace of the Ministry on Monday evening, January 18th.\"", "Instead of being delighted, as her husband hoped, she threw the invitation on the table with disdain, murmuring:", "\"What do you want me to do with that?\"", "\"But, my dear, I thought you would be glad. You never go out, and this is such a fine opportunity. I had awful trouble to get it. Everyone wants to go; it is very select, and they are not giving many invitations to clerks. The whole official world will be there.\""], "zh": ["“公共教育部長和喬治·蘭蓬諾夫人請求洛伊塞爾夫婦於一月十八日星期一晚上光臨部長府。”", "她並沒有像丈夫所希望的那樣高興，反而不屑地把邀請函扔在桌上，喃喃道：", "“你想我怎麼辦？”", "“但是，親愛的，我以為你會高興的。你從不出門，這是個多麼好的機會。我費了很大的力氣才得到這個。每個人都想去；這是非常高級的，而且不會給文員發很多邀請函。整個官場都會在那裡。”"]}, {"id": 6, "blocks": [{"lang": "en", "text": "She looked at him with an irritated eye, and she said, impatiently:"}, {"lang": "zh", "text": "她用不耐煩的眼神看著他，說道："}, {"lang": "en", "text": "\"And what do you want me to put on my back?\""}, {"lang": "zh", "text": "“那你想我穿什麼？”"}, {"lang": "en", "text": "He had not thought of that; he stammered:"}, {"lang": "zh", "text": "他沒有想到這一點，結結巴巴地說："}, {"lang": "en", "text": "\"Why, the dress you go to the theater in. It looks very well, to me.\""}, {"lang": "zh", "text": "“那你就穿你去劇院時的衣服吧。我覺得那很好看。”"}, {"lang": "en", "text": "He stopped, distracted, seeing that his wife was crying. Two great tears descended slowly from the corners of her eyes toward the corners of her mouth. He stuttered:"}, {"lang": "zh", "text": "他停下來，看到妻子在哭，神情恍惚。兩行淚水慢慢從她的眼角流向嘴角。他結結巴巴地問："}, {"lang": "en", "text": "\"What's the matter? What's the matter?\""}, {"lang": "zh", "text": "“怎麼了？怎麼了？”"}, {"lang": "en", "text": "But, by a violent effort, she had conquered her grief, and she replied, with a calm voice, while she wiped her wet cheeks:"}, {"lang": "zh", "text": "但她通過一番劇烈的努力，克制住了自己的悲傷，平靜地回答，並擦去濕潤的臉頰："}], "en": ["She looked at him with an irritated eye, and she said, impatiently:", "\"And what do you want me to put on my back?\"", "He had not thought of that; he stammered:", "\"Why, the dress you go to the theater in. It looks very well, to me.\"", "He stopped, distracted, seeing that his wife was crying. Two great tears descended slowly from the corners of her eyes toward the corners of her mouth. He stuttered:", "\"What's the matter? What's the matter?\"", "But, by a violent effort, she had conquered her grief, and she replied, with a calm voice, while she wiped her wet cheeks:"], "zh": ["她用不耐煩的眼神看著他，說道：", "“那你想我穿什麼？”", "他沒有想到這一點，結結巴巴地說：", "“那你就穿你去劇院時的衣服吧。我覺得那很好看。”", "他停下來，看到妻子在哭，神情恍惚。兩行淚水慢慢從她的眼角流向嘴角。他結結巴巴地問：", "“怎麼了？怎麼了？”", "但她通過一番劇烈的努力，克制住了自己的悲傷，平靜地回答，並擦去濕潤的臉頰："]}, {"id": 7, "blocks": [{"lang": "en", "text": "\"Nothing. Only I have no dress, and therefore I can't go to this ball. Give your card to some colleague whose wife is better equipped than I.\""}, {"lang": "zh", "text": "“沒什麼。只是我沒有衣服，所以我不能去這個舞會。把你的邀請卡給某個妻子比我更有條件的同事吧。”"}, {"lang": "en", "text": "He was in despair. He resumed:"}, {"lang": "zh", "text": "他感到絕望。他接著說："}, {"lang": "en", "text": "\"Come, let us see, Mathilde. How much would it cost, a suitable dress, which you could use on other occasions, something very simple?\""}, {"lang": "zh", "text": "“來吧，讓我們看看，馬蒂爾德。合適的衣服要多少錢，你可以在其他場合穿，簡單一點的那種？”"}, {"lang": "en", "text": "She reflected several seconds, making her calculations and wondering also what sum she could ask without drawing on herself an immediate refusal and a frightened exclamation from the economical clerk."}, {"lang": "zh", "text": "她思考了幾秒鐘，計算著，也在想她可以要求多少金額而不會引來丈夫的立即拒絕和驚訝的驚呼。"}, {"lang": "en", "text": "Finally, she replied, hesitatingly:"}, {"lang": "zh", "text": "最後，她猶豫地回答："}, {"lang": "en", "text": "\"I don't know exactly, but I think I could manage it with four hundred francs.\""}, {"lang": "zh", "text": "“我不太確定，但我想四百法郎應該可以。”"}], "en": ["\"Nothing. Only I have no dress, and therefore I can't go to this ball. Give your card to some colleague whose wife is better equipped than I.\"", "He was in despair. He resumed:", "\"Come, let us see, Mathilde. How much would it cost, a suitable dress, which you could use on other occasions, something very simple?\"", "She reflected several seconds, making her calculations and wondering also what sum she could ask without drawing on herself an immediate refusal and a frightened exclamation from the economical clerk.", "Finally, she replied, hesitatingly:", "\"I don't know exactly, but I think I could manage it with four hundred francs.\""], "zh": ["“沒什麼。只是我沒有衣服，所以我不能去這個舞會。把你的邀請卡給某個妻子比我更有條件的同事吧。”", "他感到絕望。他接著說：", "“來吧，讓我們看看，馬蒂爾德。合適的衣服要多少錢，你可以在其他場合穿，簡單一點的那種？”", "她思考了幾秒鐘，計算著，也在想她可以要求多少金額而不會引來丈夫的立即拒絕和驚訝的驚呼。", "最後，她猶豫地回答：", "“我不太確定，但我想四百法郎應該可以。”"]}, {"id": 8, "blocks": [{"lang": "en", "text": "He had grown a little pale, because he was laying aside just that amount to buy a gun and treat himself to a little shooting next summer on the plain of Nanterre, with several friends who went to shoot larks down there of a Sunday."}, {"lang": "zh", "text": "他臉色微微變白，因為他正好在攢這筆錢，準備買一把槍，打算明年夏天和幾個朋友一起去南特平原打麻雀。"}, {"lang": "en", "text": "But he said:"}, {"lang": "zh", "text": "但他說："}, {"lang": "en", "text": "\"All right. I will give you four hundred francs. And try to have a pretty dress.\""}, {"lang": "zh", "text": "“好吧。我會給你四百法郎。希望你能找到一件漂亮的衣服。”"}, {"lang": "en", "text": "The day of the ball drew near, and Mme. Loisel seemed sad, uneasy, anxious. Her dress was ready, however. Her husband said to her one evening:"}, {"lang": "zh", "text": "舞會的日子漸漸逼近，洛伊塞爾夫人似乎感到悲傷、不安和焦慮。然而，她的衣服已經準備好了。她的丈夫某天晚上對她說："}, {"lang": "en", "text": "\"What is the matter? Come, you've been so queer these last three days.\""}, {"lang": "zh", "text": "“怎麼了？這三天你一直很奇怪。”"}], "en": ["He had grown a little pale, because he was laying aside just that amount to buy a gun and treat himself to a little shooting next summer on the plain of Nanterre, with several friends who went to shoot larks down there of a Sunday.", "But he said:", "\"All right. I will give you four hundred francs. And try to have a pretty dress.\"", "The day of the ball drew near, and Mme. Loisel seemed sad, uneasy, anxious. Her dress was ready, however. Her husband said to her one evening:", "\"What is the matter? Come, you've been so queer these last three days.\""], "zh": ["他臉色微微變白，因為他正好在攢這筆錢，準備買一把槍，打算明年夏天和幾個朋友一起去南特平原打麻雀。", "但他說：", "“好吧。我會給你四百法郎。希望你能找到一件漂亮的衣服。”", "舞會的日子漸漸逼近，洛伊塞爾夫人似乎感到悲傷、不安和焦慮。然而，她的衣服已經準備好了。她的丈夫某天晚上對她說：", "“怎麼了？這三天你一直很奇怪。”"]}, {"id": 9, "blocks": [{"lang": "en", "text": "And she answered:"}, {"lang": "zh", "text": "她回答："}, {"lang": "en", "text": "\"It annoys me not to have a single jewel, not a single stone, nothing to put on. I shall look like distress. I should almost rather not go at all.\""}, {"lang": "zh", "text": "“我沒有一件珠寶，沒有一顆寶石，什麼都沒有，這讓我很煩。我看起來會像個乞丐。我幾乎不想去。”"}, {"lang": "en", "text": "He resumed:"}, {"lang": "zh", "text": "他接著說："}, {"lang": "en", "text": "\"You might wear natural flowers. It's very stylish at this time of the year. For ten francs you can get two or three magnificent roses.\""}, {"lang": "zh", "text": "“你可以戴上天然花朵。這個季節非常時尚。十法郎就能買到兩三朵美麗的玫瑰。”"}, {"lang": "en", "text": "She was not convinced."}, {"lang": "zh", "text": "她並不信服。"}, {"lang": "en", "text": "\"No; there's nothing more humiliating than to look poor among other women who are rich.\""}, {"lang": "zh", "text": "“不；在其他富有的女性面前看起來貧窮是最羞辱的。”"}, {"lang": "en", "text": "But her husband cried:"}, {"lang": "zh", "text": "但她的丈夫大喊："}, {"lang": "en", "text": "\"How stupid you are! Go look up your friend Mme. Forestier, and ask her to lend you some jewels. You're quite thick enough with her to do that.\""}, {"lang": "zh", "text": "“你真愚蠢！去找你的朋友福雷斯蒂耶夫人，請她借你一些珠寶。你和她的關係很好，可以這樣做。”"}], "en": ["And she answered:", "\"It annoys me not to have a single jewel, not a single stone, nothing to put on. I shall look like distress. I should almost rather not go at all.\"", "He resumed:", "\"You might wear natural flowers. It's very stylish at this time of the year. For ten francs you can get two or three magnificent roses.\"", "She was not convinced.", "\"No; there's nothing more humiliating than to look poor among other women who are rich.\"", "But her husband cried:", "\"How stupid you are! Go look up your friend Mme. Forestier, and ask her to lend you some jewels. You're quite thick enough with her to do that.\""], "zh": ["她回答：", "“我沒有一件珠寶，沒有一顆寶石，什麼都沒有，這讓我很煩。我看起來會像個乞丐。我幾乎不想去。”", "他接著說：", "“你可以戴上天然花朵。這個季節非常時尚。十法郎就能買到兩三朵美麗的玫瑰。”", "她並不信服。", "“不；在其他富有的女性面前看起來貧窮是最羞辱的。”", "但她的丈夫大喊：", "“你真愚蠢！去找你的朋友福雷斯蒂耶夫人，請她借你一些珠寶。你和她的關係很好，可以這樣做。”"]}, {"id": 10, "blocks": [{"lang": "en", "text": "She uttered a cry of joy:"}, {"lang": "zh", "text": "她發出一聲喜悅的驚呼："}, {"lang": "en", "text": "\"It's true. I never thought of it.\""}, {"lang": "zh", "text": "“對呀。我從來沒想到這一點。”"}, {"lang": "en", "text": "The next day she went to her friend and told of her distress."}, {"lang": "zh", "text": "第二天，她去找她的朋友，告訴她自己的困境。"}, {"lang": "en", "text": "Mme. Forestier went to a wardrobe with a glass door, took out a large jewel box, brought it back, opened it, and said to Mme. Loisel:"}, {"lang": "zh", "text": "福雷斯蒂耶夫人走到一個有玻璃門的衣櫃，拿出一個大珠寶盒，帶回來，打開它，對洛伊塞爾夫人說："}, {"lang": "en", "text": "\"Choose, my dear.\""}, {"lang": "zh", "text": "“選吧，親愛的。”"}, {"lang": "en", "text": "She saw first of all some bracelets, then a pearl necklace, then a Venetian cross, gold and precious stones of admirable workmanship. She tried on the ornaments before the glass, hesitated, could not make up her mind to part with them, to give them back. She kept asking:"}, {"lang": "zh", "text": "她首先看到一些手鐲，然後是一條珍珠項鍊，接著是一個威尼斯十字架，金製的，鑲嵌著精美的寶石。她在鏡子前試戴這些飾品，猶豫不決，無法下定決心歸還它們。她不斷詢問："}], "en": ["She uttered a cry of joy:", "\"It's true. I never thought of it.\"", "The next day she went to her friend and told of her distress.", "Mme. Forestier went to a wardrobe with a glass door, took out a large jewel box, brought it back, opened it, and said to Mme. Loisel:", "\"Choose, my dear.\"", "She saw first of all some bracelets, then a pearl necklace, then a Venetian cross, gold and precious stones of admirable workmanship. She tried on the ornaments before the glass, hesitated, could not make up her mind to part with them, to give them back. She kept asking:"], "zh": ["她發出一聲喜悅的驚呼：", "“對呀。我從來沒想到這一點。”", "第二天，她去找她的朋友，告訴她自己的困境。", "福雷斯蒂耶夫人走到一個有玻璃門的衣櫃，拿出一個大珠寶盒，帶回來，打開它，對洛伊塞爾夫人說：", "“選吧，親愛的。”", "她首先看到一些手鐲，然後是一條珍珠項鍊，接著是一個威尼斯十字架，金製的，鑲嵌著精美的寶石。她在鏡子前試戴這些飾品，猶豫不決，無法下定決心歸還它們。她不斷詢問："]}, {"id": 11, "blocks": [{"lang": "en", "text": "\"Haven't you any more?\""}, {"lang": "zh", "text": "“你沒有更多的嗎？”"}, {"lang": "en", "text": "\"Why, yes. Look. I don't know what you like.\""}, {"lang": "zh", "text": "“有的。看。我不知道你喜歡什麼。”"}, {"lang": "en", "text": "All of a sudden she discovered, in a black satin box, a superb necklace of diamonds, and her heart began to beat with an immoderate desire. Her hands trembled as she took it. She fastened it around her throat, outside her high-necked dress, and remained lost in ecstasy at the sight of herself."}, {"lang": "zh", "text": "突然，她在一個黑色絲綢盒子裡發現了一條華麗的鑽石項鍊，心中充滿了無法抑制的渴望。她的手在拿起它時顫抖著。她把它繞在脖子上，外面是高領的裙子，看到自己時陶醉不已。"}, {"lang": "en", "text": "Then she asked, hesitating, filled with anguish:"}, {"lang": "zh", "text": "然後她猶豫地問，心中充滿焦慮："}, {"lang": "en", "text": "\"Can you lend me that, only that?\""}, {"lang": "zh", "text": "“你能只借我這個嗎？”"}, {"lang": "en", "text": "\"Why, yes, certainly.\""}, {"lang": "zh", "text": "“當然可以。”"}, {"lang": "en", "text": "She sprang upon the neck of her friend, kissed her passionately, then fled with her treasure."}, {"lang": "zh", "text": "她衝上前擁抱了她的朋友，熱情地吻了她，然後帶著她的寶物逃走了。"}, {"lang": "en", "text": "The day of the ball arrived. Mme. Loisel made a great success. She was prettier than them all, elegant, gracious, smiling, and crazy with joy. All the men looked at her, asked her name, endeavored to be introduced. All the attachés of the Cabinet wanted to waltz with her. She was remarked by the minister himself."}, {"lang": "zh", "text": "舞會的日子來臨了。洛伊塞爾夫人大獲成功。她比所有人都美，優雅、迷人、微笑，心中充滿喜悅。所有的男人都在看她，詢問她的名字，努力想要認識她。所有的內閣隨員都想和她共舞。甚至部長本人也注意到了她。"}], "en": ["\"Haven't you any more?\"", "\"Why, yes. Look. I don't know what you like.\"", "All of a sudden she discovered, in a black satin box, a superb necklace of diamonds, and her heart began to beat with an immoderate desire. Her hands trembled as she took it. She fastened it around her throat, outside her high-necked dress, and remained lost in ecstasy at the sight of herself.", "Then she asked, hesitating, filled with anguish:", "\"Can you lend me that, only that?\"", "\"Why, yes, certainly.\"", "She sprang upon the neck of her friend, kissed her passionately, then fled with her treasure.", "The day of the ball arrived. Mme. Loisel made a great success. She was prettier than them all, elegant, gracious, smiling, and crazy with joy. All the men looked at her, asked her name, endeavored to be introduced. All the attachés of the Cabinet wanted to waltz with her. She was remarked by the minister himself."], "zh": ["“你沒有更多的嗎？”", "“有的。看。我不知道你喜歡什麼。”", "突然，她在一個黑色絲綢盒子裡發現了一條華麗的鑽石項鍊，心中充滿了無法抑制的渴望。她的手在拿起它時顫抖著。她把它繞在脖子上，外面是高領的裙子，看到自己時陶醉不已。", "然後她猶豫地問，心中充滿焦慮：", "“你能只借我這個嗎？”", "“當然可以。”", "她衝上前擁抱了她的朋友，熱情地吻了她，然後帶著她的寶物逃走了。", "舞會的日子來臨了。洛伊塞爾夫人大獲成功。她比所有人都美，優雅、迷人、微笑，心中充滿喜悅。所有的男人都在看她，詢問她的名字，努力想要認識她。所有的內閣隨員都想和她共舞。甚至部長本人也注意到了她。"]}, {"id": 12, "blocks": [{"lang": "en", "text": "She danced with intoxication, with passion, made drunk by pleasure, forgetting all, in the triumph of her beauty, in the glory of her success, in a sort of cloud of happiness composed of all this homage, of all this admiration, of all these awakened desires, and of that sense of complete victory which is so sweet to woman's heart."}, {"lang": "zh", "text": "她陶醉地舞動，充滿激情，沉醉於快樂之中，忘卻了一切，沉浸在她的美麗的勝利、成功的榮耀中，感受到那種由所有的敬意、所有的仰慕、所有的渴望所組成的幸福雲霧，以及那種對女性心靈來說是如此甜美的完全勝利感。"}, {"lang": "en", "text": "She went away about four o'clock in the morning. Her husband had been sleeping since midnight, in a little deserted anteroom, with three other gentlemen whose wives were having a very good time."}, {"lang": "zh", "text": "她在早上四點左右離開。她的丈夫自午夜以來就一直在一個小小的空蕩蕩的前廳裡睡覺，和另外三位丈夫的妻子們一起，她們正在享受著美好的時光。"}, {"lang": "en", "text": "He threw over her shoulders the wraps which he had brought, modest wraps of common life, whose poverty contrasted with the elegance of the ball dress. She felt this and wanted to escape so as not to be remarked by the other women, who were enveloping themselves in costly furs."}, {"lang": "zh", "text": "他把他帶來的外套披在她的肩上，那是普通生活的樸素外套，與舞會服裝的優雅形成了鮮明的對比。她感受到這一點，想要逃走，以免被其他女性注意到，她們都裹著昂貴的毛皮。"}], "en": ["She danced with intoxication, with passion, made drunk by pleasure, forgetting all, in the triumph of her beauty, in the glory of her success, in a sort of cloud of happiness composed of all this homage, of all this admiration, of all these awakened desires, and of that sense of complete victory which is so sweet to woman's heart.", "She went away about four o'clock in the morning. Her husband had been sleeping since midnight, in a little deserted anteroom, with three other gentlemen whose wives were having a very good time.", "He threw over her shoulders the wraps which he had brought, modest wraps of common life, whose poverty contrasted with the elegance of the ball dress. She felt this and wanted to escape so as not to be remarked by the other women, who were enveloping themselves in costly furs."], "zh": ["她陶醉地舞動，充滿激情，沉醉於快樂之中，忘卻了一切，沉浸在她的美麗的勝利、成功的榮耀中，感受到那種由所有的敬意、所有的仰慕、所有的渴望所組成的幸福雲霧，以及那種對女性心靈來說是如此甜美的完全勝利感。", "她在早上四點左右離開。她的丈夫自午夜以來就一直在一個小小的空蕩蕩的前廳裡睡覺，和另外三位丈夫的妻子們一起，她們正在享受著美好的時光。", "他把他帶來的外套披在她的肩上，那是普通生活的樸素外套，與舞會服裝的優雅形成了鮮明的對比。她感受到這一點，想要逃走，以免被其他女性注意到，她們都裹著昂貴的毛皮。"]}, {"id": 13, "blocks": [{"lang": "en", "text": "Loisel held her back."}, {"lang": "zh", "text": "洛伊塞爾攔住了她。"}, {"lang": "en", "text": "\"Wait a bit. You will catch cold outside. I will go and call a cab.\""}, {"lang": "zh", "text": "“等一下。你在外面會著涼的。我去叫一輛出租車。”"}, {"lang": "en", "text": "But she did not listen to him, and rapidly descended the stairs. When they were in the street they did not find a carriage; and they began to look for one, shouting after the cabmen whom they saw passing by at a distance."}, {"lang": "zh", "text": "但她沒有聽他的話，迅速下了樓梯。當他們到了街上時，卻找不到一輛馬車；於是他們開始尋找，對著遠處經過的出租車大喊。"}, {"lang": "en", "text": "They went down toward the Seine, in despair, shivering with cold. At last they found on the quay one of those ancient noctambulent coupés which, exactly as if they were ashamed to show their misery during the day, are never seen round Paris until after nightfall."}, {"lang": "zh", "text": "他們朝著塞納河走去，心中絕望，瑟瑟發抖。最後，他們在碼頭上找到了一輛古老的夜行馬車，這種馬車在白天總是羞於展示自己的貧窮，直到夜幕降臨才會出現在巴黎。"}], "en": ["Loisel held her back.", "\"Wait a bit. You will catch cold outside. I will go and call a cab.\"", "But she did not listen to him, and rapidly descended the stairs. When they were in the street they did not find a carriage; and they began to look for one, shouting after the cabmen whom they saw passing by at a distance.", "They went down toward the Seine, in despair, shivering with cold. At last they found on the quay one of those ancient noctambulent coupés which, exactly as if they were ashamed to show their misery during the day, are never seen round Paris until after nightfall."], "zh": ["洛伊塞爾攔住了她。", "“等一下。你在外面會著涼的。我去叫一輛出租車。”", "但她沒有聽他的話，迅速下了樓梯。當他們到了街上時，卻找不到一輛馬車；於是他們開始尋找，對著遠處經過的出租車大喊。", "他們朝著塞納河走去，心中絕望，瑟瑟發抖。最後，他們在碼頭上找到了一輛古老的夜行馬車，這種馬車在白天總是羞於展示自己的貧窮，直到夜幕降臨才會出現在巴黎。"]}, {"id": 14, "blocks": [{"lang": "en", "text": "It took them to their door in the Rue des Martyrs, and once more, sadly, they climbed up homeward. All was ended for her. And as to him, he reflected that he must be at the Ministry at ten o'clock."}, {"lang": "zh", "text": "它把他們送到了位於馬爾蒂爾街的家門口，然後他們又悲傷地爬上了樓梯。對她來說，一切都結束了。而對他來說，他則思考著必須在十點鐘到部裡。"}, {"lang": "en", "text": "She removed the wraps, which covered her shoulders, before the glass, so as once more to see herself in all her glory. But suddenly she uttered a cry. She had no longer the necklace around her neck!"}, {"lang": "zh", "text": "她在鏡子前脫下覆蓋在肩上的外套，想再次看到自己所有的光彩。但突然，她發出一聲驚叫。她的脖子上不再有項鍊了！"}, {"lang": "en", "text": "Her husband, already half undressed, demanded:"}, {"lang": "zh", "text": "她的丈夫已經半脫衣服，驚慌地問："}, {"lang": "en", "text": "\"What is the matter with you?\""}, {"lang": "zh", "text": "“你怎麼了？”"}, {"lang": "en", "text": "She turned madly toward him:"}, {"lang": "zh", "text": "她瘋狂地轉向他："}, {"lang": "en", "text": "\"I have—I have—I've lost Mme. Forestier's necklace.\""}, {"lang": "zh", "text": "“我—我—我丟了福雷斯蒂耶夫人的項鍊。”"}], "en": ["It took them to their door in the Rue des Martyrs, and once more, sadly, they climbed up homeward. All was ended for her. And as to him, he reflected that he must be at the Ministry at ten o'clock.", "She removed the wraps, which covered her shoulders, before the glass, so as once more to see herself in all her glory. But suddenly she uttered a cry. She had no longer the necklace around her neck!", "Her husband, already half undressed, demanded:", "\"What is the matter with you?\"", "She turned madly toward him:", "\"I have—I have—I've lost Mme. Forestier's necklace.\""], "zh": ["它把他們送到了位於馬爾蒂爾街的家門口，然後他們又悲傷地爬上了樓梯。對她來說，一切都結束了。而對他來說，他則思考著必須在十點鐘到部裡。", "她在鏡子前脫下覆蓋在肩上的外套，想再次看到自己所有的光彩。但突然，她發出一聲驚叫。她的脖子上不再有項鍊了！", "她的丈夫已經半脫衣服，驚慌地問：", "“你怎麼了？”", "她瘋狂地轉向他：", "“我—我—我丟了福雷斯蒂耶夫人的項鍊。”"]}, {"id": 15, "blocks": [{"lang": "en", "text": "He stood up, distracted."}, {"lang": "zh", "text": "他站起來，神情恍惚。"}, {"lang": "en", "text": "\"What!—how?—Impossible!\""}, {"lang": "zh", "text": "“什麼！—怎麼會？—不可能！”"}, {"lang": "en", "text": "And they looked in the folds of her dress, in the folds of her cloak, in her pockets, everywhere. They did not find it."}, {"lang": "zh", "text": "他們在她的裙子褶皺裡、斗篷的摺疊處、口袋裡，四處尋找，卻什麼也沒有找到。"}, {"lang": "en", "text": "He asked:"}, {"lang": "zh", "text": "他問："}, {"lang": "en", "text": "\"You're sure you had it on when you left the ball?\""}, {"lang": "zh", "text": "“你確定你在離開舞會時戴著它嗎？”"}, {"lang": "en", "text": "\"Yes, I felt it in the vestibule of the palace.\""}, {"lang": "zh", "text": "“是的，我在宮殿的前廳裡感覺到它的。”"}, {"lang": "en", "text": "\"But if you had lost it in the street we should have heard it fall. It must be in the cab.\""}, {"lang": "zh", "text": "“但如果你在街上丟了它，我們應該聽到它掉落的聲音。它一定是在出租車裡。”"}, {"lang": "en", "text": "\"Yes. Probably. Did you take his number?\""}, {"lang": "zh", "text": "“是的，可能是。你有記下他的號碼嗎？”"}, {"lang": "en", "text": "\"No. And you, didn't you notice it?\""}, {"lang": "zh", "text": "“沒有。你呢，沒有注意到嗎？”"}, {"lang": "en", "text": "\"No.\""}, {"lang": "zh", "text": "“沒有。”"}, {"lang": "en", "text": "They looked, thunderstruck, at one another. At last Loisel put on his clothes."}, {"lang": "zh", "text": "他們面面相覷，震驚不已。最後，洛伊塞爾穿上衣服。"}], "en": ["He stood up, distracted.", "\"What!—how?—Impossible!\"", "And they looked in the folds of her dress, in the folds of her cloak, in her pockets, everywhere. They did not find it.", "He asked:", "\"You're sure you had it on when you left the ball?\"", "\"Yes, I felt it in the vestibule of the palace.\"", "\"But if you had lost it in the street we should have heard it fall. It must be in the cab.\"", "\"Yes. Probably. Did you take his number?\"", "\"No. And you, didn't you notice it?\"", "\"No.\"", "They looked, thunderstruck, at one another. At last Loisel put on his clothes."], "zh": ["他站起來，神情恍惚。", "“什麼！—怎麼會？—不可能！”", "他們在她的裙子褶皺裡、斗篷的摺疊處、口袋裡，四處尋找，卻什麼也沒有找到。", "他問：", "“你確定你在離開舞會時戴著它嗎？”", "“是的，我在宮殿的前廳裡感覺到它的。”", "“但如果你在街上丟了它，我們應該聽到它掉落的聲音。它一定是在出租車裡。”", "“是的，可能是。你有記下他的號碼嗎？”", "“沒有。你呢，沒有注意到嗎？”", "“沒有。”", "他們面面相覷，震驚不已。最後，洛伊塞爾穿上衣服。"]}, {"id": 16, "blocks": [{"lang": "en", "text": "\"I shall go back on foot,\" said he, \"over the whole route which we have taken, to see if I can't find it.\""}, {"lang": "zh", "text": "“我將步行回去，”他說，“沿著我們走過的路，看看能否找到它。”"}, {"lang": "en", "text": "And he went out. She sat waiting on a chair in her ball dress, without strength to go to bed, overwhelmed, without fire, without a thought."}, {"lang": "zh", "text": "然後他出去了。她坐在椅子上，穿著舞會的衣服，無法去睡覺，感到無力，無法思考。"}, {"lang": "en", "text": "Her husband came back about seven o'clock. He had found nothing."}, {"lang": "zh", "text": "她的丈夫大約在七點鐘回來。他什麼也沒找到。"}, {"lang": "en", "text": "He went to Police Headquarters, to the newspaper offices, to offer a reward; he went to the cab companies—everywhere, in fact, whither he was urged by the least suspicion of hope."}, {"lang": "zh", "text": "他去警察局，去報社，提供懸賞；他去出租車公司——事實上，他到處去，無論是出於一絲希望的暗示。"}, {"lang": "en", "text": "She waited all day, in the same condition of mad fear before this terrible calamity."}, {"lang": "zh", "text": "她整天在這種可怕的災難面前，處於瘋狂的恐懼之中等待。"}], "en": ["\"I shall go back on foot,\" said he, \"over the whole route which we have taken, to see if I can't find it.\"", "And he went out. She sat waiting on a chair in her ball dress, without strength to go to bed, overwhelmed, without fire, without a thought.", "Her husband came back about seven o'clock. He had found nothing.", "He went to Police Headquarters, to the newspaper offices, to offer a reward; he went to the cab companies—everywhere, in fact, whither he was urged by the least suspicion of hope.", "She waited all day, in the same condition of mad fear before this terrible calamity."], "zh": ["“我將步行回去，”他說，“沿著我們走過的路，看看能否找到它。”", "然後他出去了。她坐在椅子上，穿著舞會的衣服，無法去睡覺，感到無力，無法思考。", "她的丈夫大約在七點鐘回來。他什麼也沒找到。", "他去警察局，去報社，提供懸賞；他去出租車公司——事實上，他到處去，無論是出於一絲希望的暗示。", "她整天在這種可怕的災難面前，處於瘋狂的恐懼之中等待。"]}, {"id": 17, "blocks": [{"lang": "en", "text": "Loisel returned at night with a hollow, pale face; he had discovered nothing."}, {"lang": "zh", "text": "洛伊塞爾晚上回來時，臉色蒼白，空洞；他什麼也沒發現。"}, {"lang": "en", "text": "\"You must write to your friend,\" said he, \"that you have broken the clasp of her necklace and that you are having it mended. That will give us time to turn round.\""}, {"lang": "zh", "text": "“你必須寫信給你的朋友，”他說，“告訴她你弄壞了她項鍊的扣子，正在修理。這樣我們就有時間應對。”"}, {"lang": "en", "text": "She wrote at his dictation."}, {"lang": "zh", "text": "她在他的口述下寫了信。"}, {"lang": "en", "text": "At the end of a week they had lost all hope."}, {"lang": "zh", "text": "一周後，他們已經失去了所有的希望。"}, {"lang": "en", "text": "And Loisel, who had aged five years, declared:"}, {"lang": "zh", "text": "而洛伊塞爾，已經老了五歲，宣稱："}, {"lang": "en", "text": "\"We must consider how to replace that ornament.\""}, {"lang": "zh", "text": "“我們必須考慮如何替換那件飾品。”"}, {"lang": "en", "text": "The next day they took the box which had contained it, and they went to the jeweler whose name was found within. He consulted his books."}, {"lang": "zh", "text": "第二天，他們拿著裝著項鍊的盒子，去找裡面寫著的珠寶商。他查閱了他的帳簿。"}], "en": ["Loisel returned at night with a hollow, pale face; he had discovered nothing.", "\"You must write to your friend,\" said he, \"that you have broken the clasp of her necklace and that you are having it mended. That will give us time to turn round.\"", "She wrote at his dictation.", "At the end of a week they had lost all hope.", "And Loisel, who had aged five years, declared:", "\"We must consider how to replace that ornament.\"", "The next day they took the box which had contained it, and they went to the jeweler whose name was found within. He consulted his books."], "zh": ["洛伊塞爾晚上回來時，臉色蒼白，空洞；他什麼也沒發現。", "“你必須寫信給你的朋友，”他說，“告訴她你弄壞了她項鍊的扣子，正在修理。這樣我們就有時間應對。”", "她在他的口述下寫了信。", "一周後，他們已經失去了所有的希望。", "而洛伊塞爾，已經老了五歲，宣稱：", "“我們必須考慮如何替換那件飾品。”", "第二天，他們拿著裝著項鍊的盒子，去找裡面寫著的珠寶商。他查閱了他的帳簿。"]}, {"id": 18, "blocks": [{"lang": "en", "text": "\"It was not I, madame, who sold that necklace; I must simply have furnished the case.\""}, {"lang": "zh", "text": "“不是我，夫人，賣了那條項鍊；我只是提供了盒子。”"}, {"lang": "en", "text": "Then they went from jeweler to jeweler, searching for a necklace like the other, consulting their memories, sick both of them with chagrin and with anguish."}, {"lang": "zh", "text": "然後他們從一個珠寶商跑到另一個珠寶商，尋找與那條項鍊一模一樣的，回憶著，兩人都因懊惱和焦慮而感到痛苦。"}, {"lang": "en", "text": "They found, in a shop at the Palais Royal, a string of diamonds which seemed to them exactly like the one they looked for. It was worth forty thousand francs. They could have it for thirty-six."}, {"lang": "zh", "text": "他們在皇家宮殿的一家商店裡找到了一條看起來完全相似的鑽石項鍊。它的價值為四萬法郎。他們可以以三十六萬法郎的價格購得。"}, {"lang": "en", "text": "So they begged the jeweler not to sell it for three days yet. And they made a bargain that he should buy it back for thirty-four thousand francs in case they found the other one before the end of February."}, {"lang": "zh", "text": "於是他們請求珠寶商不要在三天內出售它。他們達成了一項協議，如果在二月底之前找到另一條項鍊，他會以三十四萬法郎的價格回購。"}], "en": ["\"It was not I, madame, who sold that necklace; I must simply have furnished the case.\"", "Then they went from jeweler to jeweler, searching for a necklace like the other, consulting their memories, sick both of them with chagrin and with anguish.", "They found, in a shop at the Palais Royal, a string of diamonds which seemed to them exactly like the one they looked for. It was worth forty thousand francs. They could have it for thirty-six.", "So they begged the jeweler not to sell it for three days yet. And they made a bargain that he should buy it back for thirty-four thousand francs in case they found the other one before the end of February."], "zh": ["“不是我，夫人，賣了那條項鍊；我只是提供了盒子。”", "然後他們從一個珠寶商跑到另一個珠寶商，尋找與那條項鍊一模一樣的，回憶著，兩人都因懊惱和焦慮而感到痛苦。", "他們在皇家宮殿的一家商店裡找到了一條看起來完全相似的鑽石項鍊。它的價值為四萬法郎。他們可以以三十六萬法郎的價格購得。", "於是他們請求珠寶商不要在三天內出售它。他們達成了一項協議，如果在二月底之前找到另一條項鍊，他會以三十四萬法郎的價格回購。"]}, {"id": 19, "blocks": [{"lang": "en", "text": "Loisel possessed eighteen thousand francs which his father had left him. He would borrow the rest."}, {"lang": "zh", "text": "洛伊塞爾擁有一萬八千法郎，這是他父親留給他的。他會借其餘的錢。"}, {"lang": "en", "text": "He did borrow, asking a thousand francs of one, five hundred of another, five louis here, three louis there. He gave notes, took up ruinous obligations, dealt with usurers, and all the race of lenders. He compromised all the rest of his life, risked his signature without even knowing if he could meet it; and, frightened by the pains yet to come, by the black misery which was about to fall upon him, by the prospect of all the physical privations and of all the moral tortures which he was to suffer, he went to get the new necklace, putting down upon the merchant's counter thirty-six thousand francs."}, {"lang": "zh", "text": "他確實借了，向一個人借了一千法郎，向另一個人借了五百法郎，這裡借了五路易，哪裡借了三路易。他簽了票據，承擔了沉重的債務，與高利貸者打交道，與所有貸款者打交道。他將自己餘生的所有希望都賭上，甚至不知道自己是否能償還；而且，因為即將到來的痛苦、即將降臨的黑暗貧困、所有身體上的匱乏和所有精神上的折磨，他去取回新的項鍊，將三十六萬法郎放在商人的櫃檯上。"}], "en": ["Loisel possessed eighteen thousand francs which his father had left him. He would borrow the rest.", "He did borrow, asking a thousand francs of one, five hundred of another, five louis here, three louis there. He gave notes, took up ruinous obligations, dealt with usurers, and all the race of lenders. He compromised all the rest of his life, risked his signature without even knowing if he could meet it; and, frightened by the pains yet to come, by the black misery which was about to fall upon him, by the prospect of all the physical privations and of all the moral tortures which he was to suffer, he went to get the new necklace, putting down upon the merchant's counter thirty-six thousand francs."], "zh": ["洛伊塞爾擁有一萬八千法郎，這是他父親留給他的。他會借其餘的錢。", "他確實借了，向一個人借了一千法郎，向另一個人借了五百法郎，這裡借了五路易，哪裡借了三路易。他簽了票據，承擔了沉重的債務，與高利貸者打交道，與所有貸款者打交道。他將自己餘生的所有希望都賭上，甚至不知道自己是否能償還；而且，因為即將到來的痛苦、即將降臨的黑暗貧困、所有身體上的匱乏和所有精神上的折磨，他去取回新的項鍊，將三十六萬法郎放在商人的櫃檯上。"]}, {"id": 20, "blocks": [{"lang": "en", "text": "When Mme. Loisel took back the necklace, Mme. Forestier said to her, with a chilly manner:"}, {"lang": "zh", "text": "當洛伊塞爾夫人取回項鍊時，福雷斯蒂耶夫人冷冷地對她說："}, {"lang": "en", "text": "\"You should have returned it sooner, I might have needed it.\""}, {"lang": "zh", "text": "“你應該早點還給我，我可能會需要它。”"}, {"lang": "en", "text": "She did not open the case, as her friend had so much feared. If she had detected the substitution, what would she have thought, what would she have said? Would she not have taken Mme. Loisel for a thief?"}, {"lang": "zh", "text": "她並沒有打開盒子，正如她的朋友所擔心的那樣。如果她發現了替換，那她會怎麼想，會怎麼說？她會不會把洛伊塞爾夫人當成小偷？"}, {"lang": "en", "text": "Mme. Loisel now knew the horrible existence of the needy. She took her part, moreover, all on a sudden, with heroism. That dreadful debt must be paid. She would pay it. They dismissed their servant; they changed their lodgings; they rented a garret under the roof."}, {"lang": "zh", "text": "洛伊塞爾夫人現在知道了貧困的可怕生活。她突然以英雄的姿態承擔起這一切。那筆可怕的債務必須償還。她會償還的。他們解雇了女僕，換了住處，租了一間閣樓。"}], "en": ["When Mme. Loisel took back the necklace, Mme. Forestier said to her, with a chilly manner:", "\"You should have returned it sooner, I might have needed it.\"", "She did not open the case, as her friend had so much feared. If she had detected the substitution, what would she have thought, what would she have said? Would she not have taken Mme. Loisel for a thief?", "Mme. Loisel now knew the horrible existence of the needy. She took her part, moreover, all on a sudden, with heroism. That dreadful debt must be paid. She would pay it. They dismissed their servant; they changed their lodgings; they rented a garret under the roof."], "zh": ["當洛伊塞爾夫人取回項鍊時，福雷斯蒂耶夫人冷冷地對她說：", "“你應該早點還給我，我可能會需要它。”", "她並沒有打開盒子，正如她的朋友所擔心的那樣。如果她發現了替換，那她會怎麼想，會怎麼說？她會不會把洛伊塞爾夫人當成小偷？", "洛伊塞爾夫人現在知道了貧困的可怕生活。她突然以英雄的姿態承擔起這一切。那筆可怕的債務必須償還。她會償還的。他們解雇了女僕，換了住處，租了一間閣樓。"]}, {"id": 21, "blocks": [{"lang": "en", "text": "She came to know what heavy housework meant and the odious cares of the kitchen. She washed the dishes, using her rosy nails on the greasy pots and pans. She washed the dirty linen, the shirts, and the dish-cloths, which she dried upon a line; she carried the slops down to the street every morning, and carried up the water, stopping for breath at every landing. And, dressed like a woman of the people, she went to the fruiterer, the grocer, the butcher, her basket on her arm, bargaining, insulted, defending her miserable money sou by sou."}, {"lang": "zh", "text": "她開始了解繁重的家務和廚房的可憐事務。她洗碗，將她的玫瑰色指甲放在油膩的鍋碗上。她洗髒衣物、襯衫和抹布，將它們晾在繩子上；她每天早上把污水倒到街上，提著水，每層樓都停下來喘口氣。她穿著平民的衣服，手臂上提著籃子，去水果店、雜貨店、肉店，討價還價，受到侮辱，捍衛著她那微薄的金錢，一分一分地計算。"}, {"lang": "en", "text": "Each month they had to meet some notes, renew others, obtain more time."}, {"lang": "zh", "text": "每個月他們都要償還一些票據，續簽其他票據，爭取更多的時間。"}], "en": ["She came to know what heavy housework meant and the odious cares of the kitchen. She washed the dishes, using her rosy nails on the greasy pots and pans. She washed the dirty linen, the shirts, and the dish-cloths, which she dried upon a line; she carried the slops down to the street every morning, and carried up the water, stopping for breath at every landing. And, dressed like a woman of the people, she went to the fruiterer, the grocer, the butcher, her basket on her arm, bargaining, insulted, defending her miserable money sou by sou.", "Each month they had to meet some notes, renew others, obtain more time."], "zh": ["她開始了解繁重的家務和廚房的可憐事務。她洗碗，將她的玫瑰色指甲放在油膩的鍋碗上。她洗髒衣物、襯衫和抹布，將它們晾在繩子上；她每天早上把污水倒到街上，提著水，每層樓都停下來喘口氣。她穿著平民的衣服，手臂上提著籃子，去水果店、雜貨店、肉店，討價還價，受到侮辱，捍衛著她那微薄的金錢，一分一分地計算。", "每個月他們都要償還一些票據，續簽其他票據，爭取更多的時間。"]}, {"id": 22, "blocks": [{"lang": "en", "text": "Her husband worked in the evening making a fair copy of some tradesman's accounts, and late at night he often copied manuscript for five sous a page."}, {"lang": "zh", "text": "她的丈夫晚上在家裡做商人的帳目，深夜時常為五個法郎的手稿抄寫。"}, {"lang": "en", "text": "And this life lasted ten years."}, {"lang": "zh", "text": "這樣的生活持續了十年。"}, {"lang": "en", "text": "At the end of ten years they had paid everything, everything, with the rates of usury, and the accumulations of the compound interest."}, {"lang": "zh", "text": "十年後，他們償還了所有的債務，所有的債務，還有高利貸的利息和複利的累積。"}, {"lang": "en", "text": "Mme. Loisel looked old now. She had become the woman of impoverished households—strong and hard and rough. With frowsy hair, skirts askew, and red hands, she talked loud while washing the floor with great swishes of water. But sometimes, when her husband was at the office, she sat down near the window, and she thought of that gay evening of long ago, of that ball where she had been so beautiful and so feted."}, {"lang": "zh", "text": "洛伊塞爾夫人現在看起來老了。她成為了貧困家庭的女人——堅強、粗糙。她的頭髮蓬亂，裙子歪斜，雙手紅腫，洗地時大聲喧嘩，水花四濺。但有時，當她的丈夫在辦公室時，她會坐在窗邊，回想起那個久遠的快樂夜晚，回想起那場她曾經如此美麗和受人追捧的舞會。"}], "en": ["Her husband worked in the evening making a fair copy of some tradesman's accounts, and late at night he often copied manuscript for five sous a page.", "And this life lasted ten years.", "At the end of ten years they had paid everything, everything, with the rates of usury, and the accumulations of the compound interest.", "Mme. Loisel looked old now. She had become the woman of impoverished households—strong and hard and rough. With frowsy hair, skirts askew, and red hands, she talked loud while washing the floor with great swishes of water. But sometimes, when her husband was at the office, she sat down near the window, and she thought of that gay evening of long ago, of that ball where she had been so beautiful and so feted."], "zh": ["她的丈夫晚上在家裡做商人的帳目，深夜時常為五個法郎的手稿抄寫。", "這樣的生活持續了十年。", "十年後，他們償還了所有的債務，所有的債務，還有高利貸的利息和複利的累積。", "洛伊塞爾夫人現在看起來老了。她成為了貧困家庭的女人——堅強、粗糙。她的頭髮蓬亂，裙子歪斜，雙手紅腫，洗地時大聲喧嘩，水花四濺。但有時，當她的丈夫在辦公室時，她會坐在窗邊，回想起那個久遠的快樂夜晚，回想起那場她曾經如此美麗和受人追捧的舞會。"]}, {"id": 23, "blocks": [{"lang": "en", "text": "What would have happened if she had not lost that necklace? Who knows? who knows? How life is strange and changeful! How little a thing is needed for us to be lost or to be saved!"}, {"lang": "zh", "text": "如果她沒有丟失那條項鍊，會發生什麼呢？誰知道？誰知道？生活是多麼奇妙而多變！我們只需要一點小事就能迷失或得救！"}, {"lang": "en", "text": "But, one Sunday, having gone to take a walk in the Champs Élysées to refresh herself from the labors of the week, she suddenly perceived a woman who was leading a child. It was Mme. Forestier, still young, still beautiful, still charming."}, {"lang": "zh", "text": "但有一天星期天，她去香榭麗舍大街散步，以便從一周的勞累中放鬆一下，突然看到一位帶著孩子的女人。那是福雷斯蒂耶夫人，依然年輕，依然美麗，依然迷人。"}, {"lang": "en", "text": "Mme. Loisel felt moved. Was she going to speak to her? Yes, certainly. And now that she had paid, she was going to tell her all about it. Why not?"}, {"lang": "zh", "text": "洛伊塞爾夫人感到激動。她會和她說話嗎？是的，當然。現在她已經還清了，她要告訴她一切。為什麼不呢？"}], "en": ["What would have happened if she had not lost that necklace? Who knows? who knows? How life is strange and changeful! How little a thing is needed for us to be lost or to be saved!", "But, one Sunday, having gone to take a walk in the Champs Élysées to refresh herself from the labors of the week, she suddenly perceived a woman who was leading a child. It was Mme. Forestier, still young, still beautiful, still charming.", "Mme. Loisel felt moved. Was she going to speak to her? Yes, certainly. And now that she had paid, she was going to tell her all about it. Why not?"], "zh": ["如果她沒有丟失那條項鍊，會發生什麼呢？誰知道？誰知道？生活是多麼奇妙而多變！我們只需要一點小事就能迷失或得救！", "但有一天星期天，她去香榭麗舍大街散步，以便從一周的勞累中放鬆一下，突然看到一位帶著孩子的女人。那是福雷斯蒂耶夫人，依然年輕，依然美麗，依然迷人。", "洛伊塞爾夫人感到激動。她會和她說話嗎？是的，當然。現在她已經還清了，她要告訴她一切。為什麼不呢？"]}, {"id": 24, "blocks": [{"lang": "en", "text": "She went up."}, {"lang": "zh", "text": "她走上前。"}, {"lang": "en", "text": "\"Good day, Jeanne.\""}, {"lang": "zh", "text": "“你好，珍。”"}, {"lang": "en", "text": "The other, astonished to be familiarly addressed by this plain good-wife, did not recognize her at all, and stammered:"}, {"lang": "zh", "text": "對方驚訝於這位樸實的好妻子如此親切地稱呼自己，完全不認識她，結結巴巴地說："}, {"lang": "en", "text": "\"But—madame!—I do not know—You must have mistaken.\""}, {"lang": "zh", "text": "“但是——夫人！——我不知道——你一定是搞錯了。”"}, {"lang": "en", "text": "\"No. I am Mathilde Loisel.\""}, {"lang": "zh", "text": "“不。我是馬蒂爾德·洛伊塞爾。”"}, {"lang": "en", "text": "Her friend uttered a cry."}, {"lang": "zh", "text": "她的朋友驚呼。"}, {"lang": "en", "text": "\"Oh, my poor Mathilde! How you are changed!\""}, {"lang": "zh", "text": "“哦，我可憐的馬蒂爾德！你變得多麼不同了！”"}, {"lang": "en", "text": "\"Yes, I have had days hard enough, since I have seen you, days wretched enough—and that because of you!\""}, {"lang": "zh", "text": "“是的，自從見到你以來，我過得很艱難，日子過得很悲慘——而這一切都是因為你！”"}, {"lang": "en", "text": "\"Of me! How so?\""}, {"lang": "zh", "text": "“因為我！怎麼會？”"}, {"lang": "en", "text": "\"Do you remember that diamond necklace which you lent me to wear at the ministerial ball?\""}, {"lang": "zh", "text": "“你還記得那條你借給我在部長舞會上佩戴的鑽石項鍊嗎？”"}, {"lang": "en", "text": "\"Yes. Well?\""}, {"lang": "zh", "text": "“是的。那怎麼了？”"}, {"lang": "en", "text": "\"Well, I lost it.\""}, {"lang": "zh", "text": "“我把它弄丟了。”"}, {"lang": "en", "text": "\"What do you mean? You brought it back.\""}, {"lang": "zh", "text": "“你說什麼？你把它帶回來了。”"}], "en": ["She went up.", "\"Good day, Jeanne.\"", "The other, astonished to be familiarly addressed by this plain good-wife, did not recognize her at all, and stammered:", "\"But—madame!—I do not know—You must have mistaken.\"", "\"No. I am Mathilde Loisel.\"", "Her friend uttered a cry.", "\"Oh, my poor Mathilde! How you are changed!\"", "\"Yes, I have had days hard enough, since I have seen you, days wretched enough—and that because of you!\"", "\"Of me! How so?\"", "\"Do you remember that diamond necklace which you lent me to wear at the ministerial ball?\"", "\"Yes. Well?\"", "\"Well, I lost it.\"", "\"What do you mean? You brought it back.\""], "zh": ["她走上前。", "“你好，珍。”", "對方驚訝於這位樸實的好妻子如此親切地稱呼自己，完全不認識她，結結巴巴地說：", "“但是——夫人！——我不知道——你一定是搞錯了。”", "“不。我是馬蒂爾德·洛伊塞爾。”", "她的朋友驚呼。", "“哦，我可憐的馬蒂爾德！你變得多麼不同了！”", "“是的，自從見到你以來，我過得很艱難，日子過得很悲慘——而這一切都是因為你！”", "“因為我！怎麼會？”", "“你還記得那條你借給我在部長舞會上佩戴的鑽石項鍊嗎？”", "“是的。那怎麼了？”", "“我把它弄丟了。”", "“你說什麼？你把它帶回來了。”"]}, {"id": 25, "blocks": [{"lang": "en", "text": "\"I brought you back another just like it. And for this we have been ten years paying. You can understand that it was not easy for us, us who had nothing. At last it is ended, and I am very glad.\""}, {"lang": "zh", "text": "“我給你帶回了一條一模一樣的。為此我們已經支付了十年。你可以理解，對於我們這些一無所有的人來說，這並不容易。終於結束了，我非常高興。”"}, {"lang": "en", "text": "Mme. Forestier had stopped."}, {"lang": "zh", "text": "福雷斯蒂耶夫人停下了腳步。"}, {"lang": "en", "text": "\"You say that you bought a necklace of diamonds to replace mine?\""}, {"lang": "zh", "text": "“你說你買了一條鑽石項鍊來替代我的？”"}, {"lang": "en", "text": "\"Yes. You never noticed it, then! They were very like.\""}, {"lang": "zh", "text": "“是的。你從來沒有注意到嗎！它們非常相似。”"}, {"lang": "en", "text": "And she smiled with a joy which was proud and naïve at once."}, {"lang": "zh", "text": "她帶著驕傲而天真的喜悅微笑著。"}, {"lang": "en", "text": "Mme. Forestier, strongly moved, took her two hands."}, {"lang": "zh", "text": "福雷斯蒂耶夫人感動地握住她的雙手。"}, {"lang": "en", "text": "\"Oh, my poor Mathilde! Why, my necklace was paste. It was worth at most five hundred francs!\""}, {"lang": "zh", "text": "“哦，我可憐的馬蒂爾德！我的項鍊是假的。最多值五百法郎！”"}], "en": ["\"I brought you back another just like it. And for this we have been ten years paying. You can understand that it was not easy for us, us who had nothing. At last it is ended, and I am very glad.\"", "Mme. Forestier had stopped.", "\"You say that you bought a necklace of diamonds to replace mine?\"", "\"Yes. You never noticed it, then! They were very like.\"", "And she smiled with a joy which was proud and naïve at once.", "Mme. Forestier, strongly moved, took her two hands.", "\"Oh, my poor Mathilde! Why, my necklace was paste. It was worth at most five hundred francs!\""], "zh": ["“我給你帶回了一條一模一樣的。為此我們已經支付了十年。你可以理解，對於我們這些一無所有的人來說，這並不容易。終於結束了，我非常高興。”", "福雷斯蒂耶夫人停下了腳步。", "“你說你買了一條鑽石項鍊來替代我的？”", "“是的。你從來沒有注意到嗎！它們非常相似。”", "她帶著驕傲而天真的喜悅微笑著。", "福雷斯蒂耶夫人感動地握住她的雙手。", "“哦，我可憐的馬蒂爾德！我的項鍊是假的。最多值五百法郎！”"]}];

            // 手機端：直接選取文字就觸發
            if (isMobile || e.altKey) {
                const selection = window.getSelection();
                const text = selection.toString().trim().toLowerCase();
                if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                    analyzeWord(text);
                }
            }
        });

        // 💡 電腦端：直接在英文段落雙擊單字即可查詢，不需要按 Alt，看小說時更方便
        document.addEventListener('dblclick', (e) => {
            if (isMobile) return; // 手機交給上面的 mouseup 處理，避免重複觸發
            if (!e.target.closest('.en-p')) return; // 只在英文段落內生效
            const selection = window.getSelection();
            const text = selection.toString().trim().toLowerCase();
            if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                analyzeWord(text);
            }
        });

        function analyzeWord(word) {
            const popup = document.getElementById('root-dict-popup');
            const title = document.getElementById('popup-word-title');
            const content = document.getElementById('popup-content');

            title.innerText = `🔍 【${word}】`;
            content.innerHTML = '';
            let hasResult = false;

            // 1. 字首：只取「最長匹配」，避免像 un / uni 這種短字首淹沒真正對的長字首
            let pMatches = [];
            dbPrefixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.startsWith(k)) pMatches.push({ key: k, meaning: item.meaning });
                });
            });
            const maxPLen = pMatches.reduce((m, x) => Math.max(m, x.key.length), 0);
            pMatches = pMatches.filter(x => x.key.length === maxPLen);

            // 2. 字尾：同樣只取「最長匹配」，並把同一個字尾在不同分類下的結果合併成一行
            let sRaw = [];
            dbSuffixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.endsWith(k) && k.length >= 2) sRaw.push({ key: k, meaning: item.meaning, category: item.category });
                });
            });
            const maxSLen = sRaw.reduce((m, x) => Math.max(m, x.key.length), 0);
            sRaw = sRaw.filter(x => x.key.length === maxSLen);
            const sGrouped = {};
            sRaw.forEach(x => {
                if (!sGrouped[x.key]) sGrouped[x.key] = { meanings: new Set(), categories: [] };
                if (x.meaning) sGrouped[x.key].meanings.add(x.meaning);
                sGrouped[x.key].categories.push(x.category);
            });
            const sMatches = Object.keys(sGrouped).map(k => ({
                key: k,
                meaning: Array.from(sGrouped[k].meanings).join('；'),
                categories: sGrouped[k].categories
            }));

            // 3. 字根：貪婪比對——優先用最長的字根，且已被字首/字尾/其他較長字根「占用」的字母範圍不再重複標記
            //    （例如 university 拆完 uni- 與 -ity 之後，中間巧合出現的 it 就不會再被誤判成字根）
            const prefixZoneEnd = maxPLen;
            const suffixZoneStart = word.length - maxSLen;

            const rootCandidates = {};
            dbRoots.forEach(item => {
                item.keys.forEach(k => {
                    if (k.length < 2) return;
                    if (!rootCandidates[k]) rootCandidates[k] = [];
                    rootCandidates[k].push(item.meaning);
                });
            });
            const sortedKeys = Object.keys(rootCandidates).sort((a, b) => b.length - a.length);

            let claimed = [];
            let rMatches = [];
            sortedKeys.forEach(k => {
                let searchFrom = 0;
                while (true) {
                    const idx = word.indexOf(k, searchFrom);
                    if (idx === -1) break;
                    const end = idx + k.length;
                    const insidePrefix = end <= prefixZoneEnd;
                    const insideSuffix = idx >= suffixZoneStart;
                    const overlapsClaimed = claimed.some(([cs, ce]) => idx < ce && end > cs);
                    if (!insidePrefix && !insideSuffix && !overlapsClaimed) {
                        claimed.push([idx, end]);
                        rMatches.push({ key: k, meaning: rootCandidates[k].join('；') });
                        break;
                    }
                    searchFrom = idx + 1;
                }
            });
            rMatches.sort((a, b) => b.key.length - a.key.length);

            if (pMatches.length > 0) {
                hasResult = true;
                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;
            }

            if (rMatches.length > 0) {
                hasResult = true;
                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🌱 字根 Root</div>${rows}</div>`;
            }

            if (sMatches.length > 0) {
                hasResult = true;
                const rows = sMatches.map(x => {
                    const mStr = x.meaning ? ` : ${x.meaning}` : '';
                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');
                    return `<div class="tag-item"><b>-${x.key}</b>${badges}${mStr}</div>`;
                }).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🔚 字尾 Suffix</div>${rows}</div>`;
            }

            if (!hasResult) {
                content.innerHTML += `<div class="no-result">本機字根資料庫沒有找到相符的片段，這個字可能是不規則變化，或不屬於常見的拉丁／希臘字源。</div>`;
            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function closePopup() { document.getElementById('root-dict-popup').style.display = 'none'; }
        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); closePopup(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }
        function seekProgress(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleMp3Play() {
            const label = document.getElementById('mp3BtnLabel');
            stopSpeaking();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => label.textContent = " 暫停").catch(() => alert('未找到 MP3 檔案'));
            } else { audioPlayer.pause(); label.textContent = " 全文"; }
        }
        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            stopSpeaking();
            const mySession = speechSession; // 記住這次朗讀的代號，換頁/停止後這個代號就會失效

            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;

            // 💡 Chrome / Edge 對「連續朗讀超過約 10~15 秒」有個知名臭蟲：
            //    語音引擎會自己悄悄卡住、不再出聲，且不會觸發 onerror。
            //    這裡用一個定時器每隔 10 秒做一次 pause()+resume()，
            //    讓瀏覽器誤以為朗讀「剛剛才被打斷又恢復」，藉此保持引擎運作，
            //    這是這個瀏覽器臭蟲公認的繞過方式。
            speechKeepAliveTimer = setInterval(() => {
                if (mySession !== speechSession) return;
                if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
                    window.speechSynthesis.pause();
                    window.speechSynthesis.resume();
                }
            }, 10000);

            function speakNext() {
                if (mySession !== speechSession) return; // 已經換頁或被停止，這次朗讀已經過期
                if (sentenceIndex >= sentences.length) { stopSpeaking(); return; }

                // handled 確保「正常唸完」「輪詢偵測到已結束」「保底逾時強制推進」
                // 這三條路徑不管誰先誰後觸發，都只會真正推進一次，不會跳過或重複下一句
                let handled = false;
                let started = false;   // 這句話是否真的已經開始發聲（避免還沒開始就被誤判成結束）

                function cleanupTimers() {
                    if (speechWatchdogTimer) { clearTimeout(speechWatchdogTimer); speechWatchdogTimer = null; }
                    if (speechPollTimer) { clearInterval(speechPollTimer); speechPollTimer = null; }
                }

                function advanceOnce() {
                    if (handled) return;
                    handled = true;
                    cleanupTimers();
                    if (mySession !== speechSession) return;
                    sentenceIndex++;
                    speakNext();
                }

                const currentSentence = sentences[sentenceIndex].trim();
                const utterance = new SpeechSynthesisUtterance(currentSentence);
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onstart = () => { started = true; };
                utterance.onend = advanceOnce;
                utterance.onerror = advanceOnce;

                // 💡 不猜這句話要唸多久，改成每 400ms 直接問瀏覽器
                //    「現在到底還在不在講話」。手機上 onend/onerror 有時候
                //    不會觸發，但只要瀏覽器自己回報「已經不在講話了」，
                //    就可以直接判斷這句其實已經結束（或已經悄悄失敗），
                //    往下一句走，不用死等一個可能永遠不會來的通知。
                //    一定要等到 onstart 真的觸發過，才開始檢查，避免這句
                //    根本還沒真正開口就被誤判成「已經講完」而提前跳過。
                speechPollTimer = setInterval(() => {
                    if (handled) return;
                    if (started && !window.speechSynthesis.speaking) {
                        advanceOnce();
                    }
                }, 400);

                // 保底的最長等待時間：只有在瀏覽器語音引擎「仍然回報還在講話」
                // 但實際上已經整個凍結、真的卡死很久的極端狀況才會用到，
                // 所以刻意設得比較寬鬆，避免正常朗讀被誤判成卡住而提前跳過內容。
                const estimatedMs = Math.max(8000, currentSentence.length * 260);
                speechWatchdogTimer = setTimeout(() => {
                    if (handled) return;
                    window.speechSynthesis.cancel();
                    advanceOnce();
                }, estimatedMs);

                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
        updatePage();
    </script>
</body>
</html>
