    <script>
        const pages = [{"id": 1, "en": ["A white-haired old man begged us for alms. My companion, Joseph Davranche, gave him five francs. Noticing my surprised look, he said:", "“That poor unfortunate reminds me of a story which I shall tell you, the memory of which continually pursues me. Here it is:", "“My family, which came originally from Havre, was not rich. We just managed to make both ends meet. My father worked hard, came home late from the office, and earned very little. I had two sisters.", "“My mother suffered a good deal from our reduced circumstances, and she often had harsh words for her husband, veiled and sly reproaches. The poor man then made a gesture which used to distress me. He would pass his open hand over his forehead, as if to wipe away perspiration which did not exist, and he would answer nothing. I felt his helpless suffering. We economized on everything, and never would accept an invitation to dinner, so as not to have to return the courtesy. All our provisions were bought at bargain sales. My sisters made their own gowns, and long discussions would arise on the price of a piece of braid worth fifteen centimes a yard. Our meals usually consisted of soup and beef, prepared with every kind of sauce."], "zh": ["一位白髮蒼蒼的老人向我們乞求施捨。我的同伴約瑟夫·達夫朗奇給了他五法郎。注意到我驚訝的神情，他說：", "“那可憐的家伙讓我想起一個故事，這個故事的記憶一直在我腦海裡揮之不去。故事是這樣的：", "“我的家族最初來自哈維爾，並不富裕。我們勉強能夠維持生計。我的父親工作努力，總是很晚才從辦公室回家，賺得很少。我有兩個姐妹。", "“我的母親因為我們的困境而受了不少苦，經常對她的丈夫說些尖刻的話，隱晦而狡猾的責備。可憐的男人會做一個讓我感到心痛的動作。他會把手掌在額頭上輕輕一抹，彷彿要擦去不存在的汗水，然後什麼也不說。我能感受到他的無助與痛苦。我們在各方面都節省開支，從不接受晚餐的邀請，因為不想回請。所有的食材都是在特價時購買的。我的姐妹們自己做衣服，對於一根價值十五分的織帶的價格，經常會展開長時間的討論。我們的餐食通常是湯和牛肉，搭配各種醬汁。", "----------------------------------------"]}, {"id": 2, "en": ["“They say it is wholesome and nourishing, but I should have preferred a change.", "“I used to go through terrible scenes on account of lost buttons and torn trousers.", "“Every Sunday, dressed in our best, we would take our walk along the breakwater. My father, in a frock coat, high hat and kid gloves, would offer his arm to my mother, decked out and beribboned like a ship on a holiday. My sisters, who were always ready first, would await the signal for leaving; but at the last minute some one always found a spot on my father's frock coat, and it had to be wiped away quickly with a rag moistened with benzine."], "zh": ["“人們說這樣的食物既健康又有營養，但我更希望能有些變化。", "“因為丟失了扣子和撕破的褲子，我經常經歷可怕的場面。", "“每個星期天，我們都會穿上最好的衣服，沿著防波堤散步。我的父親穿著燕尾服，戴著高帽和小羊皮手套，會把手臂伸給我的母親，她打扮得花枝招展，像一艘節日的船。我的姐妹們總是最早準備好，等待出發的信號；但在最後一刻，總會有人在我父親的燕尾服上發現一個污點，必須用沾了汽油的抹布迅速擦掉。", "----------------------------------------"]}, {"id": 3, "en": ["“My father, in his shirt sleeves, his silk hat on his head, would await the completion of the operation, while my mother, putting on her spectacles, and taking off her gloves in order not to spoil them, would make haste.", "“Then we set out ceremoniously. My sisters marched on ahead, arm in arm. They were of marriageable age and had to be displayed. I walked on the left of my mother and my father on her right. I remember the pompous air of my poor parents in these Sunday walks, their stern expression, their stiff walk. They moved slowly, with a serious expression, their bodies straight, their legs stiff, as if something of extreme importance depended upon their appearance."], "zh": ["“我的父親穿著襯衫，頭戴絲綢帽，耐心等待著這一過程的完成，而我的母親則急忙戴上眼鏡，脫下手套以免弄壞它們。", "“然後我們隆重出發。我的姐妹們手挽手走在前面。她們到了適婚年齡，必須被展示出來。我走在母親的左側，父親則在她的右側。我記得在這些星期天的散步中，我的父母顯得非常自負，表情嚴肅，步伐僵硬。他們走得很慢，面色嚴肅，身體挺直，雙腿僵硬，彷彿他們的外表關乎著某種極其重要的事情。", "----------------------------------------"]}, {"id": 4, "en": ["“Every Sunday, when the big steamers were returning from unknown and distant countries, my father would invariably utter the same words:", "“'What a surprise it would be if Jules were on that one! Eh?'", "“My Uncle Jules, my father's brother, was the only hope of the family, after being its only fear. I had heard about him since childhood, and it seemed to me that I should recognize him immediately, knowing as much about him as I did. I knew every detail of his life up to the day of his departure for America, although this period of his life was spoken of only in hushed tones."], "zh": ["“每個星期天，當大型輪船從未知的遙遠國度返回時，我的父親總是會說同樣的話：", "“‘如果朱爾在那艘船上，那會是多麼驚喜啊！嗯？’", "“我的叔叔朱爾，我父親的兄弟，是家族唯一的希望，曾經也是唯一的恐懼。我從小就聽說過他，似乎我對他的了解足以讓我立刻認出他。我知道他生活的每一個細節，直到他出發去美國的那一天，雖然這段他生活的時期總是低聲談論。", "----------------------------------------"]}, {"id": 5, "en": ["“It seems that he had led a bad life, that is to say, he had squandered a little money, which action, in a poor family, is one of the greatest crimes. With rich people a man who amuses himself only sows his wild oats. He is what is generally called a sport. But among needy families a boy who forces his parents to break into the capital becomes a good-for-nothing, a rascal, a scamp. And this distinction is just, although the action be the same, for consequences alone determine the seriousness of the act.", "“Well, Uncle Jules had visibly diminished the inheritance on which my father had counted, after he had swallowed his own to the last penny. Then, according to the custom of the times, he had been shipped off to America on a freighter going from Havre to New York."], "zh": ["“據說他過著不光彩的生活，也就是說，他揮霍了一些錢，而在一個貧窮的家庭中，這種行為是最大的罪行。在富人中，僅僅是尋樂的男人被稱為玩世不恭的紳士。但在貧困家庭中，迫使父母動用資本的男孩則成為無用之人，流氓，惡棍。這種區別是正當的，儘管行為相同，因為後果才決定了行為的嚴重性。", "“好吧，叔叔朱爾明顯減少了我父親所期待的遺產，因為他自己已經把所有的錢都揮霍一空。然後，根據當時的習俗，他被送上了一艘從哈維爾開往紐約的貨船，前往美國。", "----------------------------------------"]}, {"id": 6, "en": ["“Once there, my uncle began to sell something or other, and he soon wrote that he was making a little money and that he soon hoped to be able to indemnify my father for the harm he had done him. This letter caused a profound emotion in the family. Jules, who up to that time had not been worth his salt, suddenly became a good man, a kind-hearted fellow, true and honest like all the Davranches.", "“One of the captains told us that he had rented a large shop and was doing an important business.", "“Two years later a second letter came, saying: 'My dear Philippe, I am writing to tell you not to worry about my health, which is excellent. Business is good. I leave to-morrow for a long trip to South America. I may be away for several years without sending you any news. If I shouldn't write, don't worry. When my fortune is made I shall return to Havre. I hope that it will not be too long and that we shall all live happily together....'"], "zh": ["“一到那裡，我的叔叔開始賣些什麼，並很快寫信說他賺了一些錢，並希望能夠賠償我父親對他的傷害。這封信在家族中引起了深刻的情感。朱爾，直到那時還不值一提，突然變成了一個好人，一個善良的人，像所有的達夫朗奇一樣真誠而誠實。", "“一位船長告訴我們，他租了一家大商店，生意興隆。", "“兩年後，第二封信來了，說：‘親愛的菲利普，我寫信告訴你，我的健康很好，生意也很好。我明天要去南美洲長途旅行，可能會有幾年不會給你寫信。如果我不寫，別擔心。等我賺到錢，我會回到哈維爾。我希望不會太久，我們都能幸福地生活在一起……’", "----------------------------------------"]}, {"id": 7, "en": ["“This letter became the gospel of the family. It was read on the slightest provocation, and it was shown to everybody.", "“For ten years nothing was heard from Uncle Jules; but as time went on my father's hope grew, and my mother, also, often said:", "“'When that good Jules is here, our position will be different. There is one who knew how to get along!'", "“And every Sunday, while watching the big steamers approaching from the horizon, pouring out a stream of smoke, my father would repeat his eternal question:", "“'What a surprise it would be if Jules were on that one! Eh?'"], "zh": ["“這封信成為了家族的福音。只要有一點機會就會被讀出來，並展示給每個人看。", "“十年來沒有收到來自叔叔朱爾的消息；但隨著時間的推移，我父親的希望越來越強，而我的母親也常常說：", "“‘當那個好朱爾回來時，我們的處境會有所不同。這是一個懂得如何過日子的人！’", "“每個星期天，當看著從地平線上接近的大輪船，冒出一股煙霧時，我的父親都會重複他那句永恆的問題：", "“‘如果朱爾在那艘船上，那會是多麼驚喜啊！嗯？’", "----------------------------------------"]}, {"id": 8, "en": ["“We almost expected to see him waving his handkerchief and crying:", "“'Hey! Philippe!'", "“Thousands of schemes had been planned on the strength of this expected return; we were even to buy a little house with my uncle's money—a little place in the country near Ingouville. In fact, I wouldn't swear that my father had not already begun negotiations.", "“The elder of my sisters was then twenty-eight, the other twenty-six. They were not yet married, and that was a great grief to every one.", "“At last a suitor presented himself for the younger one. He was a clerk, not rich, but honorable. I have always been morally certain that Uncle Jules' letter, which was shown him one evening, had swept away the young man's hesitation and definitely decided him."], "zh": ["“我們幾乎期待看到他揮舞著手帕，喊著：", "“‘嘿！菲利普！’", "“基於這次期待的回歸，我們計劃了成千上萬的計劃；我們甚至打算用我叔叔的錢買一棟小房子——一個位於英古維爾附近的鄉村小地方。事實上，我不敢保證我父親沒有開始進行談判。", "“我的姐姐們當時分別二十八歲和二十六歲。她們還沒有結婚，這讓每個人都感到非常悲傷。", "“最後，年輕的妹妹出現了一位求婚者。他是一名職員，並不富裕，但品德高尚。我一直堅信，叔叔朱爾的信在某個晚上展示給他看，讓這位年輕人的猶豫消失，並最終讓他下定決心。", "----------------------------------------"]}, {"id": 9, "en": ["“He was accepted eagerly, and it was decided that after the wedding the whole family should take a trip to Jersey.", "“Jersey is the ideal trip for poor people. It is not far; one crosses a strip of sea in a steamer and lands on foreign soil, as this little island belongs to England. Thus, a Frenchman, with a two hours' sail, can observe a neighboring people at home and study their customs.", "“This trip to Jersey completely absorbed our ideas, was our sole anticipation, the constant thought of our minds.", "“At last we left. I see it as plainly as if it had happened yesterday. The boat was getting up steam against the quay at Granville; my father, bewildered, was superintending the loading of our three pieces of baggage; my mother, nervous, had taken the arm of my unmarried sister, who seemed lost since the departure of the other one, like the last chicken of a brood; behind us came the bride and groom, who always stayed behind, a thing that often made me turn round."], "zh": ["“他被熱情接受，並決定在婚後全家一起去澤西島旅行。", "“澤西島是貧困人家的理想旅行地。距離不遠；只需乘坐輪船穿越一段海域，就能踏上異國的土地，因為這個小島屬於英國。因此，一位法國人只需兩小時的航行，就能在家中觀察鄰國人民，研究他們的習俗。", "“這次澤西島之行完全佔據了我們的想法，成為我們唯一的期待，時刻萦繞在心頭。", "“終於，我們出發了。我清楚地記得，就像昨天發生的一樣。船在格朗維爾的碼頭上加壓蒸汽；我父親神情恍惚，正在監督我們的三件行李的裝載；我母親緊張地挽著她未婚的女兒的手臂，因為她似乎在另一位姐妹出發後感到迷失，像是最後一隻小雞；在我們身後是新婚夫婦，他們總是走在最後，這讓我經常回頭。", "----------------------------------------"]}, {"id": 10, "en": ["“The whistle sounded. We got on board, and the vessel, leaving the breakwater, forged ahead through a sea as flat as a marble table. We watched the coast disappear in the distance, happy and proud, like all who do not travel much.", "“My father was swelling out his chest in the breeze, beneath his frock coat, which had that morning been very carefully cleaned; and he spread around him that odor of benzine which always made me recognize Sunday. Suddenly he noticed two elegantly dressed ladies to whom two gentlemen were offering oysters. An old, ragged sailor was opening them with his knife and passing them to the gentlemen, who would then offer them to the ladies. They ate them in a dainty manner, holding the shell on a fine handkerchief and advancing their mouths a little in order not to spot their dresses. Then they would drink the liquid with a rapid little motion and throw the shell overboard."], "zh": ["“汽笛響了。我們上了船，船隻離開防波堤，穿過平坦如大理石桌面的海面。我們看著海岸在遠方消失，心中快樂而自豪，像所有不常旅行的人一樣。", "“我的父親在微風中挺起胸膛，燕尾服在那天早上被仔細清洗過；他四周彌漫著那種汽油的氣味，這總讓我認出星期天的到來。突然，他注意到兩位穿著優雅的女士，兩位紳士正在向她們提供生蠔。一位衣衫襤褸的老水手用刀打開生蠔，然後把它們遞給紳士，紳士再把它們遞給女士。她們優雅地吃著，手捧著貝殼，放在精緻的手帕上，微微前傾嘴巴，以免弄髒衣服。然後，她們快速地喝下液體，並把貝殼扔到海裡。", "----------------------------------------"]}, {"id": 11, "en": ["“My father was probably pleased with this delicate manner of eating oysters on a moving ship. He considered it good form, refined, and, going up to my mother and sisters, he asked:", "“'Would you like me to offer you some oysters?'", "“My mother hesitated on account of the expense, but my two sisters immediately accepted. My mother said in a provoked manner:", "“'I am afraid that they will hurt my stomach. Offer the children some, but not too much, it would make them sick.' Then, turning toward me, she added:", "“'As for Joseph, he doesn't need any. Boys shouldn't be spoiled.'"], "zh": ["“我父親可能對這種在移動的船上優雅地吃生蠔的方式感到滿意。他認為這是良好的風度，優雅的舉止，於是走到我的母親和姐妹們身邊，問道：", "“‘你們想讓我給你們提供一些生蠔嗎？’", "“我的母親因為費用而猶豫，但我的兩個姐妹立刻接受了。我的母親不滿地說：", "“‘我擔心這會傷到我的胃。給孩子們一些，但不要太多，這會讓他們不舒服。’然後，轉向我，她補充道：", "“‘至於約瑟夫，他不需要。男孩不應該被寵壞。’", "----------------------------------------"]}, {"id": 12, "en": ["“However, I remained beside my mother, finding this discrimination unjust. I watched my father as he pompously conducted my two sisters and his son-in-law toward the ragged old sailor.", "“The two ladies had just left, and my father showed my sisters how to eat them without spilling the liquor. He even tried to give them an example, and seized an oyster. He attempted to imitate the ladies, and immediately spilled all the liquid over his coat. I heard my mother mutter:", "“'He would do far better to keep quiet.'", "“But, suddenly, my father appeared to be worried; he retreated a few steps, stared at his family gathered around the old shell opener, and quickly came toward us. He seemed very pale, with a peculiar look. In a low voice he said to my mother:"], "zh": ["“然而，我仍然留在母親身邊，覺得這種區別不公。我看著我的父親，莊重地帶著我的兩個姐妹和他的女婿走向那位衣衫襤褸的老水手。", "“兩位女士剛剛離開，我的父親向姐妹們展示了如何不灑出液體地吃生蠔。他甚至試圖給她們做個示範，抓起一個生蠔。他試圖模仿那些女士，結果把所有的液體都灑在了他的外套上。我聽到我的母親低聲咕噥：", "“‘他最好還是安靜點。’", "“但突然，我的父親似乎變得擔憂；他退後幾步，盯著圍繞著老開殼者的家人，然後迅速走向我們。他看起來非常蒼白，神情異常，低聲對我的母親說：", "----------------------------------------"]}, {"id": 13, "en": ["“'It's extraordinary how that man opening the oysters looks like Jules.'", "“Astonished, my mother asked:", "“'What Jules?'", "“My father continued:", "“'Why, my brother. If I did not know that he was well off in America, I should think it was he.'", "“Bewildered, my mother stammered:", "“'You are crazy! As long as you know that it is not he, why do you say such foolish things?'", "“But my father insisted:", "“'Go on over and see, Clarisse! I would rather have you see with your own eyes.'", "“She arose and walked to her daughters. I, too, was watching the man. He was old, dirty, wrinkled, and did not lift his eyes from his work."], "zh": ["“‘那個開生蠔的男人真像朱爾。’", "“驚訝的母親問：", "“‘什麼朱爾？’", "“我的父親繼續說：", "“‘我兄弟。如果我不知道他在美國過得很好，我會以為是他。’", "“困惑的母親結結巴巴地說：", "“‘你瘋了！既然你知道他不是，那為什麼要說這種愚蠢的話？’", "“但我的父親堅持：", "“‘去看看，克拉麗絲！我寧願你親自去看。’", "“她站起來走向她的女兒。我也在看著那個男人。他年紀大了，髒兮兮的，皺巴巴的，眼睛始終盯著他的工作。", "----------------------------------------"]}, {"id": 14, "en": ["“My mother returned. I noticed that she was trembling. She exclaimed quickly:", "“'I believe that it is he. Why don't you ask the captain? But be very careful that we don't have this rogue on our hands again!'", "“My father walked away, but I followed him. I felt strangely moved.", "“The captain, a tall, thin man, with blond whiskers, was walking along the bridge with an important air as if he were commanding the Indian mail steamer.", "“My father addressed him ceremoniously, and questioned him about his profession, adding many compliments:", "“'What might be the importance of Jersey? What did it produce? What was the population? The customs? The nature of the soil?' etc., etc."], "zh": ["“我的母親回來了。我注意到她在顫抖。她迅速驚呼：", "“‘我相信那就是他。為什麼不問船長？但要非常小心，別讓這個流浪漢再次出現在我們面前！’", "“我的父親走開了，但我跟在他後面。我感到奇怪的激動。", "“船長是一位高瘦的男人，金色的鬍鬚，神情自負地走在橋上，彷彿他正在指揮印度郵輪。", "“我的父親正式地向他詢問他的職業，並附上了許多讚美：", "“‘澤西島的重要性是什麼？它生產什麼？人口是多少？風俗？土壤的性質？’等等等等。", "----------------------------------------"]}, {"id": 15, "en": ["“'You have there an old shell opener who seems quite interesting. Do you know anything about him?'", "“The captain, whom this conversation began to weary, answered dryly:", "“'He is some old French tramp whom I found last year in America, and I brought him back. It seems that he has some relatives in Havre, but that he doesn't wish to return to them because he owes them money. His name is Jules—Jules Darmanche or Darvanche or something like that. It seems that he was once rich over there, but you can see what's left of him now.'", "“My father turned ashy pale and muttered, his throat contracted, his eyes haggard."], "zh": ["“‘你那裡有一位看起來相當有趣的老開殼者。你知道他什麼嗎？’", "“船長因為這段對話開始感到厭煩，冷淡地回答：", "“‘他是一個我去年在美國找到的老法國流浪漢，我把他帶回來。似乎他在哈維爾有親戚，但他不想回去，因為他欠他們錢。他的名字是朱爾——朱爾·達夫朗奇或達夫朗奇之類的。似乎他曾經在那邊很富有，但你可以看到他現在的樣子。’", "“我的父親臉色變得蒼白，喃喃自語，喉嚨緊縮，眼神憔悴。", "----------------------------------------"]}, {"id": 16, "en": ["“'Ah! ah! very well, very well. I'm not in the least surprised. Thank you very much, captain.'", "“He went away, and the astonished sailor watched him disappear. He returned to my mother so upset that she said to him:", "“'Sit down; some one will notice that something is the matter.'", "“He sank down on a bench and stammered:", "“'It's he! It's he!'", "“Then he asked:", "“'What are we going to do?'", "“She answered quickly:", "“'We must get the children out of the way. Since Joseph knows everything, he can go and get them. We must take good care that our son-in-law doesn't find out.'"], "zh": ["“‘啊！啊！很好，非常好。我一點也不驚訝。非常感謝你，船長。’", "“他走開了，驚訝的水手看著他消失。他回到我母親身邊，心情如此不安，以至於她對他說：", "“‘坐下；有人會注意到有什麼不對勁的。’", "“他坐在長椅上，結結巴巴地說：", "“‘就是他！就是他！’", "“然後他問：", "“‘我們該怎麼辦？’", "“她迅速回答：", "“‘我們必須把孩子們弄走。既然約瑟夫知道一切，他可以去把他們帶來。我們必須小心，讓我們的女婿不知道。’", "----------------------------------------"]}, {"id": 17, "en": ["“My father seemed absolutely bewildered. He murmured:", "“'What a catastrophe!'", "“Suddenly growing furious, my mother exclaimed:", "“'I always thought that that thief never would do anything, and that he would drop down on us again! As if one could expect anything from a Davranche!'", "“My father passed his hand over his forehead, as he always did when his wife reproached him. She added:", "“'Give Joseph some money so that he can pay for the oysters. All that it needed to cap the climax would be to be recognized by that beggar. That would be very pleasant! Let's get down to the other end of the boat, and take care that that man doesn't come near us!'"], "zh": ["“我的父親似乎完全困惑。他喃喃自語：", "“‘真是場災難！’", "“突然變得憤怒，我的母親驚呼：", "“‘我一直認為那個小偷不會有任何作為，會再次掉到我們身上！就好像人們能期待達夫朗奇會做什麼！’", "“我的父親用手擦了擦額頭，這是他在妻子責備他時總會做的動作。她接著說：", "“‘給約瑟夫一些錢，讓他能付生蠔的錢。要是被那個乞丐認出來，那就太糟糕了！這會很愉快的！我們去船的另一端，確保那個人不會靠近我們！’", "----------------------------------------"]}, {"id": 18, "en": ["“They gave me five francs and walked away.", "“Astonished, my sisters were awaiting their father. I said that mamma had felt a sudden attack of sea-sickness, and I asked the shell opener:", "“'How much do we owe you, monsieur?'", "“I felt like laughing: he was my uncle! He answered:", "“'Two francs fifty.'", "“I held out my five francs and he returned the change. I looked at his hand; it was a poor, wrinkled, sailor's hand, and I looked at his face, an unhappy old face. I said to myself:", "“'That is my uncle, the brother of my father, my uncle!'"], "zh": ["“他們給了我五法郎，然後走開了。", "“驚訝的姐妹們在等待她們的父親。我說媽媽突然感到暈船，然後我問那位開殼者：", "“‘我們欠您多少，先生？’", "“我忍不住想笑：他就是我的叔叔！他回答：", "“‘兩法郎五十分。’", "“我伸出我的五法郎，他給了我找回的錢。我看著他的手；那是一隻貧窮、皺巴巴的水手的手，我看著他的臉，一張不幸的老臉。我對自己說：", "“‘那是我的叔叔，我父親的兄弟，我的叔叔！’", "----------------------------------------"]}, {"id": 19, "en": ["“I gave him a ten-cent tip. He thanked me:", "“'God bless you, my young sir!'", "“He spoke like a poor man receiving alms. I couldn't help thinking that he must have begged over there! My sisters looked at me, surprised at my generosity. When I returned the two francs to my father, my mother asked me in surprise:", "“'Was there three francs' worth? That is impossible.'", "“I answered in a firm voice", "“'I gave ten cents as a tip.'", "“My mother started, and, staring at me, she exclaimed:", "“'You must be crazy! Give ten cents to that man, to that vagabond—'"], "zh": ["“我給了他一個十分的小費。他感謝我：", "“‘上帝保佑你，我的小先生！’", "“他說話的語氣像是一位接受施捨的可憐人。我不禁想到他一定在那邊乞討過！我的姐妹們驚訝地看著我，對我的慷慨感到驚訝。當我把兩法郎還給我父親時，我的母親驚訝地問我：", "“‘有三法郎的價值嗎？這不可能。’", "“我堅定地回答：", "“‘我給了十分的小費。’", "“我的母親驚訝地一驚，盯著我，驚呼：", "“‘你瘋了！給那個人，給那個流浪漢十分——’", "----------------------------------------"]}, {"id": 20, "en": ["“She stopped at a look from my father, who was pointing at his son-in-law. Then everybody was silent.", "“Before us, on the distant horizon, a purple shadow seemed to rise out of the sea. It was Jersey.", "“As we approached the breakwater a violent desire seized me once more to see my Uncle Jules, to be near him, to say to him something consoling, something tender. But as no one was eating any more oysters, he had disappeared, having probably gone below to the dirty hold which was the home of the poor wretch.", "“And we came back on the Saint-Malo boat, so as not to run into him. My mother was consumed with anxiety.", "“I never saw my father's brother again! That's why you will sometimes see me give a hundred sous to vagabonds.”"], "zh": ["“她在我父親指著他的女婿的一個眼神下停住了。然後大家都沉默了。", "“在我們面前，遠方的地平線上，一個紫色的影子似乎從海中升起。那是澤西島。", "“當我們接近防波堤時，我再次強烈渴望見到我的叔叔朱爾，想要靠近他，對他說些安慰的話，溫柔的話。但由於沒有人再吃生蠔，他已經消失了，可能是回到了那個骯髒的艙房，成為那位可憐的可憐者的家。", "“我們乘坐聖馬洛的船返回，以免與他相遇。我的母親焦慮不已。", "“我再也沒有見到我父親的兄弟！這就是為什麼你有時會看到我給流浪漢一百分的原因。"]}];

tegory": "形容詞字尾", "keys": ["most"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ory"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ous"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["some"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["ward"], "meaning": ""}, {"category": "形容詞字尾", "keys": ["y"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ence"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ling", "long"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ly"], "meaning": ""}, {"category": "副詞字尾", "keys": ["ward(s)"], "meaning": ""}, {"category": "副詞字尾", "keys": ["way(s)", "wise"], "meaning": ""}, {"category": "動詞字尾", "keys": ["ate"], "meaning": ""}, {"category": "動詞字尾", "keys": ["en"], "meaning": ""}, {"category": "動詞字尾", "keys": ["er"], "meaning": ""}, {"category": "動詞字尾", "keys": ["fy"], "meaning": ""}, {"category": "動詞字尾", "keys": ["ize", "ise"], "meaning": ""}, {"category": "動詞字尾", "keys": ["ish"], "meaning": ""}, {"category": "動詞字尾", "keys": ["le"], "meaning": ""}];

        let currentIndex = 0;
        let currentFontScale = parseFloat(localStorage.getItem('bilingual_font_scale')) || 1.0;
        const audioPlayer = document.getElementById('audioPlayer');

        document.documentElement.style.setProperty('--font-scale', currentFontScale);

        function changeFontSize(delta) {
            currentFontScale = Math.min(Math.max(0.7, currentFontScale + delta), 1.8);
            document.documentElement.style.setProperty('--font-scale', currentFontScale);
            localStorage.setItem('bilingual_font_scale', currentFontScale);
        }

        function updatePage() {
            if (!pages || pages.length === 0) return;
            const page = pages[currentIndex];
            const container = document.getElementById('paragraph-box');
            container.innerHTML = '';

            if (page.en && page.en.length > 0) {
                const enSec = document.createElement('div');
                enSec.className = 'en-section';
                page.en.forEach(pText => {
                    const p = document.createElement('div'); p.className = 'en-p'; p.innerText = pText; enSec.appendChild(p);
                });
                container.appendChild(enSec);
            }

            if (page.zh && page.zh.length > 0) {
                const zhSec = document.createElement('div');
                zhSec.className = 'zh-section';
                page.zh.forEach(pText => {
                    const p = document.createElement('div'); p.className = 'zh-p'; p.innerText = pText; zhSec.appendChild(p);
                });
                container.appendChild(zhSec);
            }

            document.getElementById('page-info').innerText = `${currentIndex + 1} / ${pages.length}`;
            document.getElementById('progress').style.width = `${((currentIndex + 1) / pages.length) * 100}%`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === pages.length - 1;
            document.getElementById('main-content').scrollTop = 0;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // 💡 智慧辨識電腦與手機觸控事件
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        document.addEventListener('mouseup', (e) => {
            // 電腦端：按住 Alt 鍵再選取才觸發（避開 Google 翻譯／一般選字）
            // 手機端：直接選取文字就觸發
            if (isMobile || e.altKey) {
                const selection = window.getSelection();
                const text = selection.toString().trim().toLowerCase();
                if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                    analyzeWord(text);
                }
            }
        });

        // 💡 電腦端：直接在英文段落雙擊單字即可查詢，不需要按 Alt，看小說時更方便
        document.addEventListener('dblclick', (e) => {
            if (isMobile) return; // 手機交給上面的 mouseup 處理，避免重複觸發
            if (!e.target.closest('.en-p')) return; // 只在英文段落內生效
            const selection = window.getSelection();
            const text = selection.toString().trim().toLowerCase();
            if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                analyzeWord(text);
            }
        });

        function analyzeWord(word) {
            const popup = document.getElementById('root-dict-popup');
            const title = document.getElementById('popup-word-title');
            const content = document.getElementById('popup-content');

            title.innerText = `🔍 【${word}】`;
            content.innerHTML = '';
            let hasResult = false;

            // 1. 字首：只取「最長匹配」，避免像 un / uni 這種短字首淹沒真正對的長字首
            let pMatches = [];
            dbPrefixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.startsWith(k)) pMatches.push({ key: k, meaning: item.meaning });
                });
            });
            const maxPLen = pMatches.reduce((m, x) => Math.max(m, x.key.length), 0);
            pMatches = pMatches.filter(x => x.key.length === maxPLen);

            // 2. 字尾：同樣只取「最長匹配」，並把同一個字尾在不同分類下的結果合併成一行
            let sRaw = [];
            dbSuffixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.endsWith(k) && k.length >= 2) sRaw.push({ key: k, meaning: item.meaning, category: item.category });
                });
            });
            const maxSLen = sRaw.reduce((m, x) => Math.max(m, x.key.length), 0);
            sRaw = sRaw.filter(x => x.key.length === maxSLen);
            const sGrouped = {};
            sRaw.forEach(x => {
                if (!sGrouped[x.key]) sGrouped[x.key] = { meanings: new Set(), categories: [] };
                if (x.meaning) sGrouped[x.key].meanings.add(x.meaning);
                sGrouped[x.key].categories.push(x.category);
            });
            const sMatches = Object.keys(sGrouped).map(k => ({
                key: k,
                meaning: Array.from(sGrouped[k].meanings).join('；'),
                categories: sGrouped[k].categories
            }));

            // 3. 字根：貪婪比對——優先用最長的字根，且已被字首/字尾/其他較長字根「占用」的字母範圍不再重複標記
            //    （例如 university 拆完 uni- 與 -ity 之後，中間巧合出現的 it 就不會再被誤判成字根）
            const prefixZoneEnd = maxPLen;
            const suffixZoneStart = word.length - maxSLen;

            const rootCandidates = {};
            dbRoots.forEach(item => {
                item.keys.forEach(k => {
                    if (k.length < 2) return;
                    if (!rootCandidates[k]) rootCandidates[k] = [];
                    rootCandidates[k].push(item.meaning);
                });
            });
            const sortedKeys = Object.keys(rootCandidates).sort((a, b) => b.length - a.length);

            let claimed = [];
            let rMatches = [];
            sortedKeys.forEach(k => {
                let searchFrom = 0;
                while (true) {
                    const idx = word.indexOf(k, searchFrom);
                    if (idx === -1) break;
                    const end = idx + k.length;
                    const insidePrefix = end <= prefixZoneEnd;
                    const insideSuffix = idx >= suffixZoneStart;
                    const overlapsClaimed = claimed.some(([cs, ce]) => idx < ce && end > cs);
                    if (!insidePrefix && !insideSuffix && !overlapsClaimed) {
                        claimed.push([idx, end]);
                        rMatches.push({ key: k, meaning: rootCandidates[k].join('；') });
                        break;
                    }
                    searchFrom = idx + 1;
                }
            });
            rMatches.sort((a, b) => b.key.length - a.key.length);

            if (pMatches.length > 0) {
                hasResult = true;
                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;
            }

            if (rMatches.length > 0) {
                hasResult = true;
                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🌱 字根 Root</div>${rows}</div>`;
            }

            if (sMatches.length > 0) {
                hasResult = true;
                const rows = sMatches.map(x => {
                    const mStr = x.meaning ? ` : ${x.meaning}` : '';
                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');
                    return `<div class="tag-item"><b>-${x.key}</b>${badges}${mStr}</div>`;
                }).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🔚 字尾 Suffix</div>${rows}</div>`;
            }

            if (!hasResult) {
                content.innerHTML += `<div class="no-result">本機字根資料庫沒有找到相符的片段，這個字可能是不規則變化，或不屬於常見的拉丁／希臘字源。</div>`;
            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function closePopup() { document.getElementById('root-dict-popup').style.display = 'none'; }
        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); closePopup(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }
        function seekProgress(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
        function toggleMp3Play() {
            const label = document.getElementById('mp3BtnLabel');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => label.textContent = " 暫停").catch(() => alert('未找到 MP3 檔案'));
            } else { audioPlayer.pause(); label.textContent = " 全文"; }
        }
        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;
            function speakNext() {
                if (sentenceIndex >= sentences.length) return;
                const utterance = new SpeechSynthesisUtterance(sentences[sentenceIndex].trim());
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onend = () => { sentenceIndex++; speakNext(); };
                utterance.onerror = () => { sentenceIndex++; speakNext(); };
                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
        updatePage();
    </script>
