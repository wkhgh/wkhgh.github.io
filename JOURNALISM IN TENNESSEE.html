    <style>
        :root {
            --bg-color: #f8f9fa;

        * { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column;

        header {

            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;
        }

        .controls { display: flex; align-items: center; gap: 5px; }

        .controls button {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.88rem;
        }

        main { flex: 1; display: flex; position: relative; overflow-y: auto; padding: 15px 0; }

        .click-zone { position: absolute; top: 0; bottom: 0; width: 8%; z-index: 5; cursor: pointer; user-select: none; }
        .click-left { left: 0; } .click-right { right: 0; }

        .card-container { width: 95%; max-width: 1200px; margin: auto; padding: 0 10px; z-index: 10; }

        .paragraph-box {
            background-color: var(--card-bg); padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
        }

        .en-p {
            font-size: calc(1.18rem * var(--font-scale)); line-height: 1.65;
            font-family: Georgia, serif; color: var(--text-main); margin-bottom: 16px;
            user-select: text !important; cursor: text;
        }

        .zh-p {
            font-size: calc(1.25rem * var(--font-scale)); line-height: 1.85;
            font-family: "標楷體", serif; color: var(--text-sub);
            margin: 0 0 24px 0; padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            user-select: text !important;
        }

        /* 字根分析彈窗 */
        #root-dict-popup {
            display: none; position: fixed; bottom: 80px; left: 30px; width: 340px; max-height: 420px;
            background-color: var(--card-bg); border: 2px solid var(--accent-color);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999;
            padding: 16px; overflow-y: auto; font-family: -apple-system, sans-serif;
        }

        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 12px; }
        .popup-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); }
        .close-btn { cursor: pointer; font-weight: bold; font-size: 1.2rem; color: var(--text-sub); }
        .tag-group { margin-bottom: 10px; }
        .tag-title { font-size: 0.85rem; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
        .tag-item { background-color: var(--bg-color); border-left: 3px solid var(--accent-color); padding: 6px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 0.9rem; }
        .suffix-badge { display: inline-block; background-color: var(--accent-color); color: white; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 4px; }
        .no-result { font-size: 0.85rem; color: var(--text-sub); line-height: 1.6; padding: 6px 2px 10px 2px; }
        .etymo-link { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); text-align: center; }
        .etymo-link a { color: var(--accent-color); text-decoration: none; font-size: 0.88rem; font-weight: bold; }
        .etymo-link a:hover { text-decoration: underline; }

        footer {
            height: 65px; padding: 8px 25px; background-color: var(--card-bg);
            border-top: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; gap: 6px; flex-shrink: 0; z-index: 20; user-select: none;
        }
        .progress-bar-container { width: 100%; background-color: var(--border-color); height: 6px; border-radius: 3px; overflow: hidden; cursor: pointer; }
        .progress-bar { height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.2s; }
        .footer-controls { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-sub); }
        .nav-btn { background-color: var(--accent-color); color: white; border: none; padding: 8px 22px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: bold; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        @media (max-width: 600px) {
            #root-dict-popup { left: 5%; right: 5%; width: 90%; bottom: 75px; }
            /* 手機螢幕窄，按鈕文字容易換行、把整個 header 撐成兩三行，
               所以只保留圖示、隱藏文字說明；電腦寬螢幕不受影響，文字照常顯示。 */
            .btn-label { display: none; }
            .controls button { padding: 6px 9px; }
        }

    <script>
        const pages = [{"id": 1, "blocks": [{"lang": "en", "text": "JOURNALISM IN TENNESSEE"}, {"lang": "zh", "text": "田納西州的新聞業"}, {"lang": "en", "text": "The editor of the Memphis Avalanche swoops thus mildly down upon a correspondent who posted him as a Radical:—“While he was writing the first word, the middle, dotting his i’s, crossing his t’s, and punching his period, he knew he was concocting a sentence that was saturated with infamy and reeking with falsehood.”—Exchange."}, {"lang": "zh", "text": "《孟菲斯雪崩報》的編輯輕描淡寫地對一位將他標記為激進派的通訊員進行了批評：“當他寫下第一個字、中間的部分、點綴他的 i、劃過他的 t，並敲下他的句號時，他知道自己正在編造一個充滿惡名和虛假之詞的句子。”——摘錄。"}, {"lang": "en", "text": "I was told by the physician that a Southern climate would improve my health, and so I went down to Tennessee, and got a berth on the Morning Glory and Johnson County War-Whoop as associate editor. When I went on duty I found the chief editor sitting tilted back in a three-legged chair with his feet on a pine table. There was another pine table in the room and another afflicted chair, and both were half buried under newspapers and scraps and sheets of manuscript. There was a wooden box of sand, sprinkled with cigar stubs and “old soldiers,” and a stove with a door hanging by its upper hinge. The chief editor had a long-tailed black cloth frock-coat on, and white linen pants. His boots were small and neatly blacked. He wore a ruffled shirt, a large seal-ring, a standing collar of obsolete pattern, and a checkered neckerchief with the ends hanging down. Date of costume about 1848. He was smoking a cigar, and trying to think of a word, and in pawing his hair he had rumpled his locks a good deal. He was scowling fearfully, and I judged that he was concocting a particularly knotty editorial. He told me to take the exchanges and skim through them and write up the “Spirit of the Tennessee Press,” condensing into the article all of their contents that seemed of interest."}, {"lang": "zh", "text": "我被醫生告知南方的氣候會改善我的健康，因此我來到了田納西州，並在《晨光暨約翰遜郡戰吼報》找到一份副主編的差事。。當我上班時，發現主編正坐在一把三條腿的椅子上，腳搭在一張松木桌子上。房間裡還有另一張松木桌子和一把受損的椅子，兩者都半埋在報紙、碎片和手稿的紙張下。那裡有一個裝沙子的木箱，上面撒滿了雪茄煙蒂和“老兵”，還有一個門懸掛著的爐子。主編穿著一件長尾黑色布外套和白色亞麻褲，靴子小巧且擦得很乾淨。他穿著一件有褶的襯衫、一枚大印章戒指、一個過時的立領，以及一條末端垂下的格子領巾。服裝的日期大約是1848年。他正在抽雪茄，試圖想出一個詞，撥弄頭髮時把頭髮弄得亂七八糟。他的臉色陰沉，我判斷他正在構思一篇特別棘手的社論。他告訴我去處理交換稿，瀏覽一下，寫一篇《田納西報的精神》，將所有看似有趣的內容濃縮進文章中。"}], "en": ["JOURNALISM IN TENNESSEE", "The editor of the Memphis Avalanche swoops thus mildly down upon a correspondent who posted him as a Radical:—“While he was writing the first word, the middle, dotting his i’s, crossing his t’s, and punching his period, he knew he was concocting a sentence that was saturated with infamy and reeking with falsehood.”—Exchange.", "I was told by the physician that a Southern climate would improve my health, and so I went down to Tennessee, and got a berth on the Morning Glory and Johnson County War-Whoop as associate editor. When I went on duty I found the chief editor sitting tilted back in a three-legged chair with his feet on a pine table. There was another pine table in the room and another afflicted chair, and both were half buried under newspapers and scraps and sheets of manuscript. There was a wooden box of sand, sprinkled with cigar stubs and “old soldiers,” and a stove with a door hanging by its upper hinge. The chief editor had a long-tailed black cloth frock-coat on, and white linen pants. His boots were small and neatly blacked. He wore a ruffled shirt, a large seal-ring, a standing collar of obsolete pattern, and a checkered neckerchief with the ends hanging down. Date of costume about 1848. He was smoking a cigar, and trying to think of a word, and in pawing his hair he had rumpled his locks a good deal. He was scowling fearfully, and I judged that he was concocting a particularly knotty editorial. He told me to take the exchanges and skim through them and write up the “Spirit of the Tennessee Press,” condensing into the article all of their contents that seemed of interest."], "zh": ["田納西州的新聞業", "《孟菲斯雪崩報》的編輯輕描淡寫地對一位將他標記為激進派的通訊員進行了批評：“當他寫下第一個字、中間的部分、點綴他的 i、劃過他的 t，並敲下他的句號時，他知道自己正在編造一個充滿惡名和虛假之詞的句子。”——摘錄。", "我被醫生告知南方的氣候會改善我的健康，因此我來到了田納西州，並在《晨光暨約翰遜郡戰吼報》找到一份副主編的差事。。當我上班時，發現主編正坐在一把三條腿的椅子上，腳搭在一張松木桌子上。房間裡還有另一張松木桌子和一把受損的椅子，兩者都半埋在報紙、碎片和手稿的紙張下。那裡有一個裝沙子的木箱，上面撒滿了雪茄煙蒂和“老兵”，還有一個門懸掛著的爐子。主編穿著一件長尾黑色布外套和白色亞麻褲，靴子小巧且擦得很乾淨。他穿著一件有褶的襯衫、一枚大印章戒指、一個過時的立領，以及一條末端垂下的格子領巾。服裝的日期大約是1848年。他正在抽雪茄，試圖想出一個詞，撥弄頭髮時把頭髮弄得亂七八糟。他的臉色陰沉，我判斷他正在構思一篇特別棘手的社論。他告訴我去處理交換稿，瀏覽一下，寫一篇《田納西報的精神》，將所有看似有趣的內容濃縮進文章中。"]}, {"id": 2, "blocks": [{"lang": "en", "text": "I wrote as follows:"}, {"lang": "zh", "text": "我寫道："}, {"lang": "en", "text": "SPIRIT OF THE TENNESSEE PRESS"}, {"lang": "zh", "text": "田納西報的精神"}, {"lang": "en", "text": "The editors of the Semi-Weekly Earthquake evidently labor under a misapprehension with regard to the Ballyhack railroad. It is not the object of the company to leave Buzzardville off to one side. On the contrary, they consider it one of the most important points along the line, and consequently can have no desire to slight it. The gentlemen of the Earthquake will, of course, take pleasure in making the correction."}, {"lang": "zh", "text": "《半週刊地震報》的編輯顯然對巴利哈克鐵路存在誤解。該公司的目標並不是將巴札德維爾排除在外。相反，他們認為這是沿線最重要的地點之一，因此不會有輕視它的意圖。《地震報》的紳士們當然會樂於進行更正。"}, {"lang": "en", "text": "John W. Blossom, Esq., the able editor of the Higginsville Thunderbolt and Battle Cry of Freedom, arrived in the city yesterday. He is stopping at the Van Buren House."}, {"lang": "zh", "text": "《希金斯維爾霹靂暨自由戰歌報》的優秀主編約翰·W·布洛薩姆先生，已於昨日抵達本市，目前落腳於范布倫旅店。"}], "en": ["I wrote as follows:", "SPIRIT OF THE TENNESSEE PRESS", "The editors of the Semi-Weekly Earthquake evidently labor under a misapprehension with regard to the Ballyhack railroad. It is not the object of the company to leave Buzzardville off to one side. On the contrary, they consider it one of the most important points along the line, and consequently can have no desire to slight it. The gentlemen of the Earthquake will, of course, take pleasure in making the correction.", "John W. Blossom, Esq., the able editor of the Higginsville Thunderbolt and Battle Cry of Freedom, arrived in the city yesterday. He is stopping at the Van Buren House."], "zh": ["我寫道：", "田納西報的精神", "《半週刊地震報》的編輯顯然對巴利哈克鐵路存在誤解。該公司的目標並不是將巴札德維爾排除在外。相反，他們認為這是沿線最重要的地點之一，因此不會有輕視它的意圖。《地震報》的紳士們當然會樂於進行更正。", "《希金斯維爾霹靂暨自由戰歌報》的優秀主編約翰·W·布洛薩姆先生，已於昨日抵達本市，目前落腳於范布倫旅店。"]}, {"id": 3, "blocks": [{"lang": "en", "text": "We observe that our contemporary of the Mud Springs Morning Howl has fallen into the error of supposing that the election of Van Werter is not an established fact, but he will have discovered his mistake before this reminder reaches him, no doubt. He was doubtless misled by incomplete election returns."}, {"lang": "zh", "text": "我們注意到《泥泉晨吼》的同仁犯了錯誤，認為范·維特的當選並不是既定事實，但他在這個提醒到達他之前，無疑會發現自己的錯誤。他無疑是被不完整的選舉結果所誤導。"}, {"lang": "en", "text": "It is pleasant to note that the city of Blathersville is endeavoring to contract with some New York gentlemen to pave its well-nigh impassable streets with the Nicholson pavement. The Daily Hurrah urges the measure with ability, and seems confident of ultimate success."}, {"lang": "zh", "text": "令人高興的是，布拉瑟斯維爾市正在努力與一些紐約紳士簽訂合同，為其幾乎無法通行的街道鋪設尼科爾森鋪面。《每日歡呼》以能力推動這一措施，並似乎對最終成功充滿信心。"}, {"lang": "en", "text": "I passed my manuscript over to the chief editor for acceptance, alteration, or destruction. He glanced at it and his face clouded. He ran his eye down the pages, and his countenance grew portentous. It was easy to see that something was wrong. Presently he sprang up and said:"}, {"lang": "zh", "text": "我將手稿交給主編以供接受、修改或銷毀。他瞥了一眼，臉色陰沉。他快速瀏覽了幾頁，神情變得嚴峻。很明顯，有什麼不對勁。過了一會兒，他跳起來說："}], "en": ["We observe that our contemporary of the Mud Springs Morning Howl has fallen into the error of supposing that the election of Van Werter is not an established fact, but he will have discovered his mistake before this reminder reaches him, no doubt. He was doubtless misled by incomplete election returns.", "It is pleasant to note that the city of Blathersville is endeavoring to contract with some New York gentlemen to pave its well-nigh impassable streets with the Nicholson pavement. The Daily Hurrah urges the measure with ability, and seems confident of ultimate success.", "I passed my manuscript over to the chief editor for acceptance, alteration, or destruction. He glanced at it and his face clouded. He ran his eye down the pages, and his countenance grew portentous. It was easy to see that something was wrong. Presently he sprang up and said:"], "zh": ["我們注意到《泥泉晨吼》的同仁犯了錯誤，認為范·維特的當選並不是既定事實，但他在這個提醒到達他之前，無疑會發現自己的錯誤。他無疑是被不完整的選舉結果所誤導。", "令人高興的是，布拉瑟斯維爾市正在努力與一些紐約紳士簽訂合同，為其幾乎無法通行的街道鋪設尼科爾森鋪面。《每日歡呼》以能力推動這一措施，並似乎對最終成功充滿信心。", "我將手稿交給主編以供接受、修改或銷毀。他瞥了一眼，臉色陰沉。他快速瀏覽了幾頁，神情變得嚴峻。很明顯，有什麼不對勁。過了一會兒，他跳起來說："]}, {"id": 4, "blocks": [{"lang": "en", "text": "“Thunder and lightning! Do you suppose I am going to speak of those cattle that way? Do you suppose my subscribers are going to stand such gruel as that? Give me the pen!”"}, {"lang": "zh", "text": "“雷霆和閃電！你以為我會這樣說那些牛嗎？你以為我的訂閱者會忍受這種稀飯嗎？給我筆！”"}, {"lang": "en", "text": "I never saw a pen scrape and scratch its way so viciously, or plow through another man’s verbs and adjectives so relentlessly. While he was in the midst of his work, somebody shot at him through the open window, and marred the symmetry of my ear."}, {"lang": "zh", "text": "我從未見過一支筆如此惡毒地刮擦和劃過，或如此無情地耕耘另一個人的動詞和形容詞。在他工作進行中時，有人從開著的窗戶朝他開槍，打壞了我耳朵的對稱。"}, {"lang": "en", "text": "“Ah,” said he, “that is that scoundrel Smith, of the Moral Volcano—he was due yesterday.” And he snatched a navy revolver from his belt and fired—Smith dropped, shot in the thigh. The shot spoiled Smith’s aim, who was just taking a second chance and he crippled a stranger. It was me. Merely a finger shot off."}, {"lang": "zh", "text": "“啊，”他說，“那是道德火山報的那個惡棍史密斯——他昨天應該到。”他從腰帶上抽出一把海軍左輪手槍，開了火——史密斯中彈，腿部受傷。這一槍打亂了史密斯的瞄準，他正準備再來一次，卻意外地傷到了我。只是我的一根手指被打掉了。"}], "en": ["“Thunder and lightning! Do you suppose I am going to speak of those cattle that way? Do you suppose my subscribers are going to stand such gruel as that? Give me the pen!”", "I never saw a pen scrape and scratch its way so viciously, or plow through another man’s verbs and adjectives so relentlessly. While he was in the midst of his work, somebody shot at him through the open window, and marred the symmetry of my ear.", "“Ah,” said he, “that is that scoundrel Smith, of the Moral Volcano—he was due yesterday.” And he snatched a navy revolver from his belt and fired—Smith dropped, shot in the thigh. The shot spoiled Smith’s aim, who was just taking a second chance and he crippled a stranger. It was me. Merely a finger shot off."], "zh": ["“雷霆和閃電！你以為我會這樣說那些牛嗎？你以為我的訂閱者會忍受這種稀飯嗎？給我筆！”", "我從未見過一支筆如此惡毒地刮擦和劃過，或如此無情地耕耘另一個人的動詞和形容詞。在他工作進行中時，有人從開著的窗戶朝他開槍，打壞了我耳朵的對稱。", "“啊，”他說，“那是道德火山報的那個惡棍史密斯——他昨天應該到。”他從腰帶上抽出一把海軍左輪手槍，開了火——史密斯中彈，腿部受傷。這一槍打亂了史密斯的瞄準，他正準備再來一次，卻意外地傷到了我。只是我的一根手指被打掉了。"]}, {"id": 5, "blocks": [{"lang": "en", "text": "Then the chief editor went on with his erasure; and interlineations. Just as he finished them a hand grenade came down the stove-pipe, and the explosion shivered the stove into a thousand fragments. However, it did no further damage, except that a vagrant piece knocked a couple of my teeth out."}, {"lang": "zh", "text": "然後主編繼續進行他的刪除和插入。就在他完成的時候，一枚手榴彈從煙囪掉下來，爆炸將爐子炸得粉碎。然而，這並沒有造成進一步的損害，除了有一片流浪的碎片打掉了我的幾顆牙齒。"}, {"lang": "en", "text": "“That stove is utterly ruined,” said the chief editor."}, {"lang": "zh", "text": "“那爐子完全毀了，”主編說。"}, {"lang": "en", "text": "I said I believed it was."}, {"lang": "zh", "text": "我說我相信是的。"}, {"lang": "en", "text": "“Well, no matter—don’t want it this kind of weather. I know the man that did it. I’ll get him. Now, here is the way this stuff ought to be written.”"}, {"lang": "zh", "text": "“好吧，沒關係——這種天氣不需要它。我知道是誰幹的。我會找他的。現在，這些東西應該這樣寫。”"}, {"lang": "en", "text": "I took the manuscript. It was scarred with erasures and interlineations till its mother wouldn’t have known it if it had had one. It now read as follows:"}, {"lang": "zh", "text": "我拿起手稿。它被刪除和插入的痕跡弄得面目全非，連它的母親都認不出來。現在的內容如下："}], "en": ["Then the chief editor went on with his erasure; and interlineations. Just as he finished them a hand grenade came down the stove-pipe, and the explosion shivered the stove into a thousand fragments. However, it did no further damage, except that a vagrant piece knocked a couple of my teeth out.", "“That stove is utterly ruined,” said the chief editor.", "I said I believed it was.", "“Well, no matter—don’t want it this kind of weather. I know the man that did it. I’ll get him. Now, here is the way this stuff ought to be written.”", "I took the manuscript. It was scarred with erasures and interlineations till its mother wouldn’t have known it if it had had one. It now read as follows:"], "zh": ["然後主編繼續進行他的刪除和插入。就在他完成的時候，一枚手榴彈從煙囪掉下來，爆炸將爐子炸得粉碎。然而，這並沒有造成進一步的損害，除了有一片流浪的碎片打掉了我的幾顆牙齒。", "“那爐子完全毀了，”主編說。", "我說我相信是的。", "“好吧，沒關係——這種天氣不需要它。我知道是誰幹的。我會找他的。現在，這些東西應該這樣寫。”", "我拿起手稿。它被刪除和插入的痕跡弄得面目全非，連它的母親都認不出來。現在的內容如下："]}, {"id": 6, "blocks": [{"lang": "en", "text": "SPIRIT OF THE TENNESSEE PRESS"}, {"lang": "zh", "text": "田納西報的精神"}, {"lang": "en", "text": "The inveterate liars of the Semi-Weekly Earthquake are evidently endeavoring to palm off upon a noble and chivalrous people another of their vile and brutal falsehoods with regard to that most glorious conception of the nineteenth century, the Ballyhack railroad. The idea that Buzzardville was to be left off at one side originated in their own fulsome brains—or rather in the settlings which they regard as brains. They had better swallow this lie if they want to save their abandoned reptile carcasses the cowhiding they so richly deserve."}, {"lang": "zh", "text": "《半週刊地震報》的根深蒂固的說謊者顯然試圖將另一個卑鄙而殘忍的謊言強加於一個高貴而騎士般的民族，這與十九世紀最輝煌的構想——巴利哈克鐵路有關。巴札德維爾將被排除在外的想法源於他們自己腦海中的惡心想法——或者更確切地說，是他們所認為的腦袋裡的沉澱物。如果他們想拯救他們那該死的爬行生物的屍體，就最好吞下這個謊言。"}, {"lang": "en", "text": "That ass, Blossom, of the Higginsville Thunderbolt and Battle Cry of Freedom, is down here again sponging at the Van Buren."}, {"lang": "zh", "text": "那個傻瓜布洛薩姆，《希金斯維爾霹靂暨自由戰歌報》的編輯，又來這裡在范布倫酒店混日子。"}], "en": ["SPIRIT OF THE TENNESSEE PRESS", "The inveterate liars of the Semi-Weekly Earthquake are evidently endeavoring to palm off upon a noble and chivalrous people another of their vile and brutal falsehoods with regard to that most glorious conception of the nineteenth century, the Ballyhack railroad. The idea that Buzzardville was to be left off at one side originated in their own fulsome brains—or rather in the settlings which they regard as brains. They had better swallow this lie if they want to save their abandoned reptile carcasses the cowhiding they so richly deserve.", "That ass, Blossom, of the Higginsville Thunderbolt and Battle Cry of Freedom, is down here again sponging at the Van Buren."], "zh": ["田納西報的精神", "《半週刊地震報》的根深蒂固的說謊者顯然試圖將另一個卑鄙而殘忍的謊言強加於一個高貴而騎士般的民族，這與十九世紀最輝煌的構想——巴利哈克鐵路有關。巴札德維爾將被排除在外的想法源於他們自己腦海中的惡心想法——或者更確切地說，是他們所認為的腦袋裡的沉澱物。如果他們想拯救他們那該死的爬行生物的屍體，就最好吞下這個謊言。", "那個傻瓜布洛薩姆，《希金斯維爾霹靂暨自由戰歌報》的編輯，又來這裡在范布倫酒店混日子。"]}, {"id": 7, "blocks": [{"lang": "en", "text": "We observe that the besotted blackguard of the Mud Springs Morning Howl is giving out, with his usual propensity for lying, that Van Werter is not elected. The heaven-born mission of journalism is to disseminate truth; to eradicate error; to educate, refine, and elevate the tone of public morals and manners, and make all men more gentle, more virtuous, more charitable, and in all ways better, and holier, and happier; and yet this blackhearted scoundrel degrades his great office persistently to the dissemination of falsehood, calumny, vituperation, and vulgarity."}, {"lang": "zh", "text": "我們注意到，《泥泉晨吼》的那個醉鬼流氓，依然在撒謊，宣稱范·維特沒有當選。新聞業的天賦使命是傳播真相；根除錯誤；教育、提升和提高公共道德和風俗的水平，使所有人變得更加溫和、更有德行、更有慈悲，並在各方面變得更好、更神聖和更快樂；然而這個黑心的惡棍卻不斷將他偉大的職責貶低到散播虛假、誹謗、辱罵和粗俗的程度。"}, {"lang": "en", "text": "Blathersville wants a Nicholson pavement—it wants a jail and a poorhouse more. The idea of a pavement in a one-horse town composed of two gin-mills, a blacksmith shop, and that mustard-plaster of a newspaper, the Daily Hurrah! The crawling insect, Buckner, who edits the Hurrah, is braying about his business with his customary imbecility, and imagining that he is talking sense."}, {"lang": "zh", "text": "布拉瑟斯維爾想要尼科爾森鋪面——它更想要一座監獄和一個貧民窟。在一個只有兩家酒吧、一家鐵匠鋪和那份像芥末膏一樣的報紙《每日歡呼》的小鎮上鋪設鋪面的想法！那個編輯《歡呼》的爬行昆蟲巴克納，正以他一貫的愚蠢在忙碌，並幻想自己在講道理。"}], "en": ["We observe that the besotted blackguard of the Mud Springs Morning Howl is giving out, with his usual propensity for lying, that Van Werter is not elected. The heaven-born mission of journalism is to disseminate truth; to eradicate error; to educate, refine, and elevate the tone of public morals and manners, and make all men more gentle, more virtuous, more charitable, and in all ways better, and holier, and happier; and yet this blackhearted scoundrel degrades his great office persistently to the dissemination of falsehood, calumny, vituperation, and vulgarity.", "Blathersville wants a Nicholson pavement—it wants a jail and a poorhouse more. The idea of a pavement in a one-horse town composed of two gin-mills, a blacksmith shop, and that mustard-plaster of a newspaper, the Daily Hurrah! The crawling insect, Buckner, who edits the Hurrah, is braying about his business with his customary imbecility, and imagining that he is talking sense."], "zh": ["我們注意到，《泥泉晨吼》的那個醉鬼流氓，依然在撒謊，宣稱范·維特沒有當選。新聞業的天賦使命是傳播真相；根除錯誤；教育、提升和提高公共道德和風俗的水平，使所有人變得更加溫和、更有德行、更有慈悲，並在各方面變得更好、更神聖和更快樂；然而這個黑心的惡棍卻不斷將他偉大的職責貶低到散播虛假、誹謗、辱罵和粗俗的程度。", "布拉瑟斯維爾想要尼科爾森鋪面——它更想要一座監獄和一個貧民窟。在一個只有兩家酒吧、一家鐵匠鋪和那份像芥末膏一樣的報紙《每日歡呼》的小鎮上鋪設鋪面的想法！那個編輯《歡呼》的爬行昆蟲巴克納，正以他一貫的愚蠢在忙碌，並幻想自己在講道理。"]}, {"id": 8, "blocks": [{"lang": "en", "text": "“Now that is the way to write—peppery and to the point. Mush-and-milk journalism gives me the fan-tods.”"}, {"lang": "zh", "text": "“這才是寫作的方式——辛辣且直截了當。稀飯和牛奶的新聞業讓我感到不適。”"}, {"lang": "en", "text": "About this time a brick came through the window with a splintering crash, and gave me a considerable of a jolt in the back. I moved out of range—I began to feel in the way."}, {"lang": "zh", "text": "這時，一塊磚頭從窗戶飛進來，發出破碎的聲音，狠狠地撞了我的背。我移動到安全區域——我開始感到自己在妨礙。"}, {"lang": "en", "text": "The chief said, “That was the Colonel, likely. I’ve been expecting him for two days. He will be up now right away.”"}, {"lang": "zh", "text": "主編說：“那可能是上校。我已經期待他兩天了。他馬上就會來。”"}, {"lang": "en", "text": "He was correct. The Colonel appeared in the door a moment afterward with a dragoon revolver in his hand."}, {"lang": "zh", "text": "他說得對。上校在片刻後出現在門口，手中拿著一把騎兵左輪手槍。"}, {"lang": "en", "text": "He said, “Sir, have I the honor of addressing the poltroon who edits this mangy sheet?”"}, {"lang": "zh", "text": "他說：“先生，我有榮幸與這份骯髒報紙的編輯交談嗎？”"}], "en": ["“Now that is the way to write—peppery and to the point. Mush-and-milk journalism gives me the fan-tods.”", "About this time a brick came through the window with a splintering crash, and gave me a considerable of a jolt in the back. I moved out of range—I began to feel in the way.", "The chief said, “That was the Colonel, likely. I’ve been expecting him for two days. He will be up now right away.”", "He was correct. The Colonel appeared in the door a moment afterward with a dragoon revolver in his hand.", "He said, “Sir, have I the honor of addressing the poltroon who edits this mangy sheet?”"], "zh": ["“這才是寫作的方式——辛辣且直截了當。稀飯和牛奶的新聞業讓我感到不適。”", "這時，一塊磚頭從窗戶飛進來，發出破碎的聲音，狠狠地撞了我的背。我移動到安全區域——我開始感到自己在妨礙。", "主編說：“那可能是上校。我已經期待他兩天了。他馬上就會來。”", "他說得對。上校在片刻後出現在門口，手中拿著一把騎兵左輪手槍。", "他說：“先生，我有榮幸與這份骯髒報紙的編輯交談嗎？”"]}, {"id": 9, "blocks": [{"lang": "en", "text": "“You have. Be seated, sir. Be careful of the chair, one of its legs is gone. I believe I have the honor of addressing the putrid liar, Colonel Blatherskite Tecumseh?”"}, {"lang": "zh", "text": "“你有。請坐，先生。小心椅子，因為它的一條腿壞了。我相信我有榮幸與腐臭的說謊者，布拉瑟斯凱特·特庫姆塞上校交談？”"}, {"lang": "en", "text": "“Right, Sir. I have a little account to settle with you. If you are at leisure we will begin.”"}, {"lang": "zh", "text": "“正確，先生。我有一點賬要和你算。如果你有空，我們就開始吧。”"}, {"lang": "en", "text": "“I have an article on the ‘Encouraging Progress of Moral and Intellectual Development in America’ to finish, but there is no hurry. Begin.”"}, {"lang": "zh", "text": "“我有一篇關於《美國道德和智力發展的鼓舞人心的進展》的文章要完成，但不著急。開始吧。”"}, {"lang": "en", "text": "Both pistols rang out their fierce clamor at the same instant. The chief lost a lock of his hair, and the Colonel’s bullet ended its career in the fleshy part of my thigh. The Colonel’s left shoulder was clipped a little. They fired again. Both missed their men this time, but I got my share, a shot in the arm. At the third fire both gentlemen were wounded slightly, and I had a knuckle chipped. I then said, I believed I would go out and take a walk, as this was a private matter, and I had a delicacy about participating in it further. But both gentlemen begged me to keep my seat, and assured me that I was not in the way."}, {"lang": "zh", "text": "兩把手槍同時發出激烈的聲響。主編的一撮頭髮被打掉，上校的子彈則在我大腿的肉部結束了它的旅程。上校的左肩稍微受了傷。他們又開了火。這次兩人都沒有打中目標，但我卻受了傷，手臂中了一槍。在第三次開火時，兩位紳士都輕微受傷，而我則有一根指關節被打掉。我隨即表示，我想出去散步，因為這是私人事務，我對進一步參與感到有些顧忌。但兩位紳士都請我保持座位，並向我保證我並不妨礙。"}], "en": ["“You have. Be seated, sir. Be careful of the chair, one of its legs is gone. I believe I have the honor of addressing the putrid liar, Colonel Blatherskite Tecumseh?”", "“Right, Sir. I have a little account to settle with you. If you are at leisure we will begin.”", "“I have an article on the ‘Encouraging Progress of Moral and Intellectual Development in America’ to finish, but there is no hurry. Begin.”", "Both pistols rang out their fierce clamor at the same instant. The chief lost a lock of his hair, and the Colonel’s bullet ended its career in the fleshy part of my thigh. The Colonel’s left shoulder was clipped a little. They fired again. Both missed their men this time, but I got my share, a shot in the arm. At the third fire both gentlemen were wounded slightly, and I had a knuckle chipped. I then said, I believed I would go out and take a walk, as this was a private matter, and I had a delicacy about participating in it further. But both gentlemen begged me to keep my seat, and assured me that I was not in the way."], "zh": ["“你有。請坐，先生。小心椅子，因為它的一條腿壞了。我相信我有榮幸與腐臭的說謊者，布拉瑟斯凱特·特庫姆塞上校交談？”", "“正確，先生。我有一點賬要和你算。如果你有空，我們就開始吧。”", "“我有一篇關於《美國道德和智力發展的鼓舞人心的進展》的文章要完成，但不著急。開始吧。”", "兩把手槍同時發出激烈的聲響。主編的一撮頭髮被打掉，上校的子彈則在我大腿的肉部結束了它的旅程。上校的左肩稍微受了傷。他們又開了火。這次兩人都沒有打中目標，但我卻受了傷，手臂中了一槍。在第三次開火時，兩位紳士都輕微受傷，而我則有一根指關節被打掉。我隨即表示，我想出去散步，因為這是私人事務，我對進一步參與感到有些顧忌。但兩位紳士都請我保持座位，並向我保證我並不妨礙。"]}, {"id": 10, "blocks": [{"lang": "en", "text": "They then talked about the elections and the crops while they reloaded, and I fell to tying up my wounds. But presently they opened fire again with animation, and every shot took effect—but it is proper to remark that five out of the six fell to my share. The sixth one mortally wounded the Colonel, who remarked, with fine humor, that he would have to say good morning now, as he had business uptown. He then inquired the way to the undertaker’s and left."}, {"lang": "zh", "text": "然後他們在重新裝填子彈的同時談論選舉和農作物，而我則忙著包紮傷口。但不久後他們又開始激烈開火，每一槍都命中目標——但值得一提的是，六槍中有五槍都打在我身上。第六槍則致命地擊中了上校，他幽默地說他現在得說聲早安，因為他有事要去市區。他接著詢問了去殯儀館的路，然後離開了。"}, {"lang": "en", "text": "The chief turned to me and said, “I am expecting company to dinner, and shall have to get ready. It will be a favor to me if you will read proof and attend to the customers.”"}, {"lang": "zh", "text": "主編轉向我說：“我預期有客人來吃晚餐，得準備一下。如果你能幫我看校對並招待客人，我將不勝感激。”"}], "en": ["They then talked about the elections and the crops while they reloaded, and I fell to tying up my wounds. But presently they opened fire again with animation, and every shot took effect—but it is proper to remark that five out of the six fell to my share. The sixth one mortally wounded the Colonel, who remarked, with fine humor, that he would have to say good morning now, as he had business uptown. He then inquired the way to the undertaker’s and left.", "The chief turned to me and said, “I am expecting company to dinner, and shall have to get ready. It will be a favor to me if you will read proof and attend to the customers.”"], "zh": ["然後他們在重新裝填子彈的同時談論選舉和農作物，而我則忙著包紮傷口。但不久後他們又開始激烈開火，每一槍都命中目標——但值得一提的是，六槍中有五槍都打在我身上。第六槍則致命地擊中了上校，他幽默地說他現在得說聲早安，因為他有事要去市區。他接著詢問了去殯儀館的路，然後離開了。", "主編轉向我說：“我預期有客人來吃晚餐，得準備一下。如果你能幫我看校對並招待客人，我將不勝感激。”"]}, {"id": 11, "blocks": [{"lang": "en", "text": "I winced a little at the idea of attending to the customers, but I was too bewildered by the fusillade that was still ringing in my ears to think of anything to say."}, {"lang": "zh", "text": "我對招待客人的想法有些畏懼，但我被仍在耳邊迴響的槍聲弄得迷惑，無法想到任何要說的話。"}, {"lang": "en", "text": "He continued, “Jones will be here at three—cowhide him. Gillespie will call earlier, perhaps—throw him out of the window. Ferguson will be along about four—kill him. That is all for today, I believe. If you have any odd time, you may write a blistering article on the police—give the chief inspector rats. The cowhides are under the table; weapons in the drawer—ammunition there in the corner—lint and bandages up there in the pigeonholes. In case of accident, go to Lancet, the surgeon, downstairs. He advertises—we take it out in trade.”"}, {"lang": "zh", "text": "他繼續說：“瓊斯三點會來——給他牛皮鞭。吉萊斯比可能會早點來——把他扔出窗外。弗格森大約四點會來——殺了他。我想今天就這些。如果你有空閒時間，可以寫一篇關於警察的尖銳文章——給首席檢查官一些老鼠。牛皮鞭在桌子底下；武器在抽屜裡——彈藥在角落裡——紗布和繃帶在那邊的信件夾裡。如果發生意外，去樓下的外科醫生蘭塞特。他有廣告——我們以物易物。”"}], "en": ["I winced a little at the idea of attending to the customers, but I was too bewildered by the fusillade that was still ringing in my ears to think of anything to say.", "He continued, “Jones will be here at three—cowhide him. Gillespie will call earlier, perhaps—throw him out of the window. Ferguson will be along about four—kill him. That is all for today, I believe. If you have any odd time, you may write a blistering article on the police—give the chief inspector rats. The cowhides are under the table; weapons in the drawer—ammunition there in the corner—lint and bandages up there in the pigeonholes. In case of accident, go to Lancet, the surgeon, downstairs. He advertises—we take it out in trade.”"], "zh": ["我對招待客人的想法有些畏懼，但我被仍在耳邊迴響的槍聲弄得迷惑，無法想到任何要說的話。", "他繼續說：“瓊斯三點會來——給他牛皮鞭。吉萊斯比可能會早點來——把他扔出窗外。弗格森大約四點會來——殺了他。我想今天就這些。如果你有空閒時間，可以寫一篇關於警察的尖銳文章——給首席檢查官一些老鼠。牛皮鞭在桌子底下；武器在抽屜裡——彈藥在角落裡——紗布和繃帶在那邊的信件夾裡。如果發生意外，去樓下的外科醫生蘭塞特。他有廣告——我們以物易物。”"]}, {"id": 12, "blocks": [{"lang": "en", "text": "He was gone. I shuddered. At the end of the next three hours I had been through perils so awful that all peace of mind and all cheerfulness were gone from me. Gillespie had called and thrown me out of the window. Jones arrived promptly, and when I got ready to do the cowhiding he took the job off my hands. In an encounter with a stranger, not in the bill of fare, I had lost my scalp. Another stranger, by the name of Thompson, left me a mere wreck and ruin of chaotic rags. And at last, at bay in the corner, and beset by an infuriated mob of editors, blacklegs, politicians, and desperadoes, who raved and swore and flourished their weapons about my head till the air shimmered with glancing flashes of steel, I was in the act of resigning my berth on the paper when the chief arrived, and with him a rabble of charmed and enthusiastic friends. Then ensued a scene of riot and carnage such as no human pen, or steel one either, could describe. People were shot, probed, dismembered, blown up, thrown out of the window. There was a brief tornado of murky blasphemy, with a confused and frantic war-dance glimmering through it, and then all was over. In five minutes there was silence, and the gory chief and I sat alone and surveyed the sanguinary ruin that strewed the floor around us."}, {"lang": "zh", "text": "他走了。我打了個寒顫。在接下來的三個小時裡，我經歷了如此可怕的危險，以至於所有的心靈平靜和快樂都從我身上消失了。吉萊斯比來了，並把我扔出了窗外。瓊斯準時到達，當我準備好給他牛皮鞭時，他卻把這工作接了過來。在一次與一位不在菜單上的陌生人的衝突中，我失去了我的頭皮。另一位名叫湯普森的陌生人讓我變成了一堆混亂的破布。最後，我被困在角落裡，面對一群憤怒的編輯、無賴、政客和亡命之徒，他們咆哮著、詛咒著，揮舞著武器在我頭上，直到空氣中閃爍著鋼鐵的光芒，我正準備辭去在報社的職位，這時主編來了，還帶著一群興奮的朋友。接著發生了一場騷亂和屠殺的場面，任何人類的筆，或鋼筆也無法形容。人們被射擊、刺穿、肢解、炸毀、扔出窗外。短暫的咒罵龍捲風伴隨著混亂而瘋狂的戰舞閃現，然後一切都結束了。五分鐘後，四周寂靜無聲，血腥的主編和我獨自坐著，審視著散落在我們周圍的血腥廢墟。"}], "en": ["He was gone. I shuddered. At the end of the next three hours I had been through perils so awful that all peace of mind and all cheerfulness were gone from me. Gillespie had called and thrown me out of the window. Jones arrived promptly, and when I got ready to do the cowhiding he took the job off my hands. In an encounter with a stranger, not in the bill of fare, I had lost my scalp. Another stranger, by the name of Thompson, left me a mere wreck and ruin of chaotic rags. And at last, at bay in the corner, and beset by an infuriated mob of editors, blacklegs, politicians, and desperadoes, who raved and swore and flourished their weapons about my head till the air shimmered with glancing flashes of steel, I was in the act of resigning my berth on the paper when the chief arrived, and with him a rabble of charmed and enthusiastic friends. Then ensued a scene of riot and carnage such as no human pen, or steel one either, could describe. People were shot, probed, dismembered, blown up, thrown out of the window. There was a brief tornado of murky blasphemy, with a confused and frantic war-dance glimmering through it, and then all was over. In five minutes there was silence, and the gory chief and I sat alone and surveyed the sanguinary ruin that strewed the floor around us."], "zh": ["他走了。我打了個寒顫。在接下來的三個小時裡，我經歷了如此可怕的危險，以至於所有的心靈平靜和快樂都從我身上消失了。吉萊斯比來了，並把我扔出了窗外。瓊斯準時到達，當我準備好給他牛皮鞭時，他卻把這工作接了過來。在一次與一位不在菜單上的陌生人的衝突中，我失去了我的頭皮。另一位名叫湯普森的陌生人讓我變成了一堆混亂的破布。最後，我被困在角落裡，面對一群憤怒的編輯、無賴、政客和亡命之徒，他們咆哮著、詛咒著，揮舞著武器在我頭上，直到空氣中閃爍著鋼鐵的光芒，我正準備辭去在報社的職位，這時主編來了，還帶著一群興奮的朋友。接著發生了一場騷亂和屠殺的場面，任何人類的筆，或鋼筆也無法形容。人們被射擊、刺穿、肢解、炸毀、扔出窗外。短暫的咒罵龍捲風伴隨著混亂而瘋狂的戰舞閃現，然後一切都結束了。五分鐘後，四周寂靜無聲，血腥的主編和我獨自坐著，審視著散落在我們周圍的血腥廢墟。"]}, {"id": 13, "blocks": [{"lang": "en", "text": "He said, “You’ll like this place when you get used to it.”"}, {"lang": "zh", "text": "他說：“你會喜歡這個地方的，當你習慣了它。”"}, {"lang": "en", "text": "I said, “I’ll have to get you to excuse me; I think maybe I might write to suit you after a while; as soon as I had had some practice and learned the language I am confident I could. But, to speak the plain truth, that sort of energy of expression has its inconveniences, and a man is liable to interruption."}, {"lang": "zh", "text": "我說：“我得請你原諒我；我想也許過一段時間我可以寫得讓你滿意；一旦我有了一些練習，學會了這種語言，我相信我可以做到。但說實話，這種表達的能量有其不便之處，人很容易受到干擾。"}, {"lang": "en", "text": "“You see that yourself. Vigorous writing is calculated to elevate the public, no doubt, but then I do not like to attract so much attention as it calls forth. I can’t write with comfort when I am interrupted so much as I have been to-day. I like this berth well enough, but I don’t like to be left here to wait on the customers. The experiences are novel, I grant you, and entertaining, too, after a fashion, but they are not judiciously distributed. A gentleman shoots at you through the window and cripples me; a bombshell comes down the stove-pipe for your gratification and sends the stove door down my throat; a friend drops in to swap compliments with you, and freckles me with bullet-holes till my skin won’t hold my principles; you go to dinner, and Jones comes with his cowhide, Gillespie throws me out of the window, Thompson tears all my clothes off, and an entire stranger takes my scalp with the easy freedom of an old acquaintance; and in less than five minutes all the blackguards in the country arrive in their war-paint, and proceed to scare the rest of me to death with their tomahawks. Take it altogether, I never had such a spirited time in all my life as I have had to-day. No; I like you, and I like your calm unruffled way of explaining things to the customers, but you see I am not used to it. The Southern heart is too impulsive; Southern hospitality is too lavish with the stranger. The paragraphs which I have written to-day, and into whose cold sentences your masterly hand has infused the fervent spirit of Tennesseean journalism, will wake up another nest of hornets. All that mob of editors will come—and they will come hungry, too, and want somebody for breakfast. I shall have to bid you adieu. I decline to be present at these festivities. I came South for my health, I will go back on the same errand, and suddenly. Tennesseean journalism is too stirring for me.”"}, {"lang": "zh", "text": "“你自己也看到了。毫無疑問，強而有力的寫作是為了提升公眾，但我不喜歡吸引如此多的注意力。我無法在今天這樣頻繁的干擾下舒適地寫作。我對這份工作還算滿意，但我不喜歡被留在這裡招待客人。這些經歷我承認是新奇的，並且在某種程度上也很有趣，但它們的分配並不明智。一位紳士從窗外朝你開槍，讓我受了傷；一枚炮彈從煙囪掉下來，為了你的快樂，將爐門送進了我的喉嚨；一位朋友來與你互換讚美，卻讓我身上布滿了子彈洞，直到我的皮膚無法再容納我的原則；你去吃晚餐，瓊斯來了，帶著他的牛皮鞭，吉萊斯比把我扔出了窗外，湯普森撕掉了我的所有衣服，而一位完全陌生的人則輕鬆地奪走了我的頭皮；不到五分鐘，所有的無賴們都穿著戰鬥服來到，並用他們的戰斧把我其餘的部分嚇得半死。總的來說，我從未有過如此激烈的經歷，今天的經歷讓我感到如此。不是的；我喜歡你，也喜歡你冷靜不驚的方式來解釋事情給客人，但你看我並不習慣。南方人的心太衝動；南方的熱情對陌生人太過慷慨。我今天寫的那些段落，並且在你那高超的手中注入了田納西新聞業的熱情，將會喚醒另一窩黃蜂。所有那些編輯的暴徒都會來——而且他們也會來得很饑餓，想要找人吃早餐。我必須向你告別。我來南方是為了我的健康，我會以同樣的理由回去，並且會很快。田納西的新聞業對我來說太過刺激。”"}, {"lang": "en", "text": "After which we parted with mutual regret, and I took apartments at the hospital."}, {"lang": "zh", "text": "在此之後，我們互相道別，並且我在醫院租了房間。"}], "en": ["He said, “You’ll like this place when you get used to it.”", "I said, “I’ll have to get you to excuse me; I think maybe I might write to suit you after a while; as soon as I had had some practice and learned the language I am confident I could. But, to speak the plain truth, that sort of energy of expression has its inconveniences, and a man is liable to interruption.", "“You see that yourself. Vigorous writing is calculated to elevate the public, no doubt, but then I do not like to attract so much attention as it calls forth. I can’t write with comfort when I am interrupted so much as I have been to-day. I like this berth well enough, but I don’t like to be left here to wait on the customers. The experiences are novel, I grant you, and entertaining, too, after a fashion, but they are not judiciously distributed. A gentleman shoots at you through the window and cripples me; a bombshell comes down the stove-pipe for your gratification and sends the stove door down my throat; a friend drops in to swap compliments with you, and freckles me with bullet-holes till my skin won’t hold my principl         function updatePage() {
            if (!pages || pages.length === 0) return;
            const page = pages[currentIndex];
            const container = document.getElementById('paragraph-box');
            container.innerHTML = '';

            // 依原文順序交替渲染英文／中文段落（一頁可能有好幾組英中對照），
            // 不再把整頁的英文集中在最上面、中文集中在最下面。
            const blocks = page.blocks || [];
            blocks.forEach(b => {
                const p = document.createElement('div');
                p.className = (b.lang === 'en') ? 'en-p' : 'zh-p';
                p.innerText = b.text;
                container.appendChild(p);
            });

            document.getElementById('page-info').innerText = `${currentIndex + 1} / ${pages.length}`;
            document.getElementById('progress').style.width = `${((currentIndex + 1) / pages.length) * 100}%`;
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === pages.length - 1;
            document.getElementById('main-content').scrollTop = 0;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        // 💡 智慧辨識電腦與手機觸控事件
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        document.addEventListener('mouseup', (e) => {
            // 電腦端：按住 Alt 鍵再選取才觸發（避開 Google 翻譯／一般選字）
            // 手機端：直接選取文字就觸發
            if (isMobile || e.altKey) {
                const selection = window.getSelection();
                const text = selection.toString().trim().toLowerCase();
                if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                    analyzeWord(text);
                }
            }
        });

        // 💡 電腦端：直接在英文段落雙擊單字即可查詢，不需要按 Alt，看小說時更方便
        document.addEventListener('dblclick', (e) => {
            if (isMobile) return; // 手機交給上面的 mouseup 處理，避免重複觸發
            if (!e.target.closest('.en-p')) return; // 只在英文段落內生效
            const selection = window.getSelection();
            const text = selection.toString().trim().toLowerCase();
            if (text && /^[a-zA-Z]+$/.test(text) && text.length > 2) {
                analyzeWord(text);
            }

        function analyzeWord(word) {
            const popup = document.getElementById('root-dict-popup');
            const title = document.getElementById('popup-word-title');
            const content = document.getElementById('popup-content');

            title.innerText = `🔍 【${word}】`;
            content.innerHTML = '';
            let hasResult = false;

            // 1. 字首：只取「最長匹配」，避免像 un / uni 這種短字首淹沒真正對的長字首
            let pMatches = [];
            dbPrefixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.startsWith(k)) pMatches.push({ key: k, meaning: item.meaning });
                });
            });
            const maxPLen = pMatches.reduce((m, x) => Math.max(m, x.key.length), 0);
            pMatches = pMatches.filter(x => x.key.length === maxPLen);

            // 2. 字尾：同樣只取「最長匹配」，並把同一個字尾在不同分類下的結果合併成一行
            let sRaw = [];
            dbSuffixes.forEach(item => {
                item.keys.forEach(k => {
                    if (word.endsWith(k) && k.length >= 2) sRaw.push({ key: k, meaning: item.meaning, category: item.category });
                });
            });
            const maxSLen = sRaw.reduce((m, x) => Math.max(m, x.key.length), 0);
            sRaw = sRaw.filter(x => x.key.length === maxSLen);
            const sGrouped = {};
            sRaw.forEach(x => {
                if (!sGrouped[x.key]) sGrouped[x.key] = { meanings: new Set(), categories: [] };
                if (x.meaning) sGrouped[x.key].meanings.add(x.meaning);
                sGrouped[x.key].categories.push(x.category);
            });
            const sMatches = Object.keys(sGrouped).map(k => ({
                key: k,
                meaning: Array.from(sGrouped[k].meanings).join('；'),
                categories: sGrouped[k].categories
            }));

            // 3. 字根：貪婪比對——優先用最長的字根，且已被字首/字尾/其他較長字根「占用」的字母範圍不再重複標記
            //    （例如 university 拆完 uni- 與 -ity 之後，中間巧合出現的 it 就不會再被誤判成字根）
            const prefixZoneEnd = maxPLen;
            const suffixZoneStart = word.length - maxSLen;

            const rootCandidates = {};
            dbRoots.forEach(item => {
                item.keys.forEach(k => {
                    if (k.length < 2) return;
                    if (!rootCandidates[k]) rootCandidates[k] = [];
                    rootCandidates[k].push(item.meaning);
                });
            });
            const sortedKeys = Object.keys(rootCandidates).sort((a, b) => b.length - a.length);

            let claimed = [];
            let rMatches = [];
            sortedKeys.forEach(k => {
                let searchFrom = 0;
                while (true) {
                    const idx = word.indexOf(k, searchFrom);
                    if (idx === -1) break;
                    const end = idx + k.length;
                    const insidePrefix = end <= prefixZoneEnd;
                    const insideSuffix = idx >= suffixZoneStart;
                    const overlapsClaimed = claimed.some(([cs, ce]) => idx < ce && end > cs);
                    if (!insidePrefix && !insideSuffix && !overlapsClaimed) {
                        claimed.push([idx, end]);
                        rMatches.push({ key: k, meaning: rootCandidates[k].join('；') });
                        break;
                    }
                    searchFrom = idx + 1;
                }
            });
            rMatches.sort((a, b) => b.key.length - a.key.length);

            if (pMatches.length > 0) {
                hasResult = true;
                const rows = pMatches.map(x => `<div class="tag-item"><b>${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🚩 字首 Prefix</div>${rows}</div>`;
            }

            if (rMatches.length > 0) {
                hasResult = true;
                const rows = rMatches.map(x => `<div class="tag-item"><b>-${x.key}-</b> : ${x.meaning}</div>`).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🌱 字根 Root</div>${rows}</div>`;
            }

            if (sMatches.length > 0) {
                hasResult = true;
                const rows = sMatches.map(x => {
                    const mStr = x.meaning ? ` : ${x.meaning}` : '';
                    const badges = x.categories.map(c => `<span class="suffix-badge">${c}</span>`).join('');
                    return `<div class="tag-item"><b>-${x.key}</b>${badges}${mStr}</div>`;
                }).join('');
                content.innerHTML += `<div class="tag-group"><div class="tag-title">🔚 字尾 Suffix</div>${rows}</div>`;
            }

            if (!hasResult) {
                content.innerHTML += `<div class="no-result">本機字根資料庫沒有找到相符的片段，這個字可能是不規則變化，或不屬於常見的拉丁／希臘字源。</div>`;
            }

            // 無論本機資料庫有沒有結果，都附上 Etymonline 連結，方便查真正完整、精確的字源
            const etymoUrl = `https://www.etymonline.com/word/${encodeURIComponent(word)}`;
            content.innerHTML += `<div class="etymo-link"><a href="${etymoUrl}" target="_blank" rel="noopener">📖 到 Etymonline 查看完整字源 →</a></div>`;

            popup.style.display = 'block';
        }

        function closePopup() { document.getElementById('root-dict-popup').style.display = 'none'; }
        function nextPage() { if (currentIndex < pages.length - 1) { currentIndex++; updatePage(); closePopup(); } }
        function prevPage() { if (currentIndex > 0) { currentIndex--; updatePage(); closePopup(); } }
        function seekProgress(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            currentIndex = Math.floor(((e.clientX - rect.left) / rect.width) * pages.length);
            updatePage(); closePopup();
        }

        function speakCurrentPage() {
            if (audioPlayer && !audioPlayer.paused) { audioPlayer.pause(); document.getElementById('mp3BtnLabel').textContent = " 全文MP3"; }
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const textToSpeak = (pages[currentIndex].en || []).join(' ');
            if (!textToSpeak) return;
            const sentences = textToSpeak.match(/[^.!?,;—]+(?:--|[^.!?,;—])*/g) || [textToSpeak];
            let sentenceIndex = 0;
            function speakNext() {
                if (sentenceIndex >= sentences.length) return;
                const utterance = new SpeechSynthesisUtterance(sentences[sentenceIndex].trim());
                utterance.lang = 'en-US'; utterance.rate = 0.9;
                utterance.onend = () => { sentenceIndex++; speakNext(); };
                utterance.onerror = () => { sentenceIndex++; speakNext(); };
                window.speechSynthesis.speak(utterance);
            }
            speakNext();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            else if (e.key === 'ArrowLeft') prevPage();
        });
